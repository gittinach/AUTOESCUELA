<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FBF8F2">
<title>Actualizar Autoescuela</title>
<style>
:root{color-scheme:light dark;font:17px/1.5 system-ui,sans-serif;background:#fbf8f2;color:#213630}
*{box-sizing:border-box}body{margin:0;padding:24px 16px}main{max-width:480px;margin:8vh auto;padding:24px;border-radius:22px;background:#fff;box-shadow:0 8px 36px #21363012}
h1{font-size:27px;line-height:1.2}p{overflow-wrap:anywhere}button,a{font:inherit}button{display:block;min-height:52px;width:100%;padding:12px;border:0;border-radius:12px;background:#27684e;color:#fff;font-weight:650;cursor:pointer}button:disabled{opacity:.7;cursor:wait}a{display:inline-block;min-height:44px;padding:10px 0;color:#235e49}button:focus-visible,a:focus-visible{outline:3px solid #327de6;outline-offset:4px}#status{min-height:3em}details{margin-top:16px;font-size:14px}details[hidden]{display:none}
@media(prefers-color-scheme:dark){:root{background:#181e1a;color:#f1f3e9}main{background:#252d27}button{background:#a5d9b6;color:#102b20}a{color:#b6e1c4}}
</style>
</head>
<body>
<main>
<h1>Actualizar Autoescuela</h1>
<p>Recupera los archivos de la última versión para abrir los simuladores.</p>
<p>Se conservan tus resultados y las lecciones completadas.</p>
<button type="button" id="update">Actualizar y abrir la app</button>
<p id="status" role="status" aria-live="polite"></p>
<details id="details" hidden><summary>Ver detalle del error</summary><p id="error"></p></details>
<a href="./">Volver a la app</a>
</main>
<script>
const scope=new URL('./',location.href).href;
const button=document.getElementById('update'),status=document.getElementById('status');
function workerVersion(worker){
  return new Promise(resolve=>{
    const channel=new MessageChannel();
    const timer=setTimeout(()=>{channel.port1.close();resolve(null);},1200);
    channel.port1.onmessage=event=>{clearTimeout(timer);channel.port1.close();resolve(event.data?.version||null);};
    try{worker.postMessage({type:'GET_VERSION'},[channel.port2]);}
    catch{clearTimeout(timer);channel.port1.close();resolve(null);}
  });
}
button.onclick=async()=>{
  button.disabled=true;document.getElementById('details').hidden=true;
  status.textContent='Comprobando los archivos de la actualización…';
  try{
    if(!('serviceWorker' in navigator))throw new Error('Abre esta página en Chrome con conexión a Internet.');
    const response=await fetch(new URL('sw.js',scope),{cache:'no-store'});
    if(!response.ok)throw new Error('No se ha podido consultar la actualización.');
    const version=(await response.text()).match(/const VERSION='(\d+\.\d+\.\d+)'/)?.[1];
    if(!version)throw new Error('La corrección todavía no está publicada. Vuelve a intentarlo después de subir los archivos nuevos.');
    const bundle=await fetch(new URL(`simulators-${version}.js`,scope),{cache:'reload'});
    if(!bundle.ok||!/(javascript|ecmascript)/i.test(bundle.headers.get('content-type')||''))throw new Error(`Falta publicar el archivo simulators-${version}.js.`);
    if(!(await bundle.text()).includes(version))throw new Error('El archivo del simulador no corresponde a la actualización.');
    const registration=await navigator.serviceWorker.register(new URL('sw.js',scope),{scope,updateViaCache:'none'});
    await registration.update();
    status.textContent=`Preparando Autoescuela ${version}…`;
    const end=Date.now()+30000,requested=new WeakSet(),versions=new WeakMap();
    while(Date.now()<end){
      const waiting=registration.waiting;
      if(waiting&&!requested.has(waiting)){
        requested.add(waiting);waiting.postMessage({type:'ACTIVATE_UPDATE'});
        status.textContent='Aplicando la actualización…';
      }
      const active=registration.active;
      if(active){
        if(!versions.has(active))versions.set(active,workerVersion(active));
        if(await versions.get(active)===version&&navigator.serviceWorker.controller===active){
          status.textContent='Actualización completada. Abriendo la app…';
          location.replace(scope);return;
        }
      }
      await new Promise(resolve=>setTimeout(resolve,150));
    }
    throw new Error('La actualización no se ha completado. Comprueba la conexión y vuelve a intentarlo.');
  }catch(error){
    status.textContent='No se ha podido completar la actualización.';
    document.getElementById('error').textContent=error.message;
    document.getElementById('details').hidden=false;button.disabled=false;
  }
};
</script>
</body>
</html>
