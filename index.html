 body:`<p>Respeta MMA, cargas por eje y límites del fabricante. Reparte y sujeta el equipaje sin ocultar señales, luces o matrícula ni reducir la visión necesaria. Una carga excesiva o mal colocada altera el frenado y la estabilidad.</p><p>Comprueba combustible o batería y planifica el repostaje o recarga con margen. Un vehículo eléctrico puede ser difícil de oír a baja velocidad: vigila a peatones. Utiliza el procedimiento y los equipos de recarga previstos y sigue las indicaciones del vehículo ante una avería. Revisa luces, limpiaparabrisas, espejos y cierres antes de arrancar.</p>`,tip:'La revisión debe corresponder al viaje de hoy, incluida su carga.',errs:['Tapar la matrícula con un portaequipajes sin resolver su señalización.','Cargar por encima de la MMA porque el motor puede moverlo.'],ref:'RGC, arts. 14, 15 y 18. RGV, condiciones técnicas. Manual del fabricante',source:'#a14'}
 ],questions:[
 {id:'q392',l:'T14L1',q:'¿Qué presión debes tomar como referencia para tus neumáticos?',o:['La indicada por el fabricante para el vehículo y la carga','La máxima que permita la gasolinera','La misma para todos los coches'],c:0,e:'El fabricante establece la presión adecuada y sus variaciones por carga.',r:'DGT, revisión de neumáticos'},
 {id:'q393',l:'T14L1',q:'¿Cuándo se comprueba preferentemente la presión de los neumáticos?',o:['Después de un viaje largo','En frío, según el procedimiento del fabricante','Solo cuando están muy calientes'],c:1,e:'La referencia habitual es la presión en frío; al circular aumenta la temperatura y la presión.',r:'DGT, mantenimiento de neumáticos'},
 {id:'q394',l:'T14L1',q:'En un turismo, ¿qué profundidad mínima legal deben conservar las ranuras principales?',o:['0,5 mm','1 mm','1,6 mm'],c:2,e:'Ese mínimo se exige a los neumáticos de las categorías que recoge el anexo VII, incluido el turismo.',r:'RGV, anexo VII'},
 {id:'q395',l:'T14L1',q:'Observas un bulto en el flanco de un neumático. ¿Qué haces?',o:['Lo hago revisar y resuelvo el defecto antes de seguir utilizándolo con riesgo','Lo pincho para desinflarlo','Lo ignoro si conserva dibujo'],c:0,e:'El dibujo no compensa un daño estructural que puede comprometer el neumático.',r:'RGV, anexo VII. DGT, neumáticos'},
 {id:'q396',l:'T14L1',q:'El sensor de presión no muestra aviso. ¿Puedes omitir todas las comprobaciones?',o:['Sí, detecta cualquier corte o desgaste','No, debo comprobar también presión y estado','Sí, hasta la próxima ITV'],c:1,e:'El avisador no sustituye la inspección del desgaste, daños y condiciones de inflado.',r:'DGT, revisión de neumáticos'},
 {id:'q397',l:'T14L2',q:'El turismo se desvía de forma anormal al frenar. ¿Qué debes hacer?',o:['Compensarlo siempre girando el volante','Aumentar la velocidad para comprobarlo','Solicitar una revisión y evitar circular si compromete la seguridad'],c:2,e:'Una desviación anormal puede indicar una avería que afecta al control.',r:'DGT, mantenimiento y sistemas de frenado'},
 {id:'q398',l:'T14L2',q:'¿Qué ayuda a mantener las ruedas en contacto con el firme?',o:['La suspensión en buen estado','Solo el peso del equipaje','El aire acondicionado'],c:0,e:'La suspensión influye en la estabilidad y en el aprovechamiento de la adherencia.',r:'DGT, seguridad activa del vehículo'},
 {id:'q399',l:'T14L2',q:'El pedal de freno se hunde mucho más que de costumbre. ¿Qué actuación es prudente?',o:['Esperar a que se adapte','Detenerme con seguridad y revisar la anomalía','Circular más cerca para anticipar los frenos del otro'],c:1,e:'Un cambio importante del tacto puede comprometer la frenada y exige revisión.',r:'DGT, mantenimiento. RGC, art. 17'},
 {id:'q400',l:'T14L2',q:'¿La ITV periódica sustituye el mantenimiento de frenos entre inspecciones?',o:['Sí, hasta su fecha de vencimiento','Sí, si el coche tiene ABS','No, debo mantenerlos en buen estado en todo momento'],c:2,e:'Las condiciones de seguridad deben mantenerse durante la utilización, no solo el día de la ITV.',r:'RGV, art. 12. RD 920/2017'},
 {id:'q401',l:'T14L2',q:'Aparece una vibración nueva e intensa en la dirección. ¿Qué haces?',o:['Reduzco con seguridad y hago revisar su causa','Acelero hasta que desaparezca','Suelto el volante para que se centre'],c:0,e:'Una dirección anormal puede impedir controlar el vehículo y requiere atención.',r:'RGC, art. 17. DGT, mantenimiento'},
 {id:'q402',l:'T14L3',q:'El motor está muy caliente. ¿Puedes abrir inmediatamente el tapón del refrigerante?',o:['Sí, si uso un trapo','No; puede salir líquido o vapor a presión','Sí, para enfriarlo más deprisa'],c:1,e:'Debe seguirse el procedimiento seguro del fabricante y esperar al enfriamiento necesario.',r:'DGT, mantenimiento. Manual del fabricante'},
 {id:'q403',l:'T14L3',q:'¿Qué función principal tiene el aceite del motor?',o:['Limpiar el parabrisas','Inflar las ruedas','Lubricar sus componentes'],c:2,e:'La lubricación protege las piezas móviles del motor.',r:'DGT, mantenimiento del vehículo'},
 {id:'q404',l:'T14L3',q:'El nivel del líquido de frenos desciende repetidamente. ¿Qué debes hacer?',o:['Investigar y reparar la causa con asistencia técnica','Rellenarlo indefinidamente sin revisar','Mezclarlo con agua para mantener el nivel'],c:0,e:'Una pérdida puede indicar un problema de seguridad que no se resuelve solo rellenando.',r:'DGT, mantenimiento del sistema de frenos'},
 {id:'q405',l:'T14L3',q:'Para comprobar un nivel, ¿qué procedimiento debes seguir?',o:['El de cualquier vehículo similar','El indicado por el fabricante del modelo','Solo lo que marque el color del tapón'],c:1,e:'Condiciones, productos y niveles pueden variar según el vehículo.',r:'Manual del fabricante. DGT, mantenimiento'},
 {id:'q406',l:'T14L3',q:'¿Por qué debes conservar el lavaparabrisas en condiciones?',o:['Para refrigerar los frenos','Para sustituir la limpieza de los faros','Para poder recuperar la visión a través del parabrisas'],c:2,e:'La limpieza del parabrisas influye en la visibilidad necesaria para conducir.',r:'RGC, art. 18. DGT, mantenimiento'},
 {id:'q407',l:'T14L4',q:'Se enciende durante la marcha un aviso grave de presión de aceite. ¿Qué corresponde?',o:['Detenerme de forma segura y seguir el procedimiento del manual','Seguir hasta agotar el combustible','Acelerar para que suba la presión'],c:0,e:'Una falta de presión puede dañar el motor y requiere actuar sin prolongar la marcha.',r:'DGT, mantenimiento. Manual del fabricante'},
 {id:'q408',l:'T14L4',q:'Al dar contacto se encienden varios testigos y luego se apagan. ¿Qué puede significar?',o:['Que todos los sistemas están averiados','Que se está realizando la comprobación inicial prevista','Que hay que desconectar las luces'],c:1,e:'Muchos vehículos verifican los testigos al arrancar; consulta el comportamiento normal del modelo.',r:'Manual del fabricante'},
 {id:'q409',l:'T14L4',q:'¿El color de un testigo permite saber siempre por sí solo la avería exacta?',o:['Sí, todos los rojos significan lo mismo','Sí, todos los amarillos pueden ignorarse','No, debo interpretar el símbolo y las instrucciones del modelo'],c:2,e:'El significado y la respuesta requerida dependen del aviso concreto.',r:'Manual del fabricante. DGT, mantenimiento'},
 {id:'q410',l:'T14L4',q:'Aparece un aviso de sobretemperatura del motor. ¿Qué haces?',o:['Busco una detención segura y sigo las instrucciones del vehículo','Abro el circuito de refrigeración en marcha','Continúo porque el radiador siempre lo resuelve'],c:0,e:'El sobrecalentamiento puede exigir parar y solicitar asistencia.',r:'DGT, mantenimiento. Manual del fabricante'},
 {id:'q411',l:'T14L4',q:'¿Qué puede indicar un testigo de batería que permanece encendido durante la marcha?',o:['Solo que la radio consume demasiado','Una anomalía del sistema de carga que debo atender','Que debo cambiar el aceite'],c:1,e:'El aviso suele relacionarse con el sistema eléctrico de carga, según el modelo.',r:'Manual del fabricante'},
 {id:'q412',l:'T14L5',q:'En el supuesto ordinario de un turismo particular, ¿cuándo pasa la primera ITV periódica?',o:['A los dos años','A los tres años','A los cuatro años'],c:2,e:'El régimen ordinario de turismos M1 establece la primera inspección a los cuatro años.',r:'RD 920/2017, art. 6'},
 {id:'q413',l:'T14L5',q:'Un turismo particular ordinario tiene más de diez años. ¿Con qué periodicidad pasa ITV?',o:['Anual','Cada dos años','Solo cuando cambia de propietario'],c:0,e:'Superados los diez años, el régimen ordinario es anual.',r:'RD 920/2017, art. 6'},
 {id:'q414',l:'T14L5',q:'La ITV es negativa por defectos muy graves. ¿Cómo se traslada el vehículo?',o:['Conduciéndolo despacio al taller','Por medios ajenos al propio vehículo','Circulando solo por ciudad'],c:1,e:'El resultado negativo impide circular por sus propios medios.',r:'RD 920/2017, art. 11'},
 {id:'q415',l:'T14L5',q:'La ITV es desfavorable. ¿Puedes utilizar el vehículo para tus desplazamientos habituales?',o:['Sí, durante dos meses sin límites','Sí, si son cortos','No, solo para los traslados previstos para reparación y regreso a ITV'],c:2,e:'La circulación queda restringida a los supuestos que establece la norma.',r:'RD 920/2017, art. 11'},
 {id:'q416',l:'T14L5',q:'Instalas una modificación que tiene consideración de reforma. ¿Basta con conservar la factura?',o:['No, debo cumplir el procedimiento de legalización correspondiente','Sí, si la pieza es nueva','Sí, si otro coche lleva la misma'],c:0,e:'La factura por sí sola no acredita que una reforma esté autorizada y anotada cuando proceda.',r:'RD 866/2010, tramitación de reformas'},
 {id:'q417',l:'T14L6',q:'El motor puede mover una carga superior a la MMA. ¿Puedes circular así?',o:['Sí, si los neumáticos parecen soportarla','No, debo respetar las masas autorizadas','Sí, reduciendo diez kilómetros por hora'],c:1,e:'La capacidad de moverla no sustituye los límites de masa y seguridad del vehículo.',r:'RGV, masas autorizadas. RGC, art. 14'},
 {id:'q418',l:'T14L6',q:'El equipaje tapa una luz y parte de la matrícula. ¿Qué debes hacer?',o:['Circular solo de día','Señalizarlo con una tela','Resolverlo con una disposición y señalización reglamentarias antes de circular'],c:2,e:'La carga no puede ocultar los dispositivos y placas que deben verse.',r:'RGC, art. 14.1.d'},
 {id:'q419',l:'T14L6',q:'¿Cómo debes planificar la autonomía antes de una ruta con pocos puntos de recarga?',o:['Con margen y puntos de recarga compatibles previstos','Esperando siempre al aviso de batería mínima','Suponiendo que todos los conectores son compatibles'],c:0,e:'La planificación debe ajustarse al vehículo y a la infraestructura disponible.',r:'DGT, planificación y uso del vehículo. Manual del fabricante'},
 {id:'q420',l:'T14L6',q:'Tu vehículo eléctrico apenas se oye a baja velocidad. ¿Qué debes tener en cuenta?',o:['Que los peatones siempre lo detectarán por las luces','Que pueden no advertirlo y debo extremar la vigilancia','Que eso le da prioridad en las zonas peatonales'],c:1,e:'La menor señal sonora exige anticipar que otras personas podrían no percibir su presencia.',r:'RGC, arts. 3, 17 y 46'},
 {id:'q421',l:'T14L6',q:'Antes de salir con el vehículo cargado, ¿qué debes comprobar?',o:['Solo que cierren las puertas','Solo que no se enciendan testigos','Masas, sujeción, presión adecuada y visibilidad de luces y matrícula'],c:2,e:'La preparación del vehículo debe corresponder a la carga real y a los límites autorizados.',r:'RGC, arts. 14 y 18. RGV, condiciones técnicas'}
 ]},
 '15':{desc:'Practica la conducta PAS y las decisiones básicas para pedir ayuda y atender sin crear nuevos peligros.',sims:[],lessons:[
 {id:'T15L1',t:'Proteger antes de intervenir',min:4,key:'Primero evita que el siniestro provoque otro: protege la zona y protégete.',
 body:`<p>La conducta <b>PAS</b> sigue este orden: proteger, avisar y socorrer. Estaciona sin crear otro obstáculo, identifica riesgos de tráfico, fuego o sustancias y no te expongas. Pide ayuda si no puedes acercarte con seguridad.</p><p>En una inmovilización, utiliza la señalización reglamentaria. En un turismo español, desde 2026 corresponde la V-16 conectada certificada. Colócala conforme a sus instrucciones sin exponerte. Solo abandona el vehículo si puedes salir con seguridad hacia un lugar fuera de la plataforma; si no, permanece dentro con el cinturón. No camines por los carriles para ayudar.</p>`,tip:'Proteger incluye decidir que no es seguro acercarse.',errs:['Entrar corriendo entre vehículos que siguen circulando.','Arriesgarse para recuperar equipaje.'],ref:'RGC, arts. 129 y 130. Cruz Roja, conducta PAS. DGT, V-16',source:COURSE_SOURCES.pas},
 {id:'T15L2',t:'Avisar al 112',min:4,key:'Da una localización precisa, explica los riesgos y sigue las instrucciones del operador.',
 body:`<p>Desde un lugar seguro, llama al <b>112</b>. Indica carretera, punto kilométrico, sentido o referencias útiles; describe número aproximado de afectados, vehículos y riesgos como fuego o mercancías peligrosas. Di si alguien está inconsciente o no respira normalmente.</p><p>No cuelgues hasta que lo indiquen y responde a sus preguntas. Si es posible, delega la llamada en alguien concreto mientras tú proteges. La baliza V-16 no sustituye la solicitud de ayuda sanitaria. En una emergencia real, sigue las indicaciones del servicio y comunica cambios.</p>`,tip:'Dónde, qué pasa, cuántos afectados y qué riesgos hay.',errs:['Dar solo el nombre de una autopista sin sentido ni referencias.','Suponer que activar la baliza equivale a hablar con emergencias.'],ref:'Cruz Roja, conducta PAS. RGC, art. 129. DGT, V-16',source:COURSE_SOURCES.pas},
 {id:'T15L3',t:'Consciencia, respiración y RCP de adultos',min:5,key:'Si una persona no responde y no respira normalmente, avisa al 112 e inicia la ayuda que te indiquen.',
 body:`<p>Con el entorno seguro, comprueba si responde y si respira normalmente, sin retrasar la petición de ayuda. Las boqueadas aisladas no son respiración normal. Activa el 112 en altavoz y pide un desfibrilador si hay uno disponible.</p><p>En un <b>adulto</b> en parada, comprime en el centro del pecho a 100–120 por minuto, con 5–6 cm de profundidad y dejando recuperar el tórax. Si sabes y puedes ventilar, combina 30 compresiones con 2 ventilaciones; si no, haz compresiones continuas y sigue al operador. Con DEA, obedece sus avisos y evita tocar a la víctima durante análisis y descarga.</p>`,tip:'La guía telefónica puede ayudarte a actuar mientras llega la asistencia.',errs:['Confundir boqueadas ocasionales con respiración normal.','Esperar pasivamente a una ambulancia ante una parada.'],ref:'ERC, guías 2025 de soporte vital básico del adulto. Cruz Roja, PAS',source:COURSE_SOURCES.rcp},
 {id:'T15L4',t:'Hemorragias y cuidados básicos',min:4,key:'Pide ayuda y controla una hemorragia externa importante con presión directa cuando sea seguro.',
 body:`<p>Protege tus manos si dispones de guantes. En una herida con sangrado abundante, presiona con un apósito o tela limpia y sigue al 112. Si se empapa, mantén la presión y añade material encima. Si hay un objeto clavado, no lo retires ni presiones directamente sobre él; espera instrucciones para actuar alrededor.</p><p>Mantén a la persona acompañada y abrigada sin sobrecalentarla. No le des comida, bebida, alcohol ni medicamentos. Evita mover fracturas o intentar recolocarlas. Comunica cualquier empeoramiento a emergencias.</p>`,tip:'Una actuación sencilla y guiada puede ser más útil que una maniobra improvisada.',errs:['Quitar repetidamente el apósito para mirar.','Extraer un objeto clavado de una herida.'],ref:'DGT, manual de primeros auxilios. Cruz Roja, control de hemorragias',source:COURSE_SOURCES.aid},
 {id:'T15L5',t:'Mover a un herido y el casco del motorista',min:4,key:'Evita movimientos innecesarios; la seguridad y las maniobras vitales pueden exigir excepciones.',
 body:`<p>Una persona accidentada puede tener lesiones que no se ven. Como regla, no la saques ni la muevas si está en lugar seguro y no necesita una maniobra vital. No le pidas que camine para comprobar si está bien. Tranquilízala y vigila su respiración.</p><p>No retires por rutina el casco de un motorista. Si una amenaza inmediata o la necesidad de mantener la vía aérea o reanimar obliga a actuar, pide instrucciones al 112 y aplica la ayuda necesaria, con personal formado si está disponible. No antepongas conservar el casco a una necesidad vital.</p>`,tip:'Explica al 112 si el lugar es peligroso y cómo respira la víctima.',errs:['Mover a alguien solo para colocarlo más cómodo.','Quitar el casco para ofrecer agua.'],ref:'DGT, primeros auxilios y actuación ante un motorista. ERC, soporte vital básico',source:COURSE_SOURCES.aid},
 {id:'T15L6',t:'Colaborar y evitar nuevos riesgos',min:4,key:'Auxilia o pide auxilio y facilita información sin obstaculizar la atención.',
 body:`<p>Los implicados, testigos o quienes conozcan el siniestro deben auxiliar o solicitar auxilio y colaborar para evitar daños. Facilita la identificación y los datos necesarios. Si hay heridos graves, evita alterar pruebas salvo que sea necesario para atenderlos o mantener la seguridad.</p><p>En daños materiales, aparta el vehículo si puede hacerse con seguridad y sigue las indicaciones de los agentes. Obtén fotos o datos solo desde lugar seguro. No frenes para curiosear ni difundas imágenes de las víctimas. Deja libre el acceso a los servicios de emergencia.</p>`,tip:'La colaboración útil protege, informa y deja trabajar a los servicios.',errs:['Detenerse a grabar en un punto peligroso.','Marcharse de un siniestro con víctimas sin auxiliar ni pedir ayuda.'],ref:'RGC, arts. 3, 129 y 130',source:'#a129'}
 ],questions:[
 {id:'q422',l:'T15L1',q:'¿Cuál es el orden de la conducta PAS?',o:['Proteger, avisar y socorrer','Avisar, mover y circular','Socorrer, grabar y avisar'],c:0,e:'Primero se evita otro peligro, después se pide ayuda y se atiende a las víctimas.',r:'Cruz Roja, conducta PAS'},
 {id:'q423',l:'T15L1',q:'Para llegar a un herido tendrías que cruzar carriles con tráfico rápido. ¿Qué haces?',o:['Cruzo para ahorrar tiempo','Pido ayuda y evito exponerme a un atropello','Hago señales desde el centro del carril'],c:1,e:'Proteger incluye la seguridad de quien ayuda. No debes crear una nueva víctima.',r:'Cruz Roja, conducta PAS. RGC, art. 129'},
 {id:'q424',l:'T15L1',q:'Tras una inmovilización no puedes salir del turismo hacia una zona segura. ¿Qué debes hacer?',o:['Caminar por el carril hasta una salida','Esperar detrás del coche en la calzada','Permanecer dentro con el cinturón y solicitar ayuda'],c:2,e:'Si no hay una salida segura, la norma prevé permanecer dentro con el sistema de retención abrochado.',r:'RGC, art. 130.3'},
 {id:'q425',l:'T15L1',q:'¿Qué dispositivo corresponde en 2026 a un turismo español para preseñalizar una inmovilización cuando es exigible?',o:['V-16 conectada certificada','Cualquier luz amarilla sin conectividad','Solo una linterna del móvil'],c:0,e:'Desde el 1 de enero de 2026 se exige la V-16 conectada del tipo reglamentario.',r:'RGV, anexos XI y XII. DGT, V-16'},
 {id:'q426',l:'T15L1',q:'¿Dónde debes detener tu vehículo al ayudar en un siniestro?',o:['Lo más cerca posible aunque tape un carril','En un lugar seguro que no cree otro obstáculo o peligro','Siempre junto a la víctima en doble fila'],c:1,e:'La protección empieza por no generar otro siniestro con tu llegada.',r:'Cruz Roja, PAS. RGC, art. 129'},
 {id:'q427',l:'T15L2',q:'¿Qué información permite localizar mejor un siniestro en carretera?',o:['Solo el color del coche','Solo la provincia','Carretera, punto o referencias y sentido de circulación'],c:2,e:'Una localización precisa permite enviar los recursos al lugar correcto.',r:'Cruz Roja, conducta PAS'},
 {id:'q428',l:'T15L2',q:'Hay varios testigos y quieres delegar la llamada al 112. ¿Qué es más eficaz?',o:['Asignarla a una persona concreta y confirmar que la realiza','Decir en general que alguien llame','Suponer que otro ya habrá avisado'],c:0,e:'Una asignación concreta evita que todos crean que la llamada la hizo otra persona.',r:'Cruz Roja, conducta PAS y petición de ayuda'},
 {id:'q429',l:'T15L2',q:'El operador del 112 sigue preguntando por el estado de las víctimas. ¿Qué haces?',o:['Cuelgo para no gastar batería','Respondo y sigo sus instrucciones hasta que indique finalizar','Le pido que no haga más preguntas'],c:1,e:'Las preguntas ayudan a valorar la emergencia y guiar la asistencia.',r:'Cruz Roja, conducta PAS'},
 {id:'q430',l:'T15L2',q:'Has activado la V-16 y hay una persona herida. ¿Debes solicitar ayuda sanitaria?',o:['No, la baliza sustituye toda llamada','Solo si tarda más de diez minutos','Sí, llama al 112 e informa de las víctimas'],c:2,e:'La señalización del vehículo no sustituye la comunicación necesaria para la asistencia sanitaria.',r:'DGT, V-16. Cruz Roja, PAS'},
 {id:'q431',l:'T15L2',q:'Observas un vehículo con fuego o posible mercancía peligrosa. ¿Qué informas al 112?',o:['También de ese riesgo, manteniéndome a distancia segura','Solo del número de matrícula','Nada hasta acercarme a identificar el producto'],c:0,e:'Los riesgos añadidos son relevantes para proteger a personas y equipos de emergencia.',r:'Cruz Roja, PAS. RGC, art. 129'},
 {id:'q432',l:'T15L3',q:'Un adulto no responde y solo hace boqueadas aisladas. ¿Cómo interpretas su respiración?',o:['Como respiración normal suficiente','Como respiración anormal que exige activar ayuda y valorar RCP','Como señal de que está dormido'],c:1,e:'Las boqueadas agónicas no son respiración normal. Avisa al 112 y sigue la ayuda para la parada.',r:'ERC, guías 2025 de soporte vital básico del adulto'},
 {id:'q433',l:'T15L3',q:'¿Qué frecuencia se recomienda para las compresiones de RCP en un adulto?',o:['40 a 60 por minuto','60 a 80 por minuto','100 a 120 por minuto'],c:2,e:'La referencia de soporte vital básico del adulto es de 100 a 120 compresiones por minuto.',r:'ERC, guías 2025 de soporte vital básico del adulto'},
 {id:'q434',l:'T15L3',q:'¿Qué profundidad se recomienda para comprimir el pecho de un adulto en RCP?',o:['Entre 5 y 6 cm','Apenas 1 cm','Más de 8 cm'],c:0,e:'Las guías del adulto recomiendan 5–6 cm y dejar que el tórax se reexpanda.',r:'ERC, guías 2025 de soporte vital básico del adulto'},
 {id:'q435',l:'T15L3',q:'Sabes y puedes realizar ventilaciones en una RCP de adulto. ¿Qué relación se utiliza?',o:['Cinco compresiones y cinco ventilaciones','Treinta compresiones y dos ventilaciones','Dos compresiones y treinta ventilaciones'],c:1,e:'La relación general es 30:2. Si no puedes ventilar, realiza compresiones siguiendo al 112.',r:'ERC, guías 2025 de soporte vital básico del adulto'},
 {id:'q436',l:'T15L3',q:'Un DEA anuncia que va a analizar o descargar. ¿Qué debes hacer?',o:['Seguir sujetando a la víctima','Retirar los parches para comprobar la piel','Seguir sus avisos y evitar que alguien toque a la víctima en esos momentos'],c:2,e:'Los avisos del DEA indican cuándo apartarse y cuándo reanudar la RCP.',r:'ERC, guías 2025 de soporte vital básico del adulto'},
 {id:'q437',l:'T15L4',q:'Una herida externa sangra abundantemente, sin objeto clavado. ¿Qué ayuda inicial corresponde si es seguro?',o:['Presión directa con apósito o tela limpia y aviso al 112','Lavar continuamente sin presionar','Dar una bebida para recuperar fuerzas'],c:0,e:'La presión directa ayuda a controlar el sangrado mientras llega la asistencia.',r:'DGT, manual de primeros auxilios. Cruz Roja, hemorragias'},
 {id:'q438',l:'T15L4',q:'El apósito se empapa mientras comprimes una hemorragia. ¿Qué haces inicialmente?',o:['Lo retiro para dejar respirar la herida','Mantengo la presión y añado material encima, siguiendo al 112','Interrumpo la presión hasta que se seque'],c:1,e:'Retirar repetidamente el material puede dificultar el control del sangrado.',r:'DGT, manual de primeros auxilios'},
 {id:'q439',l:'T15L4',q:'Ves un objeto clavado en una herida. ¿Qué debes evitar?',o:['Avisar al 112','Proteger tus manos','Extraerlo por tu cuenta'],c:2,e:'Retirarlo puede agravar lesiones y sangrado. Sigue las instrucciones de emergencias.',r:'Cruz Roja, control de hemorragias. DGT, primeros auxilios'},
 {id:'q440',l:'T15L4',q:'Una persona herida pide una bebida alcohólica para calmarse. ¿Qué haces?',o:['No se la doy y sigo las instrucciones de emergencias','Se la doy en cantidad pequeña','La sustituyo por un medicamento propio'],c:0,e:'No administres comida, bebida, alcohol o medicamentos a la víctima por iniciativa propia.',r:'DGT, manual de primeros auxilios'},
 {id:'q441',l:'T15L4',q:'Una extremidad parece fracturada. ¿Debes intentar enderezarla?',o:['Sí, antes de llamar','No, evito manipularla y pido asistencia','Sí, si el herido lo solicita'],c:1,e:'La manipulación puede agravar las lesiones. Sigue las indicaciones sanitarias.',r:'DGT, manual de primeros auxilios'},
 {id:'q442',l:'T15L5',q:'Un motorista consciente respira normalmente y está en lugar seguro. ¿Debes quitarle el casco por rutina?',o:['Sí, para hablar mejor','Sí, para darle agua','No, evita retirarlo innecesariamente'],c:2,e:'La retirada puede movilizar lesiones. Se reserva a necesidades justificadas y con ayuda adecuada.',r:'DGT, actuación ante un motorista accidentado'},
 {id:'q443',l:'T15L5',q:'Una víctima respira y está fuera de peligro inmediato. ¿Debes moverla solo para que esté más cómoda?',o:['No, evito movimientos innecesarios y sigo al 112','Sí, siempre la pongo sentada','Sí, le pido que camine'],c:0,e:'Puede haber lesiones ocultas. Los movimientos deben justificarse por seguridad o necesidades vitales.',r:'DGT, manual de primeros auxilios'},
 {id:'q444',l:'T15L5',q:'Un fuego inmediato amenaza a una víctima. ¿La regla de no moverla impide cualquier traslado?',o:['Sí, sin excepciones','No; la amenaza puede exigir moverla siguiendo la ayuda de emergencias','Solo puede moverse cuando llegue su familia'],c:1,e:'El peligro inmediato es una excepción a evitar movilizaciones innecesarias.',r:'DGT, primeros auxilios. Cruz Roja, PAS'},
 {id:'q445',l:'T15L5',q:'El casco impide una maniobra vital necesaria para una víctima que no respira normalmente. ¿Qué haces?',o:['Abandono la ayuda para conservar el casco','Espero sin avisar','Activo el 112 y sigo las instrucciones para atender la necesidad vital'],c:2,e:'No retirar por rutina no significa anteponer el casco a la vía aérea o a la reanimación necesaria.',r:'DGT, actuación ante un motorista. ERC, soporte vital básico'},
 {id:'q446',l:'T15L5',q:'Una persona accidentada dice que está bien, pero parece confusa. ¿Qué es prudente?',o:['Pedir ayuda, acompañarla y observar cambios sin exigirle que camine','Hacerla correr para comprobar su equilibrio','Dejarla sola si puede hablar'],c:0,e:'Poder hablar no descarta lesiones. La confusión debe comunicarse al 112.',r:'DGT, manual de primeros auxilios'},
 {id:'q447',l:'T15L6',q:'Presencias un siniestro con víctimas y no sabes prestar primeros auxilios. ¿Qué obligación puedes cumplir?',o:['Marcharme porque no soy sanitario','Solicitar auxilio y colaborar sin ponerme en peligro','Limitarme a grabarlo'],c:1,e:'La obligación incluye auxiliar o pedir auxilio y colaborar en la prevención de mayores daños.',r:'RGC, art. 129.1'},
 {id:'q448',l:'T15L6',q:'Hay heridos graves y pruebas sobre la posición de los vehículos. ¿Cuándo se justifica alterar la situación?',o:['Para mejorar una fotografía','Para evitar una discusión','Cuando sea necesario para atender o mantener la seguridad'],c:2,e:'La atención a las víctimas y la seguridad justifican las actuaciones necesarias sobre el escenario.',r:'RGC, art. 129.2'},
 {id:'q449',l:'T15L6',q:'Solo hay daños materiales y los vehículos pueden apartarse con seguridad. ¿Qué ayuda a evitar otro siniestro?',o:['Dejar libre la circulación y colaborar con los datos necesarios','Permanecer en mitad de los carriles para discutir','Retirar las matrículas antes de apartarse'],c:0,e:'Debe restablecerse la seguridad sin crear riesgos, siguiendo las instrucciones de los agentes.',r:'RGC, arts. 129 y 130'},
 {id:'q450',l:'T15L6',q:'Quieres tomar imágenes para documentar un golpe. ¿Cómo debes hacerlo?',o:['De pie en un carril si son pocos segundos','Solo desde una posición segura y sin obstaculizar la ayuda','Acercándome a las víctimas para identificarlas públicamente'],c:1,e:'Documentar no autoriza a exponerse ni a dificultar la asistencia.',r:'RGC, arts. 3 y 129'},
 {id:'q451',l:'T15L6',q:'Pasas cerca de un siniestro ya atendido. ¿Qué debes evitar?',o:['Respetar a los agentes','Dejar libre el acceso a emergencias','Frenar para curiosear o grabar'],c:2,e:'Curiosear puede generar alcances y entorpecer la atención.',r:'RGC, arts. 3, 45 y 129'}
 ]},
 '16':{desc:'Reduce consumo, ruido y emisiones con una conducción suave, mantenimiento y planificación compatibles con la seguridad.',sims:[],lessons:[
 {id:'T16L1',t:'Planificar y elegir el desplazamiento',min:4,key:'Un viaje bien elegido y preparado puede evitar consumo y riesgos innecesarios.',
 body:`<p>Valora caminar, transporte público o compartir vehículo cuando sean adecuados. Si vas a conducir, prepara ruta y horario para reducir recorridos innecesarios y retenciones, y prevé descansos. La ruta de menor consumo debe seguir siendo legal y segura.</p><p>Retira peso y accesorios que no necesitas, pero conserva el equipamiento obligatorio. No confundas eficiencia con llegar más rápido. La anticipación y una marcha regular reducen cambios bruscos y ayudan a conducir con menos tensión.</p>`,tip:'La primera decisión eficiente es cómo y cuándo desplazarte.',errs:['Elegir atajos prohibidos para ahorrar kilómetros.','Quitar elementos obligatorios para reducir peso.'],ref:'IDAE, conducción eficiente. RGC, arts. 3 y 45',source:COURSE_SOURCES.efficient},
 {id:'T16L2',t:'Arranque, aceleración y marchas',min:4,key:'Adapta el motor y el cambio a la demanda real de potencia, sin forzarlos.',
 body:`<p>Arranca según el manual y evita acelerar en vacío. Cuando el vehículo permita iniciar la marcha, hazlo progresivamente. En un vehículo de cambio manual, utiliza una relación adecuada que evite revoluciones innecesarias, sin ahogar el motor ni comprometer la respuesta.</p><p>Una marcha larga puede reducir consumo en condiciones apropiadas; una subida, una incorporación o una necesidad de control pueden exigir otra relación. No existe una cifra universal de revoluciones para todos los motores. En automático, utiliza los modos de acuerdo con el fabricante.</p>`,tip:'Eficiencia significa una relación adecuada, no la más larga a cualquier precio.',errs:['Acelerar fuerte con el motor frío.','Mantener una marcha demasiado larga aunque el motor no responda.'],ref:'IDAE, conducción eficiente. Manual del fabricante',source:COURSE_SOURCES.efficient},
 {id:'T16L3',t:'Anticipación e inercia',min:4,key:'Mira lejos y regula la marcha con antelación para evitar acelerar y frenar sin necesidad.',
 body:`<p>Observa semáforos, colas y pendientes. Si prevés reducir, deja de acelerar con tiempo cuando sea seguro y conserva separación. No acerques el vehículo para evitar que otro ocupe el hueco: perderías margen y aumentarían los cambios de ritmo.</p><p>En una bajada con un vehículo convencional de cambio manual, usa una marcha adecuada y el freno motor, completando con los frenos cuando haga falta. No bajes voluntariamente en punto muerto o con el embrague pisado: pierdes retención y control. Adapta siempre la técnica al vehículo.</p>`,tip:'Aprovecha la anticipación, manteniendo capacidad para responder.',errs:['Acelerar hacia un semáforo rojo para frenar al llegar.','Bajar en punto muerto creyendo que mejora la seguridad.'],ref:'IDAE, conducción eficiente. DGT, guía de turismos',source:COURSE_SOURCES.efficient},
 {id:'T16L4',t:'Neumáticos, carga y aerodinámica',min:4,key:'El mantenimiento y la resistencia al avance también influyen en el consumo.',
 body:`<p>Una presión incorrecta puede aumentar consumo, desgaste y riesgo. Usa la prevista para la carga. Revisa el mantenimiento: filtros y sistemas en mal estado pueden empeorar el rendimiento y las emisiones.</p><p>La carga innecesaria y una baca vacía aumentan la energía necesaria para desplazarte. Retira los accesorios que no utilices y reparte el equipaje de forma segura. No excedas masas autorizadas. Con portaequipajes, respeta límites e instrucciones y revisa la sujeción durante el viaje si es necesario.</p>`,tip:'Vaciar una baca no elimina su resistencia; retírala si no la necesitas.',errs:['Sobreinflar por encima de lo indicado para ahorrar.','Ignorar una carga mal sujeta porque el viaje sea corto.'],ref:'IDAE, conducción eficiente. RGC, art. 14',source:COURSE_SOURCES.efficient},
 {id:'T16L5',t:'Climatización y vehículos electrificados',min:4,key:'Utiliza la energía de confort y propulsión con criterio, manteniendo visibilidad y atención.',
 body:`<p>La climatización consume energía, pero evitar vaho y temperaturas que te resten atención es prioritario. Ajusta una temperatura razonable y ventila o usa los sistemas de forma compatible con la seguridad.</p><p>En eléctricos e híbridos, conoce la retención y regeneración de tu modelo. La recuperación de energía no garantiza que puedas prescindir del freno; su intensidad puede variar por batería o condiciones. Planifica la recarga con margen y equipos compatibles. La autonomía anunciada no es fija: velocidad, frío, carga y climatización pueden modificarla.</p>`,tip:'Consulta cómo retiene y frena tu modelo; no extrapoles de otro vehículo.',errs:['Desconectar el desempañado aunque se pierda visión.','Confiar en la autonomía anunciada sin valorar las condiciones.'],ref:'DGT, guía de conducción segura y eficiente de turismos. Manual del fabricante',source:COURSE_SOURCES.car},
 {id:'T16L6',t:'Emisiones, ruido y restricciones',min:4,key:'Mantén los sistemas de emisiones y respeta las restricciones de cada zona.',
 body:`<p>No alteres el escape ni los sistemas anticontaminación. Un vehículo no puede emitir ruido o contaminantes por encima de los límites autorizados. Acelerar sin necesidad y usar el claxon fuera de sus supuestos también perjudica la convivencia.</p><p>El distintivo ambiental clasifica el vehículo, pero no concede entrada universal a cualquier ZBE. Consulta la señalización y regulación municipal. Un eléctrico reduce emisiones del escape durante el uso, pero también consume recursos y necesita una conducción responsable. Entrega aceite, baterías y neumáticos a gestores o puntos autorizados.</p>`,tip:'Consulta la zona concreta: la etiqueta no sustituye sus condiciones de acceso.',errs:['Anular el sistema anticontaminación porque el vehículo siga funcionando.','Suponer que una etiqueta ECO permite entrar siempre.'],ref:'RGC, arts. 7, 110 y 157. IDAE, movilidad eficiente',source:'#a7'}
 ],questions:[
 {id:'q452',l:'T16L1',q:'¿Qué decisión puede reducir consumo antes de arrancar?',o:['Elegir un desplazamiento y una ruta adecuados, incluso otro medio si conviene','Acelerar fuerte al salir','Quitar el equipamiento obligatorio'],c:0,e:'La planificación puede evitar recorridos y consumo innecesarios sin perder seguridad.',r:'IDAE, conducción eficiente'},
 {id:'q453',l:'T16L1',q:'Un atajo más corto está prohibido para tu vehículo. ¿Es una opción eficiente válida?',o:['Sí, si ahorra combustible','No, debo escoger una ruta permitida','Sí, si no hay peatones'],c:1,e:'La eficiencia debe respetar las normas y la seguridad.',r:'RGC, arts. 3 y 132'},
 {id:'q454',l:'T16L1',q:'¿Qué ayuda a evitar aceleraciones y frenadas continuas?',o:['Seguir muy cerca al precedente','Cambiar constantemente de carril','Planificar y mantener una marcha regular con margen'],c:2,e:'La anticipación reduce cambios de ritmo innecesarios.',r:'IDAE, conducción eficiente'},
 {id:'q455',l:'T16L1',q:'¿Puedes retirar la V-16 obligatoria de un turismo para ahorrar peso?',o:['No, debo conservar el equipamiento reglamentario','Sí, si solo voy por ciudad','Sí, si la llevo en otro coche'],c:0,e:'Reducir carga innecesaria no elimina los accesorios obligatorios.',r:'RGV, anexo XII'},
 {id:'q456',l:'T16L1',q:'¿Por qué conviene consultar el estado del tráfico antes de salir?',o:['Para conocer dónde puedo superar el límite','Para prever incidencias, alternativas y horario','Para evitar todos los descansos'],c:1,e:'La información previa ayuda a planificar el desplazamiento y evitar improvisaciones.',r:'DGT, planificación. IDAE, conducción eficiente'},
 {id:'q457',l:'T16L2',q:'¿Cómo conviene acelerar al iniciar un desplazamiento ordinario?',o:['Con acelerones en vacío','Siempre a fondo','De forma progresiva y según el manual'],c:2,e:'La progresividad evita consumo y esfuerzos innecesarios.',r:'IDAE, conducción eficiente'},
 {id:'q458',l:'T16L2',q:'¿Debe usarse siempre la marcha más larga aunque el motor no responda?',o:['No, debe ser adecuada a la demanda y al control','Sí, en cualquier subida','Sí, mientras no se cale'],c:0,e:'Una relación excesivamente larga puede forzar el motor y comprometer la respuesta.',r:'IDAE, conducción eficiente'},
 {id:'q459',l:'T16L2',q:'Para conducir eficientemente, ¿sirve la misma cifra de revoluciones para todos los motores?',o:['Sí, sin excepciones','No, depende del vehículo y de las condiciones','Sí, si todos usan gasolina'],c:1,e:'La relación y el régimen adecuados dependen de características y demanda.',r:'IDAE, conducción eficiente. Manual del fabricante'},
 {id:'q460',l:'T16L2',q:'En una incorporación necesitas más capacidad de respuesta. ¿Qué debe priorizar la elección de marcha?',o:['La más larga aunque no acelere','No cambiar nunca de la marcha previa','La respuesta y el control necesarios para incorporarte con seguridad'],c:2,e:'El ahorro no justifica una relación que impida realizar la maniobra con seguridad.',r:'RGC, arts. 17 y 72. IDAE, conducción eficiente'},
 {id:'q461',l:'T16L2',q:'¿Qué debes evitar al arrancar un motor frío?',o:['Aceleraciones innecesarias y esfuerzos contrarios al manual','Seguir las instrucciones del fabricante','Iniciar la marcha cuando el vehículo esté preparado'],c:0,e:'El procedimiento debe respetar las necesidades del modelo y evitar esfuerzos innecesarios.',r:'IDAE, conducción eficiente. Manual del fabricante'},
 {id:'q462',l:'T16L3',q:'Ves una cola detenida a suficiente distancia. ¿Qué favorece una marcha eficiente y segura?',o:['Acelerar hasta llegar a la cola','Dejar de acelerar con antelación y reducir con margen','Acercarme todo lo posible antes de observar detrás'],c:1,e:'Anticiparse evita aceleraciones inútiles y permite una reducción progresiva.',r:'IDAE, conducción eficiente. RGC, art. 53'},
 {id:'q463',l:'T16L3',q:'Bajas una pendiente con un turismo convencional de cambio manual. ¿Qué es adecuado?',o:['Punto muerto durante todo el descenso','Embrague pisado continuamente','Marcha apropiada y retención, usando los frenos cuando haga falta'],c:2,e:'La marcha engranada conserva freno motor y control en el descenso.',r:'IDAE, conducción eficiente'},
 {id:'q464',l:'T16L3',q:'¿Por qué no conviene seguir muy cerca para que nadie ocupe el hueco?',o:['Porque pierdes margen y favoreces frenadas y cambios bruscos','Porque siempre aumenta la autonomía','Porque elimina la resistencia del aire de forma segura'],c:0,e:'El ahorro nunca compensa perder la separación necesaria para detenerte.',r:'RGC, art. 54. IDAE, conducción eficiente'},
 {id:'q465',l:'T16L3',q:'Un semáforo se ve rojo desde lejos y puedes reducir con seguridad. ¿Qué evita gasto innecesario?',o:['Mantener el acelerador hasta el último instante','Anticipar la reducción en vez de acelerar hacia la detención','Cambiar repetidamente entre acelerador y freno'],c:1,e:'La observación lejana permite adaptar la marcha sin consumir para frenar inmediatamente después.',r:'IDAE, conducción eficiente'},
 {id:'q466',l:'T16L3',q:'¿La eficiencia permite mantener una velocidad que no se adapta a una curva?',o:['Sí, si evita frenar','Sí, si no supera el límite genérico','No, la seguridad de la curva exige adaptar la marcha'],c:2,e:'Debe elegirse una velocidad segura aunque ello exija reducir.',r:'RGC, art. 45'},
 {id:'q467',l:'T16L4',q:'¿Qué haces con una baca que ya no utilizas?',o:['La retiro cuando sea posible siguiendo sus instrucciones','La mantengo porque vacía no crea resistencia','La cargo para compensar el aire'],c:0,e:'Una baca incluso vacía puede aumentar la resistencia aerodinámica y el consumo.',r:'IDAE, conducción eficiente'},
 {id:'q468',l:'T16L4',q:'¿Es adecuado inflar por encima de lo indicado para ahorrar combustible?',o:['Sí, cuanto más mejor','No, debo utilizar la presión prevista para la carga','Sí, si la carretera está seca'],c:1,e:'La presión debe corresponder a las indicaciones del fabricante y a la seguridad del neumático.',r:'DGT, neumáticos. IDAE, conducción eficiente'},
 {id:'q469',l:'T16L4',q:'¿Cómo influye llevar peso innecesario?',o:['Reduce siempre el consumo','Mejora todas las frenadas','Puede aumentar la energía necesaria para desplazarse'],c:2,e:'La masa adicional exige más energía, especialmente al acelerar y en pendientes.',r:'IDAE, conducción eficiente'},
 {id:'q470',l:'T16L4',q:'¿Qué debe hacerse con el equipaje de un portaequipajes?',o:['Sujetar y comprobar según sus límites e instrucciones','Confiar solo en su propio peso','Tapar las luces si eso mejora la aerodinámica'],c:0,e:'La carga debe permanecer segura y respetar las condiciones del vehículo y del accesorio.',r:'RGC, art. 14'},
 {id:'q471',l:'T16L4',q:'¿El mantenimiento influye solo en la duración del vehículo?',o:['Sí, no afecta al gasto','No, también puede afectar a consumo, emisiones y seguridad','Solo si el vehículo es diésel'],c:1,e:'Los elementos deteriorados pueden empeorar el rendimiento y las condiciones de circulación.',r:'IDAE, conducción eficiente. DGT, mantenimiento'},
 {id:'q472',l:'T16L5',q:'Los cristales se empañan y desempañar consume energía. ¿Qué priorizas?',o:['Ahorrar aunque apenas vea','Conducir mirando por una pequeña zona','Recuperar la visibilidad con los sistemas adecuados'],c:2,e:'La eficiencia es compatible con conservar el campo de visión necesario.',r:'RGC, art. 18'},
 {id:'q473',l:'T16L5',q:'¿La autonomía anunciada de un eléctrico es idéntica en todos los viajes?',o:['No, cambia con condiciones como velocidad, temperatura y carga','Sí, aunque cambie la temperatura','Sí, si la batería marca el cien por cien'],c:0,e:'La energía requerida depende del uso y las condiciones del desplazamiento.',r:'DGT, conducción eficiente. Manual del fabricante'},
 {id:'q474',l:'T16L5',q:'Tu eléctrico tiene frenada regenerativa. ¿Puedes dar por hecho que siempre retendrá con la misma intensidad?',o:['Sí, mientras no uses el pedal','No, debo conocer sus límites y mantener capacidad de frenar','Sí, independientemente del estado de batería'],c:1,e:'La regeneración puede variar y no elimina la utilización del freno cuando sea necesaria.',r:'Manual del fabricante. DGT, conducción segura y eficiente'},
 {id:'q475',l:'T16L5',q:'¿Qué climatización favorece seguridad y uso razonable de energía?',o:['Desconectarla siempre','Llevar una temperatura extrema para no hacer paradas','Ajustarla para mantener confort y visibilidad sin gasto innecesario'],c:2,e:'Evitar temperaturas que resten atención y conservar visión es prioritario.',r:'RGC, art. 18. IDAE, conducción eficiente'},
 {id:'q476',l:'T16L5',q:'¿Qué debes comprobar al planificar una recarga?',o:['Compatibilidad, disponibilidad prevista y margen de autonomía','Solo que el punto aparezca en una foto','Que todos los conectores tengan el mismo color'],c:0,e:'La infraestructura debe ser adecuada al vehículo y al recorrido.',r:'Manual del fabricante. DGT, planificación del viaje'},
 {id:'q477',l:'T16L6',q:'Tu vehículo tiene etiqueta ECO. ¿Puedes entrar en cualquier ZBE a cualquier hora?',o:['Sí, sin más condiciones','No, debo comprobar la regulación de esa zona','Sí, si voy solo'],c:1,e:'La clasificación ambiental no sustituye las restricciones locales aplicables.',r:'RGC, arts. 37 y 157'},
 {id:'q478',l:'T16L6',q:'¿Puedes anular un sistema anticontaminación para que el motor rinda más?',o:['Sí, mientras no se vea humo','Sí, si la ITV aún no toca','No, debo conservar las condiciones técnicas y límites reglamentarios'],c:2,e:'Modificar sistemas de emisiones no autoriza a incumplir la normativa técnica y ambiental.',r:'RGC, art. 7. RGV, condiciones técnicas'},
 {id:'q479',l:'T16L6',q:'¿Dónde deben entregarse aceite usado, baterías o neumáticos sustituidos?',o:['En gestores o puntos autorizados','En la basura doméstica mezclada','En un desagüe si son líquidos'],c:0,e:'Estos residuos requieren la gestión prevista para evitar contaminación.',r:'IDAE, movilidad y mantenimiento responsables. Normativa de residuos'},
 {id:'q480',l:'T16L6',q:'¿Qué conducta reduce ruido innecesario?',o:['Acelerar en vacío al detenerme','Evitar acelerones y usar el claxon solo cuando procede','Modificar el escape para que se me oiga siempre'],c:1,e:'El vehículo y su uso deben respetar los límites de ruido y las reglas de advertencias acústicas.',r:'RGC, arts. 7 y 110'},
 {id:'q481',l:'T16L6',q:'¿Conducir un eléctrico elimina la necesidad de una movilidad responsable?',o:['Sí, porque no consume recursos','Sí, porque tiene prioridad ambiental','No, sigue consumiendo energía y debe respetar seguridad y restricciones'],c:2,e:'La ausencia de emisiones de escape no elimina consumo de recursos ni obligaciones de circulación.',r:'IDAE, movilidad eficiente. RGC, arts. 3 y 157'}
 ]},
 'M1':{desc:'Elige y utiliza casco, guantes, ropa, calzado y elementos de visibilidad adecuados para conducir una moto.',sims:[],lessons:[
 {id:'M1L1',t:'Casco: ajuste y abrochado',min:4,key:'El casco debe ser adecuado, ajustar a la cabeza y permanecer correctamente abrochado.',
 body:`<p>Conductor y pasajero deben utilizar el casco exigido en toda clase de vías. Elige uno homologado que se adapte a tu cabeza sin moverse ni causar puntos de dolor. Comprueba el cierre y abróchalo antes de arrancar. Un casco grande o desabrochado puede salir despedido.</p><p>Respeta las instrucciones de uso y sustitución. Tras un impacto importante, haz valorar su sustitución aunque parezca intacto: puede haber daños internos. No lo taladres ni modifiques. Un casco de bicicleta no sustituye al exigido para motocicleta.</p>`,tip:'Pruébalo ajustado y cerrado; la apariencia no demuestra que proteja.',errs:['Llevarlo sobre la cabeza con la correa abierta.','Comprar una talla holgada para ganar comodidad.'],ref:'RGC, art. 118.1. DGT, equipamiento del motorista',source:'#a118'},
 {id:'M1L2',t:'Guantes y protección de las manos',min:4,key:'Las manos manejan los mandos y necesitan protección compatible con el tacto.',
 body:`<p>Desde octubre de 2026, conductor y pasajero de motocicleta deben llevar <b>guantes de protección en vías interurbanas</b>. Usarlos también en ciudad es una recomendación de seguridad. Elige talla, ajuste y protecciones que permitan accionar freno, embrague e intermitentes.</p><p>Evita guantes que se deslicen o puedan salir de la mano. Un guante corriente que solo abriga no ofrece necesariamente protección para moto. Revisa costuras y cierres y adapta el equipo al tiempo, conservando movilidad y sensibilidad.</p>`,tip:'Comprueba los mandos con los guantes puestos antes de circular.',errs:['Creer que la obligación interurbana afecta solo al conductor.','Elegir guantes que impidan dosificar el freno.'],ref:'RGC, art. 118.1.b. RD 518/2026. DGT, equipamiento',source:'#a118'},
 {id:'M1L3',t:'Chaqueta, pantalón y protecciones',min:4,key:'La ropa de protección añade resistencia a la abrasión y protección de zonas expuestas.',
 body:`<p>Además de los elementos exigidos por la norma, se recomienda chaqueta y pantalón de motorista con protecciones adecuadas. Busca buen ajuste y prendas concebidas para ese uso. Una camiseta o un pantalón corriente no ofrecen la misma resistencia a una caída.</p><p>Las protecciones deben conservar su posición sobre codos, hombros, rodillas y las zonas previstas por el fabricante. Una prenda excesivamente suelta puede desplazarlas. Equipa también al pasajero y adapta abrigo y ventilación para evitar frío, calor y distracciones.</p>`,tip:'La ropa debe proteger sin limitar la conducción.',errs:['Considerar suficiente el casco para el resto del cuerpo.','Llevar protecciones mal colocadas dentro de una prenda holgada.'],ref:'DGT, equipamiento para la protección individual del motorista',source:COURSE_SOURCES.motoEquipment},
 {id:'M1L4',t:'Visera y protección de los ojos',min:4,key:'Ver bien exige ojos protegidos y una visera limpia y adecuada a la luz.',
 body:`<p>Insectos, polvo, lluvia y aire pueden afectar a la visión. Utiliza la visera o protección ocular compatible con tu casco. Limpia con productos adecuados y sustituye una visera deteriorada si reduce la visibilidad. De noche necesitas una solución que permita ver con poca luz; evita viseras oscuras.</p><p>Prepara la ventilación y el sistema antivaho según el fabricante. Si no ves correctamente, busca una detención segura para resolverlo. No sigas circulando a ciegas para llegar a un lugar más cómodo. Si necesitas corrección visual, debe ser compatible con el equipo.</p>`,tip:'Comprueba la visibilidad antes de entrar en un túnel o anochecer.',errs:['Seguir con la visera empañada.','Usar una visera oscura en condiciones de poca luz.'],ref:'RGC, art. 18. DGT, equipamiento del motorista',source:COURSE_SOURCES.motoEquipment},
 {id:'M1L5',t:'Calzado y protección de los pies',min:4,key:'El calzado cerrado es obligatorio; las botas de moto añaden protección.',
 body:`<p>Desde octubre de 2026 se exige a conductor y pasajero de motocicleta <b>calzado cerrado que cubra todo el pie</b>, en todo tipo de vías. Las botas específicas que protegen tobillo y sujetan adecuadamente son una recomendación de seguridad adicional.</p><p>Elige una suela con agarre y un calzado que permita accionar mandos. Evita cordones o piezas sueltas que se enganchen. Las chanclas y sandalias abiertas no cumplen el requisito de calzado cerrado. Revisa también el apoyo del pie al detenerte, sin asumir que siempre habrá firme limpio y regular.</p>`,tip:'La obligación de calzado cerrado y la recomendación de bota protectora son distintas.',errs:['Conducir con chanclas por ser verano.','Dejar cordones sueltos junto a mandos o transmisión.'],ref:'RGC, art. 118.1.c. RD 518/2026. DGT, equipamiento',source:'#a118'},
 {id:'M1L6',t:'Ser visible y conservar el equipo',min:4,key:'La visibilidad ayuda a que te detecten, pero no garantiza que te hayan visto.',
 body:`<p>Prendas claras y elementos reflectantes ayudan a destacar. Mantén el alumbrado y los elementos de protección en condiciones. Colócate donde puedas observar y ser detectado sin invadir otro espacio ni aproximarte peligrosamente.</p><p>Desde octubre de 2026, la motocicleta debe llevar un chaleco de alta visibilidad. El conductor debe usarlo si sale y ocupa calzada o arcén interurbanos. Quienes conducen profesionalmente tienen además la obligación específica de usarlo al circular en todo tipo de vías. El resto de motoristas no tiene por ello una obligación general de llevarlo puesto en cada trayecto.</p>`,tip:'Distingue llevar el chaleco en la moto de cuándo debes ponértelo.',errs:['Pensar que un reflectante garantiza que todos te han visto.','Guardar el chaleco en un lugar inaccesible.'],ref:'RGC, art. 118.4. RGV, anexo XII. RD 518/2026',source:'#a118'}
 ],questions:[
 {id:'q482',l:'M1L1',q:'¿Cómo debe quedar el casco de moto durante la marcha?',o:['Bien ajustado y correctamente abrochado','Apoyado sin cerrar si voy despacio','Algo holgado para ventilar'],c:0,e:'El ajuste y el cierre son necesarios para mantenerlo en posición y evitar que salga despedido.',r:'RGC, art. 118.1. DGT, equipamiento'},
 {id:'q483',l:'M1L1',q:'Un casco ha recibido un impacto importante y parece intacto. ¿Qué haces?',o:['Lo sigo usando sin comprobarlo','Valoro su sustitución según el fabricante porque puede tener daño interno','Lo pinto para tapar las marcas'],c:1,e:'La ausencia de daño visible no garantiza la integridad de su protección.',r:'DGT, equipamiento del motorista. Manual del casco'},
 {id:'q484',l:'M1L1',q:'¿Puede un pasajero llevar el casco desabrochado en ciudad?',o:['Sí, si se sujeta con una mano','Sí, por debajo de 30 km/h','No, debe llevarlo adecuadamente abrochado'],c:2,e:'La obligación de uso correcto afecta también al pasajero y a vías urbanas.',r:'RGC, art. 118.1'},
 {id:'q485',l:'M1L1',q:'¿Qué problema tiene un casco demasiado grande?',o:['Puede moverse o desprenderse y proteger peor','Solo pesa menos','Protege más por dejar aire alrededor'],c:0,e:'La talla debe mantener el casco correctamente ajustado.',r:'DGT, equipamiento del motorista'},
 {id:'q486',l:'M1L1',q:'¿Un casco de bicicleta sustituye al exigido para motocicleta?',o:['Sí, si tiene correas','No, debe ser el casco adecuado y reglamentario para moto','Sí, para un trayecto urbano'],c:1,e:'El equipo debe cumplir las condiciones previstas para el vehículo y su uso.',r:'RGC, art. 118.1'},
 {id:'q487',l:'M1L2',q:'En noviembre de 2026, ¿quién debe llevar guantes de protección en una moto por una vía interurbana?',o:['Solo el conductor','Solo el pasajero','Conductor y pasajero'],c:2,e:'La obligación interurbana del artículo 118 se aplica a ambos.',r:'RGC, art. 118.1.b, vigente desde octubre de 2026'},
 {id:'q488',l:'M1L2',q:'¿Qué debes comprobar al elegir unos guantes de motorista?',o:['Protección, ajuste y posibilidad de accionar bien los mandos','Solo que sean del mismo color que la moto','Solo que abriguen mucho'],c:0,e:'La protección debe ser compatible con el tacto y la movilidad necesarios.',r:'DGT, equipamiento del motorista'},
 {id:'q489',l:'M1L2',q:'Los guantes dificultan accionar el freno con precisión. ¿Qué conviene hacer?',o:['Conducir sin usar ese freno','Elegir unos adecuados antes de iniciar la marcha','Compensarlo circulando más cerca'],c:1,e:'El equipo no debe impedir dosificar los mandos.',r:'RGC, arts. 17 y 18. DGT, equipamiento'},
 {id:'q490',l:'M1L2',q:'¿Unos guantes corrientes de abrigo ofrecen necesariamente la protección de unos de moto?',o:['Sí, si son gruesos','Sí, si cubren la muñeca','No, abrigo y protección frente a una caída no son equivalentes'],c:2,e:'Deben elegirse guantes adecuados al uso de motocicleta.',r:'DGT, equipamiento para la protección individual'},
 {id:'q491',l:'M1L2',q:'En ciudad, ¿qué recomendación de seguridad se mantiene respecto a los guantes?',o:['Utilizarlos también para proteger las manos','Quitarlos siempre para tener tacto','Llevarlos solo cuando llueve'],c:0,e:'La recomendación de protección urbana es adicional a la obligación interurbana.',r:'DGT, equipamiento. RGC, art. 118.1.b'},
 {id:'q492',l:'M1L3',q:'¿Qué ropa proporciona protección adicional frente a la abrasión?',o:['Cualquier camiseta de manga corta','Prendas de motorista adecuadas, con protecciones bien colocadas','Ropa muy holgada sin cierres'],c:1,e:'Las prendas concebidas para moto añaden protección frente al contacto con el firme.',r:'DGT, equipamiento del motorista'},
 {id:'q493',l:'M1L3',q:'¿Por qué importa el ajuste de una chaqueta con protecciones?',o:['Solo por su aspecto','Porque permite prescindir de guantes','Porque ayuda a que las protecciones permanezcan en su posición'],c:2,e:'Una prenda excesivamente suelta puede desplazar las zonas protectoras.',r:'DGT, equipamiento para la protección individual'},
 {id:'q494',l:'M1L3',q:'El pasajero lleva solo casco y ropa de playa. ¿Qué mejora su protección?',o:['Equiparlo también con ropa y protecciones apropiadas','Sentarlo más cerca sin cambiar su equipo','Circular solo por vías conocidas'],c:0,e:'El pasajero está expuesto a los mismos riesgos de abrasión y necesita protección adecuada.',r:'DGT, equipamiento y pasajero'},
 {id:'q495',l:'M1L3',q:'Hace calor y la ropa protectora resulta incómoda. ¿Qué opción es más segura?',o:['Circular sin protección en zonas urbanas','Elegir prendas adecuadas al tiempo que mantengan la protección','Abrir todos los cierres hasta que las protecciones se muevan'],c:1,e:'Puede adaptarse ventilación y tejido sin renunciar a ajuste y protección.',r:'DGT, equipamiento del motorista'},
 {id:'q496',l:'M1L3',q:'¿Las recomendaciones de chaqueta y pantalón equivalen a afirmar que toda prenda protectora es obligatoria por ley?',o:['Sí, toda prenda lo es','Sí, si la moto es A2','No, hay que distinguir las recomendaciones de los elementos legalmente exigidos'],c:2,e:'El casco, guantes y calzado tienen su régimen legal; otras protecciones se recomiendan por seguridad.',r:'RGC, art. 118. DGT, equipamiento'},
 {id:'q497',l:'M1L4',q:'Tu visera se empaña y apenas ves. ¿Qué haces?',o:['Busco una detención segura y resuelvo la visibilidad','Mantengo la marcha mirando por un lateral','Sigo al coche de delante muy cerca'],c:0,e:'No debes continuar sin campo de visión suficiente.',r:'RGC, arts. 17 y 18'},
 {id:'q498',l:'M1L4',q:'Va a anochecer y llevas una visera muy oscura. ¿Qué debes prever?',o:['Que siempre mejora la visión nocturna','Una solución de protección ocular que permita ver con poca luz','Que las luces de los otros bastarán'],c:1,e:'La protección ocular debe ser compatible con las condiciones de iluminación.',r:'DGT, equipamiento y conducción nocturna'},
 {id:'q499',l:'M1L4',q:'¿Qué debes hacer con una visera muy rayada que reduce la visión?',o:['Usarla solo cuando llueve','Limpiarla con cualquier disolvente','Revisarla y sustituirla según el fabricante'],c:2,e:'El deterioro puede reducir visibilidad y favorecer reflejos.',r:'DGT, equipamiento del motorista'},
 {id:'q500',l:'M1L4',q:'¿Por qué conviene preparar el sistema antivaho antes de salir?',o:['Para conservar visión sin manipular el equipo durante la marcha','Para poder usar siempre una visera oscura','Para sustituir la luz de cruce'],c:0,e:'Prepararlo permite evitar una incidencia de visibilidad y una distracción.',r:'RGC, art. 18. DGT, equipamiento'},
 {id:'q501',l:'M1L4',q:'Tu permiso exige corrección visual. ¿El casco elimina esa condición?',o:['Sí, si lleva visera','No, debo usar la corrección indicada y un equipo compatible','Sí, si circulo de día'],c:1,e:'La protección ocular no sustituye la corrección visual exigida.',r:'Reglamento de Conductores, anexo I. RGC, art. 18'},
 {id:'q502',l:'M1L5',q:'En noviembre de 2026, ¿qué calzado exige la norma a conductor y pasajero de moto?',o:['Cualquier calzado, incluidas chanclas','Solo botas de competición','Calzado cerrado que cubra todo el pie'],c:2,e:'La obligación se aplica en todo tipo de vías.',r:'RGC, art. 118.1.c'},
 {id:'q503',l:'M1L5',q:'¿Puedes conducir una moto con chanclas en una calle urbana?',o:['No, no cumplen el requisito de calzado cerrado','Sí, por debajo de 30 km/h','Sí, si la moto es automática'],c:0,e:'La exigencia de calzado cerrado cubre también la circulación urbana.',r:'RGC, art. 118.1.c'},
 {id:'q504',l:'M1L5',q:'¿Qué aporta una bota de moto apropiada respecto a un calzado cerrado corriente?',o:['Prioridad al circular','Protección adicional, por ejemplo de tobillo y sujeción','La posibilidad de prescindir del casco'],c:1,e:'La recomendación de bota específica añade protección al requisito mínimo de calzado cerrado.',r:'DGT, equipamiento del motorista'},
 {id:'q505',l:'M1L5',q:'¿Qué debes evitar en el calzado al manejar una moto?',o:['Una suela con agarre','Que cubra el pie','Cordones o piezas sueltas que puedan engancharse'],c:2,e:'El equipo no debe interferir con mandos o partes móviles.',r:'RGC, art. 18. DGT, equipamiento'},
 {id:'q506',l:'M1L5',q:'Al detenerte, el lugar donde vas a apoyar el pie tiene gravilla. ¿Qué debes tener en cuenta?',o:['Que puede resbalar y debo elegir el apoyo con precaución','Que el calzado elimina todo riesgo','Que conviene frenar de golpe'],c:0,e:'El estado del apoyo también influye en el equilibrio de la moto detenida.',r:'DGT, técnica y posición de conducción'},
 {id:'q507',l:'M1L6',q:'Llevas ropa reflectante. ¿Puedes suponer que un conductor te ha visto?',o:['Sí, aunque estés en su ángulo muerto','No, debo seguir observando y anticipando','Sí, si llevo además la luz de cruce'],c:1,e:'La visibilidad ayuda a ser detectado, pero no lo garantiza.',r:'DGT, conducción preventiva del motorista'},
 {id:'q508',l:'M1L6',q:'Desde octubre de 2026, ¿debe una motocicleta llevar un chaleco reflectante de alta visibilidad?',o:['Solo si lleva pasajero','Solo en viajes fuera de España','Sí, forma parte de su dotación reglamentaria'],c:2,e:'La reforma añade el chaleco a los accesorios que deben llevar las motocicletas.',r:'RGV, anexo XII. RD 518/2026, disposición final segunda'},
 {id:'q509',l:'M1L6',q:'Sales de tu moto y ocupas el arcén de una vía interurbana por una incidencia. ¿Qué elemento debes usar?',o:['El chaleco reflectante de alta visibilidad','Solo unos guantes claros','Solo las luces de la moto'],c:0,e:'El conductor debe usar chaleco al salir y ocupar calzada o arcén interurbanos.',r:'RGC, art. 118.4'},
 {id:'q510',l:'M1L6',q:'Un motorista conduce profesionalmente en una vía urbana en noviembre de 2026. ¿Qué obligación específica tiene con el chaleco?',o:['Llevarlo solo en el baúl','Usarlo al circular, según el régimen de conductores profesionales','Usarlo solo cuando llueve'],c:1,e:'La obligación profesional de alta visibilidad se aplica al circular en todo tipo de vías.',r:'RGC, art. 118.4'},
 {id:'q511',l:'M1L6',q:'Un motorista particular lleva un chaleco en la moto. ¿Eso implica que deba llevarlo puesto en todos los trayectos?',o:['Sí, siempre','Sí, solo si es de color amarillo','No; hay supuestos concretos de uso obligatorio y recomendaciones adicionales'],c:2,e:'Llevarlo en la dotación y utilizarlo son obligaciones distintas, con supuestos específicos.',r:'RGC, art. 118.4. RGV, anexo XII'}
 ]},
 'M2':{desc:'Conoce los mandos y revisa neumáticos, frenos, transmisión, líquidos y documentación de la motocicleta.',sims:[],lessons:[
 {id:'M2L1',t:'Mandos y comprobación inicial',min:4,key:'Conoce dónde actúa cada mando del modelo antes de incorporarte al tráfico.',
 body:`<p>En una moto convencional de cambio manual, la mano derecha regula acelerador y freno delantero, la izquierda el embrague, el pie izquierdo el cambio y el derecho el freno trasero. Un scooter, una eléctrica o una moto con mandos adaptados pueden ser distintos.</p><p>Consulta el manual y localiza cortacorrientes, luces, intermitentes y claxon. Antes de moverte comprueba los avisos, la pata lateral recogida y que los mandos funcionan sin interferencias. Ajusta los espejos con la moto en la posición prevista.</p>`,tip:'Aprende tu modelo; no des por hecho que todos distribuyen igual los mandos.',errs:['Buscar el cortacorrientes cuando ya hay una emergencia.','Arrancar sin recoger el soporte lateral.'],ref:'DGT, guía de motocicletas. Manual del fabricante',source:COURSE_SOURCES.moto},
 {id:'M2L2',t:'Neumáticos y suspensión',min:4,key:'Dos superficies pequeñas de contacto deben sostener todo el control de la moto.',
 body:`<p>Revisa presión en frío, desgaste, cortes, bultos y válvulas. Usa medidas, características y presión admitidas para el modelo, ajustándolas a la carga según el fabricante. El límite de 1,6 mm exigido a turismos no debe presentarse como una cifra legal universal para cualquier categoría de moto; conserva siempre el dibujo y las condiciones reglamentarias.</p><p>La suspensión influye en agarre, geometría y frenada. Comprueba fugas o respuestas anormales y respeta los ajustes previstos para carga y pasajero. Si dudas sobre desgaste o daños, pide revisión profesional.</p>`,tip:'Presión, dibujo, daños y suspensión antes de aumentar el peso.',errs:['Utilizar la presión de otro modelo.','Confiar en el dibujo aunque exista una deformación.'],ref:'RGV, art. 12 y anexo VII. DGT, mantenimiento de moto',source:COURSE_SOURCES.motoCare},
 {id:'M2L3',t:'Frenos, ABS y frenada combinada',min:4,key:'Conoce cómo actúan los frenos de tu moto y mantén sus elementos en buen estado.',
 body:`<p>Revisa tacto de mandos, desgaste, fugas y nivel según el manual. Ante una pérdida de eficacia o un mando que cambia anormalmente, evita continuar sin resolverlo. No contamines discos o pastillas con lubricantes.</p><p>El ABS ayuda a evitar bloqueo al frenar; la frenada combinada reparte actuación entre frenos según el diseño. No son lo mismo ni sustituyen el aprendizaje de frenada. Una moto con ABS sigue necesitando distancia, adherencia y una aplicación correcta. Consulta si incorpora ayudas específicas para frenar inclinada.</p>`,tip:'Identifica el sistema de tu modelo; el aspecto de las manetas no lo explica todo.',errs:['Suponer que ABS y frenada combinada son equivalentes.','Ignorar un mando esponjoso o una fuga.'],ref:'DGT, mantenimiento y guía de motocicletas. Manual del fabricante',source:COURSE_SOURCES.motoCare},
 {id:'M2L4',t:'Transmisión y cadena',min:4,key:'La transmisión necesita el mantenimiento concreto de su diseño.',
 body:`<p>Si hay cadena, revisa tensión, lubricación, desgaste y alineación siguiendo el manual. Una tensión excesiva o insuficiente puede causar problemas. Correa y cardán tienen otros cuidados: no extrapoles el procedimiento.</p><p>Para limpiar o lubricar, detén el motor y asegura la moto de la forma prevista. No acerques manos a una transmisión movida por el motor. Si no puedes efectuar la operación con seguridad, recurre al taller. Evita que el producto llegue a neumáticos o frenos.</p>`,tip:'El motor apagado y la moto estable son condiciones de una revisión segura.',errs:['Lubricar con la rueda movida por el motor.','Tensar la cadena sin consultar su holgura prevista.'],ref:'Fabricante, mantenimiento de la transmisión. DGT, estado del vehículo',source:COURSE_SOURCES.motoCare},
 {id:'M2L5',t:'Motor, líquidos y avisos',min:4,key:'Respeta los intervalos y responde a las señales de una anomalía antes de que afecte al control.',
 body:`<p>Comprueba aceite, refrigerante cuando exista y líquido de frenos en las condiciones del manual. Unos niveles se comprueban con la moto vertical y otros requieren procedimientos específicos; no improvises. No abras refrigeración caliente.</p><p>Un aviso grave de presión de aceite o temperatura exige actuar conforme al modelo y detenerse con seguridad. Revisa fugas, olores y ruidos nuevos. La comprobación inicial de testigos no equivale a un aviso persistente en marcha. En una moto eléctrica, sigue las indicaciones de batería y carga y no manipules partes de alta tensión.</p>`,tip:'Conoce los avisos antes de salir; no los investigues mientras conduces.',errs:['Rellenar con cualquier líquido disponible.','Continuar con un aviso grave por estar cerca del taller.'],ref:'Manual del fabricante. DGT, mantenimiento de motocicletas',source:COURSE_SOURCES.motoCare},
 {id:'M2L6',t:'ITV, reformas y revisión antes de salir',min:4,key:'La moto debe ser legal y segura, también entre inspecciones.',
 body:`<p>Una motocicleta ordinaria pasa su primera ITV a los cuatro años y después cada dos. Un ciclomotor ordinario de dos ruedas tiene otro inicio: tres años y después cada dos. Comprueba la fecha y categoría concretas de su documentación.</p><p>Limitaciones de potencia, escapes, neumáticos y otras modificaciones deben respetar los requisitos técnicos y legalizarse cuando proceda. Lleva la documentación y el seguro en vigor. Antes de arrancar, revisa luces, frenos, neumáticos, espejos y cierres de equipaje; una ITV favorable anterior no garantiza su estado actual.</p>`,tip:'Una moto limitada debe tener la limitación debidamente documentada.',errs:['Aplicar a una moto los plazos anuales de un turismo antiguo.','Cambiar escape o potencia sin comprobar su legalidad.'],ref:'RD 920/2017, art. 6. RD 866/2010. DGT, documentación',source:COURSE_SOURCES.itv}
 ],questions:[
 {id:'q512',l:'M2L1',q:'En una moto convencional de cambio manual, ¿qué acciona normalmente la maneta derecha?',o:['El freno delantero','El embrague','El cambio de marchas'],c:0,e:'En esa disposición habitual, la maneta derecha actúa sobre el freno delantero.',r:'DGT, mandos de la motocicleta. Manual del fabricante'},
 {id:'q513',l:'M2L1',q:'¿Debes suponer que un scooter distribuye los mandos igual que una moto manual?',o:['Sí, siempre','No, debo conocer el modelo concreto','Sí, si tiene dos ruedas'],c:1,e:'La distribución de frenos y transmisión puede variar.',r:'Manual del fabricante'},
 {id:'q514',l:'M2L1',q:'Antes de moverte con la moto, ¿qué debes comprobar respecto a la pata lateral?',o:['Que quede a mitad de recorrido','Que toque el suelo para estabilizar','Que esté recogida y en la posición prevista para circular'],c:2,e:'Un soporte desplegado puede comprometer la estabilidad o impedir la marcha.',r:'Manual del fabricante. DGT, revisión previa'},
 {id:'q515',l:'M2L1',q:'¿Cuándo conviene ajustar los espejos de la moto?',o:['Antes de circular, con la posición adecuada','Mientras entro en una curva','Solo cuando otro conductor lo avise'],c:0,e:'Prepararlos evita manipulaciones y pérdida de observación durante la marcha.',r:'RGC, art. 18. DGT, motocicletas'},
 {id:'q516',l:'M2L1',q:'¿Por qué conviene localizar previamente el cortacorrientes?',o:['Para usarlo en lugar de frenar','Para conocer el mando de parada del motor sin buscarlo durante una incidencia','Para desactivar las luces en túneles'],c:1,e:'Conocer los mandos reduce el tiempo de respuesta y las distracciones.',r:'Manual del fabricante'},
 {id:'q517',l:'M2L2',q:'¿Qué presión usas en los neumáticos de una moto con pasajero?',o:['La de cualquier moto de cilindrada parecida','Siempre la presión mínima posible','La indicada por el fabricante para esa carga'],c:2,e:'La presión debe corresponder al modelo y a su carga.',r:'Fabricante, mantenimiento de motocicletas'},
 {id:'q518',l:'M2L2',q:'Un neumático conserva dibujo pero presenta una deformación. ¿Es suficiente el dibujo?',o:['No, el daño requiere revisión y resolución','Sí, hasta que llegue al mínimo','Sí, si no circulo por autopista'],c:0,e:'La profundidad del dibujo no elimina riesgos estructurales.',r:'RGV, anexo VII. DGT, neumáticos'},
 {id:'q519',l:'M2L2',q:'¿Debe aplicarse sin comprobar categoría el mínimo de 1,6 mm de los turismos a toda motocicleta?',o:['Sí, es una cifra universal','No; hay que atender a las condiciones reglamentarias y al fabricante de la moto','Sí, solo cuando llueve'],c:1,e:'El anexo VII fija ese mínimo para categorías concretas; no debe generalizarse a todas.',r:'RGV, anexo VII'},
 {id:'q520',l:'M2L2',q:'¿Qué puede afectar una suspensión deteriorada en la moto?',o:['Solo la comodidad al estacionar','Solo el sonido del motor','El contacto con el firme, la estabilidad y el frenado'],c:2,e:'La suspensión participa en la seguridad activa y el control.',r:'DGT, mantenimiento de motocicletas'},
 {id:'q521',l:'M2L2',q:'Vas a ajustar la suspensión por carga adicional. ¿Qué referencia sigues?',o:['El manual del modelo y el ajuste previsto','La posición más dura siempre','Lo que use una moto distinta'],c:0,e:'El ajuste debe adaptarse al diseño y a la carga autorizada.',r:'Manual del fabricante'},
 {id:'q522',l:'M2L3',q:'¿ABS y frenada combinada significan lo mismo?',o:['Sí, ambos bloquean las ruedas','No, uno evita bloqueo y otro combina la actuación de frenos según el diseño','Sí, en cualquier motocicleta'],c:1,e:'Son funciones diferentes y pueden coexistir en un mismo vehículo.',r:'DGT, sistemas de frenado. Manual del fabricante'},
 {id:'q523',l:'M2L3',q:'¿Qué debes evitar al lubricar otras partes de la moto?',o:['Consultar el manual','Proteger tus manos','Que lubricante contamine discos, pastillas o neumáticos'],c:2,e:'La contaminación reduce capacidad de frenado o adherencia.',r:'Fabricante, mantenimiento de motocicletas'},
 {id:'q524',l:'M2L3',q:'Notas una pérdida anormal de eficacia de frenos. ¿Qué haces?',o:['Detengo la marcha con seguridad y hago revisar el sistema','Acelero para calentar los discos','Sigo usando únicamente el freno que menos responde'],c:0,e:'Una anomalía de frenado puede comprometer el control y necesita revisión.',r:'RGC, art. 17. DGT, mantenimiento'},
 {id:'q525',l:'M2L3',q:'Tu moto tiene ABS. ¿Puedes reducir por eso la separación en lluvia?',o:['Sí, evita cualquier caída','No, sigue siendo necesario margen según el agarre','Sí, si también hay frenada combinada'],c:1,e:'La ayuda no elimina la distancia necesaria ni los límites de adherencia.',r:'RGC, art. 54. DGT, frenado'},
 {id:'q526',l:'M2L3',q:'¿Qué debes consultar para conocer cómo frena una moto con sistemas específicos?',o:['Solo la cilindrada','Solo el color del testigo','El manual y la formación sobre ese modelo'],c:2,e:'La actuación y límites del ABS, frenada combinada y otras ayudas pueden variar.',r:'Manual del fabricante. DGT, conducción segura'},
 {id:'q527',l:'M2L4',q:'¿Cómo debe estar el motor al limpiar o lubricar la cadena?',o:['Apagado, con la moto asegurada según el procedimiento','En marcha para que gire la rueda','Acelerado suavemente'],c:0,e:'Una transmisión movida por el motor puede atrapar manos o materiales.',r:'Fabricante, mantenimiento de la transmisión'},
 {id:'q528',l:'M2L4',q:'¿Qué holgura debe tener la cadena?',o:['Ninguna; cuanto más tensa mejor','La indicada para el modelo y el procedimiento de comprobación','La misma en todas las motos'],c:1,e:'Tensión insuficiente o excesiva puede causar problemas mecánicos y de seguridad.',r:'Manual del fabricante'},
 {id:'q529',l:'M2L4',q:'Una moto tiene transmisión por correa. ¿Debes aplicar el engrase de una cadena?',o:['Sí, cualquier lubricante sirve','Sí, antes de cada salida','No, sigue el mantenimiento específico de esa transmisión'],c:2,e:'Cadena, correa y cardán tienen cuidados distintos.',r:'Fabricante, mantenimiento de motocicletas'},
 {id:'q530',l:'M2L4',q:'No puedes asegurar la moto para revisar la cadena sin riesgo. ¿Qué conviene hacer?',o:['Recurrir al taller o a ayuda adecuada','Sostenerla con una mano mientras trabaja el motor','Improvisar un apoyo inestable'],c:0,e:'La estabilidad y el procedimiento seguro son necesarios durante el mantenimiento.',r:'Manual del fabricante'},
 {id:'q531',l:'M2L4',q:'¿Qué debes revisar además de la lubricación de una cadena?',o:['Solo su color','Su tensión y desgaste, según el manual','Solo el ruido de la bocina'],c:1,e:'Lubricar no corrige una cadena desgastada o mal ajustada.',r:'Fabricante, mantenimiento de la transmisión'},
 {id:'q532',l:'M2L5',q:'¿Cómo colocas la moto para comprobar el aceite?',o:['Siempre inclinada sobre la pata lateral','Siempre con el motor acelerado','Según el procedimiento específico del fabricante'],c:2,e:'La posición, temperatura y tiempo de espera pueden variar por modelo.',r:'Manual del fabricante'},
 {id:'q533',l:'M2L5',q:'El refrigerante está muy caliente. ¿Puedes abrir el circuito?',o:['No, espera y sigue el procedimiento seguro','Sí, para evacuar presión de inmediato','Sí, si la moto está vertical'],c:0,e:'Puede expulsar líquido o vapor a presión y causar lesiones.',r:'Manual del fabricante'},
 {id:'q534',l:'M2L5',q:'Se mantiene un aviso grave de aceite durante la marcha. ¿Qué haces?',o:['Sigo mientras el motor suene normal','Me detengo de forma segura y sigo las instrucciones del modelo','Reinicio repetidamente el cuadro en marcha'],c:1,e:'No debe ignorarse un aviso que puede exigir parar el motor.',r:'Manual del fabricante. DGT, mantenimiento'},
 {id:'q535',l:'M2L5',q:'Una moto eléctrica presenta una avería de alta tensión. ¿Qué debes evitar?',o:['Parar con seguridad','Solicitar asistencia','Manipular por tu cuenta sus componentes de alta tensión'],c:2,e:'La reparación debe seguir los procedimientos del fabricante y personal cualificado.',r:'Manual del fabricante'},
 {id:'q536',l:'M2L5',q:'¿Un testigo que se enciende al dar contacto y luego se apaga indica siempre avería?',o:['No, puede ser la comprobación inicial prevista','Sí, en todos los casos','Sí, salvo que sea de color verde'],c:0,e:'Debes conocer el funcionamiento normal y distinguirlo de un aviso persistente.',r:'Manual del fabricante'},
 {id:'q537',l:'M2L6',q:'En el caso ordinario, ¿cuándo pasa una motocicleta su primera ITV periódica?',o:['A los dos años','A los cuatro años','A los seis años'],c:1,e:'Para motocicletas de la categoría correspondiente, la primera es a los cuatro años.',r:'RD 920/2017, art. 6'},
 {id:'q538',l:'M2L6',q:'Después de la primera ITV, ¿cada cuánto la pasa una motocicleta ordinaria?',o:['Cada seis meses','Cada año al cumplir diez años','Cada dos años'],c:2,e:'No se aplica a la motocicleta ordinaria el cambio a anual previsto para turismos antiguos.',r:'RD 920/2017, art. 6'},
 {id:'q539',l:'M2L6',q:'¿Cuándo pasa la primera ITV un ciclomotor ordinario de dos ruedas?',o:['A los tres años','A los cuatro años','A los diez años'],c:0,e:'El régimen ordinario L1e establece tres años y luego periodicidad bienal.',r:'RD 920/2017, art. 6'},
 {id:'q540',l:'M2L6',q:'Limitas una moto para ajustarla al A2. ¿Qué debes comprobar?',o:['Solo que el taller cobre la instalación','Que cumple las condiciones de potencia y que la limitación esté legalizada y documentada','Solo que acelere menos'],c:1,e:'Una reducción física no sustituye la compatibilidad con el permiso y la documentación reglamentaria.',r:'Reglamento de Conductores, art. 4. RD 866/2010'},
 {id:'q541',l:'M2L6',q:'La moto pasó la ITV hace un mes. ¿Puedes omitir la revisión previa de luces y frenos?',o:['Sí, hasta la siguiente ITV','Sí, si está limpia','No, debe mantenerse segura durante toda su utilización'],c:2,e:'La ITV acredita el estado en la inspección, no sustituye el mantenimiento posterior.',r:'RGV, art. 12. DGT, mantenimiento'}
 ]},
 'M3':{desc:'Comprende el equilibrio, la observación, la frenada y las curvas con una técnica suave y márgenes de seguridad.',sims:[],lessons:[
 {id:'M3L1',t:'Postura y control',min:4,key:'Una postura estable permite observar y actuar sin rigidez innecesaria.',
 body:`<p>Adopta una posición natural, con manos que alcancen los mandos sin tensión excesiva y pies apoyados en los reposapiés. Ajusta espejos y equipo antes de salir. La moto debe ser manejable para tu talla y capacidad.</p><p>Evita agarrarte con rigidez y mirar continuamente al cuadro. Mantén la cabeza orientada a la circulación y realiza comprobaciones breves. La técnica de equilibrio y manejo se aprende con prácticas supervisadas; la explicación teórica ayuda a entender qué debes hacer y por qué.</p>`,tip:'Control, comodidad y observación deben ser compatibles.',errs:['Conducir rígido por miedo a perder el equilibrio.','Elegir una moto que no puedes manejar al detenerte.'],ref:'DGT, posición y conducción de motocicletas',source:COURSE_SOURCES.moto},
 {id:'M3L2',t:'Arranque y maniobras lentas',min:4,key:'A baja velocidad necesitas mirada, equilibrio y mandos dosificados.',
 body:`<p>En una moto manual, coordina embrague y acelerador suavemente para iniciar la marcha. En otros modelos sigue su procedimiento. Antes de salir, observa, señaliza y cede a quienes circulan por la vía.</p><p>En giros lentos, dirige la mirada hacia el recorrido disponible y evita mandos bruscos. Practica el uso coordinado de los frenos y el equilibrio con un instructor. Al detenerte, prevé el apoyo de los pies y el estado del suelo. Al empujar una moto con el motor apagado, valora peso, pendiente y espacio antes de moverla.</p>`,tip:'Mira el espacio por el que quieres pasar, conservando vigilancia de los riesgos.',errs:['Soltar bruscamente el embrague al arrancar.','Iniciar una maniobra sin espacio para terminarla.'],ref:'DGT, técnica y maniobras de motocicletas. RGC, art. 72',source:COURSE_SOURCES.moto},
 {id:'M3L3',t:'La mirada y la anticipación',min:4,key:'Observar lejos y alrededor te permite preparar la maniobra antes de llegar al peligro.',
