/* ================= Tema 6: incorporación y maniobras ================= */
const MANEUVER_LESSONS=[
 {id:'T6L1',t:'Incorporarse y ceder el paso',min:5,
  key:'Quien se incorpora debe comprobar que puede hacerlo sin peligro, señalizar a tiempo y ceder el paso a los vehículos que ya circulan.',
  body:`<p>La incorporación puede empezar desde un estacionamiento, una vía de acceso, una zona de servicio o una propiedad colindante. Mira la posición, la velocidad y la trayectoria de los demás antes de salir. Usa los retrovisores y comprueba la zona que queda fuera de ellos. Si no ves bien, puedes necesitar la ayuda de otra persona.</p>
  <p>Señaliza el desplazamiento con antelación. Espera un hueco suficiente para incorporarte sin forzar a quienes circulan a frenar o desviarse de forma brusca.</p>
  <p>Si sales de un camino exclusivamente privado a una vía de uso público, avanza a una velocidad que te permita parar en el acto y cede a los vehículos que circulen por ella, vengan de donde vengan.</p>`,
  tip:'Antes de mover el coche, comprueba quién se acerca, por dónde y a qué velocidad.',
  errs:['Colocarte en la calzada para que los demás se vean obligados a dejarte salir.','Mirar solo en una dirección al salir de un camino privado.'],
  ref:'RGC, arts. 58, 72 y 109',source:'#a72'},
 {id:'T6L2',t:'Carril de aceleración y salida del autobús',min:6,
  key:'Valora el tráfico al principio del carril de aceleración. Si puedes incorporarte, utiliza el carril para alcanzar una velocidad adecuada a la vía.',
  body:`<p>Al comienzo del <b>carril de aceleración</b>, observa la calzada a la que vas a entrar. Si hace falta, detente en ese punto. Cuando puedas hacerlo con seguridad, acelera para adaptar la velocidad antes de incorporarte al final del carril. Los vehículos de la calzada a la que accedes tienen preferencia.</p>
  <p>Si eres tú quien ya circula por esa calzada, facilita la incorporación en la medida de lo posible. Puedes adaptar el ritmo o cambiar de carril cuando sea legal y seguro. La otra persona sigue teniendo que ceder.</p>
  <p>En poblado, al acercarte a un autobús de transporte colectivo que quiere salir de una <b>parada señalizada</b>, facilita su salida: desplázate si puedes, reduce la velocidad y detente si hace falta. Quien conduce el autobús debe anunciar la salida con el intermitente y comprobar que puede realizarla sin riesgo.</p>`,
  tip:'El carril de entrada da espacio para adaptar la velocidad. El hueco lo decides observando a quienes ya circulan.',
  errs:['Dar por hecho que todo el tráfico debe cambiar de carril para dejarte entrar.','Creer que el autobús puede salir sin mirar porque los demás deben facilitarle el paso.'],
  ref:'RGC, arts. 72.4, 73 y 74.2',source:'#a72'},
 {id:'T6L3',t:'Cambiar de carril y tomar una salida',min:6,
  key:'Al cambiar de carril, respeta a quien ya circula por el carril que quieres ocupar. El intermitente avisa de tu intención.',
  body:`<p>Comprueba que las marcas y señales permiten el movimiento. Observa por delante y por detrás, comprueba el ángulo muerto, avisa con el intermitente del lado hacia el que vas y desplázate cuando sea seguro. Apaga el intermitente al adoptar la nueva trayectoria.</p>
  <p>Para abandonar una autopista, autovía u otra vía, colócate con suficiente antelación en el carril más próximo a la salida. Entra en el <b>carril de deceleración</b>, si existe, tan pronto como puedas. Adapta la velocidad a la salida y a la señalización.</p>
  <p>Si te pasas la salida de una autovía, sigue hasta otra salida permitida. Dar marcha atrás está prohibido y cruzar de golpe varios carriles puede poner en peligro a quienes ya los ocupan.</p>`,
  tip:'Prepara la salida antes de llegar al desvío. Si ya lo has pasado, sigue el itinerario hasta una salida segura.',
  errs:['Cambiar de carril en el mismo momento en que enciendes el intermitente.','Tomar la salida directamente desde el carril izquierdo.'],
  ref:'RGC, arts. 74.2, 77, 80.3 y 109.2.a',source:'#a74'},
 {id:'T6L4',t:'Girar a la derecha o a la izquierda',min:7,
  key:'Comprueba la señalización y la visibilidad, avisa con antelación y colócate para el giro antes de llegar al cruce.',
  body:`<p>Si no hay una disposición o señal que indique otra forma de girar, para hacerlo a la <b>derecha</b> acércate al borde derecho. Para girar a la <b>izquierda</b> desde una calzada de sentido único, acércate al borde izquierdo. En una de doble sentido, acércate a la separación de sentidos o al eje sin invadir el sentido contrario.</p>
  <p>Si la calzada de doble sentido tiene tres carriles separados por líneas longitudinales discontinuas, colócate en el carril central para girar a la izquierda. Al girar a la izquierda, deja el centro de la intersección a tu izquierda, salvo que la vía indique o disponga otra trayectoria.</p>
  <p>Comprueba que puedes girar sin peligro por el tráfico que viene de frente. Renuncia al giro a la izquierda si no hay visibilidad suficiente. Cede a quienes tengan prioridad al cruzar la vía a la que entras, como los peatones que estén cruzando aunque no haya paso pintado.</p>
  <p>En vías interurbanas, los ciclos y ciclomotores de dos ruedas inician el giro a la izquierda desde la derecha, fuera de la calzada si es posible, cuando no existe un carril preparado para ese giro.</p>`,
  tip:'Para girar a la izquierda, identifica si la calzada de origen es de uno o de dos sentidos.',
  errs:['Preparar un giro invadiendo el sentido contrario.','Girar a la izquierda si no puedes ver con suficiente antelación a quien viene de frente.'],
  ref:'RGC, arts. 65, 74 a 76 y 109',source:'#a75'},
 {id:'T6L5',t:'Cambiar el sentido de la marcha',min:5,
  key:'Cambiar de sentido es continuar en la dirección opuesta por la misma vía. Elige un lugar permitido y con visibilidad suficiente.',
  body:`<p>Señaliza con tiempo y comprueba que puedes invertir la marcha sin poner en peligro ni obstaculizar a nadie. Ocupa la vía durante el menor tiempo posible. Si al esperar bloqueas a quienes vienen detrás, sal de la calzada por la derecha cuando sea posible y espera allí hasta que puedas realizar la maniobra.</p>
  <p>Está prohibido cambiar de sentido si no puedes comprobar que es seguro, en pasos a nivel, túneles, pasos inferiores y tramos afectados por la señal de túnel. En autopistas y autovías solo se permite en lugares habilitados.</p>
  <p>Como regla general, tampoco se permite donde esté prohibido adelantar, salvo autorización expresa para cambiar de sentido.</p>`,
  tip:'Comprueba primero el lugar. Después busca el momento y el espacio para hacer la maniobra.',
  errs:['Dar media vuelta donde no ves a los vehículos que se acercan.','Suponer que una prohibición de adelantar nunca afecta al cambio de sentido.'],
  ref:'RGC, arts. 78 y 79',source:'#a78'},
 {id:'T6L6',t:'Dar marcha atrás',min:6,
  key:'Retrocede solo en los supuestos permitidos y durante el recorrido imprescindible. Para parar, estacionar o incorporarte, el máximo es 15 metros y no puedes invadir un cruce.',
  body:`<p>La marcha atrás se permite cuando no puedes seguir hacia delante ni cambiar de dirección ni de sentido, o si es el complemento necesario de otra maniobra. El límite de 15 metros y la prohibición de invadir un cruce se aplican cuando complementa una parada, un estacionamiento o una incorporación. En autopistas y autovías la marcha atrás está prohibida.</p>
  <p>Retrocede lentamente y verifica que tienes visibilidad, espacio y tiempo. Si lo necesitas, bájate para comprobar la zona o pide a otra persona que te indique. Advierte la maniobra con la luz de marcha atrás. Si el vehículo no dispone de ella, se hace con el brazo extendido horizontalmente y la palma hacia atrás.</p>
  <p>Detente de inmediato si oyes una advertencia o detectas cerca a una persona, un animal u otro vehículo. Desiste de la maniobra si la seguridad lo exige.</p>`,
  tip:'Antes de retroceder, comprueba el espacio detrás del vehículo. Si dejas de tenerlo controlado, detente.',
  errs:['Invadir un cruce al retroceder para aparcar porque el recorrido tiene menos de 15 metros.','Confiar en que el resto se apartará al ver la luz de marcha atrás.'],
  ref:'RGC, arts. 80, 81 y 109.2.b',source:'#a80'}
];

const MANEUVER_QUESTIONS=[
 {id:'q92',l:'T6L1',q:'Vas a salir de un estacionamiento en línea y se acerca un vehículo por el carril que quieres ocupar. ¿Qué haces?',o:['Espero un hueco y le cedo el paso','Salgo en cuanto enciendo el intermitente','Saco el morro para que el otro vehículo se detenga'],c:0,e:'Quien sale de un estacionamiento debe ceder a quienes ya circulan y comprobar que puede entrar sin peligro.',r:'RGC, art. 72.1'},
 {id:'q93',l:'T6L1',q:'Sales de un camino exclusivamente privado a una carretera de uso público. ¿A qué vehículos debes ceder el paso?',o:['Solo a los que llegan por la derecha','A los que circulan por la carretera, en ambos sentidos','Solo a los que circulan por el carril en el que voy a entrar'],c:1,e:'Al salir de un camino exclusivamente privado debes ceder a los vehículos que circulan por la vía pública, cualquiera que sea su sentido.',r:'RGC, art. 72.2'},
 {id:'q94',l:'T6L1',q:'Al salir de un camino exclusivamente privado, ¿cómo debes aproximarte a la carretera de uso público?',o:['A la misma velocidad que el tráfico de la carretera','A una velocidad que me permita detenerme solo si hay un STOP','A una velocidad que me permita detenerme en el acto'],c:2,e:'La velocidad debe permitir una detención inmediata al salir del camino privado.',r:'RGC, art. 72.2'},
 {id:'q95',l:'T6L1',q:'Tienes poca visibilidad al intentar salir de un estacionamiento. ¿Puedes seguir las indicaciones de otra persona para comprobar que es seguro?',o:['Sí, si es necesario, y sigo siendo responsable de ceder el paso','No, solo puedo usar los retrovisores','Sí, y su indicación me da preferencia sobre el tráfico'],c:0,e:'El Reglamento admite la ayuda de otra persona para comprobar la seguridad. Quien se incorpora debe seguir cediendo.',r:'RGC, art. 72.1'},
 {id:'q96',l:'T6L1',q:'Vas a salir de un estacionamiento con un desplazamiento lateral. ¿Cuándo avisas de la maniobra?',o:['Cuando ya estoy cambiando de carril','Con antelación suficiente, antes de empezar','Solo si otro vehículo está cerca'],c:1,e:'La incorporación se advierte ópticamente con antelación, antes del desplazamiento.',r:'RGC, arts. 72.3 y 109.1'},
 {id:'q97',l:'T6L2',q:'¿En qué punto debes hacer la primera comprobación del tráfico al entrar en un carril de aceleración?',o:['Solo cuando llegues al final','Cuando ya estés entrando en la calzada','Al principio del carril de aceleración'],c:2,e:'La primera comprobación se hace al inicio del carril, donde debes detenerte si hace falta. Luego adaptas la velocidad para incorporarte.',r:'RGC, art. 72.4'},
 {id:'q98',l:'T6L2',q:'Tras comprobar que hay espacio para incorporarte, ¿para qué utilizas el carril de aceleración?',o:['Para alcanzar una velocidad adecuada antes de entrar en la calzada','Para alcanzar siempre el máximo señalizado','Para entrar en la calzada cuanto antes aunque todavía vayas demasiado despacio'],c:0,e:'La finalidad es llegar al final del carril con una velocidad adecuada al tráfico de la vía a la que te incorporas.',r:'RGC, art. 72.1 y 72.4'},
 {id:'q99',l:'T6L2',q:'Circulas por una autovía y otro coche quiere incorporarse. ¿Qué debes hacer?',o:['Cambiar siempre de carril aunque haya un vehículo a tu izquierda','Facilitarle la incorporación en la medida de lo posible y sin crear peligro','Mantener siempre el mismo ritmo para que calcule por sí solo'],c:1,e:'Quien ya circula debe facilitar la maniobra cuando pueda. El conductor que entra mantiene la obligación de ceder.',r:'RGC, arts. 72, 73.1 y 74.2'},
 {id:'q100',l:'T6L2',q:'En poblado, un autobús señaliza que sale de una parada señalizada. No puedes desplazarte a otro carril con seguridad. ¿Qué haces para facilitarle la salida?',o:['Acelero para pasar antes','Me cambio de carril aunque esté ocupado','Reduzco y, si hace falta, me detengo'],c:2,e:'Si no puedes desplazarte con seguridad, facilita la salida reduciendo la marcha y deteniéndote si es necesario.',r:'RGC, art. 73.2'},
 {id:'q101',l:'T6L2',q:'¿Qué debe hacer quien conduce un autobús antes de salir de una parada señalizada?',o:['Señalizar con el intermitente y comprobar que puede salir sin riesgo','Salir tras encender el intermitente, sin comprobar el tráfico','Esperar a que un agente le autorice siempre'],c:0,e:'La obligación de los demás de facilitar la incorporación no elimina las precauciones del conductor del autobús.',r:'RGC, art. 73.3'},
 {id:'q102',l:'T6L3',q:'Has encendido el intermitente izquierdo y se acerca otro coche por el carril izquierdo. ¿Quién tiene prioridad?',o:['Tú, porque has avisado primero','Quien ya circula por el carril izquierdo','El vehículo que va más despacio'],c:1,e:'Al desplazarte a otro carril debes respetar la prioridad de quien ya circula por él.',r:'RGC, art. 74.2'},
 {id:'q103',l:'T6L3',q:'Has terminado un cambio de carril y ya sigues la nueva trayectoria. ¿Qué haces con el intermitente?',o:['Lo mantengo hasta llegar al siguiente cruce','Lo cambio al lado contrario para indicar que he terminado','Dejo de señalizar el desplazamiento'],c:2,e:'La advertencia termina al adoptar la nueva trayectoria, porque avisa del desplazamiento lateral.',r:'RGC, art. 109.2.a'},
 {id:'q104',l:'T6L3',q:'Se acerca tu salida de la autovía. ¿Por qué carril debes circular con antelación?',o:['Por el más próximo a la salida','Por el más alejado de la salida','Por cualquiera hasta llegar al punto de desvío'],c:0,e:'Debes prepararte con antelación en el carril más próximo a la salida y entrar pronto en el carril de deceleración si existe.',r:'RGC, art. 77'},
 {id:'q105',l:'T6L3',q:'La vía que vas a abandonar tiene carril de deceleración. ¿Cuándo debes entrar en él?',o:['Al llegar al final del carril, para reducir menos tiempo','Lo antes posible, desde el carril próximo a la salida','Solo cuando hayas alcanzado la velocidad final del ramal'],c:1,e:'El Reglamento exige entrar en el carril de deceleración lo antes posible si existe.',r:'RGC, art. 77'},
 {id:'q106',l:'T6L3',q:'Te has pasado una salida de la autovía. ¿Qué debes hacer?',o:['Dar marcha atrás por el carril de salida','Retroceder por el arcén si está libre','Continuar hasta otra salida permitida'],c:2,e:'La marcha atrás está prohibida en autopistas y autovías. Continúa hasta otra salida.',r:'RGC, art. 80.3'},
 {id:'q107',l:'T6L4',q:'Quieres girar a la derecha y la vía no indica otra forma de hacerlo. ¿Cómo te colocas?',o:['Me acerco todo lo posible al borde derecho de la calzada','Me acerco al eje, independientemente del sentido','Me desplazo hacia el borde izquierdo para abrir el giro'],c:0,e:'Para girar a la derecha debes ceñirte al borde derecho, salvo que la vía esté preparada o señalizada de otro modo.',r:'RGC, art. 75.1.b'},
 {id:'q108',l:'T6L4',q:'Vas a girar a la izquierda desde una calzada de sentido único y sin señalización específica para girar. ¿Dónde te colocas?',o:['Junto al borde derecho','Junto al borde izquierdo','Siempre en el centro de la calzada'],c:1,e:'Si la calzada de origen tiene un solo sentido, prepara el giro a la izquierda junto al borde izquierdo.',r:'RGC, art. 75.1.b'},
 {id:'q109',l:'T6L4',q:'Vas a girar a la izquierda desde una calle de doble sentido con un carril por sentido y sin indicaciones especiales. ¿Dónde te colocas?',o:['En el borde izquierdo aunque ocupe el sentido contrario','En el borde derecho para esperar el hueco','Junto a la separación de los sentidos, sin invadir el contrario'],c:2,e:'En una calzada de doble sentido, acércate a la línea de separación o al eje sin entrar en el espacio del tráfico contrario.',r:'RGC, art. 75.1.b'},
 {id:'q110',l:'T6L4',q:'Quieres girar a la izquierda, pero un obstáculo te impide ver suficientemente a los vehículos que pueden venir de frente. ¿Qué haces?',o:['Me abstengo de girar mientras no tenga visibilidad suficiente','Giro lentamente aunque siga sin ver lo que viene','Entro en el carril contrario con el intermitente puesto'],c:0,e:'El cambio de dirección a la izquierda requiere visibilidad suficiente. Debes abstenerte si no la tienes.',r:'RGC, art. 74.1'},
 {id:'q111',l:'T6L4',q:'En una vía interurbana, ¿desde dónde inicia el giro a la izquierda un ciclomotor de dos ruedas si no hay un carril preparado para ese giro?',o:['Desde el eje de la calzada en todos los casos','Desde la derecha, fuera de la calzada si es posible','Desde el arcén del sentido contrario'],c:1,e:'En ese supuesto, los ciclos y ciclomotores de dos ruedas se colocan a la derecha, fuera de la calzada si pueden, e inician allí el giro.',r:'RGC, art. 76.2'},
 {id:'q112',l:'T6L5',q:'En una carretera de doble sentido, vas a continuar por esa misma vía en el sentido contrario tras dar media vuelta. ¿Qué maniobra haces?',o:['Una incorporación desde una vía de acceso','Un desplazamiento lateral','Un cambio de sentido'],c:2,e:'El cambio de sentido invierte el sentido de la marcha por la misma vía.',r:'RGC, art. 78'},
 {id:'q113',l:'T6L5',q:'Mientras esperas para cambiar de sentido en un lugar permitido, impides avanzar a quienes van detrás. Puedes salir por la derecha con seguridad. ¿Qué haces?',o:['Salgo de la calzada por la derecha y espero allí','Sigo esperando en mitad del carril aunque bloquee el paso','Me desplazo al carril contrario para despejar el mío'],c:0,e:'Si la espera impide el paso por detrás, debes salir por el lado derecho cuando sea posible.',r:'RGC, art. 78.1'},
 {id:'q114',l:'T6L5',q:'¿Puedes cambiar de sentido dentro de un túnel si en ese momento no ves tráfico?',o:['Sí, si hay dos carriles en tu sentido','No, está prohibido','Sí, si lo señalizas con tiempo'],c:1,e:'El cambio de sentido está prohibido en túneles y pasos inferiores.',r:'RGC, art. 79.1'},
 {id:'q115',l:'T6L5',q:'En un tramo de carretera está prohibido adelantar. ¿Qué regla general se aplica al cambio de sentido?',o:['Se permite siempre que se haga de una vez','Se permite si no se ve a nadie','También se prohíbe, salvo autorización expresa'],c:2,e:'En general, la prohibición de adelantar impide cambiar de sentido, excepto cuando el cambio está expresamente autorizado.',r:'RGC, art. 79.1'},
 {id:'q116',l:'T6L5',q:'¿Dónde puedes cambiar de sentido en una autovía?',o:['En un lugar habilitado para ello','En cualquier abertura de la mediana que veas libre','En el arcén más próximo a la salida que te has pasado'],c:0,e:'En autopistas y autovías, el cambio de sentido solo está permitido en lugares habilitados para ello.',r:'RGC, art. 79.1'},
 {id:'q117',l:'T6L6',q:'Necesitas retroceder como complemento de un estacionamiento. ¿Qué condiciones debes respetar?',o:['Hasta 20 metros si no invades un cruce','El mínimo indispensable, sin superar 15 metros ni invadir un cruce','Hasta 15 metros y puedes invadir un cruce si está despejado'],c:1,e:'Cuando complementa el estacionamiento, la marcha atrás se limita al recorrido imprescindible, con un máximo de 15 metros y sin invadir cruces.',r:'RGC, art. 80.1 y 80.2'},
 {id:'q118',l:'T6L6',q:'En una vía que no es autopista ni autovía, no puedes seguir adelante, girar ni cambiar de sentido. ¿Cuánto puedes retroceder en este supuesto, si es seguro?',o:['Hasta 15 metros en todos los casos','Hasta el último cruce, aun si antes hay una solución','Solo lo imprescindible para resolver la situación'],c:2,e:'Cuando no hay alternativa, se permite el recorrido mínimo indispensable. El límite específico de 15 metros se aplica a la marcha atrás que complementa una parada, un estacionamiento o una incorporación.',r:'RGC, art. 80.1 y 80.2'},
 {id:'q119',l:'T6L6',q:'Mientras retrocedes a poca velocidad, oyes una advertencia y ves a un peatón cerca. ¿Qué haces?',o:['Me detengo de inmediato y desisto si hace falta','Sigo marcha atrás mientras el peatón no toque el coche','Acelero para terminar antes de que se acerque más'],c:0,e:'Debes detenerte rápidamente ante avisos o al detectar a alguien cerca, y abandonar la maniobra si la seguridad lo exige.',r:'RGC, art. 81.3'},
 {id:'q120',l:'T6L6',q:'¿Cómo adviertes la marcha atrás si tu vehículo dispone de la luz correspondiente?',o:['Con el intermitente del lado hacia el que giras','Con la luz de marcha atrás','Con las luces de emergencia en todos los casos'],c:1,e:'La luz de marcha atrás advierte esa maniobra cuando el vehículo dispone de ella.',r:'RGC, art. 109.2.b'},
 {id:'q121',l:'T6L6',q:'Antes de retroceder, la carga te impide ver bien la zona que hay detrás. ¿Qué puedes hacer para comprobarla?',o:['Empezar a retroceder y comprobar solo si alguien te avisa','Confiar en que la luz de marcha atrás despejará la zona','Bajar a comprobarla o seguir las indicaciones de otra persona si es necesario'],c:2,e:'Puedes apearte o pedir indicaciones para asegurarte de que la maniobra no presenta peligro. Una vez comprobado, retrocede despacio.',r:'RGC, art. 81.1'}
];

/* ================= Tema 7: adelantamientos ================= */
const OVERTAKING_LESSONS=[
 {id:'T7L1',t:'Por qué lado se adelanta',min:5,
  key:'En general se adelanta por la izquierda. Comprueba si el caso encaja en una excepción antes de pasar por la derecha.',
  body:`<p>Si quien va delante señala claramente que va a girar o parar a la izquierda, adelanta por su derecha cuando haya espacio suficiente, con la máxima precaución. La misma regla se aplica a un tranvía que circula por el centro de una vía de doble sentido.</p>
  <p>En poblado, se permite adelantar por la derecha cuando hay al menos dos carriles para tu sentido delimitados por marcas longitudinales y puedes hacerlo sin peligro.</p>
  <p>Si la retención ocupa toda la anchura y cada fila se mueve al ritmo del vehículo precedente, que una avance más rápido que otra no cuenta como adelantamiento. En esa situación no cambies de fila para ganar posiciones. Puedes hacerlo para preparar un giro, salir de la calzada o tomar una dirección. Tampoco cuenta como adelantamiento avanzar más rápido por un carril de aceleración, deceleración o uso reservado que por un carril normal, o al revés.</p>`,
  tip:'Distingue entre tráfico fluido y filas que avanzan al ritmo de una retención.',
  errs:['Adelantar por la derecha en una autovía con tráfico fluido porque ese carril está libre.','Cambiar de fila en un atasco solo para avanzar más.'],
  ref:'RGC, arts. 82 y 83',source:'#a82'},
 {id:'T7L2',t:'Comprobaciones antes de adelantar',min:6,
  key:'Avisa con antelación y comprueba que hay visibilidad, espacio para pasar y hueco para volver.',
  body:`<p>Valora tu velocidad, la del vehículo que quieres adelantar y la de quienes puedan venir de frente. Espera si la maniobra supone un riesgo o estorba al tráfico contrario. En una calzada de doble sentido con tres carriles discontinuos, puedes utilizar el central para adelantar si el sentido contrario no lo ha ocupado para hacer lo mismo y puedes hacerlo con seguridad.</p>
  <p>Respeta la preferencia del vehículo de delante si ha anunciado un desplazamiento hacia el mismo lado. Si pasa un tiempo prudencial sin que inicie la maniobra, podrás adelantar cuando sea seguro, después de avisarle con una señal acústica u óptica.</p>
  <p>Espera si alguien que te sigue por el mismo carril ya ha empezado a adelantarte. Está prohibido adelantar a quien ya está adelantando a otro si para pasar necesitas ocupar la zona del sentido contrario.</p>`,
  tip:'Antes de salir, localiza el hueco por el que vas a volver.',
  errs:['Dar por hecho que el intermitente te da preferencia.','Salir a adelantar sin saber dónde podrás volver a tu carril.'],
  ref:'RGC, arts. 84 y 109',source:'#a84'},
 {id:'T7L3',t:'Completar o interrumpir la maniobra',min:6,
  key:'Adelanta a una velocidad claramente superior a la del otro vehículo, dentro del límite y con separación suficiente.',
  body:`<p>Vuelve a tu carril tan pronto como sea posible, de forma gradual y señalizando, sin obligar a nadie a variar su velocidad o trayectoria. Si surge un peligro que dificulta completar la maniobra, reduce con rapidez, señaliza y vuelve a tu carril.</p>
  <p>Con al menos dos carriles en tu sentido puedes quedarte en el carril de adelantamiento para pasar a otro vehículo si puedes hacerlo sin molestar indebidamente a quienes se acercan más rápido por detrás.</p>
  <p>Si te adelantan, cíñete a la derecha como regla general. Si has anunciado un giro o parada a la izquierda en el supuesto del artículo 82.2, cíñete a ese lado sin interferir en el tráfico contrario. No aceleres ni dificultes la maniobra. Si aparece peligro, reduce. Si quien te adelanta desiste y reducir tu velocidad agravaría el riesgo, facilita su regreso sin reducir en ese momento.</p>
  <p>Quienes conducen vehículos pesados, grandes o sujetos a un límite específico deben reducir o apartarse al arcén practicable cuando la vía o el tráfico dificulten que los adelanten con seguridad.</p>`,
  tip:'Deja espacio al volver para que el vehículo adelantado pueda mantener su marcha.',
  errs:['Acelerar cuando te están adelantando.','Volver obligando a frenar al vehículo que acabas de pasar.'],
  ref:'RGC, arts. 83.1, 85.1 a 85.3 y 86',source:'#a85'},
 {id:'T7L4',t:'Ciclistas y otros usuarios vulnerables',min:7,
  key:'Fuera de poblado, antes y durante estos adelantamientos debes circular al menos 20 km/h por debajo del límite de la vía.',
  body:`<p>Desde el 1 de octubre de 2026, esta reducción se aplica al adelantar fuera de poblado a peatones, animales, vehículos de tracción animal, ciclomotores, vehículos de movilidad personal y ciclistas, incluidos los grupos. En una carretera limitada a 90 km/h, el máximo para esta maniobra es 70 km/h. Reduce más si hace falta. El antiguo margen de 20 km/h para superar el límite se eliminó en 2022.</p>
  <p>Cuando hay un carril por sentido, ocupa parte o todo el carril contiguo o contrario para dejar al menos 1,5 metros de separación lateral. Si hay más de un carril por sentido, cambia por completo de carril y mantén una separación segura. Si no hay espacio, espera.</p>
  <p>Evita poner en peligro o entorpecer a quienes vienen de frente, incluso si circulan por el arcén. Trata a los ciclistas en grupo como una sola unidad. Fuera de poblado, si conduces un vehículo de dos ruedas y adelantas a otro vehículo, deja al menos 1,5 metros respecto a sus partes más salientes.</p>`,
  tip:'Calcula la reducción desde el límite del tramo y comprueba el espacio a ambos lados de la maniobra.',
  errs:['Calcular los 20 km/h respecto a la velocidad del ciclista.','Compartir carril al adelantar a un ciclomotor cuando hay más de un carril por sentido.'],
  ref:'RGC, art. 85.4 y 85.5. Real Decreto 518/2026, art. único.12',source:'#a85'},
 {id:'T7L5',t:'Dónde está prohibido adelantar',min:7,
  key:'Si no ves lo suficiente para completar la maniobra o desistir de ella, espera.',
  body:`<p>En curvas, cambios de rasante y otros lugares sin visibilidad suficiente, se prohíbe adelantar. La excepción exige que los sentidos estén claramente delimitados y que puedas pasar sin invadir el contrario. Tampoco puedes seguir a otro vehículo que adelanta si su tamaño te impide ver la vía por delante.</p>
  <p>Está prohibido adelantar en pasos para peatones señalizados, intersecciones con vías ciclistas, pasos a nivel y sus proximidades. En túneles, pasos inferiores y tramos con señal de túnel se prohíbe si solo hay un carril en tu sentido.</p>
  <p>En otras intersecciones y sus proximidades, el artículo 87.1.c prevé excepciones para glorietas, adelantamientos que deban hacerse por la derecha según el artículo 82.2, calzadas con prioridad indicada expresamente y adelantamientos a vehículos de dos ruedas. Deben cumplirse las demás reglas de seguridad.</p>`,
  tip:'Comprueba qué tipo de cruce tienes delante y qué visibilidad ofrece.',
  errs:['Adelantar cerca de un paso a nivel porque la barrera está abierta.','Invadir el sentido contrario en un túnel para adelantar.'],
  ref:'RGC, arts. 87 y 95.6',source:'#a87'},
 {id:'T7L6',t:'Vehículos inmovilizados y obstáculos',min:6,
  key:'Comprueba la causa de la inmovilización y si puedes pasar con espacio y visibilidad suficientes.',
  body:`<p>Si un vehículo inmovilizado ocupa tu carril, se puede rebasar en un tramo donde esté prohibido adelantar, incluso ocupando parte del sentido contrario, tras comprobar que es seguro. Esta excepción no se aplica cuando está detenido por necesidades del tráfico, por ejemplo, por una cola ante un semáforo. El artículo 89 también permite sortear un obstáculo material ocupando el sentido contrario si hace falta y puedes hacerlo con seguridad.</p>
  <p>Si el vehículo ocupa total o parcialmente tu carril por avería, accidente o por los servicios de urgencia, auxilio, conservación o gestión del tráfico que recoge el artículo 88.1, deja al menos 1,5 metros y reduce como mínimo 20 km/h respecto al límite de la vía. Si no cabe la maniobra con seguridad, espera.</p>
  <p>El artículo 88.2 también prevé una excepción para adelantar a ciertos usuarios lentos en tramos con prohibición, entre ellos ciclos, ciclomotores, vehículos de movilidad personal, peatones, animales y vehículos especiales agrícolas. Puedes pasar si hacerlo no crea riesgo y respetas las reglas de distancia y velocidad que se apliquen.</p>`,
  tip:'Antes de pasar, comprueba a quién vas a rebasar y de cuánto espacio dispones.',
  errs:['Aplicar la excepción de avería a una fila parada por el tráfico.','Pensar que ir muy despacio compensa dejar menos separación de la exigida.'],
  ref:'RGC, arts. 85.4, 88 y 89',source:'#a88'}
];

const OVERTAKING_QUESTIONS=[
 {id:'q122',l:'T7L1',q:'En una carretera de doble sentido con tráfico fluido, ¿por qué lado se adelanta como regla general?',o:['Por la izquierda','Por la derecha si hay arcén','Por el lado que deje menos recorrido'],c:0,e:'Se adelanta por la izquierda salvo en las excepciones previstas.',r:'RGC, art. 82.1'},
 {id:'q123',l:'T7L1',q:'El conductor de delante anuncia claramente que va a girar a la izquierda y hay espacio por su derecha. ¿Por dónde debes adelantar si puedes hacerlo con seguridad?',o:['Por la izquierda antes de que gire','Por la derecha, extremando la precaución','Por cualquiera de los dos lados'],c:1,e:'Cuando el giro a la izquierda está anunciado, se adelanta por la derecha si hay espacio suficiente.',r:'RGC, art. 82.2'},
 {id:'q124',l:'T7L1',q:'En poblado hay dos carriles marcados para tu sentido. ¿Puedes adelantar por la derecha si compruebas que es seguro?',o:['Solo si el otro conductor anuncia que va a girar','Solo si la otra fila está detenida','Sí, en esas condiciones'],c:2,e:'En poblado se permite si hay al menos dos carriles para el sentido delimitados por marcas y es seguro.',r:'RGC, art. 82.3'},
 {id:'q125',l:'T7L1',q:'En una retención que ocupa todos los carriles, tu fila avanza más rápido que la de la izquierda. ¿Se considera adelantamiento?',o:['No, cada fila va al ritmo del vehículo precedente','Sí, salvo que la otra fila esté detenida','Sí, porque avanzas por la derecha'],c:0,e:'En una retención de estas características, las distintas velocidades de las filas no se consideran adelantamiento.',r:'RGC, art. 83.2'},
 {id:'q126',l:'T7L1',q:'Un coche avanza más rápido por el carril de aceleración que otro por el carril normal. ¿Se considera adelantamiento?',o:['Sí, porque circulan en paralelo','No, la diferencia de velocidad entre esos carriles no cuenta como adelantamiento','Solo deja de contar si hay atasco'],c:1,e:'En los carriles de aceleración, deceleración y uso reservado puede haber diferencias de velocidad respecto a los carriles normales sin que se consideren adelantamiento.',r:'RGC, art. 83.3'},
 {id:'q127',l:'T7L2',q:'Un coche que iba detrás de ti en el mismo carril ya ha empezado a adelantarte. ¿Puedes iniciar tú un adelantamiento?',o:['Sí, si tenías puesto el intermitente','Sí, si puedes acelerar más rápido','No, debes esperar'],c:2,e:'Antes de salir a adelantar debes comprobar que quien te sigue no ha iniciado la maniobra.',r:'RGC, art. 84.3'},
 {id:'q128',l:'T7L2',q:'El coche de delante acaba de señalar que se va a desplazar hacia el mismo lado que tú para adelantar. ¿Quién tiene preferencia en ese momento?',o:['El coche de delante que ha indicado el desplazamiento','Quien pueda completar antes la maniobra','Quien haya acelerado primero'],c:0,e:'Debes respetar la preferencia del vehículo precedente que ya ha anunciado el desplazamiento hacia ese lado.',r:'RGC, art. 84.2'},
 {id:'q129',l:'T7L2',q:'¿Qué debes comprobar sobre el regreso a tu carril antes de iniciar un adelantamiento?',o:['Solo si la línea central es discontinua','Que dispones de espacio suficiente para volver al acabar','Que el otro conductor puede frenar para abrirte hueco'],c:1,e:'Puedes iniciar la maniobra si dispones de espacio para reintegrarte con seguridad.',r:'RGC, art. 84.3'},
 {id:'q130',l:'T7L2',q:'Un coche ya está adelantando a otro. Para sobrepasarlo tendrías que invadir el sentido contrario. ¿Puedes hacerlo?',o:['Sí, cuando termine de pasar la mitad del otro coche','Sí, si tiene el intermitente encendido','No, en ese supuesto está prohibido'],c:2,e:'Está prohibido adelantar a quien ya está adelantando si necesitas invadir la parte reservada al sentido contrario.',r:'RGC, art. 84.2'},
 {id:'q131',l:'T7L2',q:'Un conductor que viene de frente tendría que frenar para darte tiempo a adelantar. ¿Qué haces?',o:['Espero hasta disponer de un hueco seguro','Inicio la maniobra después de un aviso de luces','Salgo si puedo volver antes de que llegue a mi altura'],c:0,e:'El adelantamiento no debe entorpecer ni poner en peligro a quienes circulan en sentido contrario.',r:'RGC, art. 84.1'},
 {id:'q132',l:'T7L3',q:'Acabas de adelantar. ¿Cómo debes volver a tu carril?',o:['En cuanto tu parte delantera supere al otro vehículo','Gradualmente, señalizando y sin obligar a nadie a variar su velocidad o trayectoria','Solo cuando el otro vehículo te haga una señal de luces'],c:1,e:'Vuelve tan pronto como sea posible sin riesgo, señaliza el desplazamiento y deja espacio suficiente.',r:'RGC, art. 85.3'},
 {id:'q133',l:'T7L3',q:'Una vez iniciado el adelantamiento, aparece un peligro que impide completarlo con seguridad. ¿Qué haces?',o:['Acelero para terminar antes','Mantengo el ritmo y espero que el otro abra hueco','Reduzco con rapidez, señalizo y regreso a mi carril'],c:2,e:'Si completar el adelantamiento resulta peligroso, debes desistir y regresar a tu carril.',r:'RGC, art. 85.2'},
 {id:'q134',l:'T7L3',q:'Otro vehículo te está adelantando. ¿Puedes aumentar tu velocidad?',o:['No, debes evitar dificultar la maniobra','Sí, si no superas el límite','Sí, si te mantienes a la derecha'],c:0,e:'Quien va a ser adelantado no puede aumentar la velocidad ni dificultar el adelantamiento.',r:'RGC, art. 86.2'},
 {id:'q135',l:'T7L3',q:'En una calzada con dos carriles en tu sentido, vas a adelantar a otro vehículo inmediatamente después del anterior. ¿Puedes permanecer en el carril usado para adelantar?',o:['Sí, sin observar el tráfico posterior','Sí, si no molestas indebidamente a quienes se acercan por detrás más rápido','No, siempre debes volver antes de otro adelantamiento'],c:1,e:'Puedes mantenerte en el carril para un nuevo adelantamiento si puedes hacerlo sin molestar indebidamente al tráfico que te sigue.',r:'RGC, art. 83.1'},
 {id:'q136',l:'T7L3',q:'Cuando la maniobra puede hacerse con seguridad, ¿qué velocidad debes llevar durante el adelantamiento?',o:['La misma que el vehículo adelantado','Siempre la máxima señalizada','Claramente superior a la del adelantado, dentro del límite aplicable'],c:2,e:'La diferencia de velocidad debe permitir completar la maniobra dentro del límite y con seguridad.',r:'RGC, art. 85.1'},
 {id:'q137',l:'T7L4',q:'Fuera de poblado, un tramo está limitado a 90 km/h. ¿A qué velocidad máxima puedes adelantar allí a un ciclista según la reducción obligatoria?',o:['70 km/h','80 km/h','90 km/h'],c:0,e:'Debes ir al menos 20 km/h por debajo del límite de la vía antes y durante toda la maniobra.',r:'RGC, art. 85.4'},
 {id:'q138',l:'T7L4',q:'En una carretera de un carril por sentido, ¿qué margen lateral mínimo debes dejar al adelantar a un ciclista?',o:['Un metro si lleva las ruedas en el arcén','1,5 metros, ocupando parte o todo el carril contiguo o contrario','Dos metros solo si hay más de un ciclista'],c:1,e:'El margen mínimo es 1,5 metros y debes ocupar parte o todo el carril contiguo o contrario.',r:'RGC, art. 85.4'},
 {id:'q139',l:'T7L4',q:'Adelantas a un ciclomotor en una calzada con dos carriles por sentido. Si el carril contiguo está libre y es seguro, ¿cómo debes hacerlo?',o:['Compartiendo su carril si dejas 1,5 metros','Pisando un poco el carril contiguo','Cambiando por completo al carril contiguo'],c:2,e:'Si hay más de un carril por sentido, está obligado el cambio completo de carril en este supuesto.',r:'RGC, art. 85.4'},
 {id:'q140',l:'T7L4',q:'Al adelantar a un ciclista entorpecerías a otro que viene de frente por el arcén. ¿Qué haces?',o:['Espero hasta poder pasarlo sin entorpecer al otro','Adelanto porque el otro circula por el arcén','Adelanto si reduzco al menos 20 km/h respecto al límite'],c:0,e:'La prohibición de entorpecer o poner en peligro al tráfico contrario también protege a quienes utilizan el arcén.',r:'RGC, art. 85.4'},
 {id:'q141',l:'T7L4',q:'Conduces una motocicleta fuera de poblado y adelantas a un turismo. ¿Qué margen mínimo dejas respecto a sus partes más salientes?',o:['El que quepa sin pisar la línea del carril','1,5 metros','Medio metro si lo haces despacio'],c:1,e:'Fuera de poblado, quien conduce un vehículo de dos ruedas debe dejar un mínimo de 1,5 metros al adelantar a otro vehículo.',r:'RGC, art. 85.5'},
 {id:'q142',l:'T7L5',q:'Te acercas a un cambio de rasante con poca visibilidad y necesitas ocupar el sentido contrario para adelantar. ¿Puedes hacerlo?',o:['Sí, si la línea es discontinua','Sí, si el vehículo precedente va lento','No, porque no hay visibilidad suficiente e invadirías el sentido contrario'],c:2,e:'Una marca discontinua no compensa la falta de visibilidad. La excepción requiere sentidos delimitados y no invadir el contrario.',r:'RGC, art. 87.1.a'},
 {id:'q143',l:'T7L5',q:'Dos turismos circulan cerca de un paso a nivel. ¿Puede el de atrás adelantar al primero en las proximidades del paso?',o:['No, el adelantamiento está prohibido en las proximidades','Sí, si la barrera está abierta','Sí, si el eje es discontinuo'],c:0,e:'La prohibición se aplica al paso a nivel y a sus proximidades.',r:'RGC, art. 87.1.b'},
 {id:'q144',l:'T7L5',q:'¿Puedes adelantar a otro turismo dentro de un túnel con un solo carril en tu sentido?',o:['Sí, si el carril contrario está libre','No, está prohibido','Sí, si lo haces despacio'],c:1,e:'No puedes adelantar en un túnel o paso inferior si solo tienes un carril para tu sentido.',r:'RGC, arts. 87.1.d y 95.6'},
 {id:'q145',l:'T7L5',q:'¿Qué supuesto es una excepción a la prohibición general de adelantar en un cruce ordinario o en sus proximidades?',o:['Que el semáforo esté verde','Que el vehículo precedente circule más despacio de lo normal','Que tu calzada tenga prioridad en el cruce indicada expresamente por una señal'],c:2,e:'La calzada con prioridad expresamente indicada es una excepción. Siguen vigentes las demás condiciones de seguridad.',r:'RGC, art. 87.1.c.3.º'},
 {id:'q146',l:'T7L5',q:'Un camión empieza a adelantar y te tapa la vista de la carretera que queda por delante. ¿Puedes seguirlo para adelantar?',o:['No, espera a tener visibilidad suficiente','Sí, si el camión ya ocupa el sentido contrario','Sí, si guardas distancia con el camión'],c:0,e:'Está prohibido seguir a un vehículo que adelanta si su tamaño impide ver la vía por delante.',r:'RGC, art. 87.1.a'},
 {id:'q147',l:'T7L6',q:'Un coche averiado ocupa parte de tu carril en un tramo limitado a 80 km/h. Si hay espacio para rebasarlo con seguridad, ¿qué margen y velocidad exige el Reglamento?',o:['Al menos un metro y como máximo 80 km/h','Al menos 1,5 metros y como máximo 60 km/h','Al menos 1,5 metros y como máximo 75 km/h'],c:1,e:'Debes dejar 1,5 metros como mínimo y circular al menos 20 km/h por debajo del límite de la vía.',r:'RGC, art. 88.1'},
 {id:'q148',l:'T7L6',q:'Hay una fila detenida ante un semáforo rojo donde no se permite adelantar. ¿Puedes ocupar el sentido contrario invocando la excepción de vehículo inmovilizado?',o:['Sí, si el sentido contrario está libre','Sí, si vuelves antes del semáforo','No, la fila está detenida por necesidades del tráfico'],c:2,e:'La excepción para rebasar un vehículo inmovilizado no se aplica a las detenciones impuestas por el tráfico.',r:'RGC, art. 88.2'},
 {id:'q149',l:'T7L6',q:'Un obstáculo material ocupa tu carril. ¿Puedes ocupar parte del sentido contrario para sortearlo?',o:['Sí, si es necesario y puedes hacerlo sin peligro','Solo si la línea central es discontinua','Sí, porque el obstáculo te da preferencia'],c:0,e:'Se permite ocupar el espacio del sentido contrario si necesitas hacerlo y compruebas que es seguro.',r:'RGC, art. 89.1'},
 {id:'q150',l:'T7L6',q:'En un tramo donde no se permite adelantar alcanzas a un ciclista. ¿En qué condiciones puedes acogerte a la excepción de usuarios lentos?',o:['Siempre que vaya por el arcén','Si puedes pasar sin riesgo y respetar las reglas de separación, carril y velocidad','Basta con avisar con el claxon y reducir la marcha'],c:1,e:'El artículo 88.2 permite adelantar a los usuarios indicados solo cuando es seguro. También se aplican las condiciones del artículo 85.4.',r:'RGC, arts. 85.4 y 88.2'},
 {id:'q151',l:'T7L6',q:'Un vehículo de auxilio ocupa tu carril mientras trabaja. Hay tráfico de frente y no puedes dejar el margen lateral exigido sin peligro. ¿Qué haces?',o:['Paso despacio dejando menos separación','Paso cuando los operarios me hayan visto','Espero hasta que haya espacio suficiente'],c:2,e:'Circular despacio no sustituye el margen lateral exigido ni la necesidad de pasar con seguridad.',r:'RGC, arts. 88.1 y 88.2'}
];

/* ================= Tema 8: parada y estacionamiento ================= */
const PARKING_LESSONS=[
 {id:'T8L1',t:'Detención, parada y estacionamiento',min:5,
  key:'Identifica primero por qué se inmoviliza el vehículo. Si decides hacerlo voluntariamente, cuenta el tiempo y comprueba si permaneces en él.',
  body:`<p>Una <b>detención</b> se produce por una emergencia, por el tráfico o para cumplir una norma. Esperar ante un semáforo rojo o por una retención son ejemplos de detención, aunque tarden varios minutos.</p>
  <p>Una <b>parada</b> dura menos de dos minutos y el conductor permanece en el vehículo. Si lo dejas para hacer un recado, la inmovilización voluntaria se considera <b>estacionamiento</b>, aunque vuelvas enseguida. Si te quedas voluntariamente durante dos minutos o más, también es estacionamiento.</p>
  <p>Las luces de emergencia y el motor encendido no cambian la clasificación ni autorizan a parar en lugares prohibidos.</p>`,
  tip:'Pregúntate si te obliga el tráfico o si has decidido detener el vehículo.',
  errs:['Confundir dos minutos con menos de dos minutos.','Pensar que bajar del vehículo durante unos segundos sigue siendo una parada.'],
  ref:'Ley de Tráfico, anexo I, puntos 80 a 82',source:'https://www.boe.es/buscar/act.php?id=BOE-A-2015-11722#ani'},
 {id:'T8L2',t:'Dónde y cómo colocar el vehículo',min:6,
  key:'En ciudad, usa el lado que corresponda y respeta las plazas. Fuera de poblado, busca un lugar permitido a la derecha, fuera de la calzada y dejando libre el arcén transitable.',
  body:`<p>En vía interurbana, la parada o el estacionamiento voluntarios se hacen a la derecha de la calzada, fuera de ella y sin ocupar la parte transitable del arcén. En autopistas y autovías, solo en zonas habilitadas. Una detención por emergencia sigue sus propias reglas.</p>
  <p>En vía urbana, si paras o estacionas en la calzada o el arcén, colócate lo más cerca posible del borde derecho. Si es una vía de un solo sentido, puedes hacerlo también a la izquierda cuando las señales y las reglas locales lo permitan.</p>
  <p>Coloca el vehículo en paralelo al borde como regla general. La vía o las plazas pueden disponer otra forma, como la batería. Aprovecha bien el espacio y no bloquees el paso. Es peligroso dejar menos de tres metros hasta el borde opuesto o la marca longitudinal que no puede cruzarse. También está prohibido impedir el paso aunque queden tres metros o más.</p>`,
  tip:'Comprueba si la calle es de uno o dos sentidos y cómo están pintadas las plazas.',
  errs:['Tomar el arcén transitable como zona de descanso.','Ocupar dos plazas o dejar un hueco por el que otros vehículos no pueden pasar.'],
  ref:'RGC, arts. 90, 91, 92.1, 92.2 y 94.1.g',source:'#a90'},
 {id:'T8L3',t:'Asegurar el vehículo al dejarlo',min:5,
  key:'Antes de dejar tu puesto, apaga el motor, desconecta el arranque y acciona el freno de estacionamiento. En pendiente, utiliza también la marcha o posición de estacionamiento que corresponda.',
  body:`<p>Con un vehículo a motor o un ciclomotor, aplica las medidas que correspondan al dejar el puesto de conducción. Si te alejas, toma precauciones para impedir que se use el vehículo sin autorización.</p>
  <p>En un turismo con cambio manual, deja puesta <b>primera</b> si está cuesta arriba y <b>marcha atrás</b> si está cuesta abajo. Si corresponde, utiliza la posición de estacionamiento. Estas medidas se suman al freno de estacionamiento.</p>
  <p>Si dejas en una pendiente pronunciada un vehículo de más de 3.500 kg de masa máxima autorizada, un autobús o un conjunto de vehículos, además debes asegurarlo con calzos adecuados o apoyar una rueda directriz en el bordillo. En subida, orienta las ruedas hacia el centro de la calzada. En bajada, hacia fuera. Recoge los calzos antes de reanudar la marcha.</p>`,
  tip:'En un manual: primera en subida, marcha atrás en bajada.',
  errs:['Dejar el coche en punto muerto en pendiente confiando solo en el freno.','Usar una piedra como calzo para un vehículo pesado.'],
  ref:'RGC, arts. 91.1 y 92.3',source:'#a92'},
 {id:'T8L4',t:'Dónde se prohíbe parar o estacionar',min:7,
  key:'Donde esté prohibido parar, también está prohibido estacionar. Una parada breve no elimina el riesgo de ocultar una señal o bloquear a alguien.',
  body:`<p>No pares ni estaciones en pasos para peatones, pasos ciclistas o pasos a nivel. La prohibición también se aplica a túneles, pasos inferiores, tramos señalizados como túnel, curvas y cambios de rasante con visibilidad reducida y sus proximidades.</p>
  <p>Evita los lugares donde tapes señales, ocupes carriles reservados, bloquees vías de tranvía o interfieras en zonas exclusivas de transporte público. La Ley prohíbe parar en intersecciones y sus proximidades. El Reglamento destaca los casos en que se dificulta un giro o se crea peligro por falta de visibilidad en una vía interurbana.</p>
  <p>Además, está prohibido estacionar en doble fila, delante de un vado señalizado y en zonas señalizadas para carga y descarga mientras estén reservadas para ese uso. Tampoco bloquees el acceso a un inmueble o una rampa. Cumple la señalización de las plazas reservadas para personas con discapacidad.</p>`,
  tip:'Si al colocarte tapas una señal, un paso o un acceso, busca otro sitio.',
  errs:['Parar sobre un paso peatonal porque solo vas a recoger a alguien.','Creer que los intermitentes de emergencia permiten aparcar en doble fila.'],
  ref:'RGC, arts. 91 y 94. Ley de Tráfico, art. 40',source:'#a94'},
 {id:'T8L5',t:'Señales, marcas y estacionamiento regulado',min:6,ill:'parkingSigns',
  key:'Lee la señal principal, el lado de la vía al que se aplica y el horario. Una prohibición de estacionar no prohíbe por sí sola una parada permitida por las demás reglas.',
  body:`<p>La <b>R-307</b>, círculo azul con borde rojo y una cruz roja, prohíbe parar y estacionar. La <b>R-308</b>, con una sola banda roja, prohíbe estacionar. Ambas se aplican al lado donde están instaladas. Consulta flechas, paneles y horas para determinar el alcance.</p>
  <p>La línea amarilla continua junto al bordillo prohíbe parar y estacionar. La discontinua prohíbe estacionar. Un zigzag amarillo reserva el espacio para un uso específico y prohíbe el estacionamiento general. La señal vertical indica la limitación temporal cuando corresponda.</p>
  <p>En las plazas de estacionamiento regulado, comprueba el horario, quién está autorizado, cómo obtener el título y cuánto tiempo permite. Los detalles pueden cambiar entre municipios. En una zona reservada comprueba siempre qué usuarios o vehículos pueden ocuparla.</p>`,
  tip:'Dos bandas cruzadas en la señal: ni parar ni estacionar. Una sola banda: no estacionar.',
  errs:['Aplicar al otro lado de la calle una restricción señalizada en este lado.','Suponer que el color de la plaza tiene el mismo horario en todos los municipios.'],
  ref:'RGC, arts. 94.2 y 156 y anexo I, apartados 5.1 y 5.2',source:'#A5'},
 {id:'T8L6',t:'Motocicletas y autocaravanas',min:5,
  key:'Consulta la ordenanza antes de aparcar una moto en una acera. Si estacionas una autocaravana, mantenla dentro de su perímetro y cumple las condiciones del lugar.',
  body:`<p>Los ayuntamientos pueden regular por ordenanza la parada y el estacionamiento de los vehículos de dos ruedas sobre aceras, paseos y zonas peatonales. Debe quedar libre el paso de peatones, prestando especial atención a las personas con discapacidad o movilidad reducida. Comprueba si la ordenanza lo permite en ese lugar. Una regla de otra ciudad no sirve para decidir.</p>
  <p>Desde el 1 de octubre de 2026, el artículo 92.4 exige que las autocaravanas y otros vehículos acondicionados como vivienda estacionen sin extender elementos fuera de su perímetro, apoyados solo sobre los neumáticos, con calzos o cuñas de seguridad permitidos, y sin verter líquidos del habitáculo.</p>
  <p>Estas condiciones de colocación se aplican junto a las demás reglas de estacionamiento. Revisa las señales y las restricciones del lugar antes de ocupar una plaza.</p>`,
  tip:'En moto, lee la ordenanza. En autocaravana, comprueba el perímetro, los apoyos y que no haya vertidos.',
  errs:['Suponer que cualquier acera ancha admite motos.','Extender un toldo sobre una plaza contigua mientras el vehículo está estacionado.'],
  ref:'RGC, arts. 92.4 y 156. Ley de Tráfico, art. 40.2.e',source:'#a92'}
];

const PARKING_QUESTIONS=[
 {id:'q152',l:'T8L1',q:'Ante un semáforo en rojo, el coche queda inmóvil tres minutos. ¿Qué es?',o:['Detención','Parada','Estacionamiento'],c:0,e:'Es una detención porque la inmovilización la impone la señal, con independencia del tiempo.',r:'Ley de Tráfico, anexo I, punto 80'},
 {id:'q153',l:'T8L1',q:'En un lugar permitido, te quedas dentro del coche un minuto mientras sube un pasajero. ¿Qué maniobra has hecho?',o:['Una detención','Una parada','Un estacionamiento'],c:1,e:'La inmovilización es voluntaria, dura menos de dos minutos y permaneces en el coche.',r:'Ley de Tráfico, anexo I, punto 81'},
 {id:'q154',l:'T8L1',q:'Dejas el coche inmóvil voluntariamente durante exactamente dos minutos y te quedas dentro. ¿Cómo se clasifica?',o:['Detención','Parada','Estacionamiento'],c:2,e:'La parada exige que el tiempo sea inferior a dos minutos. Dos minutos exactos quedan fuera de esa definición.',r:'Ley de Tráfico, anexo I, puntos 81 y 82'},
 {id:'q155',l:'T8L1',q:'Dejas el coche y entras 30 segundos en un comercio. ¿Cómo se considera esta inmovilización voluntaria?',o:['Estacionamiento','Parada porque dura menos de dos minutos','Detención por necesidades del tráfico'],c:0,e:'Para que se trate de una parada, el conductor debe permanecer en el vehículo.',r:'Ley de Tráfico, anexo I, puntos 81 y 82'},
 {id:'q156',l:'T8L1',q:'Esperas voluntariamente dentro del coche durante cuatro minutos con el motor encendido. ¿Qué has hecho?',o:['Una parada mientras el motor siga encendido','Un estacionamiento','Una detención reglamentaria'],c:1,e:'Una espera voluntaria de cuatro minutos es estacionamiento. El motor encendido no cambia la clasificación.',r:'Ley de Tráfico, anexo I, puntos 80 a 82'},
 {id:'q157',l:'T8L2',q:'¿Dónde debes estacionar voluntariamente en una vía interurbana si hay un lugar permitido?',o:['En la parte transitable del arcén derecho','A la izquierda de la calzada si está despejado','A la derecha, fuera de la calzada y dejando libre el arcén transitable'],c:2,e:'La regla exige situarse a la derecha y fuera de la calzada, dejando libre la parte transitable del arcén.',r:'RGC, art. 90.1'},
 {id:'q158',l:'T8L2',q:'Se permite estacionar en la calzada de una calle de doble sentido. ¿Dónde colocas el vehículo?',o:['Lo más cerca posible del borde derecho','En cualquiera de los dos lados si usas el intermitente','En el lado izquierdo si hay plazas libres'],c:0,e:'En una vía urbana de doble sentido, la regla de colocación exige acercarse al borde derecho.',r:'RGC, art. 90.2'},
 {id:'q159',l:'T8L2',q:'En una calle de sentido único, ¿puedes estacionar en una plaza habilitada a la izquierda?',o:['Solo si conduces una motocicleta','Sí, también está permitido el lado izquierdo','No, habría que hacerlo siempre a la derecha'],c:1,e:'El Reglamento permite utilizar ambos lados en vías urbanas de sentido único, respetando las reglas y señales del lugar.',r:'RGC, art. 90.2'},
 {id:'q160',l:'T8L2',q:'¿Cómo debes colocar el vehículo respecto al borde de la calzada si la vía no dispone otra colocación?',o:['En perpendicular','En diagonal','En paralelo'],c:2,e:'La colocación general es en paralelo. Las características de la vía u otras circunstancias pueden aconsejar otra disposición.',r:'RGC, art. 92.1'},
 {id:'q161',l:'T8L2',q:'Al estacionar dejarías solo dos metros hasta una línea longitudinal que no se puede atravesar. ¿Debes buscar otro sitio?',o:['Sí, el hueco es inferior a tres metros','No, si estás completamente pegado al borde','Solo si se acerca un vehículo pesado'],c:0,e:'Dejar menos de tres metros hasta una marca que no puede cruzarse es un supuesto de parada o estacionamiento peligroso o que obstaculiza gravemente.',r:'RGC, art. 91.2.a'},
 {id:'q162',l:'T8L3',q:'En llano, vas a dejar el turismo estacionado y te alejarás. ¿Qué medidas debes tomar?',o:['Dejar el motor al ralentí y accionar el freno de estacionamiento','Apagar el motor, desconectar el arranque, accionar el freno de estacionamiento e impedir su uso sin autorización','Apagar el motor y usar las luces de emergencia en lugar del freno de estacionamiento'],c:1,e:'Apaga el motor y desconecta el arranque, acciona el freno de estacionamiento y toma medidas contra el uso no autorizado al alejarte.',r:'RGC, art. 92.3.a y 92.3.b'},
 {id:'q163',l:'T8L3',q:'Dejas estacionado un turismo con cambio manual cuesta arriba. Con el freno de estacionamiento puesto, ¿qué marcha dejas engranada?',o:['Punto muerto','Marcha atrás','Primera'],c:2,e:'Con un cambio manual, el Reglamento indica primera marcha en pendiente ascendente.',r:'RGC, art. 92.3.c'},
 {id:'q164',l:'T8L3',q:'Dejas estacionado un turismo con cambio manual cuesta abajo. Además del freno de estacionamiento, ¿qué marcha dejas puesta?',o:['Marcha atrás','Primera','Punto muerto'],c:0,e:'En pendiente descendente, el Reglamento indica dejar puesta la marcha atrás.',r:'RGC, art. 92.3.c'},
 {id:'q165',l:'T8L3',q:'Estacionas un conjunto de vehículos en una pendiente pronunciada y no hay bordillo. ¿Puedes usar piedras para calzarlo?',o:['Sí, si son bastante grandes','No, deben ser calzos destinados a esa función','Sí, siempre que las retires al salir'],c:1,e:'En este caso se deben usar calzos adecuados, no piedras u objetos que no estén diseñados para ello.',r:'RGC, art. 92.3.d'},
 {id:'q166',l:'T8L3',q:'Has utilizado calzos para asegurar un vehículo pesado en pendiente. ¿Qué haces con ellos al salir?',o:['Dejarlos junto al borde para el siguiente conductor','Moverlos a otra plaza','Retirarlos de la vía'],c:2,e:'Una vez utilizados, los calzos deben retirarse de la vía al reanudar la marcha.',r:'RGC, art. 92.3.d'},
 {id:'q167',l:'T8L4',q:'¿Puedes parar sobre un paso para peatones durante 30 segundos para recoger a una persona?',o:['No, la parada voluntaria está prohibida en ese lugar','Sí, si permaneces en el vehículo','Sí, si no hay peatones cruzando'],c:0,e:'Parar sobre un paso peatonal está prohibido aunque solo sean unos segundos.',r:'RGC, art. 94.1.b. Ley de Tráfico, art. 40.1.b'},
 {id:'q168',l:'T8L4',q:'Sin que haya ninguna emergencia, ¿puedes parar en el arcén de una autovía para comprobar una dirección?',o:['Sí, si es durante menos de dos minutos','No, debes usar una zona habilitada','Sí, si enciendes las luces de emergencia'],c:1,e:'En autopistas y autovías, solo puedes efectuar una parada voluntaria en zonas habilitadas.',r:'RGC, art. 94.1.g'},
 {id:'q169',l:'T8L4',q:'En un lugar donde está prohibido parar, ¿se puede estacionar?',o:['Sí, si se señaliza el vehículo','Sí, si la prohibición menciona la parada','No, la prohibición de parar también impide estacionar'],c:2,e:'Estacionar está prohibido en todos los lugares donde se prohíbe parar.',r:'RGC, art. 94.2.a'},
 {id:'q170',l:'T8L4',q:'Estacionas tres minutos en doble fila, aunque sigues dentro del coche. ¿Está permitido?',o:['No, estacionar en doble fila está prohibido','Sí, porque permanece el conductor','Sí, con las luces de emergencia encendidas'],c:0,e:'Una inmovilización voluntaria de tres minutos es estacionamiento. Estacionar en doble fila está prohibido aunque te quedes dentro.',r:'RGC, art. 94.2.g. Ley de Tráfico, anexo I, puntos 81 y 82'},
 {id:'q171',l:'T8L4',q:'¿Puedes estacionar delante de un vado correctamente señalizado si nadie lo está usando?',o:['Sí, hasta que alguien necesite pasar','No, está prohibido','Sí, si no ocupas la acera'],c:1,e:'Delante de un vado correctamente señalizado no se permite estacionar.',r:'RGC, art. 94.2.f'},
 {id:'q172',l:'T8L5',img:'noStopping',q:'En el tramo de aplicación de esta señal, ¿qué prohíbe en el lado donde está colocada?',o:['Solo estacionar','Solo parar','Parar y estacionar'],c:2,e:'La R-307, con dos bandas rojas cruzadas, prohíbe ambas maniobras.',r:'RGC, anexo I, apartado 5.1, señal R-307'},
 {id:'q173',l:'T8L5',img:'noParking',q:'¿Qué prohíbe esta señal por sí sola en el lado donde está colocada?',o:['Estacionar','Parar y estacionar','Solo parar'],c:0,e:'La R-308 prohíbe estacionar. La parada puede hacerse si las demás reglas la permiten.',r:'RGC, anexo I, apartado 5.1, señal R-308'},
 {id:'q174',l:'T8L5',q:'Una línea amarilla continua junto al bordillo está en vigor. ¿Qué prohíbe?',o:['Solo estacionar','Parar y estacionar','Solo parar'],c:1,e:'La marca amarilla continua prohíbe ambas maniobras en ese lado y a lo largo de la línea.',r:'RGC, anexo I, apartado 5.2, marca M-7.8'},
 {id:'q175',l:'T8L5',q:'Se ha agotado el tiempo permitido en una plaza de estacionamiento regulado. Sin renovar la autorización, ¿puedes seguir estacionado?',o:['Sí, si permaneces dentro','Sí, si dejas libre la plaza contigua','No, se prohíbe exceder el tiempo autorizado'],c:2,e:'El estacionamiento regulado exige respetar el tiempo de la autorización.',r:'Ley de Tráfico, art. 40.2.b. RGC, arts. 94.2.b y 156'},
 {id:'q176',l:'T8L5',q:'Una línea amarilla discontinua está pintada en el bordillo. ¿Qué indica mientras se aplica?',o:['Prohibición de estacionar','Prohibición de parar y estacionar','Estacionamiento reservado a turismos'],c:0,e:'La amarilla discontinua prohíbe estacionar. Si la restricción es temporal, se indica en una señal vertical.',r:'RGC, anexo I, apartado 5.2, marca M-7.7'},
 {id:'q177',l:'T8L6',q:'Quieres aparcar una motocicleta en una acera y no conoces las normas del municipio. ¿Qué debes comprobar?',o:['Solo si quedan dos metros libres, porque la regla es igual en toda España','Si la ordenanza lo autoriza allí y se respeta el paso peatonal','Si otras motos ya están aparcadas allí'],c:1,e:'Los municipios pueden regularlo por ordenanza y deben preservar el tránsito de peatones.',r:'RGC, art. 156.2. Ley de Tráfico, art. 40.2.e'},
 {id:'q178',l:'T8L6',q:'Estacionas una autocaravana en una plaza permitida. ¿Puedes desplegar un toldo que sobresale de su perímetro?',o:['Sí, si no llega a la calzada','Sí, si lo recoges antes de anochecer','No, no se pueden extender elementos fuera del perímetro'],c:2,e:'El artículo 92.4 exige que los elementos propios del vehículo no sobresalgan de su perímetro al estacionar.',r:'RGC, art. 92.4.a'},
 {id:'q179',l:'T8L6',q:'¿Puedes usar calzos o cuñas de seguridad para una autocaravana estacionada?',o:['Sí, están permitidos y el vehículo debe apoyarse sobre sus neumáticos','No, la norma prohíbe cualquier calzo','Solo si también usas patas estabilizadoras'],c:0,e:'La autocaravana debe descansar sobre sus neumáticos. Se permiten calzos o cuñas de seguridad.',r:'RGC, art. 92.4.b'},
 {id:'q180',l:'T8L6',q:'Desde una autocaravana estacionada, ¿puedes vaciar al suelo agua procedente del habitáculo?',o:['Sí, si no tiene jabón','No, está prohibido verter fluidos del habitáculo','Sí, si el agua no llega a la calzada'],c:1,e:'La norma de estacionamiento prohíbe el vertido de fluidos procedentes del habitáculo.',r:'RGC, art. 92.4.c'},
 {id:'q181',l:'T8L6',q:'La ordenanza permite estacionar motos en determinadas aceras. ¿Puedes hacerlo si dificultas el paso de una persona con movilidad reducida?',o:['Sí, si la moto está dentro de los límites de la acera','Sí, si solo vas a tardar unos minutos','No, se debe preservar el tránsito peatonal'],c:2,e:'La ordenanza debe proteger el paso de peatones y prestar especial atención a la seguridad y movilidad de las personas con movilidad reducida o discapacidad.',r:'RGC, art. 156.2'}
];

/* ================= Tema 9: alumbrado y señales del vehículo ================= */
const LIGHTING_LESSONS=[
 {id:'T9L1',t:'Posición, cruce y luces diurnas',min:5,
  key:'Las luces de posición indican dónde está el vehículo. Para circular de noche por una vía iluminada, un turismo o una moto debe llevar también las de cruce.',
  body:`<p>El alumbrado de <b>posición</b> permite que te vean. Se usa, entre otros casos, entre la puesta y la salida del sol, en túneles y pasos inferiores, y cuando la visibilidad se reduce sensiblemente. En esas condiciones también se ilumina la matrícula trasera. Si el vehículo mide más de 2,10 metros de ancho, debe llevar además el alumbrado de gálibo.</p>
  <p>Las luces de <b>cruce</b> o de corto alcance iluminan la vía sin el alcance de las largas. Úsalas de noche al circular por poblado y por vías interurbanas suficientemente iluminadas. En un túnel suficientemente iluminado se usan junto con las de posición también de día.</p>
  <p>Durante el día, las motocicletas deben llevar encendida la luz de cruce. También deben llevarla los vehículos que circulan por un carril reversible, adicional circunstancial o habilitado en sentido contrario al habitual, entre los supuestos del Reglamento. Las luces diurnas no sustituyen al alumbrado de cruce cuando este es obligatorio.</p>`,
  tip:'Antes de entrar en un túnel, comprueba qué luces están encendidas.',
  errs:['Circular de noche con las luces de posición como único alumbrado.','Dejar la moto con las luces diurnas cuando debe llevar las de cruce.'],
  ref:'RGC, arts. 98, 99, 101, 103 y 104',source:'#a98'},
 {id:'T9L2',t:'Luces largas y deslumbramiento',min:6,
  key:'Cambia de largas a cruce tan pronto como puedas deslumbrar a alguien, tanto de frente como por el retrovisor.',
  body:`<p>En un vehículo equipado con luces de <b>carretera o largo alcance</b>, se usan por regla general al circular a más de 40 km/h de noche por una vía interurbana insuficientemente iluminada, o a cualquier hora en un túnel, paso inferior o tramo señalizado como túnel que esté insuficientemente iluminado. Si existe riesgo de deslumbrar, usa las de cruce. En poblado se usa cruce aunque la vía esté poco iluminada.</p>
  <p>Una vía se considera insuficientemente iluminada si, con vista normal y en algún punto de su calzada, no se puede leer una matrícula a 10 metros o no se distingue un vehículo oscuro a 50 metros. En los tramos interurbanos o túneles poco iluminados, usa cruce si careces de largas o si vas a 40 km/h o menos y no utilizas las largas.</p>
  <p>No recuperes las luces largas antes de rebasar al vehículo que viene de frente. Si tú sufres el deslumbramiento, reduce la velocidad lo necesario, incluso hasta detenerte si hace falta. Las largas están prohibidas con el vehículo parado o estacionado.</p>`,
  tip:'Piensa también en quien va delante: sus retrovisores reciben tu luz.',
  errs:['Esperar al cruce para quitar las largas.','Mantener las largas detrás de otro vehículo aunque puedas deslumbrarlo.'],
  ref:'RGC, arts. 100 a 102',source:'#a100'},
 {id:'T9L3',t:'Niebla, lluvia y alumbrado en avería',min:6,
  key:'El antiniebla trasero se reserva para visibilidad especialmente mala. La lluvia ordinaria o una ligera bruma no lo justifican.',
  body:`<p>Si niebla, lluvia intensa, nieve, humo o polvo reducen sensiblemente la visibilidad, usa el alumbrado correspondiente. Con las luces de posición, el Reglamento prevé la delantera antiniebla o el alumbrado de cruce o carretera. Si usas las largas, respeta la regla de deslumbramiento. En niebla, el cruce suele darte mejor visión que las largas.</p>
  <p>El <b>antiniebla delantero</b> puede emplearse sin cruce o largas, o combinado con estas luces, según proceda. También se permite en una calzada de hasta 6,50 metros de ancho señalizada con una sucesión de curvas próximas. El <b>trasero</b> debe encenderse cuando las condiciones sean especialmente desfavorables, como niebla espesa, lluvia muy intensa, nevada fuerte o nubes densas de humo o polvo. Apágalo cuando desaparezcan esas condiciones.</p>
  <p>Si una avería irreparable en ruta te obliga a circular con alumbrado de menor intensidad, reduce la velocidad hasta poder detenerte dentro de la zona iluminada.</p>`,
  tip:'Para usar el antiniebla trasero, valora si la visibilidad es especialmente mala.',
  errs:['Encender el antiniebla trasero por cualquier lluvia.','Mantener la velocidad si una avería acorta el tramo iluminado.'],
  ref:'RGC, arts. 99, 102, 106 y 107',source:'#a106'},
 {id:'T9L4',t:'Intermitentes, freno y avisos acústicos',min:6,
  key:'Avisa antes de desplazarte. El intermitente indica hacia dónde vas; la prioridad sigue dependiendo de las reglas de la maniobra.',
  body:`<p>Usa el intermitente del lado hacia el que vas a desplazarte, con antelación suficiente. Apágalo al adoptar la nueva trayectoria. Si necesitas usar el brazo, haz la señal de forma visible: brazo horizontal con palma hacia abajo para el lado que indica la mano, o doblado hacia arriba con palma extendida para el contrario.</p>
  <p>Para retroceder, usa la luz de marcha atrás si el vehículo dispone de ella. Si carece de ella, extiende el brazo en horizontal con la palma hacia atrás. Para avisar de una frenada considerable o de que vas a inmovilizarte, usa repetidamente las luces de freno siempre que sea posible, o haz movimientos breves de arriba abajo con el brazo. Para parar o estacionar hacia un lado, usa también el intermitente de ese lado si lo tienes.</p>
  <p>El <b>claxon</b> se usa excepcionalmente: para evitar un accidente, para avisar de un adelantamiento fuera de poblado o para advertir la presencia en el supuesto de un servicio urgente excepcional de un vehículo no prioritario. Para esos fines se pueden sustituir las señales acústicas por destellos breves que no deslumbren.</p>`,
  tip:'Señaliza el movimiento que vas a hacer, antes de hacerlo.',
  errs:['Pitar para apremiar a quien tarda en arrancar.','Dar por hecho que otros han visto el intermitente y te dejarán pasar.'],
  ref:'RGC, arts. 70 y 108 a 110',source:'#a108'},
 {id:'T9L5',t:'Avería, luces de emergencia y baliza V-16',min:7,
  key:'En un turismo matriculado en España, desde el 1 de enero de 2026 el dispositivo válido de preseñalización es la baliza V-16 conectada y certificada.',
  body:`<p>Si el vehículo queda inmovilizado por avería o accidente y crea un peligro, enciende las luces de emergencia si dispone de ellas y las de posición y gálibo cuando proceda. En calzada o arcén, las de posición se exigen de noche o con visibilidad reducida; también las de gálibo cuando correspondan. Un vehículo estacionado en una calle urbana que no sea travesía puede prescindir de las de posición si la iluminación permite distinguirlo a distancia suficiente.</p>
  <p>La <b>V-16 conectada</b> se activa y se coloca en la parte exterior más alta que puedas alcanzar con seguridad, procurando la máxima visibilidad. Emite destellos y comunica la ubicación de la incidencia. En turismos matriculados en España, los triángulos y las balizas sin conexión quedaron fuera del régimen aplicable desde 2026. Las motos no están obligadas a llevar la V-16, aunque la DGT aconseja su uso.</p>
  <p>La baliza avisa del peligro y transmite la posición. Para pedir ayuda, contacta con el 112 si hay una emergencia o con el servicio de asistencia si necesitas una grúa. Sal por el lado contrario al tráfico si puedes alcanzar con seguridad un lugar fuera de la calzada y del arcén. Si no puedes salir con seguridad, permanece dentro con el cinturón abrochado.</p>`,
  tip:'Para colocar la baliza, prioriza un punto visible al que puedas llegar sin exponerte al tráfico.',
  errs:['Confiar en que la baliza pide una ambulancia o una grúa.','Salir del coche aunque no exista un lugar seguro al que llegar.'],
  ref:'RGC, arts. 105 y 130. Reglamento General de Vehículos, anexos XI y XII',source:'#a130'},
 {id:'T9L6',t:'Otras señales del vehículo: V-1, V-13 y V-20',min:6,
  key:'Aprende a reconocer tres avisos distintos: el servicio urgente de un vehículo prioritario, el conductor novel y la carga que sobresale.',
  body:`<p>La señal luminosa <b>V-1</b> identifica al vehículo prioritario en servicio urgente. Como regla general se usa junto con la señal acústica especial. Puede usarse sola cuando prescindir de la señal acústica no supone peligro. Si adviertes su aproximación, facilita el paso según el lugar y el tráfico.</p>
  <p>La <b>V-13</b> es la placa con la letra L. Se lleva durante el primer año al obtener por primera vez un permiso. En un turismo va detrás, a la izquierda y visible. En una motocicleta basta con que esté visible en la parte trasera. El Reglamento contempla excepciones y el cómputo del plazo cuando se suspende el permiso.</p>
  <p>La <b>V-20</b> es el panel de franjas rojas y blancas que señaliza la carga que sobresale por detrás en los casos del artículo 15. Va al extremo posterior de la carga, perpendicular al eje del vehículo. Si sobresale por toda la anchura trasera, se colocan dos paneles en los extremos, con las franjas formando una V invertida. De noche o con visibilidad sensiblemente reducida se añade una luz roja cuando la carga sobresale por detrás.</p>`,
  tip:'Relaciona el número con su función: V-1, servicio urgente; V-13, novel; V-20, carga saliente.',
  errs:['Confundir la L con una limitación de velocidad.','Colocar un solo panel si la carga sobresale por toda la anchura posterior.'],
  ref:'RGC, arts. 15.6, 68 y 69. Reglamento General de Vehículos, anexo XI',source:'https://www.boe.es/buscar/act.php?id=BOE-A-1999-1826#anxi'}
];
