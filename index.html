const SAFETY_LESSONS=[
 {id:'T12L1',t:'Observar, anticiparse y dejar margen',min:5,
  key:'Detectar un riesgo antes te da más tiempo y espacio para resolverlo con seguridad.',
  body:`<p>La <b>conducción preventiva</b> consiste en observar, prever lo que puede ocurrir y adaptar la marcha antes de que el peligro te obligue a una maniobra de emergencia. Mira también más allá del vehículo de delante, los laterales y los accesos. Consulta los retrovisores con miradas breves y frecuentes. <a href="${SAFETY_SOURCES.preventive}" target="_blank" rel="noopener">Conducción preventiva, DGT</a></p>
  <p>Los espejos dejan <b>ángulos muertos</b>, zonas donde otro usuario puede quedar oculto. Antes de un desplazamiento lateral, comprueba también esa zona con una mirada breve cuando sea seguro. Mantén el control y la atención hacia delante.</p>
  <p>Deja espacio para detenerte si frena quien te precede. Un intermitente anuncia una intención; comprueba además que puedes maniobrar sin riesgo. Tener prioridad tampoco elimina la obligación de evitar un siniestro si otro usuario comete un error.</p>
  <p>Si necesitas reducir considerablemente la velocidad y no hay peligro inminente, comprueba el tráfico posterior, avisa y reduce de forma progresiva. <a href="${RGC}#a53" target="_blank" rel="noopener">RGC, art. 53</a></p>`,
  tip:'Hazte tres preguntas: qué veo, qué podría pasar y qué margen tengo para responder.',
  errs:['Mirar únicamente la parte trasera del vehículo precedente.','Confundir no ver a nadie en el espejo con haber comprobado toda la zona lateral.'],
  ref:'RGC, arts. 3, 17, 18, 53, 54 y 74. DGT, conducción preventiva',source:'#a17'},
 {id:'T12L2',t:'Peatones y personas que necesitan más protección',min:5,ill:'peat',
  key:'Modera la velocidad cuando puedas prever que alguien entrará en la calzada, aunque todavía no lo haya hecho.',
  body:`<p>Una pelota que sale entre vehículos estacionados puede anunciar la aparición de un niño. Cerca de colegios, mercados, autobuses detenidos y zonas con peatones, observa ambos lados y modera la velocidad. Detente si las circunstancias lo exigen. Extremar la precaución es especialmente importante junto a niños, personas mayores o personas con discapacidad. <a href="${RGC}#a46" target="_blank" rel="noopener">RGC, arts. 17 y 46</a></p>
  <p>Al girar para entrar en otra vía, cede a los peatones que ya la están cruzando, <b>aunque no haya paso de peatones</b>. También debes dejarlos pasar al cruzar una acera por una entrada de garaje habilitada.</p>
  <p>En una parada señalizada de transporte colectivo, tienen prioridad los viajeros que suben o bajan y están entre el vehículo y la zona peatonal o refugio más próximo. <a href="${RGC}#a65" target="_blank" rel="noopener">Supuestos de prioridad, RGC, art. 65</a></p>
  <p>Cuenta con que una persona puede necesitar más tiempo para terminar de cruzar. Si tu semáforo permite pasar pero aún hay alguien en tu trayectoria, evita ponerlo en peligro y espera lo necesario.</p>`,
  tip:'La prevención empieza al detectar la posibilidad de que aparezca alguien.',
  errs:['Esperar a ver a un niño en la calzada para empezar a reducir.','Pensar que el verde permite avanzar aunque aún haya una persona cruzando delante.'],
  ref:'RGC, arts. 3, 17, 46.1.a, 46.1.b, 46.1.e y 65',source:'#a65'},
 {id:'T12L3',t:'Convivir con bicicletas, motos y patinetes',min:6,
  key:'Observa los ángulos muertos y deja espacio: una bicicleta o una moto pueden quedar ocultas con facilidad.',
  body:`<p>Antes de girar, cambiar de carril o abrir una puerta, busca también bicicletas, motos y patinetes. Comprueba con especial atención los laterales. Para entrar en otra vía girando, cede al ciclista próximo cuya trayectoria vayas a cortar. Abrir una puerta exige comprobar que no creas peligro ni entorpeces a nadie. <a href="${RGC}#a64" target="_blank" rel="noopener">RGC, art. 64.2</a> · <a href="${RGC}#a114" target="_blank" rel="noopener">RGC, art. 114</a></p>
  <p>En el <b>ámbito urbano</b>, si conduces un vehículo a motor detrás de un ciclista en el mismo carril, deja una separación de <b>al menos cinco metros</b>. Amplíala cuando haga falta para poder detenerte sin alcanzarlo. Esa separación es longitudinal. <a href="${RGC}#a1-6" target="_blank" rel="noopener">RGC, arts. 153.4 y 54</a></p>
  <p>Al adelantar, aplica las condiciones del tema 7. Con un carril por sentido deja al menos 1,5 metros laterales ocupando parte o todo el contiguo o contrario; con más de un carril por sentido cambia completamente de carril. Fuera de poblado, reduce al menos 20 km/h respecto al límite antes y durante la maniobra. Espera si afectarías a quien viene de frente. <a href="${RGC}#a85" target="_blank" rel="noopener">RGC, art. 85.4</a></p>
  <p>Un VMP es un vehículo. La acera está reservada a peatones y se prohíbe circular por ella con un patinete eléctrico. <a href="${RGC}#a1-5" target="_blank" rel="noopener">RGC, art. 152.1</a></p>`,
  tip:'Distingue el espacio que dejas detrás de una bicicleta del que dejas a su lado al pasarla.',
  errs:['Aplicar los 1,5 metros laterales como separación para seguir a un ciclista en ciudad.','Abrir una puerta después de comprobar solo si vienen coches.'],
  ref:'RGC, arts. 54, 64.2, 85.4, 114, 152.1 y 153.4. Texto vigente desde el 1 de octubre de 2026',source:'#a1-6'},
 {id:'T12L4',t:'Lluvia, niebla y pérdida de adherencia',min:6,
  key:'Ajusta la marcha a lo que ves y al agarre disponible, y conserva espacio para detenerte.',
  body:`<p>Las primeras gotas pueden mezclarse con polvo y grasa y volver el firme especialmente deslizante. Con lluvia, aumenta el margen, reduce la velocidad según las condiciones y actúa con suavidad. Modera también la marcha si puedes proyectar agua o gravilla a otros usuarios. <a href="${SAFETY_SOURCES.rainStart}" target="_blank" rel="noopener">Lluvia, manual de lectura fácil de la DGT</a> · <a href="${RGC}#a46" target="_blank" rel="noopener">RGC, art. 46.1.g</a></p>
  <p>Hay <b>aquaplaning</b> cuando el neumático pierde contacto efectivo con la calzada por una capa de agua. Sujeta el volante con firmeza, levanta suavemente el pie del acelerador y evita frenazos o giros bruscos. Corrige suavemente la trayectoria al recuperar el agarre. <a href="${SAFETY_SOURCES.rain}" target="_blank" rel="noopener">Lluvia y aquaplaning, DGT</a></p>
  <p>En la niebla, las luces del vehículo de delante pueden ayudarte a localizarlo, pero acercarte para seguirlas reduce el margen. Ajusta la marcha a tu propio campo de visión y deja separación. Usa como referencia las marcas de la vía sin salirte del carril. <a href="${SAFETY_SOURCES.fog}" target="_blank" rel="noopener">Recomendaciones con niebla, DGT</a></p>
  <p>Debes poder detenerte dentro de la zona que ves. El alumbrado adecuado ayuda a ver y ser visto; la velocidad y la separación también deben adaptarse. <a href="${RGC}#a45" target="_blank" rel="noopener">RGC, arts. 45, 54 y 106</a></p>`,
  tip:'Si ves menos o tienes menos agarre, necesitas más margen.',
  errs:['Creer que las primeras gotas apenas cambian la adherencia.','Acercarse al vehículo de delante para que guíe la marcha entre la niebla.'],
  ref:'RGC, arts. 45, 46.1.g, 46.1.k, 54 y 106. DGT, lluvia y niebla',source:'#a45'},
 {id:'T12L5',t:'Viento, nieve y hielo',min:5,
  key:'Anticipa los cambios de agarre y los empujones del viento antes de llegar a una zona expuesta.',
  body:`<p>Una ráfaga lateral puede desplazar tu vehículo. El empuje puede cambiar de golpe al salir de un túnel o al dejar de estar protegido por un vehículo grande: es el <b>efecto pantalla</b>. Modera la velocidad, sujeta firmemente el volante y corrige con suavidad. <a href="${SAFETY_SOURCES.wind}" target="_blank" rel="noopener">Viento y efecto pantalla, DGT</a></p>
  <p>Con nieve o hielo, aumenta la separación y evita acelerones, frenazos y giros bruscos. La suavidad ayuda a conservar el escaso agarre. Prepara el vehículo y el recorrido antes de salir. <a href="${SAFETY_SOURCES.snow}" target="_blank" rel="noopener">Conducción con nieve, DGT</a></p>
  <p>Puede haber placas de hielo en zonas de sombra, puentes y lugares próximos a ríos, aunque el resto del tramo parezca despejado. Anticípate y reduce antes de la zona sospechosa. <a href="${SAFETY_SOURCES.ice}" target="_blank" rel="noopener">Riesgo de hielo, DGT</a></p>
  <p>Comprueba las restricciones oficiales. Un vehículo con tracción total o equipado para nieve sigue sujeto a los cierres y a las instrucciones de los agentes. Si se prohíbe el acceso a tu vehículo, elige otra ruta permitida o aplaza el desplazamiento. <a href="${RGC}#a37" target="_blank" rel="noopener">RGC, art. 37</a></p>`,
  tip:'Busca dónde cambiarán las condiciones: salida del túnel, fin del resguardo, puente o zona de sombra.',
  errs:['Esperar al golpe de viento para prepararse.','Pensar que la tracción total permite circular por una carretera cerrada.'],
  ref:'RGC, arts. 17, 37, 45, 46 y 54. DGT, conducción con viento, nieve y hielo',source:'#a37'},
 {id:'T12L6',t:'Conducir de noche y evitar deslumbramientos',min:5,
  key:'Adapta la velocidad al tramo visible y evita deslumbrar a los demás.',
  body:`<p>De noche puedes detectar más tarde a una persona, un animal o un obstáculo. Ajusta la marcha al espacio que realmente iluminan tus faros y conserva margen. Circular por una vía conocida tampoco garantiza que esté libre. <a href="${RGC}#a45" target="_blank" rel="noopener">RGC, art. 45</a></p>
  <p>Las luces de carretera deben cambiarse por las de cruce tan pronto como exista posibilidad de deslumbrar, también a través de los retrovisores de quien va delante. Haz el cambio aunque el otro conductor no lo haga. <a href="${RGC}#a102" target="_blank" rel="noopener">RGC, art. 102.1 y 102.2</a></p>
  <p>Si te deslumbran, evita fijar la vista en los faros y reduce lo necesario, <b>incluso hasta detenerte</b>, para no alcanzar a vehículos o peatones. Mantén el control y guíate por la zona de la vía que puedas distinguir.</p>
  <p>Antes de salir, revisa que las luces funcionan y limpia las lunas y las ópticas. La suciedad favorece reflejos molestos. Si aparece fatiga ocular o sueño, busca un lugar seguro para parar y descansar. <a href="${SAFETY_SOURCES.night}" target="_blank" rel="noopener">Conducción nocturna, DGT</a></p>`,
  tip:'El límite de velocidad es un máximo; la visibilidad puede exigir circular más despacio.',
  errs:['Mantener las largas porque el conductor de enfrente también las lleva.','Conservar la velocidad al deslumbrarse esperando recuperar la visión.'],
  ref:'RGC, arts. 45, 46.1.j y 102. DGT, consejos para conducir de noche',source:'#a102'}
];

const SAFETY_QUESTIONS=[
 {id:'q272',l:'T12L1',q:'Para anticiparte a una retención, ¿cómo debes repartir la observación?',o:['Mirando también más allá del vehículo precedente y consultando brevemente los espejos','Fijando la vista solo en las luces de freno del vehículo precedente','Mirando los espejos únicamente cuando vayas a cambiar de carril'],c:0,e:'Observar más lejos y conocer el tráfico que te rodea permite detectar antes los cambios y adaptar la marcha.',r:'DGT, conducción preventiva. RGC, arts. 17 y 18'},
 {id:'q273',l:'T12L1',q:'Tienes prioridad en un cruce, pero ves que otro vehículo no va a ceder y puede chocar contigo. ¿Qué haces?',o:['Mantengo la marcha para hacer valer mi prioridad','Reduzco o me detengo si hace falta para evitar el siniestro','Uso el claxon y sigo porque la responsabilidad sería del otro'],c:1,e:'Tener prioridad no elimina la obligación de conducir con precaución y evitar daños. Actúa para resolver el peligro.',r:'RGC, arts. 3 y 17'},
 {id:'q274',l:'T12L1',q:'No ves ningún vehículo en el retrovisor y vas a desplazarte al carril contiguo. ¿Qué debes tener en cuenta?',o:['Que el espejo garantiza que todo el lateral está libre','Que basta con mantener el intermitente unos segundos','Que puede haber alguien en el ángulo muerto y debes comprobarlo antes de maniobrar'],c:2,e:'Los espejos dejan zonas ocultas. Comprueba el lateral con una mirada breve cuando sea seguro, manteniendo el control del vehículo.',r:'DGT, conducción preventiva. RGC, arts. 17, 18 y 74.2'},
 {id:'q275',l:'T12L1',q:'Un vehículo grande te impide ver lo que ocurre más adelante. ¿Qué favorece una conducción preventiva?',o:['Dejar más separación para mejorar el campo de visión y el margen','Acercarme para ver por debajo del vehículo','Confiar en que el conductor de delante advertirá todos los peligros'],c:0,e:'Una separación suficiente ayuda a observar y deja espacio para reaccionar si aparece una incidencia.',r:'DGT, conducción preventiva. RGC, arts. 18 y 54'},
 {id:'q276',l:'T12L1',q:'Sin peligro inminente, necesitas reducir mucho la velocidad. ¿Cómo debes hacerlo?',o:['Freno bruscamente para que se enciendan antes las luces de freno','Compruebo que sea seguro para quienes me siguen, aviso y reduzco progresivamente','Mantengo la velocidad hasta el último momento y freno entonces'],c:1,e:'Salvo peligro inminente, la reducción considerable exige comprobar el riesgo posterior, advertirla y evitar la brusquedad.',r:'RGC, art. 53.1'},
 {id:'q277',l:'T12L2',q:'Sale una pelota entre dos coches estacionados junto a un parque. Aún no ves a ningún niño. ¿Qué haces?',o:['Mantengo la velocidad hasta ver a alguien en la calzada','Paso por el centro de mi carril sin cambiar la velocidad','Modero la marcha y me preparo para detenerme si aparece alguien'],c:2,e:'La pelota permite prever que podría aparecer un niño. La precaución debe empezar antes de que entre en la calzada.',r:'RGC, arts. 17.1 y 46.1.a'},
 {id:'q278',l:'T12L2',q:'Tu semáforo se pone verde y una persona mayor sigue cruzando delante de ti. ¿Cómo actúas?',o:['Espero lo necesario para dejarla terminar sin ponerla en peligro','Avanzo despacio para que acelere el paso','Paso en cuanto tenga verde porque ya terminó su turno'],c:0,e:'La señal que permite avanzar no autoriza a poner en peligro a una persona que aún cruza tu trayectoria.',r:'RGC, arts. 3, 17.1 y 46.1.a'},
 {id:'q279',l:'T12L2',q:'Giras para entrar en una calle y hay peatones cruzándola, pero no existe paso señalizado. ¿Quién debe esperar?',o:['Los peatones, porque no hay marcas de paso','Yo, para dejar pasar a los peatones','Quien llegue más tarde al punto donde se cruzan las trayectorias'],c:1,e:'Al girar para entrar en otra vía, debes ceder a los peatones que la cruzan aunque no exista paso para ellos.',r:'RGC, art. 65.1.b'},
 {id:'q280',l:'T12L2',q:'Un autobús está en una parada señalizada. Sus viajeros bajan y cruzan el espacio entre el autobús y el refugio peatonal más próximo. ¿Qué debes hacer?',o:['Pasar si todavía queda anchura para el coche','Avisar con el claxon para que esperen entre el autobús y el refugio','Dejarlos pasar, deteniéndome si es necesario'],c:2,e:'En ese espacio, los viajeros que suben o bajan del transporte colectivo tienen prioridad sobre los vehículos.',r:'RGC, arts. 46.1.e y 65.1.d'},
 {id:'q281',l:'T12L2',q:'Sales de un garaje por una entrada habilitada que cruza la acera. Hay peatones caminando por ella. ¿Cómo actúas?',o:['Los dejo pasar antes de cruzar la acera','Salgo porque el vado me da prioridad','Avanzo hasta la calzada y espero allí aunque corte su paso'],c:0,e:'Al cruzar una zona peatonal por un acceso habilitado debes dejar pasar a quienes circulan por ella.',r:'RGC, art. 65.2'},
 {id:'q282',l:'T12L3',q:'En una vía urbana, conduces un turismo detrás de un ciclista en el mismo carril. ¿Qué mínimo longitudinal específico debes respetar, ampliándolo si las condiciones lo exigen?',o:['1,5 metros','Cinco metros','Dos metros'],c:1,e:'La norma urbana exige al menos cinco metros detrás del ciclista en el mismo carril. Puede hacer falta más para detenerte sin alcanzarlo. Los 1,5 metros son un margen lateral en determinados adelantamientos.',r:'RGC, art. 153.4 (vigente desde el 1 de octubre de 2026) y art. 54.1'},
 {id:'q283',l:'T12L3',q:'Has estacionado junto al borde de la vía y vas a abrir una puerta hacia la calzada. ¿Qué debes comprobar?',o:['Solo que no venga un vehículo por el carril contrario','Solo si la puerta cabe dentro de la marca de estacionamiento','Que abrirla no ponga en peligro ni entorpezca a otros, incluidos ciclistas y motoristas'],c:2,e:'Antes de abrir o salir debes comprobar que no creas peligro ni entorpeces a ningún usuario.',r:'RGC, art. 114.1'},
 {id:'q284',l:'T12L3',q:'Vas a girar a la derecha para entrar en otra vía. Un ciclista próximo continúa recto y tu giro cortaría su trayectoria. ¿Qué haces?',o:['Cedo y compruebo que el giro queda libre antes de realizarlo','Giro porque ya he anunciado la maniobra','Me coloco a su altura para que pueda verme y giro a la vez'],c:0,e:'Al girar para entrar en otra vía debes respetar la prioridad del ciclista próximo cuya trayectoria vas a cruzar.',r:'RGC, art. 64.2.b'},
 {id:'q285',l:'T12L3',q:'Para adelantar a una bicicleta tendrías que entorpecer a una moto que viene de frente. ¿Basta con reducir la velocidad y dejar margen lateral a la bicicleta?',o:['Sí, si dejo al menos 1,5 metros a la bicicleta','No, debo esperar hasta poder adelantar sin afectar al tráfico contrario','Sí, si la moto puede ceñirse más a su derecha'],c:1,e:'Respetar el margen y reducir la velocidad no permite poner en peligro o entorpecer a quien viene de frente.',r:'RGC, art. 85.4'},
 {id:'q286',l:'T12L3',q:'Una persona adulta conduce un patinete eléctrico por una acera sin vía ciclista. ¿Está permitido si va despacio y lleva casco?',o:['Sí, si circula a paso de peatón','Sí, siempre que no haya peatones en ese momento','No, está prohibido circular con un VMP por la acera'],c:2,e:'La acera es un espacio reservado a los peatones. Ir despacio o llevar casco no autoriza a circular por ella con un VMP.',r:'RGC, art. 152.1, vigente desde el 1 de octubre de 2026'},
 {id:'q287',l:'T12L4',q:'Empiezan a caer las primeras gotas tras varios días secos. ¿Por qué debes extremar la precaución?',o:['El agua puede mezclarse con polvo y grasa y formar una capa deslizante','La calzada recupera de inmediato el mismo agarre que en seco','El riesgo de deslizamiento aparece únicamente cuando hay charcos profundos'],c:0,e:'Las primeras gotas pueden crear una mezcla deslizante con la suciedad acumulada en el firme.',r:'DGT, Manual del permiso B en lectura fácil, conducción con lluvia. RGC, art. 46.1.g'},
 {id:'q288',l:'T12L4',q:'¿Qué ocurre durante el aquaplaning?',o:['El motor pierde potencia al entrar agua por la refrigeración','Una capa de agua hace perder contacto efectivo al neumático con la calzada','Los frenos se bloquean siempre por la humedad del aire'],c:1,e:'Si el neumático no evacúa el agua suficiente, puede perder el contacto y el agarre sobre el firme.',r:'DGT, conducción bajo la lluvia, aquaplaning'},
 {id:'q289',l:'T12L4',q:'Al atravesar una zona encharcada, el turismo sufre aquaplaning. ¿Qué actuación recomienda la DGT?',o:['Frenar a fondo y girar de inmediato para buscar asfalto seco','Acelerar para salir cuanto antes del agua','Sujetar el volante, levantar suavemente el acelerador y evitar maniobras bruscas'],c:2,e:'Evita frenazos y giros bruscos. Al recuperar el agarre, corrige con suavidad la trayectoria.',r:'DGT, conducción bajo la lluvia y Manual del permiso B en lectura fácil'},
 {id:'q290',l:'T12L4',q:'Con niebla, las luces del coche que te precede se van alejando. ¿Cómo decides tu velocidad?',o:['Por mi visibilidad y las condiciones, conservando separación','Acercándome hasta ver sus luces de freno con claridad','Igualando siempre su velocidad porque ya está comprobando la vía'],c:0,e:'No conviertas al otro vehículo en una guía que te obligue a acercarte o circular más deprisa de lo que puedes ver.',r:'RGC, arts. 45 y 54. DGT, recomendaciones con niebla'},
 {id:'q291',l:'T12L4',q:'Pasas junto a peatones y una zona de agua puede salpicarlos. Aunque no superes el límite, ¿qué exige la norma?',o:['Mantener la velocidad si continúo dentro del carril','Moderar la velocidad y detenerme si las circunstancias lo exigen','Reducir solo si el agua llega a cubrir todo el carril'],c:1,e:'Debes moderar la velocidad cuando puedas proyectar agua, gravilla u otras materias a los demás usuarios.',r:'RGC, art. 46.1.g'},
 {id:'q292',l:'T12L5',q:'Hay viento lateral fuerte y vas a salir de un túnel. ¿Qué peligro debes prever?',o:['Que el viento desaparecerá al entrar en la zona abierta','Que el túnel mantiene protegido el coche unos metros después de salir','Que al perder el resguardo una ráfaga puede desplazar el vehículo'],c:2,e:'El cambio entre una zona protegida y otra expuesta puede producir un empuje lateral repentino, asociado al efecto pantalla.',r:'DGT, viento y efecto pantalla. RGC, arts. 17 y 45'},
 {id:'q293',l:'T12L5',q:'¿Cómo conviene manejar el volante cuando hay rachas de viento lateral?',o:['Sujetándolo con firmeza y corrigiendo la trayectoria con suavidad','Con una sola mano para poder dejarlo girar con el viento','Dando un giro fuerte cada vez que se note una ráfaga'],c:0,e:'Mantener el control con firmeza y evitar correcciones bruscas reduce el riesgo de bandazos.',r:'DGT, conducción con viento. RGC, art. 17'},
 {id:'q294',l:'T12L5',q:'Hace mucho frío y te acercas a un puente en una zona de sombra. ¿Qué debes prever aunque otros tramos estén despejados?',o:['Que el puente conserva siempre más adherencia por estar elevado','Que puede haber una placa de hielo y conviene adaptar la marcha antes','Que el hielo solo puede aparecer mientras nieva'],c:1,e:'Las zonas de sombra y los puentes son lugares donde puede formarse hielo aunque el resto del recorrido parezca despejado.',r:'DGT, recomendaciones ante nieve y hielo, 3 de febrero de 2026. RGC, art. 45'},
 {id:'q295',l:'T12L5',q:'Circulas sobre nieve con poco agarre. ¿Qué forma de conducir ayuda a conservar el control?',o:['Acelerar con fuerza para que las ruedas limpien la nieve','Alternar frenazos y aceleraciones para comprobar la adherencia','Actuar suavemente sobre acelerador, frenos y dirección, dejando más separación'],c:2,e:'Las maniobras bruscas pueden hacer perder el escaso agarre disponible. Aumenta también el margen con quien va delante.',r:'DGT, hielo y nieve: con la adherencia al límite. RGC, arts. 17 y 54'},
 {id:'q296',l:'T12L5',q:'Un agente indica que la carretera está cerrada a tu vehículo por nieve. Tu turismo tiene tracción total. ¿Puedes continuar?',o:['No, debo respetar el cierre aunque lleve tracción total','Sí, si tengo experiencia circulando con nieve','Sí, si avanzo despacio y llevo cadenas en el maletero'],c:0,e:'El equipamiento no permite ignorar un cierre ordenado por la autoridad. Busca otra ruta permitida o aplaza el viaje.',r:'RGC, arts. 37 y 133 y anexo I, apartado 1'},
 {id:'q297',l:'T12L6',q:'De noche, la zona que iluminan tus faros es más corta que el espacio que necesitarías para detenerte a tu velocidad. ¿Qué haces?',o:['Mantengo la marcha si conozco bien la carretera','Reduzco hasta poder detenerme dentro del tramo visible','Me acerco al vehículo precedente para aprovechar su alumbrado'],c:1,e:'La velocidad debe permitir detenerte dentro de lo que ves. Conocer la carretera no asegura que esté libre de obstáculos.',r:'RGC, art. 45'},
 {id:'q298',l:'T12L6',q:'Un vehículo se acerca de frente con las largas y no las cambia. ¿Debes cambiar tú a las de cruce si puedes deslumbrarlo?',o:['No, puedo mantener las largas hasta que él las cambie','Solo si el otro conductor me avisa con una ráfaga','Sí, debo evitar deslumbrarlo aunque él no lo haga'],c:2,e:'La obligación de sustituir las largas existe aunque el conductor de enfrente incumpla la misma regla.',r:'RGC, art. 102.1'},
 {id:'q299',l:'T12L6',q:'Te deslumbran y no distingues bien la vía. ¿Cómo debes adaptar la velocidad?',o:['Reduciéndola lo necesario, incluso hasta detenerme, para evitar un alcance','Manteniéndola hasta recuperar la visión para no molestar detrás','Aumentándola para salir antes del haz de luz'],c:0,e:'El Reglamento exige reducir lo necesario, incluso hasta la detención total, para evitar alcanzar a vehículos o peatones.',r:'RGC, arts. 46.1.j y 102.3'},
 {id:'q300',l:'T12L6',q:'Sigues a otro vehículo por la noche y tus largas se reflejan en sus retrovisores. ¿Qué corresponde?',o:['Mantenerlas porque solo hay que evitar deslumbrar a quien viene de frente','Cambiar a las de cruce tan pronto exista posibilidad de deslumbrar','Avisar con ráfagas para que el otro ajuste sus espejos'],c:1,e:'La protección frente al deslumbramiento también se aplica a quienes circulan en el mismo sentido y lo reciben por los retrovisores.',r:'RGC, art. 102.2'},
 {id:'q301',l:'T12L6',q:'Antes de un viaje nocturno, ¿por qué conviene limpiar las lunas y las ópticas?',o:['Porque así puede usarse siempre la luz de carretera','Porque evita tener que adaptar la velocidad al anochecer','Porque la suciedad reduce la visibilidad y favorece reflejos molestos'],c:2,e:'Las superficies limpias ayudan a ver mejor y reducen reflejos. Sigue siendo necesario adaptar la marcha y usar bien el alumbrado.',r:'DGT, consejos para conducir de noche'}
];

const COMPLETION_TOPICS={
 '1':{desc:'Conoce tus obligaciones, qué permite cada permiso y cómo preparar al conductor y al vehículo antes de salir.',sims:[],lessons:[
 {id:'T1L1',t:'Conducir con responsabilidad',min:4,key:'Conducir exige atender, controlar el vehículo y proteger a quienes comparten la vía.',
 body:`<p>Todos los usuarios deben evitar peligros y molestias innecesarias. Como conductor, mantén el control, la libertad de movimientos, el campo de visión y la atención. Coloca los objetos y acomoda a los ocupantes para que nada te impida manejar.</p><p>Comprueba tu estado antes de salir. El sueño, el alcohol, las drogas o algunos tratamientos pueden impedir conducir con seguridad. Una autorización en vigor no garantiza que hoy estés en condiciones. Si no lo estás, organiza otro transporte.</p>`,tip:'Revisa tres cosas: tu estado, el vehículo y el entorno.',errs:['Confiar en la experiencia para compensar una distracción.','Empezar un viaje con objetos que interfieren con los mandos.'],ref:'RGC, arts. 2, 3, 17 y 18',source:'#a18'},
 {id:'T1L2',t:'Qué autorizan los permisos B y A2',min:5,key:'La categoría del permiso y las características del vehículo deben ser compatibles.',
 body:`<p>El <b>B</b>, desde los 18 años, permite como regla general automóviles de hasta 3.500 kg de MMA y hasta ocho pasajeros además del conductor. Puede llevar remolque de hasta 750 kg. Con remolque de más de 750 kg, el B ordinario permite un conjunto de hasta 3.500 kg; entre 3.500 y 4.250 kg se necesita la habilitación adicional correspondiente, código 96.</p><p>El <b>A2</b>, desde los 18 años, permite motos de hasta 35 kW y 0,2 kW/kg, no derivadas de una con más del doble de su potencia. Tener el B no autoriza por sí solo a conducir cualquier moto A2.</p>`,tip:'Usa las masas máximas autorizadas de la documentación, no el peso que crees que llevan hoy.',errs:['Suponer que todos los remolques requieren el B+E.','Identificar el A2 solo por la cilindrada.'],ref:'Reglamento General de Conductores, arts. 4 y 5 y anexo I, código 96',source:COURSE_SOURCES.drivers+'#a4'},
 {id:'T1L3',t:'Documentación y seguro',min:4,key:'Tu permiso y la documentación del vehículo deben estar vigentes y disponibles.',
 body:`<p>Lleva tu permiso de conducción, el permiso de circulación y la tarjeta ITV, en los formatos admitidos. Comprueba la vigencia y las restricciones que correspondan. En España, miDGT permite acreditar digitalmente los documentos que ofrece con validez a efectos de tráfico; una simple foto no equivale a ese documento verificable.</p><p>El vehículo debe tener seguro obligatorio en vigor. No es obligatorio llevar el recibo del seguro. Antes de viajar al extranjero, comprueba la documentación física y los requisitos del destino.</p>`,tip:'Permiso personal, permiso del vehículo e ITV cumplen funciones distintas.',errs:['Confundir tener cita de ITV con tener la inspección vigente.','Creer que no llevar el recibo permite circular sin seguro.'],ref:'DGT, documentación obligatoria. Reglamentos de Conductores y de Vehículos',source:COURSE_SOURCES.documents},
 {id:'T1L4',t:'El primer año y las restricciones personales',min:4,key:'Respeta las condiciones de tu permiso y distingue la señal L de las tasas de alcohol de los dos primeros años.',
 body:`<p>Si acabas de obtener tu primer permiso, usa la <b>V-13, la L</b>, durante el primer año. En un turismo se coloca visible en la parte posterior izquierda; en una moto, visible en la parte posterior. No debes dejarla puesta cuando conduce alguien que no deba usarla.</p><p>La L no impone hoy un límite general especial de 80 km/h. Aplica los límites de la vía, del vehículo y de tu autorización. La tasa reducida de alcohol para noveles dura dos años. Si tu permiso exige corrección visual, utiliza la que corresponda al conducir.</p>`,tip:'Un año para la L y dos para la tasa reducida del conductor novel.',errs:['Conservar el antiguo límite general de 80 km/h.','Conducir sin las gafas o lentes exigidas en el permiso.'],ref:'RGV, anexo XI, V-13. RGC, arts. 20 y 48. Reglamento de Conductores, anexo I',source:COURSE_SOURCES.vehicles},
 {id:'T1L5',t:'Ocupantes, animales y objetos',min:4,key:'Todo lo que llevas debe permitir manejar y permanecer sujeto sin crear peligro.',
 body:`<p>Respeta las plazas autorizadas y utiliza cinturones, SRI y cascos cuando correspondan. El conductor debe cuidar la colocación de personas, animales y objetos para conservar la visión, los movimientos y la atención.</p><p>Coloca equipaje pesado abajo y sujeto. Un objeto suelto puede desplazarse al frenar. Para transportar un animal, utiliza una solución adecuada que impida interferencias y desplazamientos peligrosos, siguiendo las instrucciones de sus dispositivos de sujeción. Llevarlo en brazos del conductor compromete el control.</p>`,tip:'Comprueba la sujeción antes de arrancar, incluso para un trayecto corto.',errs:['Llevar objetos sueltos sobre la bandeja posterior.','Permitir que un animal alcance los pedales.'],ref:'RGC, arts. 9, 10, 14, 18 y 117',source:'#a18'},
 {id:'T1L6',t:'Preparar el viaje y decidir cuándo parar',min:4,key:'Planifica con margen y adapta el plan a lo que encuentres durante el recorrido.',
 body:`<p>Antes de salir, prepara la ruta, consulta incidencias y meteorología y revisa neumáticos, luces y líquidos. Programa descansos y deja listos navegador y mandos. Comprueba también la autonomía.</p><p>Durante el viaje, adapta la velocidad a la visibilidad y la adherencia. El horario previsto no justifica correr ni seguir con sueño. Ante cansancio o una incidencia, busca un lugar permitido y seguro para detenerte; no improvises una parada en un punto que genere otro peligro.</p>`,tip:'La hora de llegada puede cambiar; la necesidad de conducir con seguridad permanece.',errs:['Manipular el navegador para recuperar una salida perdida.','Posponer el descanso por estar cerca del destino.'],ref:'RGC, arts. 3, 18 y 45. DGT, planificación y conducción preventiva',source:'#a45'}
 ],questions:[
 {id:'q302',l:'T1L1',q:'Una bolsa limita el movimiento de tus pies junto a los pedales. ¿Qué haces antes de salir?',o:['La retiro de esa zona y la sujeto adecuadamente','La aparto con el pie mientras circulo','La dejo si no impide acelerar'],c:0,e:'Debes conservar la libertad de movimientos y el control de todos los mandos.',r:'RGC, arts. 17 y 18'},
 {id:'q303',l:'T1L1',q:'Tienes el permiso en vigor, pero estás demasiado somnoliento para atender. ¿Puedes iniciar el viaje con seguridad?',o:['Sí, por una vía conocida','No; debo descansar u organizar otro transporte','Sí, si no supero la velocidad mínima'],c:1,e:'La autorización no sustituye las condiciones necesarias para controlar y atender la conducción.',r:'RGC, arts. 3, 17 y 18'},
 {id:'q304',l:'T1L1',q:'¿A quién debe proteger la conducta prudente de quien conduce?',o:['Solo a sus pasajeros','Solo a quienes tienen prioridad','A sí mismo, los ocupantes y los demás usuarios'],c:2,e:'La precaución debe evitar daños propios y ajenos, también a otros usuarios de la vía.',r:'RGC, art. 3.1'},
 {id:'q305',l:'T1L1',q:'Una carga tapa parte del parabrisas. ¿Es suficiente circular más despacio?',o:['No; debo recolocarla para disponer de visión adecuada','Sí, si voy por ciudad','Sí, si puedo ver por una esquina'],c:0,e:'La disposición de objetos debe permitir el campo de visión necesario y el manejo seguro.',r:'RGC, arts. 14 y 18'},
 {id:'q306',l:'T1L1',q:'Llevas años conduciendo por la misma calle. ¿Cómo influye eso en tu obligación de atender?',o:['Permite prestar atención solo en los cruces','Debo seguir atento porque pueden aparecer riesgos nuevos','Permite manipular el móvil en los tramos rectos'],c:1,e:'Conocer el recorrido no elimina la obligación de atención permanente.',r:'RGC, art. 18.1'},
 {id:'q307',l:'T1L2',q:'Como regla general, ¿cuántos pasajeros además del conductor admite un automóvil autorizado por el permiso B?',o:['Nueve','Diez','Hasta ocho'],c:2,e:'El máximo general es de ocho pasajeros además de quien conduce, respetando las plazas del vehículo.',r:'Reglamento General de Conductores, art. 4.2.e'},
 {id:'q308',l:'T1L2',q:'Un turismo de 2.500 kg de MMA arrastra un remolque de 700 kg de MMA. ¿Basta el B ordinario, si el conjunto está técnicamente autorizado?',o:['Sí','No, exige siempre B+E','Solo si el remolque va vacío'],c:0,e:'El B permite un remolque de hasta 750 kg junto a un vehículo que autoriza esa categoría.',r:'Reglamento General de Conductores, art. 4.2.e'},
 {id:'q309',l:'T1L2',q:'Turismo y remolque de más de 750 kg suman 4.000 kg de MMA. ¿Qué necesitas, además de compatibilidad técnica?',o:['El B ordinario sin ninguna habilitación adicional','La habilitación correspondiente, como B con código 96','Solo llevar menos equipaje'],c:1,e:'Con remolque de más de 750 kg, superar 3.500 kg sin pasar de 4.250 kg requiere habilitación adicional.',r:'Reglamento General de Conductores, arts. 4 y 5 y anexo I'},
 {id:'q310',l:'T1L2',q:'¿Cuál es la potencia máxima de una motocicleta autorizada por A2, cumpliendo además las otras condiciones?',o:['11 kW','50 kW','35 kW'],c:2,e:'El A2 exige hasta 35 kW, hasta 0,2 kW/kg y la limitación relativa al vehículo de origen.',r:'Reglamento General de Conductores, art. 4.2.c'},
 {id:'q311',l:'T1L2',q:'¿Qué dato usas para comprobar los límites del permiso al arrastrar un remolque?',o:['Las MMA de los vehículos y del conjunto según corresponda','Solo el peso del equipaje del día','Solo la longitud del remolque'],c:0,e:'Los límites de autorización se comparan con las masas máximas autorizadas, además de las condiciones técnicas.',r:'Reglamento General de Conductores, art. 4'},
 {id:'q312',l:'T1L3',q:'¿Tener una cita para mañana permite circular hoy con la ITV caducada?',o:['Sí, para cualquier desplazamiento corto','No; la cita no prorroga su vigencia','Sí, llevando la confirmación impresa'],c:1,e:'Debes mantener la inspección vigente; pedir cita no amplía el plazo.',r:'RD 920/2017, arts. 4 y 6'},
 {id:'q313',l:'T1L3',q:'¿Qué documento acredita la autorización personal para conducir la categoría correspondiente?',o:['La tarjeta ITV','El permiso de circulación','El permiso de conducción'],c:2,e:'La autorización personal es distinta de la documentación que identifica y acredita las condiciones del vehículo.',r:'Reglamento General de Conductores, arts. 1 y 3'},
 {id:'q314',l:'T1L3',q:'¿Puedes circular sin seguro obligatorio porque no es necesario llevar su recibo?',o:['No, el seguro debe estar en vigor','Sí, si solo circulo por ciudad','Sí, si la ITV es favorable'],c:0,e:'No tener que portar el recibo no elimina la obligación de asegurar el vehículo.',r:'DGT, documentación y seguro obligatorio'},
 {id:'q315',l:'T1L3',q:'En España, ¿qué valor tiene el permiso disponible y verificable en miDGT?',o:['Solo sirve para recordar su fecha','Tiene validez a efectos de tráfico como el documento físico','Solo vale si se acompaña de una fotografía'],c:1,e:'La documentación ofrecida por miDGT tiene validez en España. Una foto aislada no equivale a ella.',r:'DGT, documentación obligatoria y aplicación miDGT'},
 {id:'q316',l:'T1L3',q:'Antes de conducir en otro país, ¿qué debes hacer con la documentación?',o:['Suponer que miDGT basta en cualquier lugar','Llevar solo una foto de la tarjeta ITV','Comprobar los documentos físicos y requisitos exigidos en el destino'],c:2,e:'La validez española de la documentación digital no sustituye la comprobación de requisitos internacionales.',r:'DGT, documentación del vehículo y miDGT'},
 {id:'q317',l:'T1L4',q:'Acabas de obtener tu primer permiso B. ¿Durante cuánto tiempo debes llevar la L, en el supuesto ordinario?',o:['Durante el primer año','Durante los dos primeros años','Hasta pasar la primera ITV'],c:0,e:'La V-13 señala la condición de conductor novel durante el primer año.',r:'RGV, anexo XI, señal V-13'},
 {id:'q318',l:'T1L4',q:'¿Dónde se coloca normalmente la L en un turismo?',o:['En el centro del parabrisas','Visible en la parte posterior izquierda','En cualquier ventana lateral'],c:1,e:'La señal debe ser visible en la parte posterior izquierda del turismo.',r:'RGV, anexo XI, señal V-13'},
 {id:'q319',l:'T1L4',q:'¿Existe hoy un límite general de 80 km/h para todo conductor que lleva la L?',o:['Sí, en cualquier vía','Sí, solo en autopista','No; se aplican los límites que correspondan a vía, vehículo y conductor'],c:2,e:'El antiguo límite general especial de 80 km/h para noveles dejó de aplicarse.',r:'RGC, arts. 48 y 52. RGV, anexo XI, V-13'},
 {id:'q320',l:'T1L4',q:'Tu permiso exige corrección visual. ¿Cómo debes conducir?',o:['Con la corrección indicada en tu autorización','Sin ella si el trayecto es corto','Solo con ella al conducir de noche'],c:0,e:'Las adaptaciones y restricciones de la autorización deben respetarse en cada conducción.',r:'Reglamento General de Conductores, art. 3 y anexo I'},
 {id:'q321',l:'T1L4',q:'Tras el primer año de tu primer permiso, dejas de usar la L. ¿Ha terminado también el periodo de tasa reducida de alcohol?',o:['Sí, ambos periodos duran un año','No; la tasa reducida del novel se aplica durante dos años','Sí, si ya he conducido por autopista'],c:1,e:'La duración de la señal L y la del régimen de alcohol para noveles son distintas.',r:'RGC, art. 20. RGV, anexo XI, V-13'},
 {id:'q322',l:'T1L5',q:'Llevas una mascota que puede acceder a los pedales. ¿Qué debes hacer?',o:['Mantenerla sobre tus rodillas','Pedir que se quede quieta','Acomodarla con un sistema adecuado que impida interferencias'],c:2,e:'El conductor debe mantener su libertad de movimientos y evitar que un animal interfiera en el manejo.',r:'RGC, art. 18.1'},
 {id:'q323',l:'T1L5',q:'¿Cómo conviene colocar una maleta pesada en el vehículo?',o:['En una zona adecuada, baja y bien sujeta','Suelta sobre la bandeja posterior','Sobre un asiento sin ninguna sujeción'],c:0,e:'La carga debe evitar desplazamientos peligrosos y no comprometer la estabilidad o la visión.',r:'RGC, arts. 14 y 18'},
 {id:'q324',l:'T1L5',q:'El turismo tiene cinco plazas autorizadas, incluida la del conductor. ¿Puedes llevar cinco pasajeros?',o:['Sí, si uno es menor','No, superarías las plazas autorizadas','Sí, si comparten un cinturón'],c:1,e:'Las plazas incluyen al conductor y no pueden superarse.',r:'RGC, art. 9.1'},
 {id:'q325',l:'T1L5',q:'¿Un recorrido de dos calles permite dejar a un ocupante sin el sistema de retención exigido?',o:['Sí, a menos de 30 km/h','Sí, si va detrás','No, la brevedad del trayecto no elimina la obligación'],c:2,e:'La distancia del desplazamiento no es una excepción general al uso de los sistemas exigidos.',r:'RGC, art. 117'},
 {id:'q326',l:'T1L5',q:'Un bulto reduce tu visión por una zona necesaria para conducir. ¿Qué corresponde?',o:['Recolocarlo o retirar el exceso antes de iniciar la marcha','Compensarlo usando solo el espejo interior','Mantenerlo si las luces funcionan'],c:0,e:'La colocación de objetos debe conservar el campo de visión y el control.',r:'RGC, art. 18.1'},
 {id:'q327',l:'T1L6',q:'Has perdido una salida y el navegador propone cambiar la ruta. ¿Qué haces si necesitas manipularlo?',o:['Lo manejo sin dejar de mirar la pantalla','Estaciono en un lugar permitido y seguro para prepararlo','Me detengo en el carril de circulación'],c:1,e:'La preparación del dispositivo debe hacerse sin distraerte ni crear un peligro con la parada.',r:'RGC, arts. 18 y 90'},
 {id:'q328',l:'T1L6',q:'La previsión anuncia mal tiempo en tu recorrido. ¿Qué ayuda a preparar el viaje?',o:['Calcular la llegada manteniendo siempre el máximo permitido','Confiar solo en el tiempo que hace al salir','Consultar incidencias y meteorología y prever alternativas y margen'],c:2,e:'La planificación permite adaptar el desplazamiento a las condiciones esperables.',r:'RGC, art. 45. DGT, planificación de viajes'},
 {id:'q329',l:'T1L6',q:'Te quedan pocos kilómetros, pero aparece sueño. ¿Qué haces?',o:['Busco un lugar seguro para detenerme y descansar','Sigo porque estoy cerca','Aumento la velocidad para llegar antes'],c:0,e:'La proximidad del destino no compensa la pérdida de atención y control por somnolencia.',r:'RGC, arts. 3 y 17. DGT, conducir con sueño'},
 {id:'q330',l:'T1L6',q:'¿Cuándo conviene revisar presión y estado de neumáticos para un viaje largo?',o:['Solo si se enciende un aviso','Antes de salir, según las indicaciones del fabricante','Únicamente después de la primera parada'],c:1,e:'La revisión previa permite detectar problemas antes de iniciar el recorrido.',r:'DGT, revisión de neumáticos antes de viajar'},
 {id:'q331',l:'T1L6',q:'Un retraso pone en peligro tu hora prevista de llegada. ¿Qué decisión es correcta?',o:['Superar un poco el límite en los tramos despejados','Suprimir todos los descansos previstos','Reajustar el horario manteniendo una conducción segura'],c:2,e:'Llegar a una hora prevista no justifica incumplir las normas o continuar sin condiciones.',r:'RGC, arts. 3, 17 y 45'}
 ]},
 '2':{desc:'Reconoce las partes de la vía, elige correctamente el carril y actúa ante carriles especiales, obras y pasos a nivel.',sims:[],lessons:[
 {id:'T2L1',t:'Calzada, carril, arcén y acera',min:4,key:'Cada parte de la vía tiene una función y unos usuarios autorizados.',
 body:`<p>La <b>calzada</b> es la parte destinada a la circulación de vehículos. Puede dividirse en carriles, bandas longitudinales con anchura suficiente para una fila de automóviles, estén o no marcadas. El <b>arcén</b> es la franja contigua a la calzada destinada a usos previstos por la norma, no un carril libre para adelantar.</p><p>La <b>acera</b> está reservada a peatones, con las excepciones expresamente previstas. Una mediana separa plataformas o calzadas; no es una zona para cambiar de sentido a voluntad.</p>`,tip:'Identifica dónde acaba tu espacio antes de pensar en una maniobra.',errs:['Contar el arcén como un carril ordinario.','Interpretar una mediana como acceso para dar media vuelta.'],ref:'Ley de Tráfico, anexo I. RGC, arts. 29, 36 y 152',source:'https://www.boe.es/buscar/act.php?id=BOE-A-2015-11722'},
 {id:'T2L2',t:'Vías urbanas, travesías y carreteras',min:4,key:'El tipo de vía determina normas que debes combinar con sus señales.',
 body:`<p>Una <b>vía urbana</b> está dentro de poblado, excepto las travesías. Una <b>travesía</b> es un tramo de carretera que discurre por poblado, con las precisiones de la definición legal. Las vías interurbanas están fuera de poblado.</p><p>Autopistas y autovías tienen calzadas separadas y accesos regulados; una carretera convencional no reúne sus características. No deduzcas el límite solo de la anchura o de ver dos carriles. Identifica la vía y aplica las señales, los límites y las reglas de tu vehículo.</p>`,tip:'Una carretera ancha puede seguir siendo convencional.',errs:['Tratar una travesía como cualquier calle urbana.','Suponer que dos carriles convierten una vía en autovía.'],ref:'Ley de Tráfico, anexo I. RGC, arts. 48 y 50',source:'https://www.boe.es/buscar/act.php?id=BOE-A-2015-11722'},
 {id:'T2L3',t:'Elegir el carril',min:4,key:'Fuera de poblado utiliza normalmente el carril derecho y cambia solo cuando corresponda y sea seguro.',
 body:`<p>En una calzada con varios carriles para tu sentido fuera de poblado, circula normalmente por el derecho. Puedes usar los demás cuando lo aconseje el tráfico o la vía, sin entorpecer a quien te siga. Tras adelantar, vuelve con seguridad cuando corresponda.</p><p>En poblado, con al menos dos carriles delimitados para tu sentido y fuera de autopista o autovía, un turismo puede usar el que mejor convenga a su destino, sin obstaculizar. Para cambiar de carril, observa, señaliza y respeta a quienes ya lo ocupan.</p>`,tip:'Elegir un carril no te da prioridad para entrar en él.',errs:['Circular siempre por el central fuera de poblado aunque el derecho esté libre.','Cambiar de carril confiando solo en el intermitente.'],ref:'RGC, arts. 31, 33 y 74.2',source:'#a31'},
 {id:'T2L4',t:'Carriles reversibles y temporales',min:5,key:'Comprueba las indicaciones que abren el carril y las condiciones especiales de circulación.',
 body:`<p>En un carril <b>reversible</b>, normalmente delimitado por dobles líneas discontinuas, los semáforos de carril indican cuándo puede utilizarse. Lleva al menos la luz de cruce encendida de día y de noche. Una cruz roja prohíbe ocuparlo.</p><p>Los carriles habilitados en sentido contrario al habitual por fluidez tienen restricciones de vehículos y, como regla, un intervalo de 60 a 80 km/h, salvo límites inferiores señalizados, además de cruce. Por obras pueden admitirse otros vehículos autorizados. Los carriles adicionales circunstanciales también exigen cruce y sus reglas específicas. Sigue las señales y el balizamiento.</p>`,tip:'Una flecha verde de carril permite usarlo, pero las demás señales siguen vigentes.',errs:['Entrar en un reversible por ver que está vacío aunque haya una cruz roja.','Olvidar la luz de cruce porque sea de día.'],ref:'RGC, arts. 40, 41, 42 y 143 y anexo I, apartado 4.3',source:'#a40'},
 {id:'T2L5',t:'Carriles reservados y zonas restringidas',min:4,key:'Accede a un carril reservado solo si las condiciones señalizadas autorizan tu vehículo.',
 body:`<p>Los carriles bus, para bicicletas o reservados a determinados usuarios tienen condiciones propias. Que no circule nadie por ellos no autoriza a usarlos. Un vehículo que pueda entrar en un bus-VAO debe cumplir también las condiciones particulares de esa vía.</p><p>La ocupación mínima, los horarios y los vehículos admitidos pueden variar según la regulación señalizada. Una moto no está autorizada automáticamente en cualquier carril bus. Comprueba los paneles y las restricciones de acceso, incluidas las de una zona de bajas emisiones.</p>`,tip:'Lee vehículo autorizado, horario y ocupación cuando proceda.',errs:['Entrar en un carril bus porque se circula más rápido.','Generalizar a todas las ciudades una autorización local para motos.'],ref:'RGC, arts. 35, 37 y 157. Ley de Tráfico, competencias de ordenación',source:'#a35'},
 {id:'T2L6',t:'Obras y pasos a nivel',min:5,key:'Anticipa una detención y no entres donde puedas quedarte bloqueado.',
 body:`<p>En obras, sigue las órdenes de los agentes o personal autorizado y el balizamiento aplicable. Reduce y deja margen para las incorporaciones o estrechamientos. La presencia de una obra no permite ignorar una prohibición de acceso.</p><p>Al acercarte a un paso a nivel, extrema la prudencia y modera la velocidad. Detente ante la señal que lo ordene, las luces de prohibición o las barreras cerradas o en movimiento. No entres si una cola puede dejarte sobre las vías. Si quedas inmovilizado, desaloja a las personas y avisa cuanto antes al servicio ferroviario o a emergencias, desde lugar seguro.</p>`,tip:'Antes de cruzar las vías, comprueba que puedes salir completamente.',errs:['Pasar bajo una barrera que ya empieza a bajar.','Entrar detrás de una cola sin espacio al otro lado.'],ref:'RGC, arts. 95, 96, 97, 139 y 142 y anexo I, apartado 1',source:'#a95'}
 ],questions:[
 {id:'q332',l:'T2L1',q:'¿Qué parte de la vía está destinada a la circulación de vehículos?',o:['La calzada','La acera','La mediana'],c:0,e:'La calzada es la parte destinada a la circulación de vehículos.',r:'Ley de Tráfico, anexo I'},
 {id:'q333',l:'T2L1',q:'El arcén está despejado y hay una cola de turismos. ¿Puedes usarlo como carril ordinario para adelantar?',o:['Sí, si no viene nadie detrás','No, estar libre no lo convierte en un carril autorizado','Sí, si llevo las luces de emergencia'],c:1,e:'El arcén solo puede utilizarse en los supuestos previstos por la norma.',r:'RGC, art. 36'},
 {id:'q334',l:'T2L1',q:'¿Un carril tiene que estar siempre pintado para existir?',o:['Sí, con dos líneas continuas','Sí, con al menos una línea discontinua','No; su definición no exige que esté delimitado por marcas'],c:2,e:'Puede haber carriles sin marcas si existe anchura para las filas de automóviles correspondientes.',r:'Ley de Tráfico, anexo I, definición de carril'},
 {id:'q335',l:'T2L1',q:'Una abertura de la mediana está reservada a servicios autorizados. ¿Puedes usarla para volver atrás si pierdes la salida?',o:['No, debo continuar hasta un lugar permitido','Sí, si no se aproxima nadie','Sí, señalizando con emergencia'],c:0,e:'Una abertura no concede acceso general ni permite una maniobra prohibida.',r:'RGC, arts. 29, 78 y 79'},
 {id:'q336',l:'T2L1',q:'¿Qué debes comprobar antes de considerar una franja junto a la calzada como carril utilizable?',o:['Solo que esté asfaltada','Su señalización, delimitación y los usos autorizados','Solo que quepa el coche'],c:1,e:'La anchura o el asfalto por sí solos no autorizan a ocupar una zona reservada o un arcén.',r:'RGC, arts. 29, 35 y 36'},
 {id:'q337',l:'T2L2',q:'Una carretera discurre por un poblado y el tramo reúne la definición de travesía. ¿Cómo se clasifica?',o:['Siempre como autovía','Como cualquier vía urbana sin distinción','Como travesía'],c:2,e:'La travesía es un tramo de carretera por poblado, según la definición y sus precisiones legales.',r:'Ley de Tráfico, anexo I'},
 {id:'q338',l:'T2L2',q:'Una carretera tiene dos carriles para tu sentido. ¿Eso basta para considerarla autovía?',o:['No, debe reunir las características legales de autovía','Sí, cualquiera con dos carriles lo es','Sí, si permite superar 80 km/h'],c:0,e:'El número de carriles no determina por sí solo la clase de vía.',r:'Ley de Tráfico, anexo I'},
 {id:'q339',l:'T2L2',q:'¿Qué debes combinar para saber qué velocidad corresponde a tu vehículo?',o:['Solo el aspecto de la carretera','El tipo de vía, las señales y las limitaciones aplicables','Solo el ritmo de los demás'],c:1,e:'La clase de vía es uno de los elementos; también cuentan señalización, vehículo y circunstancias.',r:'RGC, arts. 45, 47, 48 y 50'},
 {id:'q340',l:'T2L2',q:'¿Qué caracteriza de forma general a una vía interurbana?',o:['Tiene siempre arcenes anchos','Solo admite vehículos a motor','Está situada fuera de poblado'],c:2,e:'La ubicación fuera de poblado forma parte de la definición legal de vía interurbana.',r:'Ley de Tráfico, anexo I'},
 {id:'q341',l:'T2L2',q:'Una señal específica limita a 70 km/h un tramo de carretera convencional. ¿Qué máximo respetas con tu turismo?',o:['70 km/h, sin perjuicio de reducir más por las condiciones','90 km/h por ser el genérico','El de los vehículos de delante'],c:0,e:'La limitación específica se aplica, y la seguridad puede exigir todavía menos velocidad.',r:'RGC, arts. 45 y 47'},
 {id:'q342',l:'T2L3',q:'En autovía, el carril derecho está libre y no necesitas adelantar. ¿Por dónde circulas normalmente?',o:['Por el central para evitar cambios','Por el derecho','Por el izquierdo si mantengo el máximo'],c:1,e:'Fuera de poblado se utiliza normalmente el carril derecho.',r:'RGC, art. 31'},
 {id:'q343',l:'T2L3',q:'En una calle con dos carriles marcados para tu sentido, ¿qué carril puede usar un turismo?',o:['Siempre el izquierdo','Solo el derecho en toda circunstancia','El que mejor convenga a su destino sin obstaculizar'],c:2,e:'En poblado se admite esa elección, fuera de autopistas y autovías y respetando las demás reglas.',r:'RGC, art. 33'},
 {id:'q344',l:'T2L3',q:'Para entrar en el carril contiguo ya ocupado por otro vehículo, ¿quién tiene prioridad?',o:['El vehículo que ya circula por ese carril','Yo si llevo el intermitente','El más rápido'],c:0,e:'El desplazamiento lateral debe respetar la prioridad de quien ocupa el carril.',r:'RGC, art. 74.2'},
 {id:'q345',l:'T2L3',q:'Terminas de adelantar en autovía y puedes volver con seguridad al derecho. ¿Qué haces?',o:['Me quedo indefinidamente en el izquierdo','Señalizo y regreso sin obligar al adelantado a variar su marcha','Vuelvo en cuanto mi parte delantera lo sobrepase'],c:1,e:'El regreso se realiza de forma segura y gradual, manteniendo margen con el adelantado.',r:'RGC, arts. 31 y 85.3'},
 {id:'q346',l:'T2L3',q:'Llevas el intermitente para cambiar de carril. ¿Qué significa para los demás?',o:['Que deben frenarte para dejarte espacio','Que has adquirido prioridad','Que anuncias una intención y aún debes comprobar que sea segura'],c:2,e:'La señal comunica la maniobra, pero no sustituye la obligación de respetar el tráfico del carril.',r:'RGC, arts. 74.2 y 109'},
 {id:'q347',l:'T2L4',q:'Sobre un carril reversible aparece una cruz roja. ¿Puedes entrar si está vacío?',o:['No, la cruz roja prohíbe ocuparlo','Sí, si se ve libre hasta el final','Sí, con las luces de emergencia'],c:0,e:'La señal de aspa roja impide ocupar el carril sobre el que está situada.',r:'RGC, art. 143 y anexo I, apartado 4.3'},
 {id:'q348',l:'T2L4',q:'Circulas de día por un carril reversible. ¿Qué alumbrado debes llevar como mínimo?',o:['Solo las luces de posición','La luz de cruce','Ninguno si no hay niebla'],c:1,e:'En el reversible debe llevarse encendida al menos la luz de cruce de día y de noche.',r:'RGC, art. 40'},
 {id:'q349',l:'T2L4',q:'Un carril en sentido contrario al habitual se habilita por fluidez, sin límites inferiores señalizados. ¿Cuál es su intervalo general?',o:['De 40 a 60 km/h','De 80 a 100 km/h','De 60 a 80 km/h'],c:2,e:'En ese supuesto se exige circular entre 60 y 80 km/h, además de respetar las otras condiciones.',r:'RGC, art. 41.1'},
 {id:'q350',l:'T2L4',q:'Una flecha verde permite usar un carril reversible. ¿Anula un límite de velocidad aplicable?',o:['No, las demás señales siguen vigentes','Sí, mientras la flecha esté verde','Sí, solo para turismos'],c:0,e:'La autorización de uso del carril no elimina otras obligaciones de circulación.',r:'RGC, arts. 40 y 143 y anexo I, apartado 4.3'},
 {id:'q351',l:'T2L4',q:'Un carril contrario al habitual está habilitado por obras. ¿Debes suponer que admite exactamente los mismos vehículos que uno abierto solo por fluidez?',o:['Sí, no puede haber diferencias','No, compruebo los vehículos autorizados y la señalización del caso','Sí, si ambos tienen conos'],c:1,e:'El régimen de uso puede variar cuando la habilitación se debe a obras.',r:'RGC, art. 41.2'},
 {id:'q352',l:'T2L5',q:'Ves un carril bus vacío. ¿Eso permite circular por él con tu turismo?',o:['Sí, si la circulación del resto está detenida','Sí, para adelantar un solo vehículo','No, debo estar autorizado por su regulación'],c:2,e:'La ausencia de usuarios no elimina la reserva del carril.',r:'RGC, art. 35'},
 {id:'q353',l:'T2L5',q:'Una ciudad admite motos en ciertos carriles bus. ¿Puedes extenderlo a todos los carriles bus de España?',o:['No, debo comprobar la autorización aplicable en cada lugar','Sí, porque todos tienen la misma reserva','Sí, si la moto es A2'],c:0,e:'Las condiciones particulares dependen de la regulación y señalización de cada carril.',r:'RGC, arts. 35 y 37'},
 {id:'q354',l:'T2L5',q:'Para usar un carril VAO, ¿qué debes revisar además de que tu vehículo esté admitido?',o:['Solo el color del coche','La ocupación, los horarios y las condiciones señalizadas','Solo si llevo equipaje'],c:1,e:'La autorización puede estar condicionada por ocupación y regulación específica.',r:'RGC, art. 35.2'},
 {id:'q355',l:'T2L5',q:'Tu navegador propone entrar en una zona con acceso restringido. ¿Qué prevalece?',o:['La ruta calculada','La preferencia del conductor','La regulación y las señales de acceso'],c:2,e:'Una indicación de navegación no autoriza a incumplir una restricción.',r:'RGC, arts. 37, 132 y 157'},
 {id:'q356',l:'T2L5',q:'¿Por qué debes leer el panel de un carril reservado antes de entrar?',o:['Porque puede limitar los vehículos y condiciones de uso','Porque solo informa de la longitud del carril','Porque sustituye todas las normas generales'],c:0,e:'La reserva puede ser para ciertos vehículos, horarios u ocupaciones.',r:'RGC, art. 35'},
 {id:'q357',l:'T2L6',q:'Una cola avanza hacia un paso a nivel y no cabe tu coche al otro lado. ¿Qué haces?',o:['Entro para no perder mi turno','Espero antes de las vías hasta poder salir completamente','Me acerco todo lo posible al vehículo de delante sobre las vías'],c:1,e:'No debes entrar si puedes quedar detenido obstaculizando el paso del tren.',r:'RGC, art. 96'},
 {id:'q358',l:'T2L6',q:'Empieza a bajar la barrera de un paso a nivel. ¿Puedes pasar si aún queda hueco?',o:['Sí, con precaución','Sí, si no se ve el tren','No, debo detenerme antes del paso'],c:2,e:'La barrera en movimiento ordena no entrar en el paso.',r:'RGC, art. 95'},
 {id:'q359',l:'T2L6',q:'En unas obras, un agente ordena detenerte aunque el semáforo permita pasar. ¿Qué haces?',o:['Me detengo y sigo sus indicaciones','Sigo el semáforo','Paso si el carril está libre'],c:0,e:'Las órdenes del agente prevalecen sobre la señalización que las contradiga.',r:'RGC, art. 133 y anexo I, apartado 1'},
 {id:'q360',l:'T2L6',q:'Tu vehículo queda inmovilizado sobre un paso a nivel y no puedes retirarlo de inmediato. ¿Qué prioridad tienes?',o:['Permanecer todos dentro para ser vistos','Desalojar a las personas y avisar rápidamente desde un lugar seguro','Esperar a que se levanten las barreras'],c:1,e:'Debes proteger a las personas y advertir de inmediato del peligro al servicio ferroviario o emergencias.',r:'RGC, art. 97'},
 {id:'q361',l:'T2L6',q:'Te acercas a un paso a nivel con buena visibilidad y barrera abierta. ¿Qué actitud corresponde?',o:['Mantener siempre el máximo de la vía','Mirar solo a los vehículos de detrás','Extremar la prudencia y moderar la velocidad al aproximarme'],c:2,e:'Las precauciones de aproximación siguen siendo necesarias aunque el paso esté abierto.',r:'RGC, art. 95'}
 ]},
 '13':{desc:'Comprende cómo protegen el cinturón, los sistemas infantiles, el reposacabezas, los airbags y las ayudas electrónicas.',sims:[],lessons:[
 {id:'T13L1',t:'Seguridad activa y pasiva',min:4,key:'Unos sistemas ayudan a evitar el siniestro y otros reducen las lesiones cuando ocurre.',
 body:`<p>La <b>seguridad activa</b> ayuda a prevenir el siniestro: neumáticos, frenos, alumbrado y control de estabilidad son ejemplos. La <b>pasiva</b> reduce sus consecuencias: cinturones, SRI, airbags, reposacabezas y estructura protectora.</p><p>Ambas necesitan mantenimiento y uso correcto. Ninguna permite sobrepasar la adherencia, ignorar una señal o distraerse. El conductor sigue obligado a controlar el vehículo. Una avería de un sistema de seguridad debe valorarse y repararse siguiendo el manual y el servicio técnico.</p>`,tip:'Activa: prevenir. Pasiva: proteger si se produce el impacto.',errs:['Clasificar el cinturón como sistema que evita por sí mismo la colisión.','Confiar toda la prevención a la electrónica.'],ref:'DGT, guía de conducción segura de turismos. RGC, arts. 3 y 17',source:COURSE_SOURCES.car},
 {id:'T13L2',t:'Colocar bien el cinturón',min:4,key:'Un cinturón protege si está abrochado, ajustado y colocado sobre las zonas resistentes del cuerpo.',
 body:`<p>La banda inferior va baja, sobre la pelvis; la diagonal cruza hombro y pecho. Evita holguras y torsiones, y no pases la diagonal bajo el brazo ni detrás de la espalda. Ajusta el asiento antes de arrancar y evita abrigos voluminosos que impidan tensar bien el cinturón.</p><p>También se exige en plazas traseras. El embarazo no concede una exención general: la banda inferior debe quedar bajo el abdomen, sobre las caderas. Las excepciones legales son concretas, como una exención médica acreditada, y no deben presumirse.</p>`,tip:'Bajo en la pelvis, diagonal en hombro y pecho, sin holgura.',errs:['Poner la banda abdominal sobre el vientre.','Compartir un cinturón entre dos ocupantes.'],ref:'RGC, arts. 117 y 119. DGT, cinturón de seguridad',source:COURSE_SOURCES.belt},
 {id:'T13L3',t:'Sistemas de retención infantil',min:5,key:'En un turismo, los menores de hasta 135 cm incluidos necesitan un SRI adecuado y normalmente viajan detrás.',
 body:`<p>En vehículos de hasta nueve plazas, los menores de edad de <b>135 cm o menos</b> usan un SRI homologado adecuado a su talla y peso, en las plazas traseras. Solo pueden ir delante si no hay plazas traseras, si ya están ocupadas por menores en esa situación o si no cabe instalar todos los SRI.</p><p>Si excepcionalmente colocas delante una silla orientada hacia atrás, <b>desactiva el airbag frontal</b>. Instala y utiliza el sistema según sus instrucciones. Por encima de 135 cm puede utilizarse el cinturón; la DGT recomienda mantener un SRI adecuado hasta 150 cm.</p>`,tip:'Comprueba altura, plaza, montaje y airbag antes de salir.',errs:['Elegir la silla solo por la edad.','Colocar una silla a contramarcha frente a un airbag frontal activo.'],ref:'RGC, art. 117.3 y 117.4. DGT, sillitas de la A a la Z',source:'#a117'},
 {id:'T13L4',t:'Asiento, reposacabezas y airbag',min:4,key:'Una postura correcta permite manejar y hace que los sistemas de protección trabajen como se diseñaron.',
 body:`<p>Regula el asiento para alcanzar los mandos sin estirar por completo brazos y piernas y conservar la espalda apoyada. El respaldo excesivamente tumbado reduce la protección del cinturón. Ajusta el reposacabezas a tu altura, cerca de la parte posterior de la cabeza, siguiendo el manual.</p><p>El airbag <b>complementa</b> al cinturón. Evita apoyar pies sobre el salpicadero y colocar objetos sobre sus zonas de despliegue. Mantén la distancia y posición recomendadas por el fabricante. El reposacabezas ayuda a reducir el movimiento brusco de la cabeza en un alcance.</p>`,tip:'Ajusta primero asiento y reposacabezas; después espejos y cinturón.',errs:['Llamar reposacuellos al reposacabezas y colocarlo demasiado bajo.','Pensar que el airbag permite ir sin cinturón.'],ref:'DGT, guía de conducción segura de turismos y cinturón de seguridad',source:COURSE_SOURCES.car},
 {id:'T13L5',t:'ABS, estabilidad y adherencia',min:4,key:'Las ayudas aprovechan el agarre disponible; no crean una adherencia ilimitada.',
 body:`<p>El <b>ABS</b> ayuda a evitar el bloqueo de las ruedas al frenar y permite conservar capacidad de dirección dentro de los límites físicos. En una frenada de emergencia de un turismo con ABS funcionando, presiona el freno firmemente y mantén la presión, siguiendo el manual. La vibración característica del pedal no exige soltarlo.</p><p>El <b>control de estabilidad</b> interviene para ayudar a mantener la trayectoria. El de tracción limita el patinaje al acelerar. Una velocidad excesiva, un neumático deteriorado o el hielo pueden superar lo que estos sistemas pueden corregir.</p>`,tip:'Mantén los márgenes aunque tu vehículo tenga muchas ayudas.',errs:['Bombear el pedal en una emergencia con ABS operativo.','Entrar más deprisa en una curva porque hay control de estabilidad.'],ref:'DGT, guía de conducción segura de turismos. RGC, arts. 17 y 45',source:COURSE_SOURCES.car},
 {id:'T13L6',t:'ADAS y responsabilidad del conductor',min:4,key:'Las ayudas a la conducción necesitan supervisión y tienen límites de funcionamiento.',
 body:`<p>El aviso de ángulo muerto, la frenada automática, el control adaptativo de velocidad o la ayuda de carril pueden prevenir errores. Consulta qué hace cada sistema y en qué condiciones deja de funcionar. Niebla, suciedad en sensores o marcas poco visibles pueden limitar su actuación.</p><p>En sistemas de conducción asistida o parcialmente automatizada, mantén la atención y la capacidad de intervenir. Un aviso exige comprobar la situación, no obedecer sin mirar. Tener ayuda de aparcamiento tampoco elimina la obligación de vigilar peatones y obstáculos.</p>`,tip:'Aprende el sistema concreto de tu vehículo antes de depender de él.',errs:['Tratar un asistente de carril como conducción autónoma.','Mirar el móvil mientras actúa el control adaptativo.'],ref:'DGT, vehículos parcialmente automatizados DCAS. RGC, arts. 17 y 18',source:COURSE_SOURCES.adas}
 ],questions:[
 {id:'q362',l:'T13L1',q:'¿Cuál es un elemento de seguridad activa?',o:['El sistema de frenos','El cinturón','El airbag'],c:0,e:'Los frenos ayudan a evitar la colisión. Cinturón y airbag reducen sus consecuencias.',r:'DGT, seguridad activa y pasiva'},
 {id:'q363',l:'T13L1',q:'¿Qué función principal cumple la seguridad pasiva?',o:['Sustituir la atención','Reducir las consecuencias del siniestro','Permitir circular más deprisa'],c:1,e:'Los elementos pasivos protegen a los ocupantes cuando se produce un impacto.',r:'DGT, guía de conducción segura de turismos'},
 {id:'q364',l:'T13L1',q:'Tu coche tiene muchas ayudas. ¿Puedes reducir por ello la distancia necesaria para detenerte?',o:['Sí, si todas están conectadas','Sí, en calzada seca','No, debes conservar el margen según las condiciones'],c:2,e:'Las ayudas no eliminan los límites de adherencia y frenado.',r:'RGC, arts. 17, 45 y 54'},
 {id:'q365',l:'T13L1',q:'¿Qué elemento es de seguridad pasiva?',o:['El reposacabezas','El alumbrado de cruce','El control de tracción'],c:0,e:'El reposacabezas ayuda a reducir lesiones en un impacto.',r:'DGT, seguridad pasiva'},
 {id:'q366',l:'T13L1',q:'¿Qué necesita un sistema de seguridad para conservar su eficacia?',o:['Solo que el vehículo sea reciente','Mantenimiento y utilización adecuados','Que se use únicamente en autopista'],c:1,e:'Un sistema mal mantenido o utilizado puede perder su capacidad de protección.',r:'DGT, guía de conducción segura de turismos'},
 {id:'q367',l:'T13L2',q:'¿Dónde debe quedar la banda inferior del cinturón?',o:['Sobre el abdomen','Sobre el pecho','Baja, sobre la pelvis'],c:2,e:'La pelvis soporta mejor la retención que la zona abdominal.',r:'DGT, cinturón de seguridad'},
 {id:'q368',l:'T13L2',q:'La banda diagonal te molesta. ¿Puedes pasarla por debajo del brazo?',o:['No, debo ajustar correctamente el sistema','Sí, para un trayecto corto','Sí, si queda tensa'],c:0,e:'Cambiar su recorrido reduce la protección y puede favorecer lesiones.',r:'DGT, colocación del cinturón'},
 {id:'q369',l:'T13L2',q:'¿Una persona embarazada está exenta en general de usar cinturón?',o:['Sí, siempre','No; debe colocarlo correctamente salvo una exención legal acreditada','Solo en carretera'],c:1,e:'El embarazo no es una exención general. La banda inferior se coloca bajo el abdomen.',r:'RGC, arts. 117 y 119. DGT, cinturón'},
 {id:'q370',l:'T13L2',q:'¿Pueden dos ocupantes compartir un cinturón?',o:['Sí, si son pequeños','Sí, en las plazas traseras','No, cada uno necesita su sistema adecuado'],c:2,e:'El cinturón está diseñado para retener a un ocupante, no a dos juntos.',r:'RGC, art. 117. DGT, cinturón'},
 {id:'q371',l:'T13L2',q:'¿Qué efecto tiene llevar mucha holgura en el cinturón?',o:['Reduce su eficacia de retención','Mejora la protección del airbag','Permite la misma protección con más comodidad'],c:0,e:'Debe quedar ajustado y sin torsiones para actuar correctamente.',r:'DGT, cinturón de seguridad'},
 {id:'q372',l:'T13L3',q:'Un menor mide exactamente 135 cm y viaja en un turismo. ¿Necesita SRI adecuado?',o:['No, desde 135 cm se exige solo cinturón','Sí, el límite incluye los 135 cm','Solo si tiene menos de diez años'],c:1,e:'La obligación comprende a los menores de estatura igual o inferior a 135 cm.',r:'RGC, art. 117.1 y 117.3'},
 {id:'q373',l:'T13L3',q:'¿Dónde viaja normalmente en un turismo un menor sujeto a la obligación de SRI?',o:['En el asiento delantero','En cualquier plaza que elija','En los asientos traseros'],c:2,e:'Hay excepciones concretas, pero la regla es utilizar los asientos traseros.',r:'RGC, art. 117.3'},
 {id:'q374',l:'T13L3',q:'Una excepción permite instalar delante una silla a contramarcha. ¿Qué debes hacer con el airbag frontal de esa plaza?',o:['Desactivarlo','Mantenerlo activo','Desactivarlo solo en autopista'],c:0,e:'Una silla orientada hacia atrás solo puede ocupar esa plaza con el airbag frontal desactivado.',r:'RGC, art. 117.3'},
 {id:'q375',l:'T13L3',q:'¿Qué situación permite, con SRI adecuado, usar excepcionalmente una plaza delantera?',o:['Que el niño prefiera ver la carretera','Que el vehículo no disponga de asientos traseros','Que el recorrido dure menos de cinco minutos'],c:1,e:'La ausencia de asientos traseros es una de las tres excepciones legales.',r:'RGC, art. 117.3'},
 {id:'q376',l:'T13L3',q:'Un menor supera 135 cm pero aún no llega a 150 cm. ¿Qué recomienda la DGT?',o:['Usar siempre solo cinturón, aunque ajuste mal','Dejar de usar cualquier SRI','Mantener un SRI homologado adecuado hasta 150 cm'],c:2,e:'La recomendación de protección hasta 150 cm se distingue del umbral legal general de 135 cm.',r:'DGT, sistemas de retención infantil'},
 {id:'q377',l:'T13L4',q:'¿El airbag sustituye al cinturón?',o:['No, lo complementa','Sí, en plazas delanteras','Sí, por debajo de 50 km/h'],c:0,e:'Está diseñado como protección complementaria al sistema de retención.',r:'DGT, cinturón y airbag'},
 {id:'q378',l:'T13L4',q:'¿Cómo debes ajustar el reposacabezas?',o:['Lo más bajo posible','A tu altura y cerca de la cabeza, según el manual','Separado al máximo para ganar comodidad'],c:1,e:'Un ajuste adecuado ayuda a limitar el movimiento brusco de la cabeza en un alcance.',r:'DGT, seguridad pasiva y reposacabezas'},
 {id:'q379',l:'T13L4',q:'¿Por qué debe evitarse viajar con los pies sobre el salpicadero?',o:['Solo por ensuciarlo','Porque tapa el navegador','Porque esa postura aumenta el riesgo de lesiones, especialmente al actuar el airbag'],c:2,e:'El ocupante debe mantener una postura compatible con cinturón y airbag.',r:'DGT, guía de conducción segura de turismos'},
 {id:'q380',l:'T13L4',q:'¿Qué asiento favorece el manejo seguro y la retención?',o:['El que permite alcanzar mandos con la espalda apoyada y sin estirar por completo las extremidades','El que obliga a conducir con brazos totalmente rectos','El que lleva el respaldo casi tumbado'],c:0,e:'La posición debe permitir controlar y mantener la postura prevista para los sistemas de seguridad.',r:'RGC, art. 18. DGT, posición de conducción'},
 {id:'q381',l:'T13L4',q:'¿Puedes colocar un adorno en una tapa de despliegue de airbag?',o:['Sí, si es ligero','No; debo mantener libre esa zona según el fabricante','Sí, si no tapa la visión'],c:1,e:'Un objeto en esa zona puede interferir o proyectarse cuando actúe el airbag.',r:'DGT, guía de conducción segura de turismos'},
 {id:'q382',l:'T13L5',q:'¿Qué ayuda a evitar el ABS?',o:['Todo deslizamiento lateral','Cualquier exceso de velocidad','El bloqueo de ruedas durante la frenada'],c:2,e:'Actúa regulando la frenada para conservar capacidad de dirección dentro del agarre disponible.',r:'DGT, sistemas de frenado ABS'},
 {id:'q383',l:'T13L5',q:'En una emergencia con un turismo y ABS operativo, el pedal vibra. ¿Qué haces normalmente?',o:['Mantengo la presión firme de frenado según el manual','Suelto el pedal cada vez que vibra','Paso inmediatamente a usar solo el freno de estacionamiento'],c:0,e:'La vibración puede corresponder a la actuación normal del ABS; no exige bombear el pedal.',r:'DGT, guía de conducción segura de turismos'},
 {id:'q384',l:'T13L5',q:'¿Qué función principal tiene el control de estabilidad?',o:['Mantener siempre la velocidad elegida','Ayudar a conservar la trayectoria cuando detecta inestabilidad','Evitar el desgaste de los neumáticos'],c:1,e:'Interviene para ayudar a controlar el vehículo, sin superar los límites físicos del agarre.',r:'DGT, control electrónico de estabilidad'},
 {id:'q385',l:'T13L5',q:'¿Qué sistema limita el patinaje de las ruedas al acelerar?',o:['El airbag','El reposacabezas','El control de tracción'],c:2,e:'El control de tracción actúa sobre el patinaje durante la aceleración.',r:'DGT, guía de conducción segura de turismos'},
 {id:'q386',l:'T13L5',q:'Hay hielo y el coche tiene control de estabilidad. ¿Qué debes hacer?',o:['Reducir y mantener márgenes porque el agarre sigue siendo limitado','Conducir igual que en seco','Acelerar para que el sistema se active antes'],c:0,e:'La electrónica no crea la adherencia que falta en la calzada.',r:'RGC, arts. 17 y 45. DGT, conducción segura'},
 {id:'q387',l:'T13L6',q:'El control adaptativo de velocidad está funcionando. ¿Puedes desatender la circulación?',o:['Sí, mientras detecte un vehículo delante','No, debo supervisar e intervenir si es necesario','Sí, si también hay ayuda de carril'],c:1,e:'Los sistemas de asistencia no sustituyen la responsabilidad y atención del conductor.',r:'DGT, vehículos parcialmente automatizados DCAS'},
 {id:'q388',l:'T13L6',q:'¿Qué puede limitar una ayuda basada en cámaras o sensores?',o:['Solo la cilindrada del motor','Solo que el vehículo tenga más de cuatro años','Suciedad, mala visibilidad o marcas poco visibles, según el sistema'],c:2,e:'Los sistemas tienen condiciones y límites que deben conocerse en su manual.',r:'DGT, ADAS y conducción asistida'},
 {id:'q389',l:'T13L6',q:'Un asistente de ángulo muerto no avisa. ¿Qué debes hacer antes de cambiar de carril?',o:['Comprobar igualmente que la maniobra es segura','Cambiar sin mirar porque no hay aviso','Esperar solo un segundo y cambiar'],c:0,e:'La ausencia de aviso no garantiza que el espacio esté libre.',r:'RGC, art. 74.2. DGT, ADAS'},
 {id:'q390',l:'T13L6',q:'El coche dispone de ayuda de aparcamiento. ¿Quién debe vigilar a los peatones?',o:['Solo el sistema','El conductor, manteniendo supervisión y control','Solo el pasajero'],c:1,e:'La asistencia no elimina la obligación de evitar riesgos durante la maniobra.',r:'RGC, arts. 17 y 18. DGT, ADAS'},
 {id:'q391',l:'T13L6',q:'Estrenas un vehículo con ayudas desconocidas. ¿Qué conviene hacer?',o:['Activarlas todas y aprender mientras conduzco','Suponer que funcionan igual que en otro modelo','Consultar sus funciones, avisos y límites antes de utilizarlas'],c:2,e:'Cada sistema tiene condiciones propias que el conductor debe conocer.',r:'DGT, ADAS y vehículos parcialmente automatizados'}
 ]},
 '14':{desc:'Aprende las comprobaciones básicas, el mantenimiento, la documentación técnica y cómo reconocer una avería peligrosa.',sims:[],lessons:[
 {id:'T14L1',t:'Neumáticos y presión',min:4,key:'El contacto con el suelo depende del estado y la presión de los neumáticos.',
 body:`<p>Comprueba la presión en frío con el valor indicado por el fabricante para la carga prevista. No quites aire a un neumático caliente para igualarlo al valor en frío. Revisa cortes, bultos, desgaste irregular y objetos clavados.</p><p>En un turismo, las ranuras principales deben conservar al menos <b>1,6 mm</b> de profundidad. Llegar al mínimo no garantiza el mismo agarre que un neumático en buen estado. El avisador de presión ayuda, pero no sustituye las comprobaciones. Atiende también a la rueda de repuesto si existe.</p>`,tip:'Presión, dibujo y daños: comprueba las tres cosas.',errs:['Usar la presión máxima del flanco como recomendación universal.','Esperar a que el neumático esté liso para sustituirlo.'],ref:'RGV, anexo VII. DGT, revisión de neumáticos',source:COURSE_SOURCES.tyres},
 {id:'T14L2',t:'Frenos, dirección y suspensión',min:4,key:'Una respuesta anormal de estos sistemas puede comprometer el control.',
 body:`<p>Desviarse al frenar, necesitar más recorrido del pedal, notar vibraciones nuevas o ruidos persistentes exige revisión. La suspensión ayuda a mantener las ruedas en contacto con el firme; su deterioro afecta a estabilidad y frenado.</p><p>Si aparece una anomalía grave, detente de forma segura y solicita asistencia. No compruebes una posible avería de frenos acelerando para probarlos. Sigue el mantenimiento del fabricante y no atribuyas una dirección inestable únicamente al viento sin revisar el vehículo.</p>`,tip:'Un cambio en el tacto o la trayectoria merece atención antes del siguiente viaje.',errs:['Normalizar un pedal que se hunde más que antes.','Posponer una reparación porque el coche aún se mueve.'],ref:'RGV, art. 12 y anexos. DGT, mantenimiento y guía de conducción segura',source:COURSE_SOURCES.car},
 {id:'T14L3',t:'Aceite, refrigeración y líquidos',min:4,key:'Comprueba los niveles con el procedimiento y los productos previstos por el fabricante.',
 body:`<p>El aceite lubrica el motor; el refrigerante ayuda a controlar su temperatura. Revisa niveles en las condiciones que indique el manual, con el vehículo seguro y el motor parado cuando corresponda. No mezcles productos incompatibles ni sobrepases el máximo.</p><p>No abras el circuito de refrigeración cuando esté caliente: puede salir líquido o vapor a presión. Una pérdida de líquido de frenos o de refrigerante necesita averiguar su causa. Rellenar repetidamente no sustituye reparar una fuga. Mantén también el lavaparabrisas en condiciones.</p>`,tip:'El manual determina producto, nivel y forma de comprobación.',errs:['Abrir el refrigerante con el motor sobrecalentado.','Resolver una fuga de frenos limitándose a rellenar.'],ref:'DGT, mantenimiento del vehículo. Manual del fabricante',source:COURSE_SOURCES.car},
 {id:'T14L4',t:'Testigos y averías',min:4,key:'Aprende el significado de los avisos de tu vehículo antes de necesitarlos.',
 body:`<p>Los testigos tienen significados específicos. Un aviso de presión de aceite o de temperatura puede exigir detener la marcha y parar el motor en lugar seguro. Un testigo de batería durante la marcha puede indicar un fallo de carga. Consulta siempre el manual: el color por sí solo no da un diagnóstico completo.</p><p>Algunas luces se encienden durante la comprobación de arranque y deben apagarse después. Si persiste un aviso de avería, actúa según sus instrucciones. Si notas humo, pérdida de control o funcionamiento peligroso, prioriza detenerte y pedir ayuda.</p>`,tip:'Distingue la comprobación inicial de un aviso que permanece durante la marcha.',errs:['Continuar con un aviso grave hasta la próxima revisión rutinaria.','Suponer que un testigo de aceite solo recuerda un cambio periódico.'],ref:'DGT, mantenimiento y seguridad del vehículo. Manual del fabricante',source:COURSE_SOURCES.car},
 {id:'T14L5',t:'ITV y reformas',min:5,key:'La ITV debe estar vigente y las modificaciones deben seguir el procedimiento que corresponda.',
 body:`<p>Para un turismo particular ordinario, la primera ITV periódica es a los cuatro años; después, cada dos hasta los diez y, con más de diez años, anual. Una motocicleta ordinaria pasa la primera a los cuatro años y después cada dos. Hay categorías y usos con otros plazos.</p><p>Una ITV desfavorable limita la circulación a los traslados previstos para reparación y regreso a la estación. Con resultado negativo, el vehículo debe trasladarse por medios ajenos. Una reforma que lo requiera debe legalizarse e incorporarse a la documentación; usar una pieza comprada no implica que esté autorizada.</p>`,tip:'Consulta la categoría, el uso y la fecha de la documentación, no solo la edad.',errs:['Confundir desfavorable con negativo.','Creer que una cita o una reparación sustituyen una ITV favorable.'],ref:'RD 920/2017, arts. 6 y 11. RD 866/2010, reformas de vehículos',source:COURSE_SOURCES.itv},
 {id:'T14L6',t:'Carga, autonomía y comprobación final',min:4,key:'El vehículo debe estar preparado para el peso y el recorrido reales.',
