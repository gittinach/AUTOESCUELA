 body:`<p>Busca señales, accesos, peatones y cambios del firme. Alterna la observación lejana con las comprobaciones próximas y de espejos. Antes de un desplazamiento, comprueba también el ángulo muerto cuando sea seguro.</p><p>Evita fijar la vista en un obstáculo y perder la percepción del espacio libre. Identifica un recorrido seguro dentro de tu carril y ajusta la velocidad a lo visible. No des por hecho que quien mira hacia ti te ha detectado o va a ceder. Conserva una alternativa de detención y separación.</p>`,tip:'Observa el riesgo y también el espacio seguro, sin dejar de atender al conjunto.',errs:['Fijarse solo en la rueda delantera.','Suponer que el intermitente de otro garantiza su próxima trayectoria.'],ref:'DGT, observación y anticipación en moto. RGC, arts. 18 y 45',source:COURSE_SOURCES.moto},
 {id:'M3L4',t:'Frenar con control',min:5,key:'Dosifica los frenos según el agarre y el sistema de la moto; anticiparte evita emergencias.',
 body:`<p>Utiliza ambos frenos de forma coordinada según tu modelo y formación. Al frenar, la carga se desplaza hacia delante y el freno delantero suele aportar gran parte de la capacidad. Aplicarlo bruscamente o bloquear una rueda puede provocar pérdida de control.</p><p>Conserva margen y prepara las reducciones. En una moto con ABS, sigue sus instrucciones para la frenada de emergencia. El sistema no garantiza evitar caídas, especialmente con poca adherencia o inclinación. La frenada intensa se practica en un entorno autorizado con supervisión, no improvisando pruebas en tráfico.</p>`,tip:'La mejor frenada suele empezar por haber detectado antes la necesidad de reducir.',errs:['Usar siempre solo el freno trasero.','Confundir disponer de ABS con poder frenar igual en cualquier superficie.'],ref:'DGT, técnicas de frenado en motocicleta. Manual del fabricante',source:COURSE_SOURCES.moto},
 {id:'M3L5',t:'Preparar y recorrer curvas',min:5,key:'Elige antes de entrar una velocidad que permita conservar el control dentro de tu espacio.',
 body:`<p>Observa trazado, visibilidad, firme y tráfico. Reduce y selecciona la relación adecuada antes de entrar cuando sea posible. Durante la curva, mira hacia su desarrollo y salida visible, mantén suavidad y reserva de agarre.</p><p>No recortes invadiendo el sentido contrario ni con las ruedas ni con el cuerpo al inclinar. Evita cambios bruscos de aceleración, frenado o dirección. Si aparece un riesgo, responde de forma dosificada según tu formación y las ayudas de la moto. Una curva conocida puede tener gravilla, humedad o un vehículo detenido.</p>`,tip:'Prepara entrada, conserva espacio y no supongas una salida despejada que aún no ves.',errs:['Entrar deprisa y confiar en frenar bruscamente inclinando.','Invadir el contrario con el cuerpo aunque las ruedas sigan en tu carril.'],ref:'DGT, trazado de curvas. RGC, arts. 29 y 45',source:COURSE_SOURCES.moto},
 {id:'M3L6',t:'Pendientes, detención y estacionamiento',min:4,key:'Prepara el control de la moto hasta que quede estable y asegurada.',
 body:`<p>En descensos, selecciona una relación que ayude a controlar la velocidad, completando con los frenos según la necesidad. Evita bajar en punto muerto o con el embrague pisado de forma continua. La relación debe ser adecuada a pendiente y agarre.</p><p>Para detenerte y aparcar, observa superficie, inclinación y espacio de acceso. Usa un soporte estable según el manual y evita que la moto pueda desplazarse. Respeta la regulación del lugar y no obstruyas pasos o rebajes. En una salida en cuesta, coordina mandos y freno sin dejar que la moto retroceda peligrosamente.</p>`,tip:'El control también importa al quedar parado y al bajar de la moto.',errs:['Apoyar la pata sobre un firme que puede hundirse.','Dar por terminada la maniobra antes de comprobar la estabilidad.'],ref:'RGC, arts. 17, 45 y 91. DGT, técnica de motocicletas',source:COURSE_SOURCES.moto}
 ],questions:[
 {id:'q542',l:'M3L1',q:'¿Qué postura favorece el control de una moto?',o:['Estable, con mandos al alcance y sin rigidez excesiva','Con brazos bloqueados y hombros tensos','Con los pies separados de los reposapiés durante todo el viaje'],c:0,e:'La postura debe permitir observar, equilibrar y actuar sobre los mandos.',r:'DGT, posición de conducción en moto'},
 {id:'q543',l:'M3L1',q:'¿Qué debes valorar al elegir una moto además de su potencia?',o:['Solo su color','Que puedas manejar su talla y peso en marcha y en las detenciones','Solo el tamaño de su depósito'],c:1,e:'La compatibilidad con la capacidad de manejo importa especialmente al detenerse y maniobrar.',r:'DGT, elección de motocicleta'},
 {id:'q544',l:'M3L1',q:'¿Dónde deben permanecer normalmente los pies del conductor durante la marcha?',o:['Colgando junto al suelo','Sobre el motor','Apoyados correctamente en los reposapiés'],c:2,e:'El apoyo adecuado favorece estabilidad y acceso a mandos.',r:'DGT, posición de conducción'},
 {id:'q545',l:'M3L1',q:'¿Cómo se adquiere de forma adecuada una técnica nueva de equilibrio?',o:['Mediante formación práctica supervisada en lugar autorizado','Probándola por primera vez en una carretera concurrida','Imitando cualquier vídeo en un cruce'],c:0,e:'La teoría se consolida con práctica segura y supervisada.',r:'DGT, formación y conducción segura de motocicletas'},
 {id:'q546',l:'M3L1',q:'¿Por qué no debes mirar continuamente al cuadro?',o:['Porque cambia el consumo','Porque desvía la atención del tráfico y el recorrido','Porque apaga los testigos'],c:1,e:'Las consultas deben ser breves y compatibles con la vigilancia de la vía.',r:'RGC, art. 18'},
 {id:'q547',l:'M3L2',q:'Al arrancar con una moto manual, ¿qué ayuda a conservar el control?',o:['Soltar de golpe el embrague','Acelerar a fondo antes de mirar','Coordinar suavemente embrague y acelerador'],c:2,e:'La dosificación evita una salida brusca y facilita el equilibrio.',r:'DGT, maniobras de motocicletas'},
 {id:'q548',l:'M3L2',q:'Vas a salir desde el borde de la vía. ¿Qué haces antes?',o:['Observo, señalizo y cedo al tráfico cuando corresponde','Arranco para que los demás se adapten','Miro solo al frente y acelero'],c:0,e:'La incorporación debe realizarse sin peligro y respetando a quienes circulan.',r:'RGC, art. 72'},
 {id:'q549',l:'M3L2',q:'¿Hacia dónde conviene orientar la mirada en un giro lento?',o:['Solo a la rueda delantera','Hacia el recorrido disponible, vigilando los riesgos','Al mando de embrague durante todo el giro'],c:1,e:'La mirada ayuda a preparar el recorrido y mantener percepción del espacio.',r:'DGT, manejo y observación en moto'},
 {id:'q550',l:'M3L2',q:'Vas a detener una moto pesada. ¿Qué conviene prever?',o:['Solo cuándo apagar la radio','Que el pasajero decida dónde apoyar','El apoyo de los pies y el estado y pendiente del suelo'],c:2,e:'Una mala superficie de apoyo puede comprometer el equilibrio en la detención.',r:'DGT, técnica de motocicletas'},
 {id:'q551',l:'M3L2',q:'¿Qué debes valorar al empujar una moto apagada en una pendiente?',o:['Peso, espacio y posibilidad de controlarla sin riesgo','Solo que el manillar pueda girar','Que el casco esté abierto'],c:0,e:'El peso y la pendiente pueden superar la capacidad de sostenerla.',r:'DGT, maniobras y manejo de motocicletas'},
 {id:'q552',l:'M3L3',q:'Un conductor mira en tu dirección antes de incorporarse. ¿Puedes dar por hecho que te ha visto?',o:['Sí, siempre','No, debo mantener margen y prever que pueda no detectarme','Sí, si llevo ropa clara'],c:1,e:'La mirada aparente no garantiza detección ni una respuesta correcta.',r:'DGT, conducción preventiva en moto'},
 {id:'q553',l:'M3L3',q:'¿Qué observación facilita anticipar cambios de firme y accesos?',o:['Mirar solo unos centímetros delante','Atender únicamente al espejo izquierdo','Combinar visión lejana, próxima y del entorno'],c:2,e:'Repartir la observación permite preparar decisiones con más tiempo.',r:'DGT, observación y anticipación'},
 {id:'q554',l:'M3L3',q:'Ves un obstáculo en tu carril. ¿Qué debes evitar?',o:['Fijar toda la atención en él y perder el espacio disponible','Identificarlo con anticipación','Reducir dentro de lo que ves'],c:0,e:'Debes mantener una percepción global y valorar el espacio seguro para responder.',r:'DGT, observación en moto'},
 {id:'q555',l:'M3L3',q:'Otro vehículo lleva intermitente, pero no ha cambiado aún de trayectoria. ¿Qué actitud corresponde?',o:['Dar por completada su maniobra','Confirmar sus movimientos sin perder el margen','Acelerar para pasar pegado'],c:1,e:'Una señal comunica una intención, no asegura que el conductor la ejecutará como esperas.',r:'DGT, anticipación. RGC, arts. 3 y 18'},
 {id:'q556',l:'M3L3',q:'Antes de cambiar de carril en moto, ¿qué debes tener en cuenta sobre los espejos?',o:['Cubren siempre toda la zona lateral','Basta con ver el carril a lo lejos','Puede haber ángulos muertos que debes comprobar cuando sea seguro'],c:2,e:'La comprobación del desplazamiento debe incluir posibles zonas ocultas.',r:'RGC, art. 74.2. DGT, observación'},
 {id:'q557',l:'M3L4',q:'En la frenada de una moto convencional, ¿qué uso debes aprender?',o:['El uso coordinado de ambos frenos según modelo y agarre','Usar siempre solo el trasero','Apretar el delantero de golpe en toda circunstancia'],c:0,e:'El equilibrio y la capacidad de frenado requieren dosificación y conocimiento del sistema.',r:'DGT, técnicas de frenado de motocicletas'},
 {id:'q558',l:'M3L4',q:'Al frenar una moto, ¿hacia dónde se desplaza generalmente parte de la carga?',o:['Siempre hacia atrás','Hacia la rueda delantera','Solo hacia un lateral'],c:1,e:'La transferencia influye en la capacidad relativa de los frenos y exige dosificación.',r:'DGT, frenada en motocicleta'},
 {id:'q559',l:'M3L4',q:'¿El ABS permite frenar sin margen en cualquier superficie?',o:['Sí, evita cualquier caída','Sí, si la moto está limitada para A2','No, siguen existiendo límites de agarre y control'],c:2,e:'La ayuda al bloqueo no elimina los riesgos de adherencia o inclinación.',r:'DGT, frenado y sistemas de ayuda'},
 {id:'q560',l:'M3L4',q:'¿Dónde conviene practicar por primera vez una frenada intensa?',o:['En un lugar autorizado con supervisión adecuada','En una retención para probar el ABS','En una curva sin tráfico visible'],c:0,e:'La práctica necesita espacio, condiciones y formación seguros.',r:'DGT, cursos de conducción segura'},
 {id:'q561',l:'M3L4',q:'¿Qué ventaja tiene detectar pronto una necesidad de detenerse?',o:['Elimina la distancia de frenado','Permite preparar la reducción y conservar más margen','Permite ignorar la adherencia'],c:1,e:'La anticipación reduce la necesidad de respuestas bruscas de emergencia.',r:'RGC, arts. 45 y 54. DGT, anticipación'},
 {id:'q562',l:'M3L5',q:'¿Cuándo conviene preparar la velocidad para una curva?',o:['Solo después de alcanzar su punto más cerrado','Cuando vea que la moto invade el contrario','Antes de entrar, según trazado, visibilidad y firme'],c:2,e:'La preparación previa facilita conservar agarre, control y espacio.',r:'DGT, trazado de curvas. RGC, art. 45'},
 {id:'q563',l:'M3L5',q:'Tus ruedas quedan en tu carril, pero al inclinar el cuerpo invade el contrario. ¿Es una trayectoria segura?',o:['No, debes mantener también tu cuerpo dentro del espacio seguro','Sí, solo cuentan los neumáticos','Sí, si no viene un turismo'],c:0,e:'La trayectoria del conjunto conductor y moto no debe invadir el espacio del tráfico contrario.',r:'RGC, arts. 3 y 29. DGT, curvas'},
 {id:'q564',l:'M3L5',q:'Conoces bien una curva. ¿Qué puede exigir una velocidad distinta hoy?',o:['Solo que sea fin de semana','Humedad, gravilla, visibilidad o tráfico diferentes','Nada si la señal no cambia'],c:1,e:'Las condiciones actuales determinan la velocidad adecuada además del límite.',r:'RGC, art. 45'},
 {id:'q565',l:'M3L5',q:'¿Qué forma de manejar favorece el agarre al recorrer una curva?',o:['Cambios bruscos y frecuentes','Acelerar y frenar alternativamente a fondo','Suavidad y una velocidad compatible con el trazado visible'],c:2,e:'Las acciones bruscas pueden superar el agarre disponible durante la inclinación.',r:'DGT, trazado de curvas'},
 {id:'q566',l:'M3L5',q:'La salida de una curva queda oculta. ¿Qué debes evitar?',o:['Suponer que está despejada y entrar sin margen para detenerme','Ajustar la velocidad a lo visible','Observar el desarrollo de la vía'],c:0,e:'La velocidad debe permitir responder dentro del espacio visible.',r:'RGC, art. 45'},
 {id:'q567',l:'M3L6',q:'En un descenso con moto manual, ¿qué ayuda a controlar la velocidad?',o:['Bajar siempre en punto muerto','Una relación adecuada y los frenos cuando sean necesarios','Mantener el embrague pisado todo el tiempo'],c:1,e:'La relación apropiada aporta retención sin perder capacidad de control.',r:'DGT, técnica de motocicletas'},
 {id:'q568',l:'M3L6',q:'Aparcas y el soporte lateral puede hundirse en un suelo blando. ¿Qué haces?',o:['Lo dejo si aguanta unos segundos','Me alejo antes de que cambie el equilibrio','Busco un apoyo estable y permitido conforme al manual'],c:2,e:'La moto debe quedar asegurada y sin riesgo de caer o desplazarse.',r:'RGC, art. 91. Manual del fabricante'},
 {id:'q569',l:'M3L6',q:'¿Cuándo termina de forma segura una maniobra de estacionamiento?',o:['Cuando la moto queda estable y asegurada en lugar permitido','En cuanto se apaga el motor','En cuanto la rueda toca el bordillo'],c:0,e:'Detener el motor no garantiza la estabilidad ni que el lugar sea adecuado.',r:'RGC, arts. 90 y 91'},
 {id:'q570',l:'M3L6',q:'Vas a iniciar la marcha cuesta arriba. ¿Qué debes evitar?',o:['Coordinar freno y mandos','Que la moto retroceda creando peligro','Observar el tráfico antes de incorporarte'],c:1,e:'La salida debe conservar el control y no poner en riesgo a los demás.',r:'RGC, arts. 17 y 72'},
 {id:'q571',l:'M3L6',q:'Ves un rebaje peatonal libre y cabe la moto. ¿Puedes estacionar bloqueándolo?',o:['Sí, por ser estrecha','Sí, durante pocos minutos','No, no debes obstruir el acceso peatonal'],c:2,e:'El tamaño de la moto no permite obstaculizar zonas protegidas de paso.',r:'RGC, arts. 91 y 94'}
 ]},
 'M4':{desc:'Aplica el permiso A2 y las reglas de carril, arcén, adelantamiento, señalización y estacionamiento en moto.',sims:[],lessons:[
 {id:'M4L1',t:'A2, limitaciones y autorizaciones',min:5,key:'Comprueba potencia, relación potencia/peso y vehículo de origen; no basta con la cilindrada.',
 body:`<p>El A2, desde los 18 años, autoriza motos de hasta <b>35 kW</b> y <b>0,2 kW/kg</b>, no derivadas de otra con más del doble de su potencia. Una moto limitada a 25 kW no puede derivar de una de 70 kW: el doble de 25 es 50. La limitación debe ser reglamentaria y estar documentada.</p><p>El B con antigüedad superior a tres años permite en España las motos de A1 en sus condiciones; no equivale al A2. Con B en vigor se está exento del teórico común al obtener A2, pero no del específico por ese solo motivo. Respeta también las restricciones de tu permiso.</p>`,tip:'La potencia de origen se compara con el doble de la potencia limitada real.',errs:['Aplicar siempre un máximo de origen de 70 kW aunque se limite a menos de 35.','Suponer que cualquier moto de 125 cm³ cumple A1.'],ref:'Reglamento General de Conductores, arts. 4, 5 y 54',source:COURSE_SOURCES.drivers+'#a4'},
 {id:'M4L2',t:'Posición, carriles y distancias',min:4,key:'Usa el carril con visibilidad y margen, sin compartir espacios peligrosamente.',
 body:`<p>La moto es un vehículo y utiliza la calzada. Fuera de poblado, circula normalmente por el carril derecho cuando haya varios para tu sentido. Dentro del carril, evita quedar pegado a puertas estacionadas, gravilla o ángulos muertos y mantén una posición que permita ver y ser visto.</p><p>No necesitas ceder a otro vehículo una parte de tu carril para que pase rozándote. Mantén separación frontal suficiente y espacio lateral. Cambiar de posición dentro del carril no justifica invadir otro ni sorprender a usuarios cercanos. En túneles se aplican las separaciones específicas del tema 10.</p>`,tip:'Derecho como carril habitual no significa rozar el borde de la calzada.',errs:['Circular pegado a coches estacionados.','Confiar en que una moto siempre frena en menos espacio que un coche.'],ref:'RGC, arts. 29, 31 y 54. DGT, posición en la vía',source:'#a31'},
 {id:'M4L3',t:'Uso excepcional del arcén',min:5,key:'El arcén no es un carril general para motos: su uso extraordinario exige habilitación y condiciones.',
 body:`<p>Desde octubre de 2026, puede habilitarse el <b>arcén derecho</b> para motos en tramos acordados por las autoridades y señalizados con señales verticales y marcas. La habilitación solo opera cuando el tráfico de los carriles está <b>detenido por congestión</b>.</p><p>En esos tramos, el máximo es <b>30 km/h</b> y se circula en columna de a uno, extremando la precaución. Respeta a quienes están obligados a usar el arcén y abandónalo si es necesario para no ponerlos en riesgo. Una cola por sí sola no habilita cualquier arcén. Se mantienen además los supuestos generales de emergencia previstos por el artículo 36.</p>`,tip:'Busca habilitación señalizada, tráfico detenido, máximo 30 y fila de uno.',errs:['Usar cualquier arcén por ver una retención.','Circular por el arcén mientras los carriles avanzan lentamente en vez de estar detenidos.'],ref:'RGC, art. 36.3, vigente desde octubre de 2026',source:'#a36'},
 {id:'M4L4',t:'Adelantar y respetar el espacio',min:5,key:'La menor anchura de la moto no elimina las obligaciones de seguridad del adelantamiento.',
 body:`<p>Como regla adelanta por la izquierda, con las excepciones legales, y observa antes de desplazarte. Fuera de poblado, una moto de dos ruedas debe dejar <b>al menos 1,5 metros</b> respecto a las partes más salientes del vehículo adelantado. Para adelantar a ciclistas y otros usuarios del artículo 85.4 se aplican también sus condiciones, incluida la reducción respecto al límite.</p><p>No invadas el sentido contrario sin visibilidad ni hagas eslalon entre vehículos creando riesgo. Que haya hueco físico no demuestra que la maniobra esté permitida. No sobrepases líneas, semáforos o reservas incompatibles con tu trayectoria.</p>`,tip:'Antes de usar un hueco, comprueba legalidad, visibilidad y separación.',errs:['Pasar rozando porque la moto cabe.','Interpretar un atasco como permiso para cualquier adelantamiento.'],ref:'RGC, arts. 74, 82, 84, 85 y 87',source:'#a85'},
 {id:'M4L5',t:'Cruces, glorietas y señales',min:4,key:'La moto aplica las mismas prioridades y debe anunciarlas y resolverlas con margen.',
 body:`<p>Observa señales, semáforos y posibles errores ajenos. Cede al entrar en una glorieta según su regulación y no cortes desde un carril interior la trayectoria del exterior para salir. Si no puedes colocarte a tiempo con seguridad, continúa y prepara otra oportunidad.</p><p>Señaliza giros y cambios de carril y cancela el intermitente al terminar si tu modelo no lo hace. No supongas que por ocupar menos espacio puedes pasar un STOP sin detenerte. En un cruce con prioridad, prepara también la respuesta si otro no te detecta.</p>`,tip:'Ser pequeño no reduce la necesidad de ser previsible.',errs:['Dejar un intermitente olvidado.','Salir de una glorieta cruzando el carril de otro vehículo.'],ref:'RGC, arts. 56, 57, 74 y 109',source:'#a74'},
 {id:'M4L6',t:'Comunicación y estacionamiento',min:4,key:'Señaliza sin distraerte y comprueba la regulación local antes de aparcar.',
 body:`<p>No manipules el móvil durante la conducción. La norma exceptúa dispositivos inalámbricos certificados u homologados integrados en el casco para intercomunicación o navegación, si no afectan a la seguridad. Eso no autoriza cualquier auricular ni cualquier uso. Prepara el destino parado en un lugar permitido y seguro.</p><p>Para aparcar, respeta señales, reservas y ordenanzas. Los ayuntamientos pueden regular el estacionamiento de dos ruedas en determinadas zonas peatonales con condiciones, pero no existe permiso universal para dejar la moto en cualquier acera. Protege el paso accesible y asegura la estabilidad de la moto.</p>`,tip:'Una autorización de otra ciudad no demuestra que aquí esté permitido.',errs:['Usar un auricular corriente como si fuera un dispositivo integrado autorizado.','Bloquear una zona peatonal por haber sitio junto a una pared.'],ref:'RGC, arts. 18, 91, 94 y 156',source:'#a18'}
 ],questions:[
 {id:'q572',l:'M4L1',q:'Una moto limitada a 25 kW deriva de otra de 70 kW. ¿Cumple por ese dato las condiciones del A2?',o:['No, el origen supera el doble de su potencia limitada','Sí, porque 25 es menor que 35','Sí, porque 70 es un máximo universal de origen'],c:0,e:'Para 25 kW, el doble es 50 kW. No basta con estar por debajo de 35 kW.',r:'Reglamento General de Conductores, art. 4.2.c'},
 {id:'q573',l:'M4L1',q:'¿Qué relación potencia/peso máxima autoriza el A2?',o:['0,1 kW/kg','0,2 kW/kg','0,5 kW/kg'],c:1,e:'El máximo del A2 es de 0,2 kW/kg, junto a las demás condiciones.',r:'Reglamento General de Conductores, art. 4.2.c'},
 {id:'q574',l:'M4L1',q:'Tienes B en vigor desde hace más de tres años. ¿Puedes por ello conducir cualquier moto A2?',o:['Sí, sin límites','Sí, si es automática','No, la habilitación nacional del B se refiere a motos de A1'],c:2,e:'La antigüedad del B no lo convierte en un permiso A2.',r:'Reglamento General de Conductores, art. 5.7'},
 {id:'q575',l:'M4L1',q:'Solicitas A2 y ya tienes B en vigor. ¿De qué prueba teórica estás exento por ese hecho?',o:['De la común','De toda prueba específica y práctica','Solo de las preguntas sobre señales'],c:0,e:'El B permite la exención del teórico común, no del específico de moto por sí solo.',r:'Reglamento General de Conductores, art. 54'},
 {id:'q576',l:'M4L1',q:'¿La cilindrada por sí sola demuestra que una moto es apta para A2?',o:['Sí, si es menor de 500 cm³','No, deben comprobarse potencia, relación y origen','Sí, si tiene dos cilindros'],c:1,e:'El A2 se define por condiciones de potencia, relación potencia/peso y vehículo de origen.',r:'Reglamento General de Conductores, art. 4.2.c'},
 {id:'q577',l:'M4L2',q:'Fuera de poblado hay dos carriles para tu sentido y no necesitas adelantar. ¿Qué carril utilizas normalmente con la moto?',o:['El izquierdo para ser más visible','El central si hay tres','El derecho'],c:2,e:'La regla general de uso del carril derecho también afecta a la motocicleta.',r:'RGC, art. 31'},
 {id:'q578',l:'M4L2',q:'Circulas junto a una fila de coches estacionados. ¿Qué riesgo lateral debes prever?',o:['Que una puerta pueda abrirse y necesites margen','Que todos saldrán a la vez','Que el bordillo siempre tenga más agarre'],c:0,e:'La posición debe reservar espacio ante una posible apertura o incorporación.',r:'DGT, posición y anticipación en moto'},
 {id:'q579',l:'M4L2',q:'Un turismo intenta compartir tu carril pasando muy cerca. ¿El tamaño de la moto justifica ese roce?',o:['Sí, si cabe','No, el adelantamiento debe respetar el espacio y la seguridad','Sí, en una autovía'],c:1,e:'La anchura de la moto no elimina las reglas de adelantamiento y separación.',r:'RGC, arts. 84 y 85'},
 {id:'q580',l:'M4L2',q:'¿Puedes asumir que una moto siempre se detiene antes que cualquier coche?',o:['Sí, pesa menos','Sí, si lleva ABS','No, depende del agarre, frenos y respuesta del conductor'],c:2,e:'La distancia necesaria varía y debe dejarse margen suficiente.',r:'RGC, art. 54. DGT, frenado'},
 {id:'q581',l:'M4L2',q:'En el borde de tu carril hay arena. ¿Qué debe guiar tu posición?',o:['Evitarla con observación y suavidad dentro del espacio permitido','Mantenerme sobre ella para dejar hueco a otros','Cambiar bruscamente al carril contiguo'],c:0,e:'La posición debe preservar agarre, margen y previsibilidad sin invadir otros espacios.',r:'DGT, posición en la vía. RGC, arts. 17 y 29'},
 {id:'q582',l:'M4L3',q:'Hay una retención, pero el arcén no está habilitado y señalizado para uso extraordinario de motos. ¿Puedes usarlo solo por la congestión?',o:['Sí, a menos de 30 km/h','No, la retención por sí sola no autoriza ese uso','Sí, si es suficientemente ancho'],c:1,e:'La excepción requiere un tramo habilitado y las demás condiciones del artículo 36.3.',r:'RGC, art. 36.3'},
 {id:'q583',l:'M4L3',q:'En un tramo debidamente habilitado para motos, ¿cuándo opera el uso extraordinario del arcén por congestión?',o:['Siempre que el tráfico vaya por debajo de 50 km/h','Cuando un conductor desee adelantar','Cuando los carriles estén detenidos por congestión'],c:2,e:'La norma exige tráfico detenido, no cualquier circulación lenta.',r:'RGC, art. 36.3'},
 {id:'q584',l:'M4L3',q:'¿Cuál es el máximo de la moto en el arcén extraordinario habilitado por congestión?',o:['30 km/h','45 km/h','60 km/h'],c:0,e:'La habilitación limita la velocidad a 30 km/h.',r:'RGC, art. 36.3'},
 {id:'q585',l:'M4L3',q:'¿Cómo deben circular las motos en ese uso extraordinario del arcén?',o:['En paralelo si caben','En columna de a uno y extremando precaución','Por cualquiera de los dos arcenes'],c:1,e:'El régimen se refiere al arcén derecho y exige columna de a uno.',r:'RGC, art. 36.3'},
 {id:'q586',l:'M4L3',q:'Una bicicleta obligada a usar el arcén quedaría en riesgo por tu paso en la moto. ¿Qué corresponde?',o:['Pedirle que salga a la calzada','Pasar si no supero 30 km/h','Evitar el riesgo y abandonar el arcén si es necesario'],c:2,e:'El uso extraordinario no permite perjudicar a los usuarios obligados a circular por el arcén.',r:'RGC, art. 36.3'},
 {id:'q587',l:'M4L4',q:'Fuera de poblado, adelantas con una moto de dos ruedas a un turismo. ¿Qué separación lateral mínima dejas?',o:['1,5 metros respecto a sus partes más salientes','Medio metro','La que permita no tocarlo'],c:0,e:'La norma exige al menos 1,5 metros al adelantar fuera de poblado con un vehículo de dos ruedas.',r:'RGC, art. 85.5'},
 {id:'q588',l:'M4L4',q:'Hay hueco entre vehículos, pero usarlo supondría cruzar una línea que lo prohíbe. ¿Basta con que la moto quepa?',o:['Sí, porque no es un turismo','No, debo respetar la delimitación y las normas de maniobra','Sí, a baja velocidad'],c:1,e:'El hueco físico no transforma en permitida una trayectoria prohibida.',r:'RGC, arts. 74 y 132'},
 {id:'q589',l:'M4L4',q:'¿Por qué lado se adelanta como regla general con una motocicleta?',o:['Por el más estrecho','Por la derecha','Por la izquierda'],c:2,e:'Se aplican las reglas generales y sus excepciones expresas.',r:'RGC, art. 82'},
 {id:'q590',l:'M4L4',q:'Un adelantamiento requiere invadir el contrario sin visibilidad suficiente. ¿Qué haces?',o:['Espero una oportunidad permitida y segura','Lo inicio por ser la moto más corta','Paso si no he visto venir a nadie'],c:0,e:'No ver a otro no equivale a disponer de visibilidad suficiente.',r:'RGC, arts. 84 y 87'},
 {id:'q591',l:'M4L4',q:'Fuera de poblado, adelantas a un ciclista en un tramo limitado a 80 km/h. ¿Qué máximo impone la reducción específica durante la maniobra?',o:['80 km/h','60 km/h','100 km/h'],c:1,e:'El artículo 85.4 exige al menos 20 km/h por debajo del límite antes y durante el adelantamiento.',r:'RGC, art. 85.4'},
 {id:'q592',l:'M4L5',q:'Vas por el carril interior de una glorieta y otro vehículo ocupa el exterior junto a ti. ¿Puedes cruzarlo directamente para salir?',o:['Sí, si lo indico','Sí, por ser una moto','No, debo preparar el cambio respetando su prioridad'],c:2,e:'Cambiar de carril exige respetar a quien ya lo ocupa.',r:'RGC, art. 74.2'},
 {id:'q593',l:'M4L5',q:'Terminas un giro y el intermitente de tu moto sigue activado. ¿Qué haces?',o:['Lo cancelo para no anunciar una intención falsa','Lo dejo hasta el próximo giro','Lo sustituyo por luces de emergencia'],c:0,e:'La señal debe cesar cuando termina la maniobra.',r:'RGC, art. 109'},
 {id:'q594',l:'M4L5',q:'Hay un STOP y apenas hay tráfico. ¿La moto debe detenerse por completo?',o:['Solo si viene un turismo','Sí, igual que los demás vehículos sujetos a la señal','No, basta bajar a paso de peatón'],c:1,e:'El tamaño o agilidad de la moto no reduce la obligación de detención.',r:'RGC, art. 56 y anexo I, señal R-2'},
 {id:'q595',l:'M4L5',q:'No puedes colocarte a tiempo para salir de una glorieta sin cortar a otro. ¿Qué haces?',o:['Freno de golpe en el interior','Cruzo porque la salida ya estaba señalizada','Continúo y preparo otra oportunidad segura'],c:2,e:'Una salida perdida no justifica cruzar la trayectoria de otro vehículo.',r:'RGC, arts. 3 y 74'},
 {id:'q596',l:'M4L5',q:'Tienes prioridad y un coche parece no detectar tu moto. ¿Qué debes prever?',o:['Una respuesta segura si no cede','Que obligatoriamente frenará a tiempo','Que puedes desatender el cruce'],c:0,e:'La conducción preventiva contempla errores ajenos incluso cuando tienes prioridad.',r:'RGC, arts. 3 y 17. DGT, anticipación'},
 {id:'q597',l:'M4L6',q:'¿Qué dispositivo de comunicación admite la excepción para motoristas?',o:['Cualquier auricular conectado','Un inalámbrico certificado u homologado integrado en el casco para intercomunicación o navegación y uso seguro','El móvil sostenido con una mano'],c:1,e:'La excepción tiene condiciones de integración, finalidad y seguridad.',r:'RGC, art. 18.2. Ley de Tráfico, art. 13.3'},
 {id:'q598',l:'M4L6',q:'Necesitas introducir otra ruta en el móvil mientras conduces la moto. ¿Qué haces?',o:['Lo manipulo al circular recto','Lo manejo en una retención mientras avanzo','Estaciono de forma permitida y segura para prepararlo'],c:2,e:'El dispositivo no debe manipularse durante la conducción.',r:'RGC, art. 18'},
 {id:'q599',l:'M4L6',q:'En otra ciudad se admite aparcar motos en algunas aceras. ¿Puedes aplicarlo aquí sin comprobar?',o:['No, debo consultar las condiciones locales y respetar el paso peatonal','Sí, para cualquier moto','Sí, si no hay señal de prohibición visible'],c:0,e:'La ordenanza puede regular ciertos supuestos; no existe una autorización universal.',r:'RGC, art. 156.2'},
 {id:'q600',l:'M4L6',q:'Un hueco para aparcar dejaría bloqueado un itinerario peatonal accesible. ¿Qué haces?',o:['Lo uso si la moto es estrecha','Busco un lugar permitido que mantenga libre el paso','Lo uso con luces de emergencia'],c:1,e:'El estacionamiento no debe perjudicar la movilidad y seguridad de los peatones.',r:'RGC, arts. 91, 94 y 156'},
 {id:'q601',l:'M4L6',q:'¿Un dispositivo integrado autorizado elimina el riesgo de distracción?',o:['Sí, en cualquier conversación','Sí, si no uso las manos','No, debo mantener la atención y un uso compatible con la seguridad'],c:2,e:'La excepción legal mantiene expresamente la condición de seguridad de la conducción.',r:'RGC, art. 18.2'}
 ]},
 'M5':{desc:'Comprueba quién puede viajar contigo, adapta la moto y transporta equipaje y remolque de forma reglamentaria.',sims:[],lessons:[
 {id:'M5L1',t:'Quién puede viajar como pasajero',min:5,key:'La moto debe admitir pasajero y esa persona debe cumplir edad, equipo y posición.',
 body:`<p>Puede viajar un pasajero si la autorización del vehículo lo permite y existe la plaza correspondiente. Como regla, debe ser <b>mayor de doce años</b>. Excepcionalmente pueden viajar mayores de siete con su padre, madre o tutor, o con una persona mayor de edad autorizada por ellos, cumpliendo las demás condiciones.</p><p>Debe llevar casco reglamentario, ir a horcajadas en el asiento tras el conductor y apoyar los pies en reposapiés laterales. Nunca entre quien conduce y el manillar. Se aplican también guantes interurbanos y calzado cerrado exigidos por la norma.</p>`,tip:'Comprueba plaza autorizada, edad, conductor autorizado, pies y equipo.',errs:['Transportar un niño delante del conductor.','Suponer que basta con la edad aunque no alcance los reposapiés.'],ref:'RGC, arts. 12 y 118',source:'#a12'},
 {id:'M5L2',t:'Explicar al pasajero cómo colaborar',min:4,key:'Antes de salir, acuerda una conducta tranquila que no altere el equilibrio.',
 body:`<p>Explica cómo subir y bajar cuando el conductor haya preparado la moto. El pasajero mantiene pies en reposapiés, se sujeta en los puntos adecuados y acompaña suavemente la inclinación sin intentar contrarrestarla. Evita movimientos repentinos o distraer al conductor.</p><p>Conviene acordar una señal para pedir una parada sin sorprender. Si necesita ajustar equipo o se encuentra mal, busca una detención segura. El conductor debe adaptar aceleraciones, frenadas y curvas al peso y a la experiencia del acompañante.</p>`,tip:'Una breve explicación parado evita sorpresas en marcha.',errs:['Bajar los pies del pasajero en cada semáforo.','Moverse en sentido contrario a la inclinación por miedo.'],ref:'DGT, circulación con pasajero en motocicleta',source:COURSE_SOURCES.moto},
 {id:'M5L3',t:'Preparar la moto para más peso',min:4,key:'El pasajero y la carga cambian respuesta, geometría y capacidad de frenado.',
 body:`<p>Respeta la MMA y la carga autorizada. Ajusta presión, suspensión y altura de faros cuando corresponda según el fabricante. Un peso adicional atrás puede elevar el haz y deslumbrar, además de modificar la respuesta de la dirección.</p><p>Prevé menor capacidad de aceleración y más espacio para las maniobras y detenciones. Evita aceleraciones bruscas y aumenta los márgenes de adelantamiento e incorporación. El equipaje debe quedar sujeto y no impedir al pasajero una postura correcta.</p>`,tip:'Prepara ajustes y márgenes antes de iniciar el trayecto con acompañante.',errs:['Mantener ajustes de carga ligera sin consultar el manual.','Calcular un adelantamiento como si fueras solo.'],ref:'DGT, circulación con pasajero. RGC, arts. 14 y 45',source:COURSE_SOURCES.moto},
 {id:'M5L4',t:'Equipaje y límites de dimensiones',min:5,key:'La carga debe quedar estable, sujeta y dentro de los límites que correspondan.',
 body:`<p>Reparte el peso de forma equilibrada, baja y próxima al centro de la moto, según sus accesorios y límites. Evita objetos que rocen rueda, cadena o escape, oculten alumbrado o impidan manejar. Comprueba cierres y sujeciones.</p><p>En un vehículo de <b>anchura inferior a un metro</b>, la carga no puede sobresalir por delante; por detrás, como máximo 0,25 m; lateralmente, no más de 0,50 m a cada lado del <b>eje longitudinal</b>. No son 0,50 m desde cada borde. Respeta también los límites técnicos del vehículo y accesorios.</p>`,tip:'Mide el lateral desde el eje central, no desde la carrocería.',errs:['Confundir el límite lateral desde el eje con un saliente añadido a cada costado.','Dejar una correa cerca de la cadena.'],ref:'RGC, arts. 14 y 15.4',source:'#a15'},
 {id:'M5L5',t:'Remolque de motocicleta',min:5,key:'Arrastrar un remolque exige condiciones técnicas y unas reglas específicas.',
 body:`<p>Cuando el conjunto esté técnicamente autorizado, la moto puede arrastrar remolque o semirremolque que no supere el <b>50 % de su masa en vacío</b>. Circula de día y con visibilidad que no esté disminuida; no transportes personas en el remolque.</p><p>La velocidad debe reducirse un <b>10 % respecto a la genérica</b> del artículo 48 para el vehículo, respetando además límites inferiores señalizados y condiciones de seguridad. En circulación urbana rigen las ordenanzas correspondientes. Prevé cambios de frenada, longitud y estabilidad y consulta el equipo homologado.</p>`,tip:'Cincuenta por ciento de masa en vacío, día, buena visibilidad y reducción del diez por ciento.',errs:['Calcular el remolque según la MMA en lugar de la masa en vacío.','Llevar personas en el remolque.'],ref:'RGC, art. 12.3',source:'#a12'},
 {id:'M5L6',t:'Viajes con acompañante y en grupo',min:4,key:'Cada motorista conserva su responsabilidad y su margen, aunque viaje en compañía.',
 body:`<p>Acuerda ruta, paradas y puntos de encuentro. Adapta el ritmo a la experiencia de quienes viajan, dentro de las normas. Si pierdes al grupo, continúa con seguridad hacia un punto acordado; no cruces un semáforo rojo para alcanzarlo.</p><p>Conserva espacio para frenar y maniobrar. Evita circular en paralelo compartiendo un carril estrecho. Cada adelantamiento se decide con visibilidad propia; seguir a otra moto no demuestra que haya hueco para ti. Revisa equipaje y estado del pasajero durante las pausas.</p>`,tip:'Un punto de encuentro reduce la presión de mantenerse pegado al grupo.',errs:['Adelantar porque la moto de delante pudo hacerlo.','Acelerar por encima de tu capacidad para no quedarte atrás.'],ref:'DGT, circulación en grupo. RGC, arts. 3, 45, 54 y 84',source:COURSE_SOURCES.moto}
 ],questions:[
 {id:'q602',l:'M5L1',q:'Una moto solo tiene autorizada la plaza del conductor. ¿Puedes llevar un pasajero adulto?',o:['No, la autorización del vehículo debe permitirlo','Sí, si pesa poco','Sí, si hay espacio sobre el asiento'],c:0,e:'El espacio físico no sustituye la autorización y dotación para pasajero.',r:'RGC, art. 12.1'},
 {id:'q603',l:'M5L1',q:'Un menor de diez años viaja con una persona adulta que no es su progenitor ni tutor. ¿Qué requiere la excepción de edad, además del resto de condiciones?',o:['Solo que el menor quiera ir','Autorización de padre, madre o tutor para ese conductor adulto','Que el trayecto no supere un kilómetro'],c:1,e:'La excepción para mayores de siete exige el vínculo previsto o la autorización de los responsables.',r:'RGC, art. 12.2'},
 {id:'q604',l:'M5L1',q:'Un niño de ocho años viaja con su madre en una moto autorizada para pasajero. ¿Qué debe cumplir también?',o:['Sentarse delante para ser vigilado','Llevar solo casco aunque no llegue a los apoyos','Usar el equipo exigido, ir detrás a horcajadas y apoyar los pies en reposapiés'],c:2,e:'La excepción de edad no elimina las condiciones de equipo y posición.',r:'RGC, arts. 12.1, 12.2 y 118'},
 {id:'q605',l:'M5L1',q:'¿Puede un pasajero situarse entre el conductor y el manillar?',o:['No, está expresamente prohibido','Sí, si es menor','Sí, a baja velocidad'],c:0,e:'La posición reglamentaria es detrás del conductor, con los apoyos correspondientes.',r:'RGC, art. 12.1'},
 {id:'q606',l:'M5L1',q:'Un pasajero de catorce años no alcanza los reposapiés. ¿Basta con superar la edad general?',o:['Sí, puede llevar los pies colgando','No, también debe cumplir la posición y apoyos exigidos','Sí, si el conductor lo sujeta'],c:1,e:'Edad, autorización de plaza, postura y equipo deben cumplirse conjuntamente.',r:'RGC, art. 12.1'},
 {id:'q607',l:'M5L2',q:'¿Cómo debe comportarse el pasajero al inclinar la moto en una curva?',o:['Contrarrestando el movimiento de forma brusca','Permaneciendo siempre vertical a cualquier precio','Acompañando suavemente el movimiento sin desestabilizar'],c:2,e:'Intentar contrarrestar la inclinación puede alterar el equilibrio y la trayectoria.',r:'DGT, circulación con pasajero'},
 {id:'q608',l:'M5L2',q:'¿Cuándo debe subir o bajar el pasajero?',o:['Cuando el conductor haya preparado y estabilizado la moto','En cuanto se acerque al bordillo aunque aún ruede','Sin avisar para hacerlo más rápido'],c:0,e:'La coordinación evita una transferencia de peso inesperada.',r:'DGT, circulación con pasajero'},
 {id:'q609',l:'M5L2',q:'Al detenerse en un semáforo, ¿qué debe hacer normalmente el pasajero con los pies?',o:['Apoyarlos siempre en el suelo','Mantenerlos en los reposapiés','Colocarlos sobre la rueda'],c:1,e:'El conductor gestiona el apoyo y el pasajero mantiene su posición estable.',r:'DGT, circulación con pasajero'},
 {id:'q610',l:'M5L2',q:'El pasajero necesita ajustar el casco durante el viaje. ¿Qué es adecuado?',o:['Que se levante en marcha','Que el conductor lo ajuste con una mano','Pedir una detención segura y ajustarlo parado'],c:2,e:'El equipo debe resolverse sin comprometer control ni equilibrio.',r:'RGC, arts. 17 y 18. DGT, pasajero'},
 {id:'q611',l:'M5L2',q:'Un acompañante nunca ha viajado en moto. ¿Qué conviene hacer antes?',o:['Explicarle sujeción, postura, movimientos y cómo pedir una parada','Suponer que aprenderá mirando','Pedirle que se mueva para compensar cada giro'],c:0,e:'La preparación facilita una conducta previsible y estable.',r:'DGT, circulación con pasajero'},
 {id:'q612',l:'M5L3',q:'Con pasajero y equipaje, ¿qué debes revisar en los ajustes?',o:['Solo la música del intercomunicador','Presión, suspensión y faros según la carga y el fabricante','Solo la altura del asiento del pasajero'],c:1,e:'El peso modifica el comportamiento y puede elevar el haz de luz.',r:'DGT, circulación con pasajero. Manual del fabricante'},
 {id:'q613',l:'M5L3',q:'¿Cómo puede cambiar la capacidad de aceleración al añadir pasajero?',o:['Mejora siempre','No cambia nunca','Puede disminuir y exige prever más margen'],c:2,e:'La carga adicional debe tenerse en cuenta al incorporarse o adelantar.',r:'DGT, circulación con pasajero'},
 {id:'q614',l:'M5L3',q:'La moto supera su MMA con dos personas y equipaje. ¿Qué haces?',o:['Reduzco carga o cambio el plan antes de circular','Sigo si la suspensión aguanta','Compenso aumentando mucho la presión'],c:0,e:'Los ajustes no autorizan a superar la masa máxima.',r:'RGV, masas. RGC, art. 14'},
 {id:'q615',l:'M5L3',q:'Al cargar atrás, el faro apunta más alto. ¿Qué debes hacer?',o:['Mantenerlo para ver más lejos','Ajustarlo según el fabricante para no deslumbrar','Apagarlo de día'],c:1,e:'La variación de geometría puede causar deslumbramiento y necesita el ajuste previsto.',r:'RGC, art. 102. DGT, pasajero'},
 {id:'q616',l:'M5L3',q:'¿Cómo conviene adaptar las maniobras con pasajero?',o:['Acelerando más fuerte para compensar','Frenando más tarde para evitar movimientos','Con suavidad y mayor previsión y margen'],c:2,e:'Las prestaciones y el equilibrio cambian con la carga adicional.',r:'DGT, circulación con pasajero'},
 {id:'q617',l:'M5L4',q:'¿Dónde conviene situar el equipaje dentro de los límites del fabricante?',o:['Equilibrado, sujeto y evitando peso alto innecesario','Todo en un lateral','Suelto sobre el asiento del pasajero'],c:0,e:'El reparto y la sujeción ayudan a conservar estabilidad.',r:'RGC, art. 14. DGT, carga en moto'},
 {id:'q618',l:'M5L4',q:'En una moto de anchura inferior a un metro, ¿desde dónde se mide el límite lateral de 0,50 m de la carga?',o:['Desde cada borde exterior','Desde el eje longitudinal a cada lado','Desde cada extremo del manillar'],c:1,e:'El límite se mide desde el eje central, no como un añadido al costado.',r:'RGC, art. 15.4'},
 {id:'q619',l:'M5L4',q:'En ese vehículo de anchura inferior a un metro, ¿cuánto puede sobresalir la carga por detrás como máximo?',o:['0,50 metros','Un metro','0,25 metros'],c:2,e:'El artículo 15.4 establece ese máximo posterior y prohíbe saliente delantero.',r:'RGC, art. 15.4'},
 {id:'q620',l:'M5L4',q:'¿Puede sobresalir la carga por delante de una moto de anchura inferior a un metro?',o:['No','Sí, hasta 0,25 m','Sí, hasta 0,50 m'],c:0,e:'La regla específica prohíbe el saliente por la extremidad anterior.',r:'RGC, art. 15.4'},
 {id:'q621',l:'M5L4',q:'Una correa del equipaje queda junto a la cadena. ¿Qué haces?',o:['La dejo si no toca en parado','La recojo y aseguro antes de circular','La engraso para que no roce'],c:1,e:'Una parte suelta puede engancharse en la transmisión y crear peligro.',r:'RGC, art. 14'},
 {id:'q622',l:'M5L5',q:'El remolque de una moto técnicamente autorizada no puede superar, según la regla general, ¿qué referencia?',o:['El 50 % de la MMA de la moto','Toda la masa en vacío de la moto','El 50 % de la masa en vacío de la moto'],c:2,e:'La referencia del artículo 12.3 es la masa en vacío del vehículo tractor.',r:'RGC, art. 12.3'},
 {id:'q623',l:'M5L5',q:'Fuera del régimen urbano de ordenanza, ¿puedes arrastrar remolque con una moto de noche?',o:['No, la regla exige circulación de día y visibilidad no disminuida','Sí, con antiniebla','Sí, si el remolque está vacío'],c:0,e:'La autorización del artículo 12.3 tiene condiciones de luz y visibilidad.',r:'RGC, art. 12.3.a'},
 {id:'q624',l:'M5L5',q:'¿Qué reducción de velocidad exige la regla general de moto con remolque respecto a la genérica del artículo 48?',o:['Ninguna','Un diez por ciento','Siempre veinte kilómetros por hora'],c:1,e:'La reducción es del 10 %, sin superar otros límites que correspondan.',r:'RGC, art. 12.3.b'},
 {id:'q625',l:'M5L5',q:'¿Puede llevar personas el remolque arrastrado por una moto?',o:['Sí, con casco','Sí, si son adultas','No, está prohibido'],c:2,e:'El artículo 12.3 impide transportar personas en el vehículo remolcado.',r:'RGC, art. 12.3.c'},
 {id:'q626',l:'M5L5',q:'En circulación urbana con remolque de moto, ¿qué debes comprobar?',o:['La ordenanza correspondiente además de la compatibilidad técnica','Solo que el remolque tenga ruedas','Que el pasajero pueda sujetarlo'],c:0,e:'El artículo 12.3 remite en ámbito urbano a las ordenanzas municipales.',r:'RGC, art. 12.3'},
 {id:'q627',l:'M5L6',q:'El grupo pasa un semáforo y a ti te cambia a rojo. ¿Qué haces?',o:['Sigo para no perderlo','Me detengo y me reúno después en un punto acordado','Paso si aún veo la última moto'],c:1,e:'Circular en grupo no concede una excepción a la señal.',r:'RGC, arts. 3 y 132. DGT, circulación en grupo'},
 {id:'q628',l:'M5L6',q:'La moto de delante ha adelantado con seguridad. ¿Eso demuestra que también hay espacio para ti?',o:['Sí, si acelero igual','Sí, si llevamos la misma moto','No, debo comprobar mi propia maniobra'],c:2,e:'La visibilidad y el hueco deben valorarse para cada adelantamiento.',r:'RGC, art. 84'},
 {id:'q629',l:'M5L6',q:'¿Qué acuerdo ayuda a evitar que alguien corra para no perder al grupo?',o:['Ruta y puntos de encuentro seguros','No permitir que nadie se separe','Seguir siempre a la rueda del anterior'],c:0,e:'Un plan compartido reduce la presión de mantener un contacto peligroso.',r:'DGT, circulación en grupo'},
 {id:'q630',l:'M5L6',q:'El ritmo del grupo supera tu capacidad de conducir con seguridad. ¿Qué haces?',o:['Me esfuerzo aunque vaya sin margen','Mantengo un ritmo seguro y uso el plan de encuentro','Compenso frenando más tarde'],c:1,e:'Cada conductor conserva su responsabilidad y debe adaptar su velocidad.',r:'RGC, art. 45. DGT, circulación en grupo'},
 {id:'q631',l:'M5L6',q:'Dos motos comparten un carril estrecho en paralelo sin margen para maniobrar. ¿Es una disposición prudente?',o:['Sí, permite hablar','Sí, si llevan el mismo ritmo','No, deben conservar espacio suficiente para controlar y frenar'],c:2,e:'La proximidad lateral reduce alternativas y puede crear riesgo.',r:'RGC, arts. 3, 17 y 54. DGT, circulación en grupo'}
 ]},
 'M6':{desc:'Identifica riesgos de ciudad, adherencia, viento, noche y averías y elige respuestas que conserven control y margen.',sims:[],lessons:[
 {id:'M6L1',t:'Cruces urbanos y vehículos que no te ven',min:4,key:'Anticipa errores de detección en accesos, giros y puertas.',
 body:`<p>Una moto puede ocultarse tras un pilar, otro vehículo o un ángulo muerto. Al acercarte a un cruce, observa ruedas y movimientos sin dar por hecho que el conductor te ha detectado. Ajusta velocidad y margen aunque tengas prioridad.</p><p>Conserva espacio junto a vehículos estacionados y evita permanecer en zonas ocultas de camiones o autobuses. Si no puedes confirmar una maniobra segura, espera. Ver una señal favorable no demuestra que todos la cumplirán. Usa alumbrado y señalización correctos sin convertir la visibilidad en una garantía.</p>`,tip:'Prepara una salida segura antes de necesitarla, sin invadir otros espacios.',errs:['Interpretar una mirada como confirmación de que te han visto.','Permanecer pegado al lateral de un vehículo grande.'],ref:'RGC, arts. 3, 17, 18 y 45. DGT, riesgos en moto',source:COURSE_SOURCES.moto},
 {id:'M6L2',t:'Lluvia, pintura, metal y gravilla',min:4,key:'Detecta las superficies de poco agarre y reduce antes de pisarlas cuando sea posible.',
 body:`<p>Con lluvia, pintura vial, tapas metálicas, hojas, aceite o arena pueden ofrecer menos agarre. Observa y prepara la velocidad antes de llegar. Al atravesar una zona deslizante, evita acciones bruscas y una inclinación innecesaria.</p><p>No busques evitar una tapa con un volantazo que te lleve a otro carril. Mantén las maniobras dentro de tu espacio y adapta el margen. Las primeras gotas pueden mezclar agua y suciedad. Neumáticos en condiciones y mandos suaves ayudan, pero no eliminan el riesgo.</p>`,tip:'Identifica el cambio de superficie y prepárate antes de estar encima.',errs:['Frenar bruscamente sobre una marca mojada.','Esquivar gravilla invadiendo el carril contrario sin comprobar.'],ref:'RGC, arts. 17, 45 y 46. DGT, riesgos de adherencia en moto',source:COURSE_SOURCES.motoEquipment},
 {id:'M6L3',t:'Viento y vehículos grandes',min:4,key:'Una ráfaga o un cambio de resguardo puede alterar el equilibrio y la trayectoria.',
 body:`<p>Anticipa viento lateral en puentes, zonas abiertas y salidas de túneles. Al pasar junto a un vehículo voluminoso, su pantalla puede ocultar el viento y devolverlo de golpe al terminar. Reduce con margen, sujeta los mandos con control y evita correcciones bruscas.</p><p>Deja separación lateral y no te acerques para buscar refugio. La carga alta puede aumentar la sensibilidad al viento. Si no puedes mantener la trayectoria con seguridad, busca un lugar adecuado para detenerte o cambia el plan. No atravieses una zona cerrada por viento.</p>`,tip:'El fin de una zona protegida es un lugar donde esperar cambios de empuje.',errs:['Acercarse a un camión para usarlo de pantalla.','Mantener la velocidad aunque el viento impida controlar la moto.'],ref:'RGC, arts. 17 y 45. DGT, viento y conducción de moto',source:SAFETY_SOURCES.wind},
 {id:'M6L4',t:'Noche, fatiga y visibilidad',min:4,key:'Tu campo de visión y tu estado determinan cuánto margen necesitas.',
 body:`<p>De noche, ajusta la marcha a lo que ves y conserva luces y visera en condiciones. Cambia de largas a cruce si puedes deslumbrar. Si te deslumbran, reduce lo necesario, incluso hasta detenerte, manteniendo el control.</p><p>El frío, el ruido, el calor y una postura sostenida pueden favorecer cansancio. Programa pausas y adelántalas si aparece fatiga o sueño. Un estimulante, una conversación o el aire en la cara no sustituyen descansar. Alcohol y medicación pueden aumentar los riesgos; consulta el tema 11 antes de conducir.</p>`,tip:'Llegar antes no compensa continuar sin visión o sin atención.',errs:['Seguir con sueño para no perder al grupo.','Usar una visera oscura en una carretera sin iluminación.'],ref:'RGC, arts. 17, 45 y 102. DGT, fatiga y conducción nocturna',source:RISK_SOURCES.sleep},
 {id:'M6L5',t:'Pinchazo, inestabilidad y avería',min:4,key:'Conserva el control, reduce de forma dosificada y busca una detención segura.',
 body:`<p>Si notas pérdida de presión o una respuesta inestable, evita frenazos y giros repentinos. Sujeta los mandos, reduce de forma progresiva en la medida que permita el control y apártate a un lugar seguro. No continúes solo porque aún puedes mover la moto.</p><p>Una oscilación o ruido nuevo exige identificar la causa antes de seguir. Pide asistencia si no puedes resolverla con seguridad. No hagas reparaciones expuesto al tráfico. La V-16 no es dotación obligatoria general de una moto, pero la DGT recomienda usarla; el chaleco sí tiene el régimen vigente explicado en M1.</p>`,tip:'No añadas una maniobra brusca a una pérdida de estabilidad.',errs:['Frenar a fondo por sorpresa ante un pinchazo.','Revisar una avería de pie en un carril abierto.'],ref:'RGC, arts. 17 y 130. DGT, averías y V-16 en motocicletas',source:COURSE_SOURCES.v16},
 {id:'M6L6',t:'Animales, obstáculos y decisiones bajo presión',min:4,key:'Evitar un peligro no debe crear otro mayor por una maniobra improvisada.',
 body:`<p>En zonas con animales, observa márgenes y reduce si puedes prever que entren en la vía. Conserva margen para frenar y evita volantazos que te lancen al contrario o fuera de la calzada. Un animal puede ir acompañado de otros.</p><p>Ante un obstáculo, un giro perdido o la presión del grupo, valora el espacio disponible sin improvisar. Respeta a peatones y ciclistas y espera si no puedes pasar con separación y visibilidad. En caso de siniestro, protege, llama al 112 y sigue el tema 15. La prioridad es conservar control y prevenir daños.</p>`,tip:'Un giro perdido puede recuperarse después; una maniobra peligrosa puede no tener vuelta atrás.',errs:['Seguir una salida con un giro repentino desde otro carril.','Adelantar a un ciclista sin margen para seguir al grupo.'],ref:'RGC, arts. 3, 17, 45, 46.1.c, 85 y 129',source:'#a46'}
 ],questions:[
 {id:'q632',l:'M6L1',q:'Un coche va a salir de un acceso y tu moto puede quedar oculta tras un pilar. ¿Qué haces?',o:['Mantengo margen y preveo que pueda no detectarme','Acelero porque tengo prioridad','Supongo que me oye aunque no me vea'],c:0,e:'La anticipación contempla fallos de detección incluso cuando te corresponde pasar.',r:'RGC, arts. 3 y 17. DGT, riesgos en moto'},
 {id:'q633',l:'M6L1',q:'Circulas junto a un camión en una zona donde podrías quedar oculto. ¿Qué es prudente?',o:['Permanecer allí para mantener el ritmo','Evitar quedar en su ángulo muerto y conservar separación','Acercarme al máximo al lateral'],c:1,e:'Un vehículo grande puede no percibir a una moto próxima a ciertas zonas.',r:'DGT, visibilidad y ángulos muertos'},
 {id:'q634',l:'M6L1',q:'¿Qué riesgo debes prever junto a coches estacionados?',o:['Solo que falte alumbrado','Solo que se agote el combustible','Apertura de puertas, personas que aparezcan e incorporaciones'],c:2,e:'La observación lateral ayuda a detectar riesgos que pueden irrumpir en tu trayectoria.',r:'RGC, arts. 17 y 46. DGT, riesgos urbanos'},

 {id:'q636',l:'M6L1',q:'No puedes confirmar que un cambio de carril en moto sea seguro. ¿Qué decisión corresponde?',o:['Intentarlo porque ocupas poco espacio','Esperar y mantener el control','Hacerlo después de una ráfaga de luces'],c:1,e:'El desplazamiento exige asegurarse de que no pones en peligro ni obstaculizas.',r:'RGC, art. 74.2'},
 {id:'q637',l:'M6L2',q:'Una tapa metálica está mojada en tu trayectoria. ¿Qué debes prever?',o:['Que siempre tiene más agarre que el asfalto','Que el ABS permite cualquier inclinación','Que puede ofrecer menos agarre y conviene actuar con suavidad'],c:2,e:'Los cambios de superficie pueden reducir la adherencia, especialmente mojados.',r:'DGT, riesgos de adherencia en moto'},
 {id:'q638',l:'M6L2',q:'Ves gravilla antes de entrar en una curva. ¿Qué haces?',o:['Adapto la velocidad antes y conservo una trayectoria suave y segura','Freno bruscamente cuando esté encima','Inclino más para cruzarla rápido'],c:0,e:'La preparación previa evita exigir demasiado agarre en la zona deslizante.',r:'RGC, arts. 17 y 45. DGT, adherencia'},
 {id:'q639',l:'M6L2',q:'¿Es adecuado esquivar una marca mojada con un giro brusco hacia el contrario?',o:['Sí, toda pintura debe evitarse a cualquier precio','No, evitar un riesgo no justifica crear otro con la maniobra','Sí, si la moto es ligera'],c:1,e:'La respuesta debe mantener el control y respetar el espacio y el tráfico contrario.',r:'RGC, arts. 3, 17 y 29'},
 {id:'q640',l:'M6L2',q:'¿Qué condiciones pueden reducir el agarre de una moto?',o:['Solo lluvia muy intensa','Solo nieve','Pintura mojada, hojas, arena o aceite, entre otras'],c:2,e:'El riesgo puede aparecer en zonas pequeñas de firme con características distintas.',r:'DGT, situaciones de riesgo en moto'},
 {id:'q641',l:'M6L2',q:'Empieza a llover tras un periodo seco. ¿Qué debes tener en cuenta?',o:['Que agua y suciedad pueden volver deslizante el firme desde las primeras gotas','Que el peligro empieza solo al haber charcos','Que la presión de los neumáticos deja de importar'],c:0,e:'La mezcla inicial de agua con suciedad puede empeorar la adherencia.',r:'DGT, conducción con lluvia'},
 {id:'q642',l:'M6L3',q:'Al terminar de pasar junto a un camión con viento lateral, ¿qué debes prever?',o:['Que el viento seguirá bloqueado','Que puede reaparecer de golpe su empuje','Que debes soltar el manillar'],c:1,e:'El fin del efecto pantalla puede producir un cambio repentino de fuerza lateral.',r:'DGT, viento y efecto pantalla'},
 {id:'q643',l:'M6L3',q:'¿Es prudente acercarte a un camión para que te proteja del viento?',o:['Sí, cuanto más cerca mejor','Sí, si no lo adelanto','No, perderías separación y podrías quedar oculto o sufrir cambios de empuje'],c:2,e:'Buscar refugio no justifica proximidad peligrosa ni pérdida de observación.',r:'RGC, art. 54. DGT, conducción con viento'},
 {id:'q644',l:'M6L3',q:'El viento ya no te permite mantener la trayectoria con seguridad. ¿Qué haces?',o:['Busco un lugar adecuado para detenerme o cambio el plan','Mantengo el ritmo para salir antes','Aumento la carga en un lateral'],c:0,e:'La velocidad y la decisión de continuar deben adaptarse a la capacidad real de control.',r:'RGC, arts. 17 y 45'},

 {id:'q647',l:'M6L4',q:'Conduces de noche y detectas los obstáculos más tarde. ¿Qué haces?',o:['Adapto la velocidad al tramo visible','Mantengo siempre el máximo permitido','Me guío solo por el vehículo de delante'],c:0,e:'Debes poder detenerte dentro del espacio que puedes ver.',r:'RGC, art. 45'},
 {id:'q648',l:'M6L4',q:'Te deslumbran al conducir la moto. ¿Qué exige la norma?',o:['Mantener la velocidad hasta recuperar visión','Reducir lo necesario, incluso hasta detenerme','Responder siempre con las largas'],c:1,e:'El deslumbramiento exige adaptar la velocidad para evitar alcanzar a otros usuarios.',r:'RGC, art. 102.3'},

let animToken=0,closeDrivingGame=null;
function measure(p){const L=[0];for(let i=1;i<p.length;i++)L.push(L[i-1]+Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]));return L;}
const pathLengths=new WeakMap();
function at(p,f){
  let L=pathLengths.get(p);
  if(!L){
    L=measure(p);
    pathLengths.set(p,L);
  }
  const T=L[L.length-1]*f;let i=1;while(i<p.length-1&&L[i]<T)i++;
  const a=p[i-1],b=p[i],seg=(L[i]-L[i-1])||1,k=Math.min(1,Math.max(0,(T-L[i-1])/seg));
  return{x:a[0]+(b[0]-a[0])*k,y:a[1]+(b[1]-a[1])*k,h:Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI+90};}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, lin=t=>t, decel=t=>1-Math.pow(1-t,2);

const SPEECH=(()=>{try{return ('speechSynthesis' in window)?window.speechSynthesis:null;}catch(e){return null;}})();
let esVoice=null;
function esVoices(){try{return SPEECH.getVoices().filter(x=>/^es/i.test(x.lang));}catch(e){return [];}}
function voiceScore(x){let n=0;if(/^es[-_]ES/i.test(x.lang))n+=4;if(/natural|neural|online|enhanced|premium|mejorad/i.test(x.name))n+=6;if(/google/i.test(x.name))n+=3;if(x.localService===true)n+=20;return n;}
function pickVoice(){const v=esVoices();esVoice=(S.voice&&v.find(x=>x.name===S.voice))||v.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0]||null;}
if(SPEECH){pickVoice();try{SPEECH.addEventListener('voiceschanged',pickVoice);}catch(e){}}
let speechGen=0;
function stopSpeech(){speechGen++;try{SPEECH&&SPEECH.cancel();}catch(e){}}
function speak(text,onend,force){const g=speechGen;let done=false;const fin=()=>{if(done)return;done=true;if(g===speechGen&&onend)onend();};
  if(!SPEECH||(S.mute&&!force)){setTimeout(fin,Math.max(2600,text.length*60));return;}
  try{const u=new SpeechSynthesisUtterance(text);u.lang='es-ES';if(esVoice)u.voice=esVoice;u.rate=S.rate||0.95;u.pitch=S.pitch||1;u.onend=fin;u.onerror=fin;SPEECH.speak(u);setTimeout(fin,text.length*130+5000);}
  catch(e){setTimeout(fin,2600);}}
function splitText(t){return t.replace(/\s+/g,' ').split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(Boolean);}
function speakList(parts,onend,force){stopSpeech();let i=0;const nx=()=>{if(i>=parts.length){onend&&onend();return;}speak(parts[i++],nx,force);};nx();}

function startExplainer(k){
  const a=ANIMS[k],svg=document.getElementById('xsvg'),$=id=>document.getElementById(id),token=animToken;
  let cur=0,playing=false,gen=0,cars={},completeVoice=null;
  svg.innerHTML=DEFS+bg(a.scene)+['e1','oth'].map(id=>`<g id="x-${id}">${carBody(id==='oth'?'oth':'grey')}</g>`).join('')+
    `<g id="x-you">${carBody('you')}<g class="ind" id="x-ind" style="display:none"><circle cx="9" cy="-12" r="2.6" fill="#FFB300"/><circle cx="9" cy="12" r="2.6" fill="#FFB300"/></g></g>`;
  ['you','oth','e1'].forEach(id=>cars[id]=document.getElementById('x-'+id));
  const place=(c,pt)=>cars[c].setAttribute('transform',`translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)}) rotate(${pt.h.toFixed(1)})`);
  const alive=g=>token===animToken&&g===gen&&document.body.contains(svg);
  function setup(i){const st=a.steps[i];cur=i;Object.entries(st.cars).forEach(([c,p])=>place(c,at(p,0)));

      else b.removeAttribute('aria-current');
    });}
  function ui(){$('xplay').innerHTML=playing?PAUSE_ICON+' Pausa':(cur===a.steps.length-1&&ended?REPLAY_ICON+' Volver a ver':PLAY_ICON+(started?' Reproducir este paso':' Ver la explicación'));
    $('xmute').innerHTML=S.mute?MUTE_ICON:SPK_ICON;$('xmute').setAttribute('aria-label',S.mute?'Activar la voz':'Silenciar la voz');}
  let started=false,ended=false;
  function play(i){const g=++gen;playing=true;started=true;ended=false;setup(i);ui();const st=a.steps[i];
    if(st.ind)$('x-ind').style.display='';
    let animDone=false,voiceDone=false;const check=()=>{if(!alive(g)||!animDone||!voiceDone)return;
      setTimeout(()=>{if(!alive(g))return;if(i<a.steps.length-1)play(i+1);else{playing=false;ended=true;ui();}},700);};
    completeVoice=()=>{if(voiceDone)return;voiceDone=true;check();};
    stopSpeech();
    if(S.mute)completeVoice();else speak(st.text,completeVoice);
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      st.moves.forEach(m=>place(m.c,at(m.p,1)));
      animDone=true;
      check();
      return;
    }
    const end=Math.max(...st.moves.map(m=>m.s+m.d)),t0=performance.now();
    (function f(now){if(!alive(g))return;const t=now-t0;
      st.moves.forEach(m=>{const kk=Math.min(1,Math.max(0,(t-m.s)/m.d));if(t>=m.s)place(m.c,at(m.p,FNS[m.fn||'ease'](kk)));});
      if(t<end)requestAnimationFrame(f);else{animDone=true;check();}})(t0);}
  function pause(){gen++;playing=false;stopSpeech();setup(cur);ui();}
  $('xplay').onclick=()=>{if(playing)pause();else play(ended?0:cur);};
  $('xre').onclick=()=>{play(0);};
  $('xmute').onclick=()=>{S.mute=!S.mute;save();if(S.mute){stopSpeech();if(playing)completeVoice?.();}ui();};
  $('xdots').querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.xs;if(playing)play(i);else{gen++;setup(i);started=true;ended=false;ui();}});
  setup(0);ui();
}

  else if(v.mode==='practica-leccion'){ids=shuffle(availableQuestions().filter(q=>q.l===v.id)).map(q=>q.id);title='Practicar lección';}
  else if(v.mode==='fallos'){const d=dueFallos();ids=shuffle((d.length?d:fallos())).slice(0,15).map(q=>q.id);title='Repaso de fallos';}
  else if(v.mode==='repaso-programado'){
    ids=dueFallos().sort((a,b)=>S.q[a.id].due-S.q[b.id].due).slice(0,15).map(q=>q.id);
    title='Repaso programado';
  }
  else if(v.mode==='repaso'){const available=new Set(availableQuestions().map(q=>q.id));ids=Array.isArray(v.ids)?v.ids.filter(id=>available.has(id)):[];title='Repaso del último intento';}
  else if(v.mode==='guardadas'){
    if(v.id){ids=availableQuestions().some(q=>q.id===v.id)?[v.id]:[];title='Practicar pregunta';}
    else{ids=shuffle(savedQuestions()).map(q=>q.id);title='Preguntas guardadas';}
  }
  else if(v.mode==='rapido'){ids=shuffle(studyQuestions()).slice(0,5).map(q=>q.id);title='Test rápido';}
  else {const topic=availableTopics().find(topic=>topic.id===(v.id||'5'));ids=shuffle(topic?.questions||[]).slice(0,15).map(q=>q.id);title=`Test del tema ${topic?.id||''}`;}

 guardadas(view){
  header('Preguntas guardadas');
  const questions=savedQuestions();
  const normalize=text=>text.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  V.innerHTML=`<div class="card">
   <div class="saved-search">
    <label class="small" for="savedSearch">Buscar por pregunta o lección</label>
    <input type="search" id="savedSearch" maxlength="120" aria-controls="savedList">
   </div>
   <p class="small muted" id="savedCount" tabindex="-1" role="status"></p>
   <button class="btn primary" type="button" id="startSaved" data-go="quiz" data-mode="guardadas">Practicar todas las guardadas</button>
  </div>
  <ul class="list saved-list" id="savedList" role="list">${questions.map(q=>{
    const lesson=LESSONS.find(l=>l.id===q.l);
    return `<li class="card saved-preview" data-search="${esc(normalize(q.q+' '+(lesson?.t||'')))}">
     <p class="small muted">${esc(lesson?.t||'')}</p>
     <p id="saved-${q.id}">${esc(q.q)}</p>
     ${q.img?`<div class="qimg">${SIGN[q.img]}</div>`:''}
     <div class="saved-actions">
      <button class="btn primary" type="button" data-go="quiz" data-mode="guardadas" data-id="${q.id}" aria-describedby="saved-${q.id}">Practicar esta pregunta</button>
      <button class="btn ghost" type="button" data-remove-saved="${q.id}" aria-describedby="saved-${q.id}">Quitar de guardadas</button>
     </div>
    </li>`;
  }).join('')}</ul>`;
  const search=V.querySelector('#savedSearch'),count=V.querySelector('#savedCount');
  const start=V.querySelector('#startSaved'),list=V.querySelector('#savedList');
  search.value=view.search||'';
  function updateList(){
    const total=list.children.length;
    const query=normalize(search.value).trim();
    const words=query.split(/\s+/);
    let matches=0;
    for(const row of list.children){
      row.hidden=!words.every(word=>row.dataset.search.includes(word));
      if(!row.hidden)matches++;
    }
    count.textContent=!total?'Aún no hay preguntas guardadas. Pulsa «Guardar pregunta» durante un test para añadirla aquí.':
      query?(matches?`${matches} de ${total} preguntas guardadas`:'No hay preguntas guardadas que coincidan con la búsqueda.'):
      `${total} ${total===1?'pregunta guardada':'preguntas guardadas'}`;
    search.parentElement.hidden=!total;
    start.hidden=!total;
  }
  search.oninput=()=>{view.search=search.value;rememberView(false);updateList();};
  updateList();
  list.addEventListener('click',event=>{
    const button=event.target.closest('[data-remove-saved]');
    if(!button)return;
    const row=button.closest('li');

const EXAM_TYPES={comun:{name:'Teoría común',n:30,minutes:30,maxErrors:3},moto:{name:'Específico A2',n:20,minutes:20,maxErrors:2}};
const EXAM_GUIDE='https://sede.dgt.gob.es/export/sites/dgt/.galleries/permisos-de-conducir/certificacion-aptitud-profesores-formacion-vial/2025/Manual-IV-Normativa-Permisos-Conduccion-2025.pdf';
let examTimer=null;
const examKinds=()=>S.profile?.obj==='B'?['comun']:S.profile?.obj==='A2B'?['moto']:['comun','moto'];
const canViewExam=kind=>kind==='comun'||(kind==='moto'&&S.profile?.obj!=='B');
const examPassed=test=>test.n-test.ok<=EXAM_TYPES[test.kind].maxErrors;
const examTime=seconds=>Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');
const examSeconds=exam=>Math.max(0,Math.min(exam.paper.length*60,Math.ceil((exam.deadline-Date.now())/1000)));
const examRecords=()=>S.tests.filter(t=>t.mode==='examen').slice().sort((a,b)=>b.d-a.d);
function syncExamTimer(){
  if(!S.activeExam){if(examTimer!==null)clearInterval(examTimer);examTimer=null;return;}
  if(examTimer===null)examTimer=setInterval(examTick,1000);
}
function examTick(){
  const exam=S.activeExam;
  if(!exam){syncExamTimer();return;}
  if(Date.now()>=exam.deadline){const onExam=stack.at(-1)?.name==='exam';finishExam('tiempo',onExam,onExam||(tab==='simulacros'&&!stack.length));return;}
  updateExamClock();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)examTick();});
function updateExamClock(){
  const exam=S.activeExam,clock=document.getElementById('exam-time');
  if(!exam||!clock||clock.dataset.attempt!==exam.attempt)return;
  const seconds=examSeconds(exam);
  clock.textContent=examTime(seconds);clock.classList.toggle('urgent',seconds<=60);
  const live=document.getElementById('exam-announcement');
  if(live&&seconds<=60&&!live.dataset.minute){live.dataset.minute='true';live.textContent='Queda menos de un minuto. El simulacro se entregará al terminar el tiempo.';}
}
function startExam(kind){
  if(!examKinds().includes(kind))return;
  if(S.activeExam){tab='simulacros';stack=[];rememberView(true);render();return;}
  const config=EXAM_TYPES[kind];
  const topics=ACTIVE_TOPICS.filter(t=>t.id.startsWith('M')===(kind==='moto'));
  const buckets=shuffle(topics).map(t=>shuffle(t.questions));
  if(buckets.reduce((n,qs)=>n+qs.length,0)<config.n)return;
  const selected=[];
  while(selected.length<config.n){
    for(const bucket of buckets){if(bucket.length)selected.push(bucket.pop());if(selected.length===config.n)break;}
  }
  const paper=shuffle(selected).map(q=>({id:q.id,q:q.q,o:q.o.slice(),c:q.c,e:q.e,r:q.r,...(q.img?{img:q.img}:{})}));
  const started=Date.now();
  const token=globalThis.crypto?.randomUUID?.()||started.toString(36)+'-'+Math.random().toString(36).slice(2);
  S.activeExam={attempt:'exam-'+token,kind,started,deadline:started+config.minutes*60000,paper,
    answers:Array(config.n).fill(null),orders:paper.map(()=>shuffle([0,1,2])),flags:Array(config.n).fill(false),index:0,mapOpen:false};
  save();syncExamTimer();
  tab='simulacros';stack=[{name:'exam',id:S.activeExam.attempt}];rememberView(true);render();
}
function currentExam(attempt){
  if(!S.activeExam||S.activeExam.attempt!==attempt)return null;
  if(Date.now()>=S.activeExam.deadline){finishExam('tiempo',true);return null;}
  return S.activeExam;
}

  <p class="note">Entrenamiento con preguntas propias. El formato de tiempo de esta práctica no incluye vídeos ni adaptaciones de la prueba oficial. <a href="${EXAM_GUIDE}" target="_blank" rel="noopener">Formato de pruebas, DGT</a>.</p>`;
  V.querySelectorAll('[data-start-exam]').forEach(b=>b.onclick=()=>startExam(b.dataset.startExam));
  const discard=document.getElementById('exam-discard');if(discard)discard.onclick=()=>showExamDialog(active,'discard');
}

function showExamDialog(exam,action){

function finishExam(reason='entrega',navigate=true,redraw=true){
  const exam=S.activeExam;if(!exam)return null;
  let result=S.tests.find(t=>t.mode==='examen'&&t.attempt===exam.attempt);
  if(!result){
    if(Date.now()>=exam.deadline)reason='tiempo';
    const end=reason==='tiempo'?exam.deadline:Date.now(),duration=exam.paper.length*60000;
    const ok=exam.paper.filter((q,i)=>exam.answers[i]===q.c).length;
    result={mode:'examen',attempt:exam.attempt,kind:exam.kind,d:end,n:exam.paper.length,ok,
      elapsed:Math.min(duration,Math.max(0,end-exam.started)),reason,version:VERSION,
      paper:exam.paper,answers:exam.answers.slice(),orders:exam.orders};
    exam.paper.forEach((q,i)=>record(q.id,exam.answers[i]===q.c,false));
    S.tests.push(result);S.tests=S.tests.slice(-50);
  }
  S.activeExam=null;save();syncExamTimer();
  if(navigate){tab='simulacros';stack=[{name:'examResult',id:result.attempt}];rememberView(false);}
  if(redraw)render();
  return result;
}

const TUTOR_CODE_KEY='autoescuela_tutor_code';
let tutorCode='';
let rememberTutor=false;
try{
