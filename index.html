 {id:'q4',l:'L1',q:'¿Qué significa ceder el paso?',o:['No obligar al que tiene prioridad a cambiar bruscamente su trayectoria o velocidad','Detenerse siempre por completo','Pasar primero haciendo una señal con la mano'],c:0,e:'Ceder el paso es no forzar al vehículo con prioridad a frenar, desviarse o cambiar bruscamente de velocidad.',r:'RGC, art. 58.1'},
 {id:'q5',l:'L2',img:'stop',q:'Ante esta señal, y sin vehículos a la vista, ¿qué debes hacer?',o:['Detenerte por completo y después continuar','Reducir mucho la velocidad y pasar sin detenerte','Continuar, porque no viene nadie'],c:0,e:'El STOP obliga a detenerse siempre, aunque no venga nadie. Después hay que ceder el paso.',r:'Catálogo oficial, señal R-2'},
 {id:'q6',l:'L2',q:'Hay una señal de STOP pero no hay línea de detención pintada. ¿Dónde te detienes?',o:['Inmediatamente antes de la intersección','Justo debajo de la señal, aunque no veas bien','Dentro de la intersección, para ver mejor'],c:0,e:'Sin línea, haz la primera parada justo antes de la intersección. Si desde allí no ves lo suficiente, debes detenerte de nuevo donde puedas ver sin crear peligro.',r:'Catálogo oficial, señal R-2'},
 {id:'q7',l:'L2',img:'ceda',q:'Esta señal te obliga a…',o:['Ceder el paso, deteniéndote solo si es necesario','Detenerte siempre por completo','Nada: indica que tienes preferencia'],c:0,e:'La señal de ceda el paso obliga a ceder a los que circulan por la vía a la que llegas. Solo hay que parar si hace falta.',r:'Señal R-1'},
 {id:'q8',l:'L2',img:'r3',q:'¿Qué indica esta señal?',o:['Que circulas por una calzada con prioridad en las intersecciones','Peligro por obras','El final de la prioridad'],c:0,e:'El rombo amarillo con borde blanco es la señal R-3: calzada con prioridad. En sus intersecciones tienes preferencia.',r:'Señal R-3'},
 {id:'q9',l:'L2',q:'Un semáforo está en amarillo intermitente. ¿Qué significa?',o:['Precaución: se aplican las señales o normas de prioridad del cruce','Prohibido pasar','Tienes preferencia sobre todos'],c:0,e:'El amarillo intermitente obliga a extremar la precaución. Cede cuando corresponda y respeta las señales que obliguen a parar, como un STOP.',r:'RGC, anexo I, apartado 4.2.d'},
 {id:'q10',l:'L2',img:'r4',q:'¿Qué anuncia esta señal?',o:['Que se acerca el lugar donde tu calzada pierde la prioridad','Sigues teniendo prioridad en todos los cruces','Debes detenerte en el siguiente cruce'],c:0,e:'La R-4 anuncia que se acerca el fin de la prioridad de tu calzada. Allí, aplica la señalización o, si no la hay, las reglas generales.',r:'Señal R-4'},
 {id:'q11',l:'L2',q:'Una línea blanca continua que atraviesa tu carril antes de un cruce indica…',o:['El lugar donde debes detenerte si hay STOP, semáforo en rojo o un agente lo ordena','Que debes ceder el paso sin detenerte','Un paso para ciclistas'],c:0,e:'Es la línea de detención. La línea de ceda el paso es discontinua.',r:'Catálogo oficial, marca M-4.1'},
 {id:'q12',l:'L3',q:'Llegas a un cruce ordinario de dos vías pavimentadas sin señales. Un coche se acerca por tu derecha. ¿Quién pasa primero?',o:['El coche que viene por la derecha','Yo, porque he llegado antes','Yo, porque sigo recto'],c:0,e:'En este cruce, la prioridad corresponde al vehículo que viene por la derecha, tanto si tú continúas recto como si giras.',r:'RGC, art. 57.1'},
 {id:'q13',l:'L3',q:'Circulas por una carretera asfaltada. Por tu derecha sale un coche de un camino de tierra. ¿Quién tiene preferencia?',o:['Tú, porque circulas por una vía pavimentada','El otro coche, porque viene por tu derecha','El que llegue primero al cruce'],c:0,e:'Es una excepción a la regla de la derecha: la vía pavimentada tiene preferencia sobre la no pavimentada.',r:'RGC, art. 57.1 a)'},
 {id:'q14',l:'L3',q:'En un cruce sin señales se acerca un tranvía por tu izquierda. ¿Quién pasa primero?',o:['El tranvía','Yo, porque vengo por su derecha','El que llegue antes'],c:0,e:'Los vehículos que circulan sobre raíles tienen preferencia, vengan por donde vengan.',r:'RGC, art. 57.1 b)'},
 {id:'q15',l:'L3',q:'Tienes preferencia, pero la calle de salida del cruce está atascada. ¿Qué haces?',o:['No entro en el cruce hasta que haya sitio al otro lado','Entro, porque tengo preferencia','Entro hasta la mitad y espero a que avance la cola'],c:0,e:'Aun con preferencia, no debes entrar si es previsible que te quedes parado dentro bloqueando la circulación transversal.',r:'RGC, art. 59'},
 {id:'q16',l:'L3',q:'Sales de una gasolinera a la carretera. ¿Quién tiene preferencia?',o:['Los vehículos que circulan por la carretera','Tú, si vienes por su derecha','Tú, si has señalizado la incorporación con antelación'],c:0,e:'Quien se incorpora a la circulación desde una gasolinera, un garaje o una vía de acceso debe ceder el paso a los que ya circulan. Poner el intermitente avisa de tu intención y la obligación de ceder se mantiene.',r:'RGC, art. 72'},
 {id:'q17',l:'L4',q:'En el acceso a una glorieta convencional con ceda el paso, ¿quién tiene preferencia?',o:['Los vehículos que ya circulan por ella','Los que quieren entrar por la derecha','Los de dentro solo si circulan por el carril exterior'],c:0,e:'Al acceder, cede a los vehículos que ya circulan por el anillo. Comprueba qué trayectorias pueden cruzarse, incluso si el otro coche está por el interior.',r:'RGC, art. 57.1 c)'},
 {id:'q18',l:'L4',q:'¿En qué sentido se circula por una glorieta?',o:['Dejando la isleta central a la izquierda','Dejando la isleta central a la derecha','Por el lado con menos tráfico'],c:0,e:'Se circula en sentido contrario a las agujas del reloj, con la isleta a la izquierda.',r:'RGC, art. 43.2'},
 {id:'q19',l:'L4',q:'Vas a tomar la primera salida de una glorieta convencional de dos carriles. ¿Qué carril es el más recomendable?',o:['Por el carril exterior','Por el carril interior','Por cualquiera'],c:0,e:'El exterior te sitúa junto a la salida. Si estás en el interior, primero tendrías que cambiar de carril con seguridad y luego salir.',r:'Recomendaciones de la DGT sobre glorietas'},
 {id:'q20',l:'L4',q:'Vas por el carril interior de una glorieta convencional y quieres salir. ¿Qué haces?',o:['Paso al carril exterior con antelación, cediendo a quien circule por él','Salgo directamente cruzando el carril exterior','Me detengo dentro hasta que el carril exterior quede libre'],c:0,e:'Colócate en el carril exterior con antelación, cediendo a quien ya circule por él. Si no tienes hueco a tiempo, continúa por el anillo y vuelve a intentarlo.',r:'RGC, art. 74'},
 {id:'q21',l:'L4',q:'¿Cómo señalizas que vas a abandonar una glorieta?',o:['Con el intermitente derecho, antes de la salida','Con el intermitente izquierdo','No hace falta señalizarlo'],c:0,e:'La salida de la glorieta es un desplazamiento a la derecha y se señaliza con el intermitente derecho con antelación.',r:'RGC, art. 109'},
 {id:'q22',l:'L5',q:'Si está claro quién entró primero en un estrechamiento sin señalizar, ¿quién tiene preferencia?',o:['El que haya entrado antes en el estrechamiento','El que venga por la derecha','El vehículo más grande'],c:0,e:'Sin señal, tiene preferencia quien entró primero. El otro debe esperar fuera.',r:'RGC, art. 60'},
 {id:'q23',l:'L5',img:'r5',q:'Antes de un estrechamiento ves una señal redonda con borde rojo de prioridad en sentido contrario. Significa que…',o:['Debes ceder el paso a los que vienen de frente','Tienes preferencia sobre los que vienen de frente','Está prohibido el paso'],c:0,e:'Con la R-5 debes esperar fuera si al entrar obligarías a detenerse a un vehículo que viene de frente.',r:'Señal R-5'},
 {id:'q24',l:'L5',img:'r6',q:'Una señal cuadrada azul de prioridad respecto al sentido contrario indica que…',o:['Tienes preferencia sobre los que vienen de frente','Debes ceder el paso a los que vienen de frente','Es una calle de sentido único'],c:0,e:'La señal R-6 te da preferencia en el estrechamiento frente a los que vienen en sentido contrario.',r:'Señal R-6'},
 {id:'q25',l:'L5',q:'En un tramo estrecho de gran pendiente, sin señales, ¿quién tiene preferencia?',o:['El que sube, salvo que pueda llegar antes a un apartadero','El que baja','El vehículo más pesado'],c:0,e:'Tiene preferencia el vehículo que circula en sentido ascendente, salvo que pueda llegar antes a un apartadero. La gran pendiente empieza en el 7 %.',r:'RGC, art. 63'},
 {id:'q26',l:'L6',q:'Giras a la derecha y unos peatones cruzan la calle a la que entras, sin paso de peatones. ¿Quién tiene preferencia?',o:['Los peatones','Tú, porque no hay paso de peatones','El que llegue primero'],c:0,e:'Al girar, los peatones que cruzan la calzada a la que te incorporas tienen preferencia aunque no haya paso de peatones.',r:'RGC, art. 65'},
 {id:'q27',l:'L6',q:'Un peatón está a punto de cruzar por un paso de peatones sin semáforo. ¿Qué haces?',o:['Me detengo y le cedo el paso','Paso si voy despacio','Toco el claxon para avisarle'],c:0,e:'En un paso de peatones señalizado y sin semáforo, los peatones tienen preferencia.',r:'RGC, art. 65'},
 {id:'q28',l:'L6',q:'Vas a girar y un ciclista circula por el carril bici que cruzas. ¿Quién tiene preferencia?',o:['El ciclista','Tú, porque el ciclista es más lento','El que vaya por la derecha'],c:0,e:'Los ciclistas que circulan por un carril bici tienen preferencia sobre los vehículos que lo cruzan.',r:'RGC, art. 64'},
 {id:'q29',l:'L6',q:'Un grupo de ciclistas está cruzando un cruce; el primero ya ha entrado. ¿Qué haces?',o:['Dejo pasar a todo el grupo, porque cuenta como una unidad','Paso en cuanto cruce el primero','Paso entre dos ciclistas si hay hueco'],c:0,e:'Un grupo de ciclistas que ya ha iniciado el cruce se considera una sola unidad a efectos de preferencia.',r:'RGC, art. 64'},
 {id:'q30',l:'L6',q:'Oyes una ambulancia con sirena y luces que se acerca por detrás. ¿Qué haces?',o:['Facilito su paso apartándome a la derecha y deteniéndome si hace falta','Acelero para no estorbar','Sigo igual, porque no puedo apartarme'],c:0,e:'Ante un vehículo de emergencia en servicio, debes facilitarle el paso, apartándote hacia la derecha y deteniéndote si es necesario.',r:'RGC, arts. 67 a 69'},
 {id:'q31',l:'L6',q:'En una cañada señalizada cruza un rebaño. ¿Quién tiene preferencia?',o:['El ganado','Tú, porque circulas por la carretera','El que llegue antes'],c:0,e:'Los animales tienen preferencia en las cañadas debidamente señalizadas.',r:'RGC, art. 66'}
];
/* ================= Tema 3: señalización ================= */
const SIGN_LESSONS=[
 {id:'T3L1',t:'Qué señal debes obedecer',min:5,ill:'order',
  key:'Cuando dos indicaciones aplicables se contradicen, comprueba primero cuál tiene preferencia. Si son del mismo tipo, aplica la más restrictiva.',
  body:`<p>La señalización sirve para advertir, informar o indicar cómo debes circular. Antes de comparar dos señales, comprueba que ambas se dirigen a ti y a la maniobra que vas a realizar.</p>
  <p>El orden es: <b>agentes</b>; <b>señalización y balizamiento circunstancial, dispositivos delimitadores y señales de balizamiento</b>; <b>semáforos</b>; <b>señales verticales</b>; y <b>marcas viales</b>.</p>
  <p>Dos indicaciones compatibles se cumplen juntas. Por ejemplo, un semáforo verde permite el paso, pero puedes seguir teniendo prohibido girar a la izquierda.</p>
  <p>Para semáforos y señales verticales, fíjate en los situados inmediatamente a tu derecha, sobre la calzada o sobre tu carril. Si no hay ninguno en esas posiciones y vas de frente o a la izquierda, atiende a los de la izquierda. Si las indicaciones de ambos lados difieren, quienes siguen de frente o giran a la izquierda obedecen las situadas inmediatamente a la izquierda.</p>`,
  tip:'Primero comprueba si la señal se aplica a tu carril o maniobra. Después resuelve el conflicto.',
  errs:['Elegir siempre la señal más restrictiva, aunque sea de menor rango.','Creer que el verde anula una prohibición de giro compatible.'],
  ref:'RGC, arts. 131 a 133',source:'#a132'},
 {id:'T3L2',t:'Gestos y órdenes de los agentes',min:6,
  key:'El brazo levantado ordena parar. Los brazos extendidos en horizontal obligan a parar a quienes se acercan en una dirección que corta la línea de los brazos.',
  body:`<p><b>Brazo hacia arriba:</b> detente si te acercas al agente y puedes hacerlo con seguridad. Usa la línea de detención más próxima o, si falta, detente justo antes del agente. En un cruce, detente antes de entrar. Quien ya está dentro no tiene que detenerse por ese gesto.</p>
  <p><b>Brazos extendidos:</b> imagina una barrera en su dirección. Quien se acerca cruzando esa dirección debe detenerse. La orden sigue aunque el agente baje los brazos, hasta que cambie de posición o haga otra señal.</p>
  <p>Si el agente mueve un brazo extendido arriba y abajo, deben reducir la velocidad quienes se acercan por ese lado y en dirección perpendicular al brazo. Si balancea una luz roja o amarilla hacia ti, detente.</p>
  <p>Varios silbidos breves seguidos ordenan parar. Un silbido largo ordena reanudar la marcha. Si un agente que va detrás dirige hacia ti una luz roja intermitente o destellante, detente a la derecha, delante de su vehículo, en un lugar seguro, y sigue sus instrucciones.</p>`,
  tip:'Brazo arriba: alto. Brazo que sube y baja: reduce si la orden va dirigida a ti.',
  errs:['Pararte dentro del cruce por el gesto de brazo levantado cuando ya habías entrado.','Reanudar la marcha solo porque el agente ha bajado los brazos.'],
  ref:'RGC, art. 141 y anexo I, apartados 1.1 y 1.2',source:'#A1'},
 {id:'T3L3',t:'Obras, paneles y balizamiento',min:5,
  key:'Los dispositivos que cierran una zona marcan un límite. Sigue el itinerario abierto sin atravesar la línea de conos o balizas que delimita el cierre.',
  body:`<p>Las obras o una incidencia pueden cambiar temporalmente qué carriles puedes usar y por dónde debes circular. Atiende a las indicaciones de los paneles variables y a los desvíos habilitados. La regulación habitual vuelve cuando termina la modificación temporal.</p>
  <p>Una barrera o un panel direccional provisional puede cerrar el paso. El panel provisional señala también el sentido en el que debes continuar. Un tramo puede estar delimitado por conos o balizas: respeta la línea que forman, aunque haya huecos entre ellos. En estos dispositivos, una luz roja fija indica el cierre total de la calzada y una fila de luces amarillas prohíbe cruzar la línea que forman.</p>
  <p>Los <b>dispositivos de guía</b> cumplen otra función. Un hito de arista ayuda a reconocer el borde de la calzada y un panel direccional permanente advierte del trazado de una curva.</p>
  <p>Las marcas nuevas pintadas durante las obras son amarillas. Las blancas anteriores pueden permanecer si todavía son aplicables. La señal P-18 advierte de obras y lleva fondo amarillo.</p>`,
  tip:'Un panel que advierte de una curva y un panel provisional que cierra el paso se interpretan según su función y su contexto.',
  errs:['Cruzar entre dos conos porque hay espacio.','Suponer que toda marca blanca deja de aplicarse al entrar en una obra.'],
  ref:'RGC, arts. 133, 142 y 149 y anexo I, apartados 2, 3.1 y 5.2',source:'#a142'},
 {id:'T3L4',t:'Semáforos y luces de carril',min:7,ill:'trafficLights',
  key:'Amarillo fijo: detente si puedes hacerlo con seguridad. Amarillo intermitente: extrema la precaución, cede cuando corresponda y respeta las señales que obliguen a parar.',
  body:`<p>El <b>rojo fijo</b> prohíbe pasar. El <b>verde fijo</b> permite el paso con prioridad, pero debes esperar si el atasco de salida puede dejarte parado dentro y bloquear la circulación transversal. Ante el <b>amarillo fijo</b>, detente como ante el rojo, excepto si se enciende cuando ya estás demasiado cerca para parar con seguridad.</p>
  <p>Como regla general, en un paso con semáforo propio para peatones, el amarillo intermitente para vehículos va precedido del rojo fijo y no coincide con el verde fijo de peatones.</p>
  <p>Una <b>flecha verde</b> sobre fondo negro permite la maniobra que indica aunque se mantenga encendido el rojo. Debes realizarla con precaución, dejar pasar a quienes circulen por el carril al que te incorporas y proteger a quienes cruzan. Si estás en el carril que esa maniobra debe utilizar, la flecha te obliga a avanzar en esa dirección.</p>
  <p>Los <b>semáforos cuadrados de carril</b> afectan al carril indicado. Un aspa roja prohíbe ocuparlo y, si ya estás en él, debes abandonarlo lo antes posible. La flecha verde hacia abajo permite usarlo, respetando las demás señales. Una flecha blanca o amarilla oblicua hacia abajo avisa de un cierre próximo: incorpórate con seguridad al carril que señala.</p>
  <p>El peatón con verde intermitente dispone de poco tiempo para terminar de cruzar. Para vehículos, el rojo intermitente prohíbe temporalmente el paso en casos como un paso a nivel. Las luces con silueta de ciclo se aplican a los ciclos. Las franjas blancas pueden regular tranvías, autobuses de línea o a quienes usan un carril reservado: horizontal significa alto, vertical permite seguir de frente y oblicua autoriza el giro indicado. Si la franja vertical u oblicua parpadea, se aplica la regla del amarillo fijo.</p>`,
  tip:'Distingue el semáforo circular del semáforo cuadrado. Uno regula el paso y el otro el uso de un carril.',
  errs:['Acelerar al ver amarillo fijo aunque puedas parar con seguridad.','Considerar una flecha verde un permiso para girar con prioridad sobre todos.'],
  ref:'RGC, arts. 59.1 y 143 y anexo I, apartado 4',source:'#A4'},
 {id:'T3L5',t:'Señales verticales y paneles',min:7,ill:'verticalSigns',
  key:'Identifica el símbolo y su función. Si hay un panel debajo, léelo junto con la señal para entender su alcance.',
  body:`<p>Las señales verticales forman tres familias: <b>advertencia de peligro</b>, <b>reglamentación</b> e <b>indicación</b>. Un triángulo con borde rojo suele advertir de un peligro. La señal R-1 es un triángulo invertido y ordena ceder el paso. El octógono R-2 ordena detenerse y ceder.</p>
  <p>La <b>reglamentación</b> incluye prioridad, prohibición de entrada, restricciones de paso, otras prohibiciones y restricciones, obligaciones y final de prohibiciones, restricciones u obligaciones. Por ejemplo, la R-101 impide entrar desde ese sentido y la R-301 fija una velocidad máxima.</p>
  <p>Las señales de <b>indicación</b> te ayudan a circular: incluyen información general, dirección, carriles, servicios y localización, entre otros grupos. La S-17 señala un lugar autorizado para estacionar. Un color por sí solo no basta: comprueba la forma y el símbolo.</p>
  <p>Un <b>panel complementario</b> puede indicar a qué distancia empieza un peligro (S-800), a lo largo de cuánto tramo se extiende (S-810) o a qué usuarios afecta la señal. El catálogo oficial del anexo I incluye los significados y dibujos de las señales individuales.</p>`,
  tip:'Lee de arriba abajo: identifica la señal principal y después qué aclara el panel.',
  errs:['Confundir la velocidad máxima con una velocidad que debes alcanzar.','Interpretar como longitud del tramo una distancia que solo avisa de cuándo empieza el peligro.'],
  ref:'RGC, arts. 134 y 144 a 146 y anexo I, apartado 5.1',source:'#A5'},
 {id:'T3L6',t:'Líneas, flechas y marcas viales',min:7,ill:'roadMarks',
  key:'Una línea a lo largo de la vía separa o guía. Una línea que atraviesa tu carril puede marcar dónde detenerte o ceder el paso.',
  body:`<p>Una <b>línea longitudinal continua</b> que separa carriles o sentidos no debe pisarse ni atravesarse como regla general. Hay excepciones previstas en el Reglamento, y una línea de borde no cumple esa misma función. Con dos líneas adosadas, una continua y otra discontinua, para iniciar la maniobra fíjate en la de tu lado. Si comenzaste a adelantar desde el lado discontinuo en ese tramo, puedes cruzar la continua para volver a tu carril.</p>
  <p>La <b>línea transversal continua</b> indica dónde parar cuando te lo exige una señal como el STOP o un semáforo rojo. La <b>transversal discontinua</b> marca el lugar donde ceder el paso cuando existe esa obligación. El STOP pintado también puede imponer una detención.</p>
  <p>Las <b>flechas de carril</b> señalan los movimientos permitidos u obligatorios. Una flecha de fin de carril avisa de que tendrás que cambiarte, respetando la prioridad de quien ya circula por el otro carril. Deja paso a los peatones en un paso señalizado sin semáforo y a los ciclistas que cruzan por un paso ciclista.</p>
  <p>En el bordillo o junto a él, una <b>línea amarilla continua</b> prohíbe parar y estacionar. La <b>amarilla discontinua</b> prohíbe estacionar. Si la prohibición tiene un horario, se indica en una señal vertical.</p>`,
  tip:'Comprueba la orientación de la línea, su color y dónde está pintada antes de decidir qué significa.',
  errs:['Leer la línea del otro sentido cuando hay continua y discontinua juntas.','Confundir la prohibición de estacionar con la de parar y estacionar.'],
  ref:'RGC, arts. 64, 65 y 147 y anexo I, apartado 5.2',source:'#A5'}
];

const SIGN_QUESTIONS=[
 {id:'q32',l:'T3L1',q:'Dos señales verticales aplicables a tu carril indican a la vez 50 y 70 km/h como límite. ¿Cuál prevalece?',o:['50 km/h','70 km/h','La situada más alta'],c:0,e:'Cuando dos indicaciones del mismo tipo se contradicen y ambas se aplican, prevalece la más restrictiva.',r:'RGC, art. 133.2'},
 {id:'q33',l:'T3L1',q:'Un semáforo está verde y una señal vertical prohíbe girar a la izquierda. ¿Puedes girar a la izquierda?',o:['Sí, porque el semáforo tiene más rango','No, el verde y la prohibición de giro son compatibles','Sí, si cedes a los que vienen de frente'],c:1,e:'El verde permite el paso, pero no transforma en permitido un giro prohibido por una señal compatible.',r:'RGC, arts. 132 y 133 y anexo I, apartado 4.2.e'},
 {id:'q34',l:'T3L1',q:'En un cruce, una señal vertical a la derecha y otra a la izquierda tienen indicaciones distintas. Quieres seguir de frente. ¿Cuál obedeces?',o:['La de la derecha','La que se vea desde más lejos','La situada inmediatamente a tu izquierda'],c:2,e:'Si las indicaciones de ambos lados son distintas, quien sigue de frente o gira a la izquierda obedece la de la izquierda.',r:'RGC, art. 132.3'},
 {id:'q35',l:'T3L1',q:'Un agente te ordena detenerte aunque el semáforo esté verde. ¿Qué haces?',o:['Avanzo despacio hasta el cruce','Me detengo según la orden del agente','Sigo si los otros vehículos avanzan'],c:1,e:'La orden del agente es la primera en el orden de preferencia. Debes detenerte aunque la luz sea verde.',r:'RGC, art. 133.1'},
 {id:'q36',l:'T3L1',q:'En unas obras, un panel provisional y sus conos cierran tu carril, pero su semáforo está verde. ¿Qué indicación prevalece?',o:['El cierre indicado por la señalización de las obras','El semáforo verde','La línea blanca del carril'],c:0,e:'La señalización circunstancial y los dispositivos delimitadores prevalecen sobre los semáforos en caso de contradicción.',r:'RGC, art. 133.1'},
 {id:'q37',l:'T3L2',q:'Un agente levanta un brazo en vertical cuando ya estás dentro de la intersección. Sin ninguna orden adicional, ¿te obliga ese gesto a detenerte dentro?',o:['Sí, de inmediato','No, el gesto no obliga a detenerse a quien ya ha entrado','Sí, pero solo si hay línea de detención en la salida'],c:1,e:'La señal de brazo levantado no obliga a detenerse a los conductores que ya han entrado en la intersección.',r:'RGC, anexo I, apartado 1.1.a'},
 {id:'q38',l:'T3L2',q:'El agente mantiene los brazos en horizontal. Te acercas en una dirección que corta la línea de sus brazos. ¿Qué haces?',o:['Me detengo','Paso si circulo despacio','Sigo si no me señala directamente'],c:0,e:'La orden se dirige a quienes se acercan en una dirección que corta la marcada por el brazo o los brazos.',r:'RGC, anexo I, apartado 1.1.b'},
 {id:'q39',l:'T3L2',q:'Un agente te detuvo con los brazos en horizontal. Después los baja sin moverse ni hacer otro gesto. ¿Puedes avanzar?',o:['Sí, porque ha terminado la orden','Sí, si el semáforo está verde','No, la orden de detención sigue vigente'],c:2,e:'Bajar los brazos no revoca la orden si el agente conserva su posición y no realiza otra señal.',r:'RGC, anexo I, apartado 1.1.b'},
 {id:'q40',l:'T3L2',q:'¿Qué indica un toque largo de silbato del agente tras haber detenido el tráfico?',o:['Que reanudes la marcha','Que detengas el vehículo','Que cambies de carril'],c:0,e:'El silbido largo ordena reanudar la marcha. Los toques breves y frecuentes ordenan detenerse.',r:'RGC, anexo I, apartado 1.1.e'},
 {id:'q41',l:'T3L2',q:'Un agente balancea una luz amarilla dirigida hacia ti. ¿Qué debes hacer?',o:['Reducir la velocidad sin detenerme','Detenerme','Continuar si puedo incorporarme sin peligro'],c:1,e:'El balanceo de una luz amarilla o roja ordena detenerse al usuario hacia quien se dirige.',r:'RGC, anexo I, apartado 1.1.c'},
 {id:'q42',l:'T3L3',q:'Hay una fila de conos que delimita una zona cerrada por obras. ¿Puedes atravesarla si cabes entre dos conos?',o:['Sí, si la carretera está despejada','Sí, si vuelvo a salir antes de llegar a la obra','No, debo respetar la línea que forman los conos'],c:2,e:'Está prohibido atravesar la línea de los dispositivos delimitadores, aunque no sea una barrera continua.',r:'RGC, art. 142.4 y anexo I, apartado 3.1.1'},
 {id:'q43',l:'T3L3',q:'¿Qué función tiene un hito de arista situado al borde de la carretera?',o:['Ayuda a reconocer el borde con poca visibilidad','Cierra el arcén de forma temporal','Señala el lugar exacto para detenerse'],c:0,e:'Es un dispositivo de guía que ayuda a distinguir el borde de la carretera, especialmente de noche o con baja visibilidad.',r:'RGC, anexo I, apartado 3.1.2'},
 {id:'q44',l:'T3L3',q:'¿De qué color se pintan las marcas viales nuevas que se usan en un tramo en obras?',o:['Del mismo color que todas las marcas anteriores','Amarillo','Rojo'],c:1,e:'Las nuevas marcas de obra se pintan en amarillo. Las anteriores pueden seguir en blanco si todavía se aplican.',r:'RGC, anexo I, apartado 5.2, características generales'},
 {id:'q45',l:'T3L3',q:'¿Qué indica un panel direccional provisional colocado para cerrar parte de la vía?',o:['El sentido del paso habilitado y la prohibición de entrar en lo cerrado','Solo la cercanía de una curva','Que se puede cruzar por ambos lados si no hay tráfico'],c:0,e:'El panel provisional prohíbe pasar por la parte cerrada e informa del sentido de la circulación.',r:'RGC, anexo I, apartado 3.1.1'},
 {id:'q46',l:'T3L3',q:'¿Cuándo vuelven a aplicarse las reglas habituales tras un cambio temporal de señalización?',o:['En cuanto dejas de ver el primer panel','Al anochecer','Cuando lo indique la señalización o terminen las circunstancias que causaron el cambio'],c:2,e:'El fin de la modificación depende de lo que establezca la señalización o del fin de las causas que motivaron el cambio.',r:'RGC, art. 142.1'},
 {id:'q47',l:'T3L4',q:'Se enciende la luz amarilla fija y puedes parar antes de la línea con seguridad. ¿Qué haces?',o:['Sigo, porque todavía no está en rojo','Me detengo','Cedo únicamente si se acerca un vehículo por la derecha'],c:1,e:'Con amarillo fijo debes detenerte si tienes espacio suficiente para hacerlo con seguridad.',r:'RGC, anexo I, apartado 4.2.c'},
 {id:'q48',l:'T3L4',q:'Hay amarillo intermitente y un STOP que se aplica a tu carril. ¿Debes detenerte?',o:['Sí, el STOP sigue obligando a parar','Solo si hay tráfico en la otra vía','No, la luz sustituye al STOP'],c:0,e:'El amarillo intermitente obliga a extremar la precaución y no elimina las señales que obligan a detenerse.',r:'RGC, anexo I, apartado 4.2.d'},
 {id:'q49',l:'T3L4',q:'El semáforo general está rojo y hay una flecha verde a la derecha. Vas a girar a la derecha. ¿Qué implica la flecha?',o:['Puedes girar con prioridad sobre quienes ya circulan por la vía de destino','Solo podrás girar cuando la luz general cambie','Permite girar con precaución, dejando pasar a los vehículos de tu carril de destino y sin poner en peligro a quienes cruzan'],c:2,e:'La flecha autoriza la dirección indicada, pero debes dejar pasar a quienes ya circulan por el carril al que entras y proteger a los demás usuarios que cruzan.',r:'RGC, anexo I, apartado 4.2.g'},
 {id:'q50',l:'T3L4',q:'Circulas por un carril y se enciende un aspa roja sobre él. ¿Qué debes hacer?',o:['Abandonar ese carril lo antes posible','Esperar detenido bajo el aspa','Seguir por el carril hasta la próxima salida'],c:0,e:'El aspa roja prohíbe ocupar el carril indicado. Quien ya esté circulando por él debe salir de ese carril lo antes posible.',r:'RGC, anexo I, apartado 4.3.a'},
 {id:'q51',l:'T3L4',q:'Mientras cruzas como peatón, la luz verde empieza a parpadear. ¿Qué anuncia?',o:['Que los vehículos seguirán parados durante otro ciclo','Que queda poco tiempo para terminar de cruzar y aparecerá la luz roja','Que el semáforo ha dejado de funcionar'],c:1,e:'El verde intermitente avisa de que está a punto de terminar el tiempo disponible para completar el cruce.',r:'RGC, anexo I, apartado 4.1.b'},
 {id:'q52',l:'T3L5',img:'entry',q:'¿Qué indica esta señal?',o:['Vía reservada para vehículos de emergencia','Calzada cerrada en ambos sentidos','Prohibición de entrar desde el sentido en que está colocada'],c:2,e:'La R-101 prohíbe el acceso a los vehículos desde el sentido por el que llegan a la señal.',r:'RGC, anexo I, apartado 5.1, señal R-101'},
 {id:'q53',l:'T3L5',img:'speed',q:'¿Qué indica el número de esta señal?',o:['La velocidad máxima permitida, en km/h','La velocidad mínima que debes mantener','La velocidad recomendada para el tramo'],c:0,e:'La R-301 fija un límite máximo. Puedes circular más despacio cuando lo exijan las circunstancias.',r:'RGC, anexo I, apartado 5.1, señal R-301'},
 {id:'q54',l:'T3L5',q:'¿Cuál es la función de una señal de advertencia de peligro?',o:['Reservar una vía a una clase de vehículos','Avisar con antelación de un riesgo y de su naturaleza','Confirmar siempre un itinerario o destino'],c:1,e:'Estas señales advierten con tiempo de un riesgo, como una curva o la proximidad de obras.',r:'RGC, art. 144'},
 {id:'q55',l:'T3L5',q:'Debajo de una señal de peligro hay un panel S-800 que indica 200 m. ¿Cómo debes interpretar esa distancia?',o:['Como la longitud del tramo peligroso','Como la distancia hasta la siguiente señal de velocidad','Como la distancia que falta hasta donde comienza el peligro'],c:2,e:'El S-800 indica cuánto falta hasta el inicio del peligro. El S-810 indica la longitud del tramo en el que existe.',r:'RGC, art. 144.2 y 144.3 y anexo I, apartado 5.1'},
 {id:'q56',l:'T3L5',img:'ceda',q:'¿A qué familia pertenece esta señal?',o:['Reglamentación: prioridad','Indicación: servicios','Advertencia de peligro'],c:0,e:'Aunque es triangular, la R-1 es una señal de prioridad, que pertenece a la familia de reglamentación.',r:'RGC, art. 145.2.a y anexo I, apartado 5.1, señal R-1'},
 {id:'q57',l:'T3L6',q:'Hay una línea continua junto a una discontinua separando los dos sentidos. Quieres iniciar un adelantamiento y la continua está de tu lado. ¿Puedes atravesarla en condiciones ordinarias?',o:['Sí, si la discontinua está al otro lado','No, para iniciar la maniobra cuenta la línea de tu lado','Sí, si el vehículo adelantado circula por debajo del límite'],c:1,e:'Para iniciar la maniobra debes tener en cuenta la línea más próxima a tu carril. La continua de tu lado impide atravesarla como regla general.',r:'RGC, anexo I, apartado 5.2, marcas M-3.1 a M-3.3'},
 {id:'q58',l:'T3L6',q:'El semáforo está rojo y hay una línea transversal continua antes del cruce. ¿Dónde debes detenerte?',o:['Delante de la línea, sin rebasarla','A la altura del poste, aunque rebases la línea','Justo después de la línea'],c:0,e:'La marca M-4.1 establece el límite que no debes sobrepasar cuando el semáforo ordena detenerse.',r:'RGC, anexo I, apartados 4.2.a y 5.2, marca M-4.1'},
 {id:'q59',l:'T3L6',q:'¿Qué indica una línea amarilla discontinua pintada en el bordillo?',o:['Prohibición de parar y estacionar','Obligación de estacionar junto al bordillo','Prohibición de estacionar'],c:2,e:'La amarilla discontinua prohíbe estacionar. La continua prohíbe tanto la parada como el estacionamiento.',r:'RGC, anexo I, apartado 5.2, marcas M-7.7 y M-7.8'},
 {id:'q60',l:'T3L6',q:'Una flecha de fin de carril te indica cambiar a la izquierda. Por el carril izquierdo ya circula un vehículo. ¿Qué haces?',o:['Cambio, porque la flecha me da prioridad','Espero un hueco y respeto la prioridad del vehículo de la izquierda','Me detengo donde está pintada la flecha'],c:1,e:'La flecha avisa de que tu carril termina. Al cambiar, debe pasar primero quien ya circula por el carril que quieres ocupar.',r:'RGC, anexo I, apartado 5.2, marca M-5.4'},
 {id:'q61',l:'T3L6',q:'En un cruce sin señal vertical ni semáforo hay un STOP pintado y una línea de detención. ¿Qué debes hacer?',o:['Detenerte antes de la línea y después ceder el paso','Reducir la velocidad y seguir si no hay vehículos','Detenerte solo si una señal vertical refuerza la marca'],c:0,e:'La marca vial de STOP puede ordenar por sí misma detenerse y después ceder el paso.',r:'RGC, anexo I, apartado 5.2, marcas M-6.3 y M-6.4'}
];

/* ================= Tema 4: velocidad ================= */
const SPEED_LESSONS=[
 {id:'T4L1',t:'Velocidad adecuada y visibilidad',min:5,
  key:'El límite marca el máximo. Ajusta la velocidad para poder detenerte dentro del tramo que ves y ante cualquier obstáculo que pueda aparecer.',
  body:`<p>Para elegir la velocidad, observa cuánto ves y cómo están el firme, el tráfico, el vehículo y su carga. Ten en cuenta también tu estado. Con lluvia intensa, niebla densa o poca adherencia quizá debas circular muy por debajo del límite señalizado.</p>
  <p>Modera la velocidad y detente si hace falta al acercarte a un centro escolar, a un autobús parado, a un paso peatonal sin regulación, a ciclistas, animales o a un lugar de poca visibilidad. Hazlo también antes de estrechamientos y cruces en los que no tengas prioridad.</p>
  <p>En una intersección debidamente señalizada con visibilidad prácticamente nula, el Reglamento fija un máximo de 50 km/h. Sigue aplicando cualquier límite inferior y reduce aún más si lo exige la seguridad.</p>`,
  tip:'Si se acorta lo que ves o empeora el agarre, necesitas bajar la velocidad antes de llegar al peligro.',
  errs:['Mantener el límite señalizado con niebla intensa aunque veas muy poco.','Confundir el máximo de 50 km/h en el cruce con una velocidad segura en cualquier circunstancia.'],
  ref:'RGC, arts. 45 y 46',source:'#a45'},
 {id:'T4L2',t:'Límites en ciudad y travesías',min:6,
  key:'En calles urbanas sin un límite específico, recuerda 20, 30 y 50. Mira primero si acera y calzada están al mismo nivel y después cuántos carriles cuentan en tu sentido.',
  body:`<ul><li><b>20 km/h:</b> plataforma única de calzada y acera.</li><li><b>30 km/h:</b> un carril por sentido.</li><li><b>50 km/h:</b> dos o más carriles por sentido.</li></ul>
  <p>Los carriles reservados a usuarios concretos o al transporte público no cuentan en este cálculo. El ayuntamiento puede señalizar un límite inferior o, de forma excepcional, autorizar hasta 50 km/h en una calle de un carril por sentido mediante señal específica.</p>
  <p>En una <b>travesía</b> el límite genérico es 50 km/h. En una <b>autopista o autovía dentro de poblado</b> es 80 km/h. En ambos casos, el Reglamento permite que un acuerdo entre el ayuntamiento y el titular de la vía modifique el límite con señalización específica: para rebajarlo en travesías o para ampliarlo en autopistas y autovías sin superar el genérico de fuera de poblado.</p>
  <p>Los vehículos con mercancías peligrosas tienen un máximo de 40 km/h en travesías y en las vías urbanas con dos o más carriles por sentido.</p>`,
  tip:'Una calle con un carril normal y un carril bus en tu sentido cuenta como un carril.',
  errs:['Contar los carriles de ambos sentidos juntos.','Aplicar los límites de una calle urbana a una travesía sin distinguir el tipo de vía.'],
  ref:'RGC, art. 50',source:'#a50'},
 {id:'T4L3',t:'Límites fuera de poblado',min:7,
  key:'El máximo genérico de turismos y motocicletas es de 120 km/h en autopista o autovía y de 90 km/h en carretera convencional pavimentada.',
  body:`<ul><li><b>Turismos, motocicletas, autocaravanas hasta 3.500 kg de MMA y pick-up:</b> 120 en autopista o autovía y 90 en carretera convencional.</li><li><b>Autobuses, derivados de turismo y vehículos mixtos adaptables:</b> 100 y 90, respectivamente, salvo límites especiales.</li><li><b>Camiones, furgonetas, autocaravanas de más de 3.500 kg y automóviles con remolque:</b> 90 y 80, respectivamente.</li></ul>
  <p>En una carretera convencional con separación física entre sentidos, el titular puede fijar un máximo de <b>100 km/h</b> para turismos, motocicletas y autocaravanas de hasta 3.500 kg. El límite no sube automáticamente por existir una mediana. En vías sin pavimentar fuera de poblado, el máximo es <b>30 km/h</b>.</p>
  <p>En el transporte escolar o de menores y en el de mercancías peligrosas, el máximo de la tabla del artículo 48 se reduce en 10 km/h. Fuera de poblado, un autobús con pasajeros de pie autorizados o que carezca de cinturones tiene un máximo de 80 km/h en cualquier tipo de vía.</p>
  <p>Fuera de poblado, el límite de referencia de los ciclomotores, los cuadriciclos ligeros y los ciclos es 45 km/h. Las bicicletas pueden superarlo si el tramo lo permite. Los vehículos especiales tienen reglas propias. MMA significa masa máxima autorizada.</p>`,
  tip:'Para elegir la cifra, identifica primero la vía y después la categoría del vehículo.',
  errs:['Aplicar 120 km/h a un turismo que lleva remolque.','Dar por hecho que una mediana eleva la máxima a 100 km/h.'],
  ref:'RGC, art. 48.1',source:'#a48'},
 {id:'T4L4',t:'Velocidad mínima, señales y adelantamiento',min:6,ill:'verticalSigns',
  key:'En autopista y autovía, el mínimo general para vehículos a motor es 60 km/h. En las demás vías es la mitad de la velocidad genérica de la categoría del vehículo, salvo causa justificada.',
  body:`<p>La mínima general también se aplica cuando no hay otros vehículos. Puedes bajar de ella si el tráfico, la vía o el vehículo impiden mantenerla con seguridad, como en una retención, y en los demás supuestos del artículo 49.</p>
  <p>Si tu vehículo no alcanza la velocidad mínima y hay peligro de alcance, utiliza la señal de emergencia mientras circulas. En cambio, si frenas mucho y no hay un peligro inminente, comprueba que puedes hacerlo con seguridad, avisa y reduce de forma progresiva.</p>
  <p>Si hay una señal de velocidad específica o temporal, comprueba que se aplica a tu vehículo y carril. Respeta las limitaciones que también correspondan a tu vehículo o a ti como conductor.</p>
  <p>El margen de 20 km/h que se permitía a turismos y motocicletas para adelantar en determinadas carreteras convencionales dejó de aplicarse en 2022. Solo adelanta cuando lo puedas hacer respetando el límite.</p>`,
  tip:'La mínima no obliga a mantener una velocidad peligrosa y el adelantamiento no autoriza a superar la máxima.',
  errs:['Calcular la mínima de una autovía como la mitad de la máxima de tu vehículo.','Añadir 20 km/h al límite porque vas a adelantar.'],
  ref:'RGC, arts. 47, 49 y 51 a 53. Ley 18/2021, disposición derogatoria única.2',source:'#a49'},
 {id:'T4L5',t:'Reacción, frenado y detención',min:5,ill:'stoppingDistance',
  key:'La distancia de detención suma lo que recorres antes de empezar a frenar y lo que recorres desde que frenas hasta que te paras.',
  body:`<p><b>Distancia de reacción:</b> lo que avanzas desde que detectas el peligro hasta que empiezas a frenar. A igual velocidad, aumenta si tardas más en reaccionar por cansancio o distracción. Si el tiempo de reacción es el mismo, recorrerás más metros cuanto más rápido vayas.</p>
  <p><b>Distancia de frenado:</b> lo que avanzas desde que empiezas a frenar hasta la detención. Influyen la velocidad, la adherencia de la calzada y el estado del vehículo. A la misma velocidad, un firme deslizante puede alargar la frenada.</p>
  <p>Por ejemplo, si recorres 10 metros antes de frenar y otros 15 hasta detenerte, necesitas 25 metros en total. Es un ejemplo de suma: en carretera, el espacio necesario cambia con las condiciones.</p>`,
  tip:'Separa los dos momentos: darse cuenta y empezar a frenar, y después frenar hasta parar.',
  errs:['Medir la detención solo desde que pisas el freno.','Creer que la lluvia y los neumáticos apenas cambian la distancia de frenado.'],
  ref:'RGC, arts. 45 y 54.1',source:'#a45'},
 {id:'T4L6',t:'Distancia de seguridad',min:6,
  key:'Deja espacio para detenerte si quien va delante frena de golpe. Aumenta el margen si sube la velocidad o baja la adherencia.',
  body:`<p>Calcula la separación según el agarre y la capacidad de frenado. El Reglamento permite que las bicicletas circulen en grupo sin mantener la separación ordinaria, extremando la atención para evitar alcances.</p>
  <p>Cuando sigues a otro vehículo sin indicar que vas a adelantarlo, deja además hueco para que quien venga detrás pueda adelantarte con seguridad. Para vehículos de más de 3.500 kg de MMA y vehículos o conjuntos de más de 10 metros, esa última separación es de al menos <b>50 metros</b> donde se aplica la regla.</p>
  <p>El hueco adicional para facilitar el adelantamiento no se exige en poblado, cuando adelantar está prohibido, si hay más de un carril en tu sentido o si el tráfico está demasiado denso para adelantar. Sigue siendo obligatorio dejar margen para evitar un alcance.</p>
  <p>En <b>túneles o pasos inferiores</b>, si no vas a adelantar, guarda al menos <b>100 metros o cuatro segundos</b>. Para vehículos de más de 3.500 kg de MMA, el mínimo es <b>150 metros o seis segundos</b>. Para estimar los segundos, empieza a contar al pasar el vehículo de delante por una referencia fija.</p>`,
  tip:'Distingue tres situaciones: evitar un alcance, dejar hueco para que otro adelante y circular por un túnel.',
  errs:['Pensar que en ciudad no hace falta distancia porque no se exige el hueco adicional.','Usar el mínimo de un turismo en un túnel cuando conduces un vehículo de más de 3.500 kg.'],
  ref:'RGC, arts. 54 y 95.6',source:'#a54'}
];

 {id:'q62',l:'T4L1',q:'El máximo señalizado es 90 km/h. Hay niebla densa y a esa velocidad no puedes parar dentro del tramo visible. ¿Qué haces?',o:['Mantengo 90 si no veo ningún vehículo','Reduzco hasta poder detenerme dentro de lo que veo','Mantengo 90 si llevo luces antiniebla'],c:1,e:'Debes adaptar la velocidad a la visibilidad y poder detenerte dentro del tramo que ves.',r:'RGC, arts. 45 y 46.1.k'},
 {id:'q63',l:'T4L1',q:'Te acercas a un colegio a la hora de salida. ¿Qué debes hacer aunque circules dentro del límite?',o:['Moderar la velocidad y detenerte si hace falta','Mantener la velocidad hasta que un menor pise la calzada','Reducir solo si se enciende una señal luminosa'],c:0,e:'Debes moderar la velocidad al acercarte a lugares donde es previsible la presencia de niños.',r:'RGC, art. 46.1.b'},
 {id:'q64',l:'T4L1',q:'Al aproximarte a un autobús escolar parado, ¿qué conducta corresponde?',o:['Mantener el máximo del tramo mientras sus puertas estén cerradas','Moderarte solo si el autobús lleva encendidos los intermitentes','Moderar la velocidad y detenerte si es preciso'],c:2,e:'El Reglamento exige moderación cuando te acercas a un autobús parado, especialmente si es de transporte escolar.',r:'RGC, art. 46.1.e'},
 {id:'q65',l:'T4L1',q:'En una carretera convencional con límite de 90 km/h, llegas a una intersección señalizada con visibilidad prácticamente nula. ¿Qué máximo fija la regla para ese cruce?',o:['70 km/h','50 km/h','60 km/h'],c:1,e:'El Reglamento fija un tope de 50 km/h en este supuesto. Debes reducir más si la seguridad o un límite inferior lo exigen.',r:'RGC, arts. 45 y 46.1.h'},
 {id:'q66',l:'T4L1',q:'En una vía con charcos puedes salpicar a los peatones aunque circules por debajo del máximo. ¿Qué debes hacer?',o:['Moderar la velocidad para evitar salpicarlos','Mantener la marcha porque estás por debajo del límite','Acelerar para pasar menos tiempo junto al charco'],c:0,e:'La posibilidad de proyectar agua sobre otros usuarios es motivo para moderar la velocidad.',r:'RGC, art. 46.1.g'},
 {id:'q67',l:'T4L2',q:'En una calle de plataforma única de calzada y acera, sin señal específica, ¿cuál es el máximo genérico?',o:['30 km/h','20 km/h','50 km/h'],c:1,e:'Una plataforma única de calzada y acera tiene límite genérico de 20 km/h.',r:'RGC, art. 50.1.a'},
 {id:'q68',l:'T4L2',q:'En una calle con aceras separadas tienes un carril normal y otro reservado al autobús en tu sentido. Sin señal específica, ¿cuál es el máximo genérico para tu turismo?',o:['50 km/h porque hay dos carriles','20 km/h porque hay un carril reservado','30 km/h porque el carril bus no cuenta'],c:2,e:'Al contar los carriles para el límite urbano, se excluyen los reservados al transporte público.',r:'RGC, art. 50.1.b y párrafo final del apartado 1'},
 {id:'q69',l:'T4L2',q:'Una vía urbana tiene dos carriles de uso general en cada sentido, calzada separada de la acera y ninguna señal específica. ¿Cuál es su máximo genérico?',o:['50 km/h','30 km/h','80 km/h'],c:0,e:'En vías urbanas con dos o más carriles por sentido, el límite genérico es de 50 km/h.',r:'RGC, art. 50.1.c'},
 {id:'q70',l:'T4L2',q:'Conduces un turismo por una travesía sin señal específica. ¿Cuál es el límite genérico?',o:['30 km/h','50 km/h','80 km/h'],c:1,e:'Una travesía tiene un límite genérico de 50 km/h. Puede rebajarse con señalización específica.',r:'RGC, art. 50.5'},
 {id:'q71',l:'T4L2',q:'Circulas por una autovía dentro de poblado y no hay señal específica de velocidad. ¿Cuál es el máximo genérico?',o:['50 km/h','120 km/h','80 km/h'],c:2,e:'En autopistas y autovías que atraviesan un poblado, el límite genérico del tramo es 80 km/h.',r:'RGC, art. 50.6'},
 {id:'q72',l:'T4L3',q:'Conduces una motocicleta por autopista fuera de poblado en buenas condiciones. Sin señal ni límite particular, ¿cuál es tu máximo genérico?',o:['120 km/h','100 km/h','90 km/h'],c:0,e:'Las motocicletas y los turismos tienen un máximo genérico de 120 km/h en autopista y autovía fuera de poblado.',r:'RGC, art. 48.1.a'},
 {id:'q73',l:'T4L3',q:'¿Cuál es la máxima genérica de un turismo sin remolque en una carretera convencional pavimentada, si no hay una señal específica?',o:['100 km/h','90 km/h','80 km/h'],c:1,e:'Para un turismo, el límite genérico de la carretera convencional pavimentada es 90 km/h.',r:'RGC, art. 48.1.a'},
 {id:'q74',l:'T4L3',q:'Una carretera convencional tiene separación física entre sentidos y una señal fija 100 km/h conforme al Reglamento. ¿A cuál de estos vehículos se le puede aplicar ese máximo?',o:['Una furgoneta','Un turismo con remolque','Una motocicleta'],c:2,e:'El titular puede fijar 100 km/h en ese tipo de carretera para motocicletas, turismos y autocaravanas de hasta 3.500 kg de MMA.',r:'RGC, art. 48.1.a.1.º'},
 {id:'q75',l:'T4L3',q:'Conduces un turismo con remolque por una autovía fuera de poblado. Sin un límite específico inferior, ¿cuál es tu máxima genérica?',o:['90 km/h','100 km/h','120 km/h'],c:0,e:'Los automóviles con remolque tienen una máxima genérica de 90 km/h en autopista y autovía y de 80 km/h en carretera convencional.',r:'RGC, art. 48.1.a'},
 {id:'q76',l:'T4L3',q:'Circulas fuera de poblado por una vía sin pavimentar y sin un límite específico inferior. ¿Cuál es el máximo?',o:['45 km/h','30 km/h','50 km/h'],c:1,e:'Fuera de poblado, el máximo en vías sin pavimentar es de 30 km/h.',r:'RGC, art. 48.1.f'},
 {id:'q77',l:'T4L4',q:'En una autovía despejada y sin causa justificada para circular más despacio, ¿cuál es la velocidad mínima general de un vehículo a motor?',o:['50 km/h','45 km/h','60 km/h'],c:2,e:'La mínima general en autopista y autovía es de 60 km/h, aunque no circulen otros vehículos.',r:'RGC, art. 49.1'},
 {id:'q78',l:'T4L4',q:'En una carretera convencional cuyo máximo genérico para tu turismo es 90 km/h, ¿cuál es la mínima general en condiciones normales y sin señales que la modifiquen?',o:['45 km/h','60 km/h','30 km/h'],c:0,e:'En las vías distintas de autopistas y autovías, se toma la mitad de la genérica del vehículo: la mitad de 90 es 45.',r:'RGC, arts. 48.1.a y 49.1'},
 {id:'q79',l:'T4L4',q:'Una retención impide mantener 60 km/h con seguridad en una autopista. ¿Puedes circular por debajo de esa cifra?',o:['Solo si llevas un vehículo especial','Sí, si el tráfico obliga a ello','No, el mínimo se aplica también en una retención'],c:1,e:'Está permitido bajar del mínimo cuando las circunstancias del tráfico impiden mantenerlo con seguridad.',r:'RGC, art. 49.2'},
 {id:'q80',l:'T4L4',q:'Tu vehículo no puede alcanzar la velocidad mínima exigida y existe peligro de alcance. ¿Cómo lo adviertes mientras circulas?',o:['Con el intermitente derecho solamente','Con las ráfagas de luz larga','Con la señal de emergencia'],c:2,e:'Cuando el vehículo no alcanza la mínima y hay peligro de alcance, debes activar la señal de emergencia durante la marcha.',r:'RGC, art. 49.3'},
 {id:'q81',l:'T4L4',q:'En una carretera convencional limitada a 90 km/h, ¿puedes llegar a 110 km/h solo para adelantar con un turismo?',o:['No, debes respetar el límite durante la maniobra','Sí, si el vehículo adelantado circula por debajo de 90','Sí, si no viene nadie de frente'],c:0,e:'El antiguo margen para adelantar se eliminó. El adelantamiento debe hacerse dentro del límite.',r:'RGC, art. 51 derogado. Ley 18/2021, disposición derogatoria única.2'},
 {id:'q82',l:'T4L5',q:'Recorres 10 metros antes de empezar a frenar y otros 15 metros hasta parar. ¿Cuál es la distancia total de detención?',o:['15 metros','25 metros','10 metros'],c:1,e:'Se suman la distancia de reacción y la de frenado: 10 más 15 son 25 metros.',r:'DGT, Manual del permiso B, velocidad y distancias'},
 {id:'q83',l:'T4L5',q:'Con la misma velocidad, tardas más en empezar a frenar porque estás distraído. ¿Qué distancia aumenta directamente por ese retraso?',o:['La distancia de frenado','La distancia lateral al borde','La distancia de reacción'],c:2,e:'Durante el retraso sigues avanzando. La distancia de reacción termina cuando empiezas a frenar.',r:'DGT, Manual del permiso B, velocidad y distancias'},
 {id:'q84',l:'T4L5',q:'Dos coches iguales inician la frenada a la misma velocidad. Uno circula por un firme con menos agarre. ¿Cuál suele necesitar más distancia para frenar?',o:['El que tiene menos agarre','El que tiene más agarre','Los dos necesitan siempre la misma'],c:0,e:'Con menos adherencia, normalmente se necesita más espacio desde que empieza la frenada hasta la detención.',r:'RGC, art. 54.1 y guía de velocidad de la DGT'},
 {id:'q85',l:'T4L5',q:'Si tu tiempo de reacción es el mismo pero circulas más rápido, ¿qué pasa con la distancia de reacción?',o:['Se mantiene, porque el tiempo no cambia','Aumenta','Disminuye, porque llegas antes al obstáculo'],c:1,e:'Durante los mismos segundos recorres más metros cuanto mayor sea la velocidad.',r:'DGT, Manual del permiso B, velocidad y distancias'},
 {id:'q86',l:'T4L5',q:'¿Desde qué momento empieza a medirse la distancia de frenado?',o:['Desde que adviertes el peligro','Desde que el vehículo de delante enciende sus luces de freno','Desde que empiezas a frenar'],c:2,e:'El tramo anterior a pisar el freno es la distancia de reacción. La de frenado comienza al actuar sobre el freno.',r:'DGT, Manual del permiso B, velocidad y distancias'},
 {id:'q87',l:'T4L6',q:'Sigues a otro turismo con poca separación y empieza a llover con intensidad. ¿Qué debes hacer?',o:['Moderar la velocidad y dejar margen para parar sin alcanzarlo','Mantener velocidad y separación mientras veas sus luces','Acercarme para que otro vehículo no ocupe el hueco'],c:0,e:'Con lluvia intensa debes moderar la velocidad. Deja una distancia que te permita parar sin colisionar teniendo en cuenta la adherencia.',r:'RGC, arts. 46.1.k y 54.1'},
 {id:'q88',l:'T4L6',q:'Conduces un turismo en un túnel, detrás de otro vehículo y sin intención de adelantar. ¿Qué separación mínima se exige?',o:['50 metros o dos segundos','100 metros o cuatro segundos','150 metros o seis segundos'],c:1,e:'El mínimo en túnel o paso inferior para un turismo, cuando no se pretende adelantar, es 100 metros o cuatro segundos.',r:'RGC, art. 95.6'},
 {id:'q89',l:'T4L6',q:'En un túnel conduces un vehículo de más de 3.500 kg de MMA y vas detrás de otro sin intención de adelantar. ¿Qué separación mínima se exige?',o:['100 metros o cuatro segundos','50 metros o dos segundos','150 metros o seis segundos'],c:2,e:'Para vehículos de más de 3.500 kg de MMA, el mínimo en este supuesto sube a 150 metros o seis segundos.',r:'RGC, art. 95.6'},
 {id:'q90',l:'T4L6',q:'Fuera de poblado, en una vía con un carril por sentido donde se puede adelantar y con tráfico fluido, conduces un vehículo de 12 metros. No has señalado que vayas a adelantar. ¿Qué separación mínima debes dejar con el vehículo precedente para que otros puedan adelantarte?',o:['50 metros','30 metros','100 metros'],c:0,e:'El mínimo de 50 metros para facilitar el adelantamiento se aplica en estas condiciones a vehículos y conjuntos de más de 10 metros.',r:'RGC, art. 54.2 y 54.3'},
 {id:'q91',l:'T4L6',q:'Circulas en poblado detrás de otro coche. ¿Qué separación debes mantener?',o:['Ninguna mientras la velocidad sea baja','La necesaria para detenerte sin alcanzarlo si frena bruscamente','Siempre 50 metros para facilitar que te adelanten'],c:1,e:'En poblado no se exige el hueco adicional para facilitar el adelantamiento, pero sigue siendo obligatorio evitar el alcance.',r:'RGC, art. 54.1 y 54.3.a'}
];

/* ================= Tema 6: incorporación y maniobras ================= */
const MANEUVER_LESSONS=[
 {id:'T6L1',t:'Incorporarse y ceder el paso',min:5,
  key:'Quien se incorpora debe comprobar que puede hacerlo sin peligro, señalizar a tiempo y ceder el paso a los vehículos que ya circulan.',
  body:`<p>La incorporación puede empezar desde un estacionamiento, una vía de acceso, una zona de servicio o una propiedad colindante. Mira la posición, la velocidad y la trayectoria de los demás antes de salir. Usa los retrovisores y comprueba la zona que queda fuera de ellos. Si no ves bien, puedes necesitar la ayuda de otra persona.</p>
  <p>Señaliza el desplazamiento con antelación. Espera un hueco suficiente para incorporarte sin forzar a quienes circulan a frenar o desviarse de forma brusca.</p>
  <p>Si sales de un camino exclusivamente privado a una vía de uso público, avanza a una velocidad que te permita parar en el acto y cede a los vehículos que circulen por ella, vengan de donde vengan.</p>`,
  tip:'Antes de mover el coche, comprueba quién se acerca, por dónde y a qué velocidad.',
  errs:['Colocarte en la calzada para que los demás se vean obligados a dejarte salir.','Mirar solo en una dirección al salir de un camino privado.'],
  ref:'RGC, arts. 58, 72 y 109',source:'#a72'},
 {id:'T6L2',t:'Carril de aceleración y salida del autobús',min:6,
  key:'Valora el tráfico al principio del carril de aceleración. Si puedes incorporarte, utiliza el carril para alcanzar una velocidad adecuada a la vía.',
  body:`<p>Al comienzo del <b>carril de aceleración</b>, observa la calzada a la que vas a entrar. Si hace falta, detente en ese punto. Cuando puedas hacerlo con seguridad, acelera para adaptar la velocidad antes de incorporarte al final del carril. Los vehículos de la calzada a la que accedes tienen preferencia.</p>
  <p>Si eres tú quien ya circula por esa calzada, facilita la incorporación en la medida de lo posible. Puedes adaptar el ritmo o cambiar de carril cuando sea legal y seguro. La otra persona sigue teniendo que ceder.</p>
  <p>En poblado, al acercarte a un autobús de transporte colectivo que quiere salir de una <b>parada señalizada</b>, facilita su salida: desplázate si puedes, reduce la velocidad y detente si hace falta. Quien conduce el autobús debe anunciar la salida con el intermitente y comprobar que puede realizarla sin riesgo.</p>`,
  tip:'El carril de entrada da espacio para adaptar la velocidad. El hueco lo decides observando a quienes ya circulan.',
  errs:['Dar por hecho que todo el tráfico debe cambiar de carril para dejarte entrar.','Creer que el autobús puede salir sin mirar porque los demás deben facilitarle el paso.'],
  ref:'RGC, arts. 72.4, 73 y 74.2',source:'#a72'},
 {id:'T6L3',t:'Cambiar de carril y tomar una salida',min:6,
  key:'Al cambiar de carril, respeta a quien ya circula por el carril que quieres ocupar. El intermitente avisa de tu intención.',
  body:`<p>Comprueba que las marcas y señales permiten el movimiento. Observa por delante y por detrás, comprueba el ángulo muerto, avisa con el intermitente del lado hacia el que vas y desplázate cuando sea seguro. Apaga el intermitente al adoptar la nueva trayectoria.</p>
  <p>Para abandonar una autopista, autovía u otra vía, colócate con suficiente antelación en el carril más próximo a la salida. Entra en el <b>carril de deceleración</b>, si existe, tan pronto como puedas. Adapta la velocidad a la salida y a la señalización.</p>
  <p>Si te pasas la salida de una autovía, sigue hasta otra salida permitida. Dar marcha atrás está prohibido y cruzar de golpe varios carriles puede poner en peligro a quienes ya los ocupan.</p>`,
  tip:'Prepara la salida antes de llegar al desvío. Si ya lo has pasado, sigue el itinerario hasta una salida segura.',
  errs:['Cambiar de carril en el mismo momento en que enciendes el intermitente.','Tomar la salida directamente desde el carril izquierdo.'],
  ref:'RGC, arts. 74.2, 77, 80.3 y 109.2.a',source:'#a74'},
 {id:'T6L4',t:'Girar a la derecha o a la izquierda',min:7,
  key:'Comprueba la señalización y la visibilidad, avisa con antelación y colócate para el giro antes de llegar al cruce.',
  body:`<p>Si no hay una disposición o señal que indique otra forma de girar, para hacerlo a la <b>derecha</b> acércate al borde derecho. Para girar a la <b>izquierda</b> desde una calzada de sentido único, acércate al borde izquierdo. En una de doble sentido, acércate a la separación de sentidos o al eje sin invadir el sentido contrario.</p>
  <p>Si la calzada de doble sentido tiene tres carriles separados por líneas longitudinales discontinuas, colócate en el carril central para girar a la izquierda. Al girar a la izquierda, deja el centro de la intersección a tu izquierda, salvo que la vía indique o disponga otra trayectoria.</p>
  <p>Comprueba que puedes girar sin peligro por el tráfico que viene de frente. Renuncia al giro a la izquierda si no hay visibilidad suficiente. Cede a quienes tengan prioridad al cruzar la vía a la que entras, como los peatones que estén cruzando aunque no haya paso pintado.</p>
  <p>En vías interurbanas, los ciclos y ciclomotores de dos ruedas inician el giro a la izquierda desde la derecha, fuera de la calzada si es posible, cuando no existe un carril preparado para ese giro.</p>`,
  tip:'Para girar a la izquierda, identifica si la calzada de origen es de uno o de dos sentidos.',
  errs:['Preparar un giro invadiendo el sentido contrario.','Girar a la izquierda si no puedes ver con suficiente antelación a quien viene de frente.'],
  ref:'RGC, arts. 65, 74 a 76 y 109',source:'#a75'},
 {id:'T6L5',t:'Cambiar el sentido de la marcha',min:5,
  key:'Cambiar de sentido es continuar en la dirección opuesta por la misma vía. Elige un lugar permitido y con visibilidad suficiente.',
  body:`<p>Señaliza con tiempo y comprueba que puedes invertir la marcha sin poner en peligro ni obstaculizar a nadie. Ocupa la vía durante el menor tiempo posible. Si al esperar bloqueas a quienes vienen detrás, sal de la calzada por la derecha cuando sea posible y espera allí hasta que puedas realizar la maniobra.</p>
  <p>Está prohibido cambiar de sentido si no puedes comprobar que es seguro, en pasos a nivel, túneles, pasos inferiores y tramos afectados por la señal de túnel. En autopistas y autovías solo se permite en lugares habilitados.</p>
  <p>Como regla general, tampoco se permite donde esté prohibido adelantar, salvo autorización expresa para cambiar de sentido.</p>`,
  tip:'Comprueba primero el lugar. Después busca el momento y el espacio para hacer la maniobra.',
  errs:['Dar media vuelta donde no ves a los vehículos que se acercan.','Suponer que una prohibición de adelantar nunca afecta al cambio de sentido.'],
  ref:'RGC, arts. 78 y 79',source:'#a78'},
 {id:'T6L6',t:'Dar marcha atrás',min:6,
  key:'Retrocede solo en los supuestos permitidos y durante el recorrido imprescindible. Para parar, estacionar o incorporarte, el máximo es 15 metros y no puedes invadir un cruce.',
  body:`<p>La marcha atrás se permite cuando no puedes seguir hacia delante ni cambiar de dirección ni de sentido, o si es el complemento necesario de otra maniobra. El límite de 15 metros y la prohibición de invadir un cruce se aplican cuando complementa una parada, un estacionamiento o una incorporación. En autopistas y autovías la marcha atrás está prohibida.</p>
  <p>Retrocede lentamente y verifica que tienes visibilidad, espacio y tiempo. Si lo necesitas, bájate para comprobar la zona o pide a otra persona que te indique. Advierte la maniobra con la luz de marcha atrás. Si el vehículo no dispone de ella, se hace con el brazo extendido horizontalmente y la palma hacia atrás.</p>
  <p>Detente de inmediato si oyes una advertencia o detectas cerca a una persona, un animal u otro vehículo. Desiste de la maniobra si la seguridad lo exige.</p>`,
  tip:'Antes de retroceder, comprueba el espacio detrás del vehículo. Si dejas de tenerlo controlado, detente.',
  errs:['Invadir un cruce al retroceder para aparcar porque el recorrido tiene menos de 15 metros.','Confiar en que el resto se apartará al ver la luz de marcha atrás.'],
  ref:'RGC, arts. 80, 81 y 109.2.b',source:'#a80'}
];

const MANEUVER_QUESTIONS=[
 {id:'q92',l:'T6L1',q:'Vas a salir de un estacionamiento en línea y se acerca un vehículo por el carril que quieres ocupar. ¿Qué haces?',o:['Espero un hueco y le cedo el paso','Salgo en cuanto enciendo el intermitente','Saco el morro para que el otro vehículo se detenga'],c:0,e:'Quien sale de un estacionamiento debe ceder a quienes ya circulan y comprobar que puede entrar sin peligro.',r:'RGC, art. 72.1'},
 {id:'q93',l:'T6L1',q:'Sales de un camino exclusivamente privado a una carretera de uso público. ¿A qué vehículos debes ceder el paso?',o:['Solo a los que llegan por la derecha','A los que circulan por la carretera, en ambos sentidos','Solo a los que circulan por el carril en el que voy a entrar'],c:1,e:'Al salir de un camino exclusivamente privado debes ceder a los vehículos que circulan por la vía pública, cualquiera que sea su sentido.',r:'RGC, art. 72.2'},
 {id:'q94',l:'T6L1',q:'Al salir de un camino exclusivamente privado, ¿cómo debes aproximarte a la carretera de uso público?',o:['A la misma velocidad que el tráfico de la carretera','A una velocidad que me permita detenerme solo si hay un STOP','A una velocidad que me permita detenerme en el acto'],c:2,e:'La velocidad debe permitir una detención inmediata al salir del camino privado.',r:'RGC, art. 72.2'},
 {id:'q95',l:'T6L1',q:'Tienes poca visibilidad al intentar salir de un estacionamiento. ¿Puedes seguir las indicaciones de otra persona para comprobar que es seguro?',o:['Sí, si es necesario, y sigo siendo responsable de ceder el paso','No, solo puedo usar los retrovisores','Sí, y su indicación me da preferencia sobre el tráfico'],c:0,e:'El Reglamento admite la ayuda de otra persona para comprobar la seguridad. Quien se incorpora debe seguir cediendo.',r:'RGC, art. 72.1'},
 {id:'q96',l:'T6L1',q:'Vas a salir de un estacionamiento con un desplazamiento lateral. ¿Cuándo avisas de la maniobra?',o:['Cuando ya estoy cambiando de carril','Con antelación suficiente, antes de empezar','Solo si otro vehículo está cerca'],c:1,e:'La incorporación se advierte ópticamente con antelación, antes del desplazamiento.',r:'RGC, arts. 72.3 y 109.1'},
 {id:'q97',l:'T6L2',q:'¿En qué punto debes hacer la primera comprobación del tráfico al entrar en un carril de aceleración?',o:['Solo cuando llegues al final','Cuando ya estés entrando en la calzada','Al principio del carril de aceleración'],c:2,e:'La primera comprobación se hace al inicio del carril, donde debes detenerte si hace falta. Luego adaptas la velocidad para incorporarte.',r:'RGC, art. 72.4'},
 {id:'q98',l:'T6L2',q:'Tras comprobar que hay espacio para incorporarte, ¿para qué utilizas el carril de aceleración?',o:['Para alcanzar una velocidad adecuada antes de entrar en la calzada','Para alcanzar siempre el máximo señalizado','Para entrar en la calzada cuanto antes aunque todavía vayas demasiado despacio'],c:0,e:'La finalidad es llegar al final del carril con una velocidad adecuada al tráfico de la vía a la que te incorporas.',r:'RGC, art. 72.1 y 72.4'},
 {id:'q99',l:'T6L2',q:'Circulas por una autovía y otro coche quiere incorporarse. ¿Qué debes hacer?',o:['Cambiar siempre de carril aunque haya un vehículo a tu izquierda','Facilitarle la incorporación en la medida de lo posible y sin crear peligro','Mantener siempre el mismo ritmo para que calcule por sí solo'],c:1,e:'Quien ya circula debe facilitar la maniobra cuando pueda. El conductor que entra mantiene la obligación de ceder.',r:'RGC, arts. 72, 73.1 y 74.2'},
 {id:'q100',l:'T6L2',q:'En poblado, un autobús señaliza que sale de una parada señalizada. No puedes desplazarte a otro carril con seguridad. ¿Qué haces para facilitarle la salida?',o:['Acelero para pasar antes','Me cambio de carril aunque esté ocupado','Reduzco y, si hace falta, me detengo'],c:2,e:'Si no puedes desplazarte con seguridad, facilita la salida reduciendo la marcha y deteniéndote si es necesario.',r:'RGC, art. 73.2'},
 {id:'q101',l:'T6L2',q:'¿Qué debe hacer quien conduce un autobús antes de salir de una parada señalizada?',o:['Señalizar con el intermitente y comprobar que puede salir sin riesgo','Salir tras encender el intermitente, sin comprobar el tráfico','Esperar a que un agente le autorice siempre'],c:0,e:'La obligación de los demás de facilitar la incorporación no elimina las precauciones del conductor del autobús.',r:'RGC, art. 73.3'},
 {id:'q102',l:'T6L3',q:'Has encendido el intermitente izquierdo y se acerca otro coche por el carril izquierdo. ¿Quién tiene prioridad?',o:['Tú, porque has avisado primero','Quien ya circula por el carril izquierdo','El vehículo que va más despacio'],c:1,e:'Al desplazarte a otro carril debes respetar la prioridad de quien ya circula por él.',r:'RGC, art. 74.2'},
 {id:'q103',l:'T6L3',q:'Has terminado un cambio de carril y ya sigues la nueva trayectoria. ¿Qué haces con el intermitente?',o:['Lo mantengo hasta llegar al siguiente cruce','Lo cambio al lado contrario para indicar que he terminado','Dejo de señalizar el desplazamiento'],c:2,e:'La advertencia termina al adoptar la nueva trayectoria, porque avisa del desplazamiento lateral.',r:'RGC, art. 109.2.a'},
 {id:'q104',l:'T6L3',q:'Se acerca tu salida de la autovía. ¿Por qué carril debes circular con antelación?',o:['Por el más próximo a la salida','Por el más alejado de la salida','Por cualquiera hasta llegar al punto de desvío'],c:0,e:'Debes prepararte con antelación en el carril más próximo a la salida y entrar pronto en el carril de deceleración si existe.',r:'RGC, art. 77'},
 {id:'q105',l:'T6L3',q:'La vía que vas a abandonar tiene carril de deceleración. ¿Cuándo debes entrar en él?',o:['Al llegar al final del carril, para reducir menos tiempo','Lo antes posible, desde el carril próximo a la salida','Solo cuando hayas alcanzado la velocidad final del ramal'],c:1,e:'El Reglamento exige entrar en el carril de deceleración lo antes posible si existe.',r:'RGC, art. 77'},
 {id:'q106',l:'T6L3',q:'Te has pasado una salida de la autovía. ¿Qué debes hacer?',o:['Dar marcha atrás por el carril de salida','Retroceder por el arcén si está libre','Continuar hasta otra salida permitida'],c:2,e:'La marcha atrás está prohibida en autopistas y autovías. Continúa hasta otra salida.',r:'RGC, art. 80.3'},
 {id:'q107',l:'T6L4',q:'Quieres girar a la derecha y la vía no indica otra forma de hacerlo. ¿Cómo te colocas?',o:['Me acerco todo lo posible al borde derecho de la calzada','Me acerco al eje, independientemente del sentido','Me desplazo hacia el borde izquierdo para abrir el giro'],c:0,e:'Para girar a la derecha debes ceñirte al borde derecho, salvo que la vía esté preparada o señalizada de otro modo.',r:'RGC, art. 75.1.b'},
 {id:'q108',l:'T6L4',q:'Vas a girar a la izquierda desde una calzada de sentido único y sin señalización específica para girar. ¿Dónde te colocas?',o:['Junto al borde derecho','Junto al borde izquierdo','Siempre en el centro de la calzada'],c:1,e:'Si la calzada de origen tiene un solo sentido, prepara el giro a la izquierda junto al borde izquierdo.',r:'RGC, art. 75.1.b'},
 {id:'q109',l:'T6L4',q:'Vas a girar a la izquierda desde una calle de doble sentido con un carril por sentido y sin indicaciones especiales. ¿Dónde te colocas?',o:['En el borde izquierdo aunque ocupe el sentido contrario','En el borde derecho para esperar el hueco','Junto a la separación de los sentidos, sin invadir el contrario'],c:2,e:'En una calzada de doble sentido, acércate a la línea de separación o al eje sin entrar en el espacio del tráfico contrario.',r:'RGC, art. 75.1.b'},
 {id:'q110',l:'T6L4',q:'Quieres girar a la izquierda, pero un obstáculo te impide ver suficientemente a los vehículos que pueden venir de frente. ¿Qué haces?',o:['Me abstengo de girar mientras no tenga visibilidad suficiente','Giro lentamente aunque siga sin ver lo que viene','Entro en el carril contrario con el intermitente puesto'],c:0,e:'El cambio de dirección a la izquierda requiere visibilidad suficiente. Debes abstenerte si no la tienes.',r:'RGC, art. 74.1'},
 {id:'q111',l:'T6L4',q:'En una vía interurbana, ¿desde dónde inicia el giro a la izquierda un ciclomotor de dos ruedas si no hay un carril preparado para ese giro?',o:['Desde el eje de la calzada en todos los casos','Desde la derecha, fuera de la calzada si es posible','Desde el arcén del sentido contrario'],c:1,e:'En ese supuesto, los ciclos y ciclomotores de dos ruedas se colocan a la derecha, fuera de la calzada si pueden, e inician allí el giro.',r:'RGC, art. 76.2'},
 {id:'q112',l:'T6L5',q:'En una carretera de doble sentido, vas a continuar por esa misma vía en el sentido contrario tras dar media vuelta. ¿Qué maniobra haces?',o:['Una incorporación desde una vía de acceso','Un desplazamiento lateral','Un cambio de sentido'],c:2,e:'El cambio de sentido invierte el sentido de la marcha por la misma vía.',r:'RGC, art. 78'},
 {id:'q113',l:'T6L5',q:'Mientras esperas para cambiar de sentido en un lugar permitido, impides avanzar a quienes van detrás. Puedes salir por la derecha con seguridad. ¿Qué haces?',o:['Salgo de la calzada por la derecha y espero allí','Sigo esperando en mitad del carril aunque bloquee el paso','Me desplazo al carril contrario para despejar el mío'],c:0,e:'Si la espera impide el paso por detrás, debes salir por el lado derecho cuando sea posible.',r:'RGC, art. 78.1'},
 {id:'q114',l:'T6L5',q:'¿Puedes cambiar de sentido dentro de un túnel si en ese momento no ves tráfico?',o:['Sí, si hay dos carriles en tu sentido','No, está prohibido','Sí, si lo señalizas con tiempo'],c:1,e:'El cambio de sentido está prohibido en túneles y pasos inferiores.',r:'RGC, art. 79.1'},
 {id:'q115',l:'T6L5',q:'En un tramo de carretera está prohibido adelantar. ¿Qué regla general se aplica al cambio de sentido?',o:['Se permite siempre que se haga de una vez','Se permite si no se ve a nadie','También se prohíbe, salvo autorización expresa'],c:2,e:'En general, la prohibición de adelantar impide cambiar de sentido, excepto cuando el cambio está expresamente autorizado.',r:'RGC, art. 79.1'},
 {id:'q116',l:'T6L5',q:'¿Dónde puedes cambiar de sentido en una autovía?',o:['En un lugar habilitado para ello','En cualquier abertura de la mediana que veas libre','En el arcén más próximo a la salida que te has pasado'],c:0,e:'En autopistas y autovías, el cambio de sentido solo está permitido en lugares habilitados para ello.',r:'RGC, art. 79.1'},
 {id:'q117',l:'T6L6',q:'Necesitas retroceder como complemento de un estacionamiento. ¿Qué condiciones debes respetar?',o:['Hasta 20 metros si no invades un cruce','El mínimo indispensable, sin superar 15 metros ni invadir un cruce','Hasta 15 metros y puedes invadir un cruce si está despejado'],c:1,e:'Cuando complementa el estacionamiento, la marcha atrás se limita al recorrido imprescindible, con un máximo de 15 metros y sin invadir cruces.',r:'RGC, art. 80.1 y 80.2'},
 {id:'q118',l:'T6L6',q:'En una vía que no es autopista ni autovía, no puedes seguir adelante, girar ni cambiar de sentido. ¿Cuánto puedes retroceder en este supuesto, si es seguro?',o:['Hasta 15 metros en todos los casos','Hasta el último cruce, aun si antes hay una solución','Solo lo imprescindible para resolver la situación'],c:2,e:'Cuando no hay alternativa, se permite el recorrido mínimo indispensable. El límite específico de 15 metros se aplica a la marcha atrás que complementa una parada, un estacionamiento o una incorporación.',r:'RGC, art. 80.1 y 80.2'},
 {id:'q119',l:'T6L6',q:'Mientras retrocedes a poca velocidad, oyes una advertencia y ves a un peatón cerca. ¿Qué haces?',o:['Me detengo de inmediato y desisto si hace falta','Sigo marcha atrás mientras el peatón no toque el coche','Acelero para terminar antes de que se acerque más'],c:0,e:'Debes detenerte rápidamente ante avisos o al detectar a alguien cerca, y abandonar la maniobra si la seguridad lo exige.',r:'RGC, art. 81.3'},
 {id:'q120',l:'T6L6',q:'¿Cómo adviertes la marcha atrás si tu vehículo dispone de la luz correspondiente?',o:['Con el intermitente del lado hacia el que giras','Con la luz de marcha atrás','Con las luces de emergencia en todos los casos'],c:1,e:'La luz de marcha atrás advierte esa maniobra cuando el vehículo dispone de ella.',r:'RGC, art. 109.2.b'},
 {id:'q121',l:'T6L6',q:'Antes de retroceder, la carga te impide ver bien la zona que hay detrás. ¿Qué puedes hacer para comprobarla?',o:['Empezar a retroceder y comprobar solo si alguien te avisa','Confiar en que la luz de marcha atrás despejará la zona','Bajar a comprobarla o seguir las indicaciones de otra persona si es necesario'],c:2,e:'Puedes apearte o pedir indicaciones para asegurarte de que la maniobra no presenta peligro. Una vez comprobado, retrocede despacio.',r:'RGC, art. 81.1'}
];

/* ================= Tema 7: adelantamientos ================= */
const OVERTAKING_LESSONS=[
 {id:'T7L1',t:'Por qué lado se adelanta',min:5,
  key:'En general se adelanta por la izquierda. Comprueba si el caso encaja en una excepción antes de pasar por la derecha.',
  body:`<p>Si quien va delante señala claramente que va a girar o parar a la izquierda, adelanta por su derecha cuando haya espacio suficiente, con la máxima precaución. La misma regla se aplica a un tranvía que circula por el centro de una vía de doble sentido.</p>
  <p>En poblado, se permite adelantar por la derecha cuando hay al menos dos carriles para tu sentido delimitados por marcas longitudinales y puedes hacerlo sin peligro.</p>
  <p>Si la retención ocupa toda la anchura y cada fila se mueve al ritmo del vehículo precedente, que una avance más rápido que otra no cuenta como adelantamiento. En esa situación no cambies de fila para ganar posiciones. Puedes hacerlo para preparar un giro, salir de la calzada o tomar una dirección. Tampoco cuenta como adelantamiento avanzar más rápido por un carril de aceleración, deceleración o uso reservado que por un carril normal, o al revés.</p>`,
  tip:'Distingue entre tráfico fluido y filas que avanzan al ritmo de una retención.',
  errs:['Adelantar por la derecha en una autovía con tráfico fluido porque ese carril está libre.','Cambiar de fila en un atasco solo para avanzar más.'],
  ref:'RGC, arts. 82 y 83',source:'#a82'},
 {id:'T7L2',t:'Comprobaciones antes de adelantar',min:6,
  key:'Avisa con antelación y comprueba que hay visibilidad, espacio para pasar y hueco para volver.',
  body:`<p>Valora tu velocidad, la del vehículo que quieres adelantar y la de quienes puedan venir de frente. Espera si la maniobra supone un riesgo o estorba al tráfico contrario. En una calzada de doble sentido con tres carriles discontinuos, puedes utilizar el central para adelantar si el sentido contrario no lo ha ocupado para hacer lo mismo y puedes hacerlo con seguridad.</p>
  <p>Respeta la preferencia del vehículo de delante si ha anunciado un desplazamiento hacia el mismo lado. Si pasa un tiempo prudencial sin que inicie la maniobra, podrás adelantar cuando sea seguro, después de avisarle con una señal acústica u óptica.</p>
  <p>Espera si alguien que te sigue por el mismo carril ya ha empezado a adelantarte. Está prohibido adelantar a quien ya está adelantando a otro si para pasar necesitas ocupar la zona del sentido contrario.</p>`,
  tip:'Antes de salir, localiza el hueco por el que vas a volver.',
  errs:['Dar por hecho que el intermitente te da preferencia.','Salir a adelantar sin saber dónde podrás volver a tu carril.'],
  ref:'RGC, arts. 84 y 109',source:'#a84'},
 {id:'T7L3',t:'Completar o interrumpir la maniobra',min:6,
  key:'Adelanta a una velocidad claramente superior a la del otro vehículo, dentro del límite y con separación suficiente.',
  body:`<p>Vuelve a tu carril tan pronto como sea posible, de forma gradual y señalizando, sin obligar a nadie a variar su velocidad o trayectoria. Si surge un peligro que dificulta completar la maniobra, reduce con rapidez, señaliza y vuelve a tu carril.</p>
  <p>Con al menos dos carriles en tu sentido puedes quedarte en el carril de adelantamiento para pasar a otro vehículo si puedes hacerlo sin molestar indebidamente a quienes se acercan más rápido por detrás.</p>
  <p>Si te adelantan, cíñete a la derecha como regla general. Si has anunciado un giro o parada a la izquierda en el supuesto del artículo 82.2, cíñete a ese lado sin interferir en el tráfico contrario. No aceleres ni dificultes la maniobra. Si aparece peligro, reduce. Si quien te adelanta desiste y reducir tu velocidad agravaría el riesgo, facilita su regreso sin reducir en ese momento.</p>
  <p>Quienes conducen vehículos pesados, grandes o sujetos a un límite específico deben reducir o apartarse al arcén practicable cuando la vía o el tráfico dificulten que los adelanten con seguridad.</p>`,
  tip:'Deja espacio al volver para que el vehículo adelantado pueda mantener su marcha.',
  errs:['Acelerar cuando te están adelantando.','Volver obligando a frenar al vehículo que acabas de pasar.'],
  ref:'RGC, arts. 83.1, 85.1 a 85.3 y 86',source:'#a85'},
 {id:'T7L4',t:'Ciclistas y otros usuarios vulnerables',min:7,
  key:'Fuera de poblado, antes y durante estos adelantamientos debes circular al menos 20 km/h por debajo del límite de la vía.',
  body:`<p>Desde el 1 de octubre de 2026, esta reducción se aplica al adelantar fuera de poblado a peatones, animales, vehículos de tracción animal, ciclomotores, vehículos de movilidad personal y ciclistas, incluidos los grupos. En una carretera limitada a 90 km/h, el máximo para esta maniobra es 70 km/h. Reduce más si hace falta. El antiguo margen de 20 km/h para superar el límite se eliminó en 2022.</p>
  <p>Cuando hay un carril por sentido, ocupa parte o todo el carril contiguo o contrario para dejar al menos 1,5 metros de separación lateral. Si hay más de un carril por sentido, cambia por completo de carril y mantén una separación segura. Si no hay espacio, espera.</p>
  <p>Evita poner en peligro o entorpecer a quienes vienen de frente, incluso si circulan por el arcén. Trata a los ciclistas en grupo como una sola unidad. Fuera de poblado, si conduces un vehículo de dos ruedas y adelantas a otro vehículo, deja al menos 1,5 metros respecto a sus partes más salientes.</p>`,
  tip:'Calcula la reducción desde el límite del tramo y comprueba el espacio a ambos lados de la maniobra.',
