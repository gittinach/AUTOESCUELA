  else if(v.mode==='fallos'){const d=dueFallos();ids=shuffle((d.length?d:fallos())).slice(0,15).map(q=>q.id);title='Repaso de fallos';}
  else if(v.mode==='repaso-programado'){
    ids=dueFallos().sort((a,b)=>S.q[a.id].due-S.q[b.id].due).slice(0,15).map(q=>q.id);
    title='Repaso programado';
  }
  else if(v.mode==='repaso'){ids=Array.isArray(v.ids)?v.ids.filter(id=>Object.hasOwn(QBY,id)):[];title='Repaso del último intento';}
  else if(v.mode==='guardadas'){
    if(v.id){ids=Object.hasOwn(QBY,v.id)?[v.id]:[];title='Practicar pregunta';}
    else{ids=shuffle(savedQuestions()).map(q=>q.id);title='Preguntas guardadas';}
  }
  else if(v.mode==='rapido'){ids=shuffle(QS).slice(0,5).map(q=>q.id);title='Test rápido';}

     </div>
    </li>`;

  const search=V.querySelector('#savedSearch'),count=V.querySelector('#savedCount');
  const start=V.querySelector('#startSaved'),list=V.querySelector('#savedList');
  search.value=view.search||'';
  function updateList(){
    const total=list.children.length;
    const query=normalize(search.value).trim();
    const words=query.split(/\s+/);
    let matches=0;
    for(const row of list.children){
      row.hidden=!words.every(word=>row.dataset.search.includes(word));
      if(!row.hidden)matches++;
    }
    count.textContent=!total?'Aún no hay preguntas guardadas. Pulsa «Guardar pregunta» durante un test para añadirla aquí.':
      query?(matches?`${matches} de ${total} preguntas guardadas`:'No hay preguntas guardadas que coincidan con la búsqueda.'):
      `${total} ${total===1?'pregunta guardada':'preguntas guardadas'}`;

    (neighbor?.querySelector('[data-remove-saved]')||count).focus();
  });

function addTutor(feedback,q,choice){
  const panel=document.createElement('details');
  panel.className='card tutor-chat';
  panel.innerHTML=`<summary>Preguntar al tutor IA</summary>
    <form>
      <label for="tutor-doubt">¿Qué duda tienes sobre esta pregunta?</label>
      <textarea id="tutor-doubt" maxlength="500" required></textarea>
      <label for="tutor-code">Código del tutor</label>
      <input id="tutor-code" type="password" maxlength="128" required>
      <label class="tutor-remember"><input id="tutor-remember" type="checkbox"> Recordar el código en este dispositivo</label>
      <p class="small muted">Necesita internet. La consulta se envía al proveedor de IA.</p>
      <button class="btn ghost" type="submit">Enviar duda</button>
      <div class="tutor-wait" hidden aria-hidden="true"><span class="tutor-wait-mascot">${mascot(52)}</span><span>La mascota busca una explicación…</span></div>
      <p class="tutor-status small" role="status" aria-live="polite"></p>
      <button class="btn ghost" type="button" data-tutor-read hidden>Ver última respuesta</button>
    </form>
    <dialog class="tutor-sheet" aria-labelledby="tutor-sheet-title">
      <header class="tutor-sheet-head">
        <h2 id="tutor-sheet-title" tabindex="-1" autofocus>Respuesta del tutor IA</h2>
        <span class="tutor-sheet-art" aria-hidden="true">${mascot(66)}</span>
      </header>
      <div class="tutor-sheet-body" tabindex="0" role="region" aria-label="Consulta y explicación">
        <div class="tutor-sheet-doubt"><b class="small">Tu duda</b><p data-tutor-doubt></p></div>
        <p class="tutor-answer"></p>
      </div>
      <footer class="tutor-sheet-foot">
        <button class="btn ghost listen" type="button" data-tutor-listen ${SPEECH?'':'hidden'}>${SPK_ICON} Escuchar</button>
        <button class="btn primary" type="button" data-tutor-close>Volver al test</button>
      </footer>
    </dialog>`;
  const form=panel.querySelector('form'),status=panel.querySelector('[role="status"]');
  const button=form.querySelector('button[type="submit"]'),code=form.querySelector('#tutor-code');
  const sheet=panel.querySelector('dialog'),readAnswer=form.querySelector('[data-tutor-read]');
  const waiting=form.querySelector('.tutor-wait');
  const listen=sheet.querySelector('[data-tutor-listen]'),answerText=sheet.querySelector('.tutor-answer');
  let reading=false;
  function setReading(active){
    reading=active;
    listen.innerHTML=active?STOP_ICON+' Detener':SPK_ICON+' Escuchar';
  }
  listen.onclick=()=>{
    if(reading){stopSpeech();setReading(false);return;}
    setReading(true);
    speakList(splitText(answerText.textContent),()=>setReading(false),true);
  };
  function openAnswer(){
    sheet.showModal();
    sheet.querySelector('.tutor-sheet-body').scrollTop=0;
  }
  readAnswer.onclick=openAnswer;
  sheet.querySelector('[data-tutor-close]').onclick=()=>sheet.close();
  sheet.onclose=()=>{
    if(reading){stopSpeech();setReading(false);}
    if(panel.isConnected&&panel.open)readAnswer.focus({preventScroll:true});
  };
  const remember=form.querySelector('#tutor-remember');
  code.value=tutorCode;
  remember.checked=rememberTutor;
  remember.onchange=()=>{
    rememberTutor=remember.checked;
    if(!rememberTutor){
      try{localStorage.removeItem(TUTOR_CODE_KEY);}catch(e){}
    }
  };
  if(!TUTOR_URL){
    button.disabled=true;
    status.textContent='El tutor aún no está conectado.';
  }
  form.onsubmit=async event=>{
    event.preventDefault();
    if(!TUTOR_URL||button.disabled)return;
    const doubt=form.querySelector('textarea').value.trim();
    if(!doubt)return;
    const submittedCode=code.value.trim();
    if(!submittedCode)return;
    button.disabled=true;
    readAnswer.disabled=true;
    status.textContent='El tutor está preparando la explicación. La primera respuesta puede tardar un poco.';
    waiting.hidden=false;
    try{
      const response=await fetch(TUTOR_URL,{
        method:'POST',
        headers:{'Content-Type':'application/json',Authorization:'Bearer '+submittedCode},
        signal:AbortSignal.timeout(110000),
        body:JSON.stringify({id:q.id,choice,doubt})
      });
      const result=await response.json();
      if(!response.ok){
        status.textContent=result?.error||'El tutor no está disponible.';
        return;
      }
      const answer=typeof result?.answer==='string'?result.answer.trim():'';
      if(!answer){status.textContent='El tutor no ha enviado una respuesta. Prueba de nuevo.';return;}
      sheet.querySelector('[data-tutor-doubt]').textContent=doubt;
      answerText.textContent=answer;
      readAnswer.hidden=false;
      status.textContent='';
      tutorCode=submittedCode;
      if(rememberTutor){
        try{localStorage.setItem(TUTOR_CODE_KEY,tutorCode);}
        catch(e){status.textContent='No se pudo recordar el código en este dispositivo.';}
      }
    }catch{
      status.textContent='No se pudo conectar con el tutor. Puedes seguir con el test.';
      return;
    }finally{
      waiting.hidden=true;
      button.disabled=false;
      readAnswer.disabled=false;
    }
    if(panel.isConnected&&panel.open)openAnswer();
  };
  feedback.after(panel);
}
function runQuiz(ids,v){

    <div class="opts">${order.map((o,k)=>`<button class="opt" type="button" data-o="${o}"><b>${'ABC'[k]}</b><span>${esc(q.o[o])}</span></button>`).join('')}</div>

      bookmark.setAttribute('aria-pressed',String(saved));
      bookmark.querySelector('span').textContent=saved?'Pregunta guardada':'Guardar pregunta';
    };
    V.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const o=+b.dataset.o,ok=o===q.c;res[i]=ok;
      earnedStreak=record(q.id,ok)||earnedStreak;
      V.querySelectorAll('.opt').forEach(x=>{x.disabled=true;const xo=+x.dataset.o;if(xo===q.c)x.classList.add('ok');else if(x===b)x.classList.add('bad');});
      const last=i===ids.length-1;
      const verdict=ok?'¡Correcto!':'Casi. Fíjate en esto:';
      const reaction=ok?'<span class="q-reaction q-correct-star" aria-hidden="true">⭐</span>':
        `<span class="q-reaction q-sad-car" aria-hidden="true">${mascot(62,true)}</span>`;
      const feedback=document.getElementById('qfb');
      feedback.innerHTML=`<div class="fb ${ok?'ok':'bad'}"><div class="q-verdict"><span class="v">${verdict}</span>${reaction}</div><p>${withSigns(esc(q.e))}</p><span class="ref">${withSigns(esc(q.r))}</span><button class="btn primary" type="button" id="qn" style="margin-top:4px">${last?'Ver resultado':'Siguiente'}</button></div>`;
      if(!ok){
        const correct=document.createElement('p');
        correct.textContent='Respuesta correcta: '+q.o[q.c];
        feedback.querySelector('.q-verdict').after(correct);
      }
      addTutor(feedback,q,o);
      feedback.focus({preventScroll:true});
      V.querySelectorAll('.qprog span')[i].className=ok?'ok':'bad';
      document.getElementById('qn').onclick=()=>{if(last)finish();else{i++;draw();window.scrollTo(0,0);}};
      feedback.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'nearest'});
    });
  };
  const finish=()=>{
    const ok=res.filter(Boolean).length,n=ids.length;
    if(v.mode==='lesson'){S.lessons[v.id]=true;}
    S.tests.push({d:Date.now(),mode:v.mode,ok,n,...(v.mode==='tema'?{topic:v.id||'5'}:{})});S.tests=S.tests.slice(-50);
    const wrongIds=ids.filter((_,k)=>!res[k]);
    const wrong=wrongIds.map(id=>QBY[id]);
    const repeatLabel=v.mode==='guardadas'&&v.id?'Repetir pregunta':v.mode==='repaso'?'Repetir repaso':'Repetir test';
    const msg=ok===n?'¡Perfecto, ni un fallo!':ok/n>=.7?'¡Bien! Echa un vistazo a las que fallaste.':'No pasa nada: repasa la lección y vuelve a intentarlo.';
    const mastered=ACTIVE_TOPICS.find(topic=>!S.masteredTopics?.includes(topic.id)&&!(topic.id==='5'&&S.dom5)&&topicStats(topic).level==='Dominado');
    if(mastered){S.masteredTopics=[...(S.masteredTopics||[]),mastered.id];if(mastered.id==='5')S.dom5=true;setTimeout(()=>celebrate('topic'),300);}
    else if(ok===n)celebrate('perfect');else if(v.mode==='lesson')celebrate('lesson');
    save();
    V.innerHTML=`<div class="card result"><div class="mascot-c">${mascot(80)}</div><div class="big">${ok}/${n}</div><p class="muted">${msg}</p>
     ${earnedStreak?`<p class="note">🔥 Racha de ${streak()} días</p>`:''}
     ${wrong.length?`<button class="btn primary retry-missed" type="button" id="retryMissed">Repasar ${wrong.length} ${wrong.length===1?'fallo':'fallos'}</button>`:''}
     ${wrong.length?`<div class="review">${wrong.map(q=>`<div><b>${esc(q.q)}</b><br>Respuesta correcta: ${esc(q.o[q.c])}</div>`).join('')}</div>`:''}
     <div class="grid2" style="width:100%"><button class="btn ghost" type="button" data-back>Volver</button><button class="btn ${wrong.length?'ghost':'primary'}" type="button" id="again">${repeatLabel}</button></div></div>
     ${v.mode==='lesson'?'<p class="note">Lección marcada como leída.</p>':''}`;
    const retry=document.getElementById('retryMissed');
    if(retry)retry.onclick=()=>{
      stack[stack.length-1]={name:'quiz',mode:'repaso',ids:wrongIds};
      rememberView(false);
      render();
    };
    document.getElementById('again').onclick=render;
    window.scrollTo(0,0);
  };
  draw();
}

function runSim(simId,set){
  const L=set.list;let idx=0,score=0,results=[],busy=false,pos={},cars={};const token=animToken;
  V.innerHTML=`<div class="qprog" id="sp"></div>
   <div class="scene" id="scene"><svg viewBox="0 0 300 300" id="svg" role="img" aria-labelledby="st sd"></svg></div>
   <div class="legend"><span><i style="background:#3A86F5"></i>Tu coche</span><span><i style="background:#F5A23A"></i>Otro vehículo</span></div>
   <div><h3 id="st"></h3><p class="muted" id="sd"></p></div>
   <div class="simopts" id="so"></div>
   <div class="fb" id="sfb" tabindex="-1" hidden><span class="v" id="sv"></span><p id="se"></p><span class="ref" id="sn"></span><button class="btn primary" type="button" id="snext" style="margin-top:4px"></button></div>`;
  const svg=document.getElementById('svg'),$=id=>document.getElementById(id);
  const place=(c,pt)=>{pos[c]=pt;if(cars[c])cars[c].setAttribute('transform',`translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)}) rotate(${pt.h.toFixed(1)})`);};
  function run(moves,done,fn=ease){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      moves.forEach(m=>place(m.c,at(m.p,1)));
      done?.();
      return;
    }
    const end=Math.max(...moves.map(m=>m.s+m.d)),t0=performance.now();
    (function f(now){if(token!==animToken)return;const t=now-t0;
      moves.forEach(m=>{const k=Math.min(1,Math.max(0,(t-m.s)/m.d));if(t>=m.s)place(m.c,at(m.p,(m.fn||fn)(k)));});
      t<end?requestAnimationFrame(f):done&&done();})(t0);
  }
  const prog=()=>{$('sp').innerHTML=L.map((_,k)=>`<span class="${results[k]===true?'ok':results[k]===false?'bad':k===idx?'now':''}" style="width:28px"></span>`).join('');};
  function load(){
    const s=L[idx];busy=true;
    const specs=Object.entries(s.cars).map(([id,v])=>{const o=Array.isArray(v)?{p:v}:v;return [id,{p:o.p,lin:o.lin,kind:o.kind||(id==='you'?'you':id==='oth'?'oth':'grey')}];});
    svg.innerHTML=DEFS+bg(s.scene)+specs.filter(([id])=>id!=='you').map(([id,o])=>`<g id="car-${id}">${carBody(o.kind)}</g>`).join('')+`<g id="car-you">${carBody('you')}</g><g id="fx"></g>`;
    cars={};specs.forEach(([id])=>cars[id]=document.getElementById('car-'+id));
    specs.forEach(([id,o])=>place(id,at(o.p,0)));
    $('st').textContent=s.title;$('sd').textContent=s.desc;$('sfb').hidden=true;
    $('so').innerHTML=s.opts.map((o,k)=>`<button class="btn" type="button" data-k="${k}" disabled>${esc(o.label)}</button>`).join('');
    $('so').querySelectorAll('button').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
    prog();
    run(specs.map(([id,o])=>({c:id,p:o.p,s:0,d:1300,fn:o.lin?lin:decel})),()=>{busy=false;$('so').querySelectorAll('button').forEach(b=>b.disabled=false);});
  }
  function boom(x,y){const pts=[];for(let i=0;i<16;i++){const r=i%2?9:20,a=i*Math.PI/8;pts.push((x+r*Math.cos(a)).toFixed(1)+','+(y+r*Math.sin(a)).toFixed(1));}
    $('fx').innerHTML=`<polygon points="${pts.join(' ')}" fill="#FFD23F" stroke="#D0302B" stroke-width="3"/>`;
    const sc=$('scene');sc.classList.remove('shake');void sc.offsetWidth;sc.classList.add('shake');}
  function bubble(c,ch){const p=pos[c];if(!p)return;const x=Math.min(285,Math.max(15,p.x)),y=Math.max(40,p.y);
    $('fx').innerHTML=`<circle cx="${x}" cy="${y-28}" r="11" fill="#fff" stroke="#333"/><text x="${x}" y="${y-23.5}" font-family="Arial,sans-serif" font-weight="700" font-size="14" text-anchor="middle" fill="#333">${ch}</text>`;}
  function answer(k){
    if(busy)return;busy=true;$('so').querySelectorAll('button').forEach(b=>b.disabled=true);
    const s=L[idx],o=s.opts[k],ok=o.ok;results[idx]=ok;if(ok)score++;
    const show=()=>{
      $('sfb').className='fb '+(ok?'ok':'bad');
      $('sv').textContent=ok?'¡Bien hecho!':o.type==='crash'?'¡Colisión!':(s.badTitle||'No es correcto');
      $('se').textContent=(ok?s.okMsg+' ':'')+s.expl;$('sn').innerHTML=withSigns(esc(s.norma));
      $('snext').textContent=idx<L.length-1?'Siguiente situación':'Ver resultado';
      $('sfb').hidden=false;prog();$('sfb').focus({preventScroll:true});
      $('sfb').scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'nearest'});
    };
    if(o.type==='go')run(o.moves,show);
    else if(o.type==='hesitate'){bubble(o.bubble,'?');setTimeout(()=>{if(token!==animToken)return;$('fx').innerHTML='';run(o.moves,show);},1300);}
    else if(o.type==='block')run(o.moves,()=>{bubble(o.bubble,'!');setTimeout(show,500);});
    else run(Object.entries(o.p).map(([c,p])=>({c,p,s:0,d:800})),()=>{boom(o.at[0],o.at[1]);setTimeout(show,350);},lin);
  }
  $('snext').onclick=()=>{idx++;if(idx<L.length){load();window.scrollTo(0,0);}else finish();};
  function finish(){
    const prev=S.sims[simId];S.sims[simId]={best:Math.max(score,prev?prev.best:0),last:score,total:L.length};if(markDay())setTimeout(()=>celebrate('streak'),1900);save();celebrate('sim');if(score===L.length)setTimeout(()=>celebrate('perfect'),1500);
    V.innerHTML=`<div class="card result"><div class="mascot-c">${mascot(80)}</div><div class="big">${score}/${L.length}</div><p class="muted">${score===L.length?'Perfecto. Dominas estas situaciones.':score>=L.length*.6?'Vas bien. Repite para afianzar las que fallaste.':'Repasa las lecciones del tema y vuelve a intentarlo.'}</p>
     <div class="grid2" style="width:100%"><button class="btn ghost" type="button" data-back>Volver</button><button class="btn primary" type="button" id="again">Repetir</button></div></div>`;
    document.getElementById('again').onclick=()=>{animToken++;runSim(simId,set);};
  }
  load();
}

function urbanStopPainter(canvas){
  const ctx=canvas.getContext('2d');
  if(!ctx)return null;
  // El barrio se dibuja una vez, y los fotogramas solo añaden los vehículos y las indicaciones.
  const background=document.createElement('canvas');
  background.width=canvas.width;background.height=canvas.height;
  const scale=canvas.width/400;
  const scene=background.getContext('2d');
  if(!scene)return null;
  scene.setTransform(scale,0,0,scale,0,0);
  const block=urbanDrawing(scene),moving=urbanDrawing(ctx);
  const {rect,shape,rounded,disk,line,gradient}=block;
  const incline=context=>context.transform(1,.10,0,.84,0,-11);

  function paving(x,y,w,h){
    rect(x,y,w,h,'#cbbba7');
    scene.save();scene.beginPath();scene.rect(x,y,w,h);scene.clip();
    for(let row=0;row*9<h;row++){
      for(let col=-1;col*18<w;col++){
        const tint=(row+col+1)%3===0?'#e0cdb7':'#d7c6af';
        rect(x+col*18+(row%2)*9,y+row*9,17,8,tint);
      }
    }
    scene.restore();
  }
  function building(x,y,w,h,roof,lit){
    shape([[x,y-2],[x+w,y-2],[x+w+18,y+12],[x+w+18,y+h+19],[x+18,y+h+19],[x,y+h]],'#28342846');
    rect(x,y,w,h+7,'#9c6951');
    shape([[x+w-6,y-7],[x+w+3,y-15],[x+w+7,y+h-5],[x+w-6,y+h+7]],'#655146');
    rect(x,y+h-9,w,3,'#c79b7b');
    for(let offset=8;offset<w-9;offset+=18){
      rect(x+offset,y+h-5,10,9,'#523f37');
      rect(x+offset+1,y+h-4,8,6,'#8ca9b0');
      rect(x+offset+5,y+h-4,1,6,'#d4c6ac');
    }
    const peak=y-12+Math.round(h*.45),far=y+h-12;
    shape([[x-5,far],[x+w+4,far],[x+w+4,y-14],[x-5,y-14]],'#58483e');
    shape([[x-4,y-15],[x+w+3,y-15],[x+w+3,peak],[x-4,peak]],roof);
    shape([[x-4,peak],[x+w+3,peak],[x+w+3,far],[x-4,far]],lit);
    for(let row=y-10;row<far-1;row+=5){
      line([[x-3,row],[x+w+2,row]],'#472e2c43',.65);
      for(let col=x+(row%2?2:7);col<x+w;col+=10)rect(col,row,1,4,'#472e2c2a');
    }
    line([[x-3,peak],[x+w+3,peak]],'#f5c399',2);
    const stackX=x+w-17,stackY=peak-10;
    rect(stackX+3,stackY+3,9,9,'#483d3565');
    rect(stackX,stackY,7,8,'#b8a08b');rect(stackX-1,stackY-1,9,3,'#dfc2a2');
  }
  function tree(x,y,size){
    scene.save();scene.translate(x,y);scene.scale(size,size);
    scene.save();scene.translate(9,5);scene.scale(1.28,.72);disk(0,0,15,'#1a302b47');scene.restore();
    rect(-1,0,3,8,'#694c35');
    disk(0,-5,13,'#284e41');disk(5,-6,9,'#3a6b4b');
    disk(-5,-9,10,'#55875a');disk(-2,-13,6,'#729b64');disk(6,-12,5,'#5d905b');
    for(const [dx,dy] of [[-7,-13],[-4,-7],[1,-13],[6,-9],[-1,-17]])disk(dx,dy,1.4,'#a1b67b');
    scene.restore();
  }
  function planter(x,y,w){
    rounded(x+3,y+4,w,13,5,'#263d3550');rounded(x,y,w,12,5,'#b3a28c');
    rounded(x+2,y+2,w-4,8,3,'#685244');
    for(let off=5;off<w-4;off+=7){disk(x+off,y+5,3,'#487b58');disk(x+off+1,y+4,1.4,'#a16062');}
  }
  function lamp(x,y){
    line([[x,y],[x+12,y+6]],'#24332f4c',2);
    line([[x,y],[x,y-12],[x+5,y-15]],'#344450',1.7);
    rounded(x+3,y-16,7,3,1.3,'#243b44');rect(x+5,y-14,4,1,'#fff0ae');
  }

  rect(0,0,400,338,'#718b63');
  incline(scene);
  rect(-1,-66,402,531,gradient(0,0,400,405,[[0,'#8eaa73'],[1,'#627e62']]));
  for(const [x,y,w,h] of [[0,84,169,29],[258,82,142,31],[145,-60,24,152],[258,-62,24,159],
    [0,220,170,58],[258,220,142,45],[145,263,24,185],[258,256,25,193]])paving(x,y,w,h);

  const road=[[-2,112],[169,112],[169,-65],[258,-65],[258,112],[402,112],[402,220],
    [258,220],[258,448],[169,448],[169,220],[-2,220]];
  shape(road,gradient(18,95,370,375,[[0,'#55616a'],[.55,'#46535e'],[1,'#35444f']]));
  let seed=137;
  const sample=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
  for(let i=0;i<3600;i++){
    const x=sample()*400,y=sample()*444-30;
    if((y>=112&&y<220)||(x>=169&&x<258))rect(x,y,.6+sample()*1.1,.7,i%3?'#e4ebe817':'#171f2633');
  }
  for(const curb of [[[-2,112],[169,112],[169,-64]],[[258,-64],[258,112],[402,112]],
    [[-2,220],[169,220],[169,448]],[[402,220],[258,220],[258,448]]]){
    line(curb.map(([x,y])=>[x,y+3]),'#29394370',5);
    line(curb,'#e3d3bd',3.2);
  }
  const marking='#eae4d6';
  for(let x=5;x<400;x+=33)if(x+19<169||x>258)rect(x,164,19,1.8,marking);
  for(let y=-27;y<96;y+=29)rect(212,y,1.8,16,marking);
  for(let y=313;y<440;y+=31)rect(212,y,1.8,17,marking);
  rect(215,307,40,4,'#23343c');rect(215,305,40,4,'#fff6e4');
  block.label('STOP',235,326,12,'#fff6e4');

  rect(12,232,154,32,'#59666c');
  line([[13,232],[13,263],[165,263],[165,232]],'#f0debb',1.1);
  line([[56,233],[56,263]],'#e1d2b5',1);
  for(const x of [284,333,376])planter(x,236,x===333?25:18);
  paving(34,284,72,22);paving(303,270,70,25);
  building(5,27,82,47,'#a85f4d','#cd8062');
  building(97,25,42,43,'#77696a','#a48b83');
  building(293,19,89,51,'#a86350','#d59169');
  building(13,313,117,57,'#826369','#b1837a');
  building(315,310,80,57,'#8d5d48','#c48a65');
  for(const [x,y,size] of [[86,88,.82],[141,75,.83],[284,80,.81],[388,80,1],
    [22,293,1.06],[131,284,.86],[294,266,.9],[391,277,.94],[301,326,.7]])tree(x,y,size);
  for(const [x,y] of [[49,105],[143,102],[279,105],[345,104],[18,270],[283,255],[365,258]])lamp(x,y);

  return (carY,trafficX,stage,braking=false)=>{
    ctx.setTransform(scale,0,0,scale,0,0);
    ctx.drawImage(background,0,0,400,338);
    incline(ctx);
    const visibleTraffic=stage>=2||carY<280;
    if(visibleTraffic)urbanVehicle(moving,trafficX,190,Math.PI/2,'orange');
    urbanVehicle(moving,126,248,Math.PI/2,'van');
    urbanVehicle(moving,235,carY,0,'blue',braking);
    if(!visibleTraffic){
      moving.line([[104,211],[119,220],[124,230]],'#f5e4c4',1.4);
      moving.disk(124,230,2.2,'#fff3d4');
      moving.rounded(18,191,122,23,8,'#182b37');
      moving.label('Visión tapada',79,202.5,11,'#fff3d4');
    }
    drawUrbanStopSign(moving);
  };
}

function urbanDrawing(ctx){
  const rect=(x,y,w,h,color)=>{ctx.fillStyle=color;ctx.fillRect(x,y,w,h);};
  const shape=(points,color)=>{
    ctx.beginPath();
    points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
    ctx.closePath();ctx.fillStyle=color;ctx.fill();
  };
  const rounded=(x,y,w,h,r,color)=>{
    ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=color;ctx.fill();
  };
  const disk=(x,y,r,color)=>{
    ctx.beginPath();ctx.arc(x,y,r,0,2*Math.PI);ctx.fillStyle=color;ctx.fill();
  };
  const label=(value,x,y,size,color)=>{
    ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='700 '+size+'px system-ui,sans-serif';ctx.fillText(value,x,y);
  };
  const line=(points,color,width)=>{
    ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
    ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();
  };
  const gradient=(x1,y1,x2,y2,stops)=>{
    const fill=ctx.createLinearGradient(x1,y1,x2,y2);
    for(const [offset,color] of stops)fill.addColorStop(offset,color);
    return fill;
  };
  return {ctx,rect,shape,rounded,disk,label,line,gradient};
}

const URBAN_PAINT={
  blue:['#82c5ff','#2f8bff','#184e9e'],
  orange:['#ffd08a','#efaa57','#a85a29'],
  van:['#fff9ec','#e7eaeb','#9daab2']
};

function urbanVehicle({ctx,rect,shape,rounded,line,gradient},x,y,angle,model,braking=false){
  const van=model==='van';
  const [light,body,shade]=URBAN_PAINT[model];
  const half=van?14:11,front=van?-38:-21.5,rear=-front;
  ctx.save();
  ctx.translate(x+5,y+5);ctx.rotate(angle);
  rounded(-half-2,front-2,half*2+4,rear*2+4,8,'#17232b62');
  ctx.restore();
  ctx.save();ctx.translate(x,y);
  ctx.rotate(angle);
  for(const edge of [-half-1,half-3]){
    rounded(edge,front+6,4,9,2,'#202932');
    rounded(edge,rear-14,4,9,2,'#202932');
  }
  const paint=gradient(-half,0,half,0,[[0,light],[.33,body],[.75,body],[1,shade]]);
  rounded(-half,front,half*2,rear*2,van?4.5:7.5,shade);
  rounded(-half,front,half*2-1,rear*2-2,van?4.5:7.5,paint);
  const glassY=front+(van?12:10);
  shape([[-half+2,glassY],[half-2,glassY],[half-4,glassY+8],[-half+4,glassY+8]],'#253d4c');
  shape([[-half+3,glassY+1],[half-3,glassY+1],[half-5,glassY+4],[-half+5,glassY+7]],'#9bc2d1');
  if(van){
    rounded(-half+2,glassY+11,half*2-5,rear-glassY-16,3,paint);
    for(const offset of [-5,0,5])rect(offset,glassY+15,1,rear-glassY-23,'#93a0a656');
    line([[-half+3,rear-5],[half-3,rear-5]],'#637885',.8);
  }else{
    for(const side of [-1,1]){
      shape([[side*(half-2),glassY+4],[side*(half-2),rear-11],[side*(half-4),rear-13],
        [side*(half-4),glassY+8]],'#284657');
      rounded(side*half-1,glassY+5,3,2.3,.8,light);
    }
    rounded(-half+4,glassY+9,half*2-8,9,2,paint);
    shape([[-half+4,rear-13],[half-4,rear-13],[half-3,rear-8],[-half+3,rear-8]],'#304955');
    line([[-half+3,front+6],[half-4,front+6]],light,1);
  }
  for(const edge of [-half+2,half-6]){
    rounded(edge,front+2,4,2.6,1,'#fff6d9');
    if(braking)rounded(edge-1,rear-6,6,6,2,'#ff504d57');
    rounded(edge,rear-5,4,2.6,1,braking?'#ff8d75':'#a83941');
  }
  rect(-2.5,rear-2.8,5,1.6,'#efece4');
  ctx.restore();
}

const URBAN_STOP_OCTAGON=Array.from({length:8},(_,i)=>{
  const angle=(i+.5)*Math.PI/4;
  return [Math.cos(angle),Math.sin(angle)];
});

function drawUrbanStopSign({label,line,rect,shape}){
  const face=(x,y,r,color)=>shape(URBAN_STOP_OCTAGON.map(([dx,dy])=>[x+dx*r,y+dy*r]),color);
  line([[276,316],[294,322]],'#21352e61',2.8);
  rect(274,287,3.5,29,'#394d58');rect(274,287,1,29,'#c2d0cc');
  face(276,286,19.5,'#742b35');face(275,284.5,19,'#fff5e6');
  face(275,284.5,17.1,'#ae2534');label('STOP',275,285,10.2,'#fff');
}

function runUrbanStop(){
  const token=animToken;
  V.innerHTML=`<section class="card drive" aria-labelledby="drive-title">
   <h2 id="drive-title">Cruce con STOP</h2>
   <div class="drive-scene"><canvas width="800" height="676" role="img" aria-label="Cruce urbano visto desde arriba"></canvas></div>
   <div class="drive-key small muted"><span><i aria-hidden="true"></i>Tu coche</span><span><i aria-hidden="true"></i>Tráfico transversal</span></div>
   <p class="eyebrow drive-step"></p><p class="drive-prompt" tabindex="-1"></p>
   <p class="drive-feedback small" role="status"></p>
   <div class="drive-actions"></div>
  </section>`;
  const game=V.querySelector('.drive'),actions=game.querySelector('.drive-actions');
  const prompt=game.querySelector('.drive-prompt'),feedback=game.querySelector('.drive-feedback');
  const stepLabel=game.querySelector('.drive-step');
  const paint=urbanStopPainter(game.querySelector('canvas'));
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
  const total=URBAN_STOP.length;
  let stage=0,car=360,traffic=-34,score=0,missed=false,busy=false;
  function drawStep(focus=false){
    const step=URBAN_STOP[stage];
    stepLabel.textContent=`Decisión ${stage+1} de ${total}`;
    prompt.textContent=step.prompt;
    actions.replaceChildren();
    const options=[[step.good,true],[step.bad,false]];
    if(stage%2)options.reverse();
    for(const [label,correct] of options){
      const button=document.createElement('button');
      button.type='button';button.className='btn ghost';button.textContent=label;
      button.onclick=()=>choose(correct);actions.appendChild(button);
    }
    if(focus)prompt.focus({preventScroll:true});
  }
  function finish(){
    const last=S.sims['urbano-stop'];
    S.sims['urbano-stop']={last:score,best:Math.max(score,last?.best||0),total};
    markDay();save();
    stepLabel.textContent='Cruce completado';
    prompt.textContent=`${score} de ${total} decisiones acertadas a la primera.`;
    feedback.innerHTML=`<a href="${RGC}#A5" target="_blank" rel="noopener">Regla del STOP · RGC, anexo I, señal R-2</a>`;
    actions.innerHTML='<button class="btn primary" type="button">Repetir cruce</button><button class="btn ghost" type="button" data-back>Volver</button>';
    actions.firstElementChild.onclick=render;
    actions.firstElementChild.focus({preventScroll:true});
  }
  function choose(correct){
    if(busy)return;
    const step=URBAN_STOP[stage];
    if(!correct){
      missed=true;feedback.className='drive-feedback small is-error';
      feedback.textContent=step.error;return;
    }
    busy=true;
    if(!missed)score++;
    actions.querySelectorAll('button').forEach(button=>{button.disabled=true;});
    feedback.className='drive-feedback small';
    feedback.textContent='Maniobra en curso…';
    const fromCar=car,fromTraffic=traffic,start=performance.now();
    function advance(now){
      if(token!==animToken||!game.isConnected)return;
      const t=reduced.matches||!paint?1:Math.min(1,(now-start)/step.duration);
      const eased=ease(t);
      car=fromCar+(step.car-fromCar)*eased;
      traffic=fromTraffic+(step.traffic-fromTraffic)*t;
      paint?.(car,traffic,stage,t>.45&&stage<2);
      if(t<1){requestAnimationFrame(advance);return;}
      stage++;missed=false;busy=false;
      paint?.(car,traffic,stage,stage<3);
      feedback.textContent=step.result;
      if(stage===total)finish();else drawStep(true);
    }
    advance(start);
  }
  paint?.(car,traffic,stage);
  drawStep();
}

function runDrivingGame(){
  const token=animToken;
  V.innerHTML='<p class="card" role="status">Cargando el cruce…</p>';
  import('./driving.js').then(({openDrivingGame})=>{
    if(token!==animToken)return;
    V.replaceChildren();
    closeDrivingGame=openDrivingGame({
      ruleUrl:RGC+'#A5',
      onExit:()=>history.back(),
      onResult(score,total){
        const previous=S.sims['juego-stop'];
        S.sims['juego-stop']={last:score,best:Math.max(score,previous?.best||0),total};
        markDay();save();
      }
    });
  }).catch(()=>{
    if(token!==animToken)return;
    V.innerHTML='<section class="card"><p>El videojuego no se ha podido cargar.</p><button class="btn primary" type="button">Reintentar</button></section>';
    V.querySelector('button').onclick=runDrivingGame;
  });
}
