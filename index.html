<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Autoescuela</title>
<meta name="description" content="Prepara el teórico de la DGT de coche y moto: lecciones, tests y simuladores.">
<meta name="theme-color" content="#FBF8F2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="driving.css">
<link rel="stylesheet" href="simulators.css">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<style>
/* Layout: app móvil de una columna, cabecera fija arriba y barra de 5 pestañas abajo */
:root{
  --bg:#FBF8F2; --surface:#FFFFFF; --surface2:#F4F0E8; color-scheme:light; --fg:#2F3A35; --muted:#55645B; --line:#E4E0D7; --control-line:#7E8C83;
  --accent:#356B50; --accent-soft:#E7EFE9; --accent-fg:#FFFFFF;
  --peach:#98512E; --peach-soft:#FBE9DD; --blue:#3F6694; --blue-soft:#E6EDF6;
  --ok:#306A46; --ok-bg:#E3F1E7; --bad:#9D3E2D; --bad-bg:#FBE6E0; --warn:#7D551C; --warn-bg:#FAF0DC;
  --display:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root.dk{
  --bg:#171B19; --surface:#212622; --surface2:#2A302C; --fg:#E6ECE8; --muted:#9DA8A1; --line:#343B36; --control-line:#829087;
  --accent:#7DBB99; --accent-soft:#25352C; --accent-fg:#13201A;
  --peach:#E39A70; --peach-soft:#3A2A21; --blue:#86A9D6; --blue-soft:#222D3A;
  --ok:#7DCB9A; --ok-bg:#1C3326; --bad:#EC8B78; --bad-bg:#3A221D; --warn:#E3B66A; --warn-bg:#352A17; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:54px}
.top h1{font-family:var(--display);font-weight:700;font-size:22px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backbtn{border:0;background:var(--surface);color:var(--fg);width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;cursor:pointer;padding:0;font-size:20px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em}
.brand span{color:var(--accent)}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 24px}
.view{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.15;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:14px}
p{margin:0}
.card{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.section-title{font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted);margin-top:6px}
.btn{font:inherit;font-weight:700;font-size:16px;border-radius:12px;padding:13px 16px;cursor:pointer;border:2px solid var(--accent);background:var(--surface);color:var(--accent);text-align:center;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{border-color:var(--line);color:var(--fg)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,.item:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:13px 14px;border:0;width:100%;text-align:left;font:inherit;color:var(--fg);cursor:pointer}
.item[disabled]{cursor:default;opacity:.55}
.item .ic{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;font-family:var(--display);font-weight:700;font-size:17px}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.item .tx b{font-weight:700;line-height:1.25}
.item .tx span{font-size:14px;color:var(--muted);line-height:1.3}
.item .chev{color:var(--muted);flex:none}
.list{display:flex;flex-direction:column;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.done .ic{background:var(--ok-bg);color:var(--ok)}
.bar{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.progress-details summary{min-height:44px;padding-block:10px;font-weight:600;cursor:pointer}
.lesson-progress .list{margin-top:8px}
.lesson-progress .item{background:var(--surface2)}
.test-history ol{list-style:none;margin:4px 0 0;padding:0}
.test-history li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:10px 12px;border-radius:12px;background:var(--surface2)}
.test-history time,.test-history .muted{display:block}
.review-schedule h2{font-size:18px}
.saved-list{list-style:none;margin:0;padding:0}
.saved-search{display:grid;gap:4px}
.saved-preview .qimg svg{width:56px;height:56px}
.saved-actions{display:flex;flex-wrap:wrap;gap:8px}
.saved-actions .btn{padding:8px 12px;min-height:44px}
/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.nav button{border:0;border-radius:18px;background:none;font:inherit;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px;padding:8px 2px 9px;cursor:pointer;overflow-wrap:anywhere}
.nav button svg{width:24px;height:24px}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
/* Home */
.hero{background:var(--accent);color:var(--accent-fg);border-radius:18px;padding:18px;display:flex;gap:16px;align-items:center}
.hero h2{color:inherit;font-size:28px}
.hero p{opacity:.9;font-size:14px}
.ring{flex:none}
/* Lesson */
.lesson p+p{margin-top:10px}
.lesson ul,.lesson ol{margin:8px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.key{background:var(--accent-soft);border-radius:14px;padding:14px 16px;font-weight:700;font-size:17px;line-height:1.4}
.key small{display:block;font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:2px}
.tip{background:var(--warn-bg);border-radius:14px;padding:12px 14px}
.tip b{color:var(--warn)}
.errs{background:var(--bad-bg);border-radius:14px;padding:12px 14px}
.errs b{color:var(--bad)}
.errs ul{margin:6px 0 0;padding-left:20px}
.ref{font-size:13px;color:var(--muted)}
.fig{background:var(--surface);border-radius:16px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{padding:10px 14px;font-size:13px;color:var(--muted)}
figure{margin:0}
.signs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px}
.signs div{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;line-height:1.25}
.signs svg{width:54px;height:54px}
.lesson-gallery{grid-template-columns:repeat(3,minmax(0,1fr))}
.parking-gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
.emergency-lanes{padding:14px;display:grid;gap:10px;text-align:center}
.emergency-road{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.emergency-road span{flex:1;display:grid;place-items:center;padding:8px 3px;font-size:12px}
.emergency-road span+span{border-inline-start:1px dashed var(--control-line)}
.emergency-road .emergency-gap{flex:1.3;background:var(--accent-soft);color:var(--accent);font-weight:600}
.lesson-ref a{color:var(--accent)}
.stopping-distance{padding:14px;text-align:center}
.stopping-distance .grid2{gap:4px}
.stopping-distance span{padding:8px;border-radius:8px;background:var(--blue-soft);color:var(--blue);font-size:13px}
.stopping-distance span+span{background:var(--warn-bg);color:var(--warn)}
.ladder{list-style:none;margin:0;padding:14px;display:flex;flex-direction:column;gap:6px;counter-reset:l}
.ladder li{counter-increment:l;background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:8px 12px;font-weight:700;font-size:15px;display:flex;gap:10px;align-items:center}
.ladder li::before{content:counter(l);font-family:var(--display);font-size:20px;opacity:.8;width:16px}
.ladder li:nth-child(2){width:92%;opacity:.92}.ladder li:nth-child(3){width:84%;opacity:.84}.ladder li:nth-child(4){width:76%;opacity:.76}.ladder li:nth-child(5){width:68%;opacity:.68}
/* Quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.q-save{align-self:flex-start;display:flex;align-items:center;gap:8px;min-height:44px;padding:7px 10px;font-size:14px}
.q-save svg{width:18px;height:18px;flex:none}
.q-save[aria-pressed="true"] svg{fill:currentColor}
.qprog{display:flex;gap:4px;flex-wrap:wrap}
.qprog span{width:14px;height:6px;border-radius:3px;background:var(--line)}
.qprog span.ok{background:var(--ok)}.qprog span.bad{background:var(--bad)}.qprog span.now{background:var(--accent)}
.qtext{font-size:18px;font-weight:700;line-height:1.35}
/* Simulacros: selección sin corrección hasta la entrega */
.exam-toolbar{position:sticky;top:calc(54px + env(safe-area-inset-top,0px));z-index:4;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.exam-clock{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.exam-clock.urgent{color:var(--bad)}
.opt.exam-selected{border-color:var(--accent);background:var(--accent-soft)}
.exam-actions{display:flex;flex-wrap:wrap;gap:8px}
.exam-actions .btn{flex:1;min-height:44px;padding:10px 12px;font-size:14px}
.exam-map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.exam-map button{min-height:44px;min-width:0;border:2px solid var(--control-line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;font-weight:600;cursor:pointer}
.exam-map button.answered{background:var(--accent-soft);border-color:var(--accent)}
.exam-map button.flagged{border-style:dashed}
.exam-map button[aria-current="step"]{outline:3px solid var(--accent);outline-offset:1px}
.exam-map small{display:block;font-size:11px;line-height:1}
.exam-question-map summary{min-height:44px;cursor:pointer;font-weight:600}
.exam-summary{display:flex;flex-wrap:wrap;gap:8px}
.exam-history{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.exam-history button{align-items:flex-start;flex-direction:column;gap:6px}
.exam-history .exam-history-row{display:flex;flex-wrap:wrap;width:100%;justify-content:space-between;gap:6px}
.exam-review summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
.exam-review[open] summary{margin-bottom:8px}
.exam-review ol{padding:0;list-style:none;margin:12px 0;display:grid;gap:6px}
.exam-review li{padding:9px 12px;border-radius:10px;border:1px solid var(--line);overflow-wrap:anywhere}
.exam-review li.correct{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.exam-review li.incorrect{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.exam-review .qimg svg{width:68px;height:68px}
.exam-dialog{max-width:440px;width:calc(100% - 32px);max-height:85dvh;overflow:auto;border:2px solid var(--line);border-radius:18px;padding:20px;background:var(--surface);color:var(--fg);font:inherit}
.exam-dialog::backdrop{background:#0008}
.exam-dialog form{display:grid;gap:14px}
.exam-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.qimg{display:flex;justify-content:center;padding:6px 0}
.qimg svg{width:96px;height:96px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;font-size:16px;background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.opt b{font-family:var(--display);font-size:18px;color:var(--muted);width:16px;flex:none}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.ok b{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)} .opt.bad b{color:var(--bad)}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--ok-bg)}.fb.bad{background:var(--bad-bg)}
.fb .v{font-family:var(--display);font-weight:700;font-size:20px}
.fb.ok .v{color:var(--ok)}.fb.bad .v{color:var(--bad)}
.q-verdict{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.q-reaction{flex:none;display:grid;place-items:center;line-height:1}
.q-correct-star{font-size:32px;margin-inline-end:8px}
.q-sad-car svg{display:block}
@media (prefers-reduced-motion: no-preference){
  .q-correct-star{animation:q-star-pop .6s ease-out}
  .q-sad-car{animation:q-car-sigh .7s ease-out}
}
@keyframes q-star-pop{0%{transform:scale(.4);opacity:0}45%{transform:scale(1.45) rotate(-14deg)}75%{transform:scale(.9) rotate(8deg)}100%{transform:none;opacity:1}}
@keyframes q-car-sigh{0%,100%{transform:none}40%{transform:translateY(4px) rotate(-8deg) scale(.96)}}
.result{text-align:center;align-items:center}
.result .big{font-family:var(--display);font-weight:700;font-size:60px;line-height:1;font-variant-numeric:tabular-nums}
.result .retry-missed{width:100%}
.review{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.review div{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:14px}
/* Sim */
.drive{gap:10px}
.drive-scene{position:relative;overflow:hidden;border-radius:20px;background:#46554e;max-width:100%}
.drive-scene canvas{display:block;width:100%;height:auto}
.drive-key{display:flex;flex-wrap:wrap;gap:6px 14px}
.drive-key span{display:flex;align-items:center;gap:5px}
.drive-key i{width:10px;height:10px;border-radius:4px;background:#2f8bff}
.drive-key span+span i{background:#efaa57}
.drive-feedback{min-height:1.55em}
.drive-feedback.is-error{color:var(--bad);background:var(--bad-bg);padding:8px 10px;border-radius:10px}
.drive-feedback a{color:var(--accent)}
.drive-actions{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.drive-actions .btn{min-height:48px;padding:8px 10px}
.drive-actions .btn:only-child{grid-column:1/-1}
.scene{background:#C9C4B8;border-radius:16px;overflow:hidden;aspect-ratio:1/1;max-width:100%;position:relative}
.scene svg{display:block;width:100%;height:100%}
.scene.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:16px;border-radius:3px;vertical-align:-3px;margin-right:6px}
.simopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lb1{animation:blink .5s infinite}.lb2{animation:blink .5s infinite .25s}
@keyframes blink{50%{opacity:.15}}
textarea{width:100%;min-height:110px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px}
input[type=text],input[type=search]{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg)}
.choice{display:flex;flex-direction:column;gap:8px}
.choice button{text-align:left}
.choice button.sel{border-color:var(--accent);background:var(--accent-soft)}
.note{font-size:13px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){.scene.shake,.lb1,.lb2{animation:none}.btn{transition:none}}
.tutor-chat summary{min-height:44px;padding-block:10px;cursor:pointer}
.tutor-chat form{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding-top:4px}
.tutor-chat textarea,.tutor-chat input[type=password]{font:inherit;line-height:1.5;width:100%;border:1px solid var(--control-line);border-radius:12px;padding:10px 12px;background:var(--surface2);color:var(--fg)}
.tutor-chat input[type=password]{min-height:44px}
.tutor-remember{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.tutor-remember input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--accent)}
.tutor-status:empty{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.tutor-sheet{inset:auto 0 0;margin:0 auto;width:min(100%,520px);max-width:none;max-height:min(86vh,720px);max-height:min(86dvh,720px);padding:0;border:0;border-radius:24px 24px 0 0;background:var(--surface);color:var(--fg);box-shadow:0 12px 48px #0004;overflow:hidden}
.tutor-sheet[open]{display:flex;flex-direction:column}
.tutor-sheet::backdrop{background:#101a16a6}
body:has(.tutor-sheet[open]){overflow:hidden}
.tutor-sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;background:var(--accent-soft)}
.tutor-sheet-art{flex:none;display:grid;place-items:center;width:78px;height:64px;border-radius:18px;background:var(--blue-soft)}
.tutor-sheet-art svg{display:block}
.tutor-sheet-body{min-height:0;overflow:auto;overscroll-behavior:contain;padding:16px 18px}
.tutor-sheet-body:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tutor-sheet-doubt{display:grid;gap:4px;margin:0 0 16px;padding:10px 12px;border-radius:12px;background:var(--surface2);overflow-wrap:anywhere;white-space:pre-wrap}
.tutor-answer{font-family:var(--body);font-size:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.tutor-sheet-foot{display:flex;flex-wrap:wrap;gap:8px;padding:10px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.tutor-sheet-foot .btn{flex:1 1 128px;padding-inline:10px}
@media (min-width:600px){.tutor-sheet{inset:0;margin:auto;border-radius:24px}}

<script>
"use strict";
const VERSION='0.14.1';
const TUTOR_URL=location.hostname==='gittinach.github.io'
  ?'https://autoescuela-tutor.onrender.com/api/tutor'

/* ================= Guardado ================= */
const KEY='autoescuela_v1';
let S={profile:null,q:{},lessons:{},sims:{},tests:[],days:[]};
const isObject=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
const isCount=v=>Number.isSafeInteger(v)&&v>=0;
const isBool=v=>typeof v==='boolean';
const isExamAnswer=v=>v===0||v===1||v===2;
function validExamPaper(v){
  if(!isObject(v)||!['comun','moto'].includes(v.kind)||typeof v.attempt!=='string'||!/^exam-[a-z0-9-]{1,80}$/.test(v.attempt))return false;
  const n=v.kind==='comun'?30:20;
  const text=(s,max)=>typeof s==='string'&&s.length>0&&s.length<=max;
  return Array.isArray(v.paper)&&v.paper.length===n&&v.paper.every(q=>isObject(q)&&typeof q.id==='string'&&/^q[1-9]\d*$/.test(q.id)&&
    text(q.q,3000)&&Array.isArray(q.o)&&q.o.length===3&&q.o.every(o=>text(o,1500))&&new Set(q.o).size===3&&isExamAnswer(q.c)&&text(q.e,6000)&&text(q.r,3000)&&
    (q.img===undefined||(typeof q.img==='string'&&/^[a-zA-Z0-9_-]{1,80}$/.test(q.img))))&&
    new Set(v.paper.map(q=>q.id)).size===n&&Array.isArray(v.answers)&&v.answers.length===n&&v.answers.every(a=>a===null||isExamAnswer(a))&&
    Array.isArray(v.orders)&&v.orders.length===n&&v.orders.every(a=>Array.isArray(a)&&a.length===3&&a.every(isExamAnswer)&&new Set(a).size===3);
}
function validExamDraft(v){
  return validExamPaper(v)&&isCount(v.started)&&v.started>0&&isCount(v.deadline)&&v.deadline-v.started===v.paper.length*60000&&
    Number.isFinite(new Date(v.started).getTime())&&Number.isFinite(new Date(v.deadline).getTime())&&
    isCount(v.index)&&v.index<v.paper.length&&Array.isArray(v.flags)&&v.flags.length===v.paper.length&&v.flags.every(isBool)&&
    (v.mapOpen===undefined||isBool(v.mapOpen));
}
function validExamResult(v){
  return validExamPaper(v)&&v.n===v.paper.length&&v.ok===v.paper.filter((q,i)=>v.answers[i]===q.c).length&&
    isCount(v.d)&&Number.isFinite(new Date(v.d).getTime())&&isCount(v.elapsed)&&v.elapsed<=v.n*60000&&['entrega','tiempo'].includes(v.reason);
}
function validProgress(v){
  return isObject(v)&&
    (v.profile===null||(isObject(v.profile)&&typeof v.profile.name==='string'&&['B','A2','A2B'].includes(v.profile.obj)))&&
    isObject(v.q)&&Object.values(v.q).every(r=>isObject(r)&&isCount(r.n)&&isCount(r.ok)&&r.ok<=r.n&&
      isCount(r.streak)&&r.streak<=r.ok&&isCount(r.due)&&isBool(r.last)&&isBool(r.wrong))&&
    isObject(v.lessons)&&Object.values(v.lessons).every(isBool)&&
    isObject(v.sims)&&Object.values(v.sims).every(r=>isObject(r)&&isCount(r.total)&&r.total>0&&
      isCount(r.best)&&r.best<=r.total&&isCount(r.last)&&r.last<=r.best)&&
    Array.isArray(v.tests)&&v.tests.every(r=>isObject(r)&&isCount(r.d)&&isCount(r.n)&&isCount(r.ok)&&r.ok<=r.n&&typeof r.mode==='string'&&
      (r.mode!=='examen'||validExamResult(r)))&&
    (v.activeExam===undefined||v.activeExam===null||validExamDraft(v.activeExam))&&
    Array.isArray(v.days)&&v.days.every(d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d))&&
    (v.savedQuestions===undefined||(Array.isArray(v.savedQuestions)&&v.savedQuestions.every(id=>typeof id==='string')))&&
    (v.masteredTopics===undefined||(Array.isArray(v.masteredTopics)&&v.masteredTopics.every(id=>typeof id==='string')))&&
    (v.theme===undefined||['light','dark'].includes(v.theme))&&
    (v.voice===undefined||typeof v.voice==='string')&&
    (v.mute===undefined||isBool(v.mute))&&
    ['rate','pitch'].every(k=>v[k]===undefined||(Number.isFinite(v[k])&&v[k]>0&&v[k]<=2));
}
const storageNotice=document.createElement('p');
storageNotice.className='card';
storageNotice.setAttribute('role','status');
storageNotice.hidden=true;
document.querySelector('main').before(storageNotice);
function storageStatus(message=''){
  storageNotice.textContent=message;
  storageNotice.hidden=!message;
}
let invalidSavedProgress=false;
try{
  const raw=localStorage.getItem(KEY);
  if(raw!==null){
    invalidSavedProgress=true;
    const data=JSON.parse(raw);
    if(!validProgress(data))throw new Error('Progreso no válido');
    S=data;
    invalidSavedProgress=false;
  }
}catch(e){
  storageStatus(invalidSavedProgress?'El progreso guardado no se puede leer. Se conservará al guardar los datos de esta sesión.':'El navegador no permite leer el progreso guardado.');
}
function applyTheme(){document.documentElement.classList.toggle('dk',S.theme==='dark');}
applyTheme();
function save(data=S){
  try{
    if(invalidSavedProgress){
      localStorage.setItem(KEY+'_previous',localStorage.getItem(KEY));
      invalidSavedProgress=false;
    }
    localStorage.setItem(KEY,JSON.stringify(data));
    storageStatus();
    return true;
  }catch(e){
    storageStatus('No se ha podido guardar el progreso. Copia tus datos desde Progreso antes de cerrar.');
    return false;
  }
}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function markDay(){const t=today();if(S.days.includes(t))return false;S.days.push(t);S.days=S.days.slice(-90);return streak()>=2;}
function streak(){if(!S.days.length)return 0;const set=new Set(S.days);let n=0;const d=new Date();if(!set.has(today()))d.setDate(d.getDate()-1);
  for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(set.has(k)){n++;d.setDate(d.getDate()-1);}else break;}return n;}
const DAY=864e5;
function record(id,ok,persist=true){const r=S.q[id]||{n:0,ok:0,last:false,streak:0,wrong:false,due:0};r.n++;r.last=ok;
  if(ok){r.ok++;r.streak++;r.due=Date.now()+[1,3,7][Math.min(r.streak-1,2)]*DAY;}else{r.streak=0;r.wrong=true;r.due=Date.now()+DAY;}
  S.q[id]=r;const earnedStreak=markDay();if(persist)save();return earnedStreak;}
const isFallo=id=>{const r=S.q[id];return r&&r.wrong&&r.streak<3;};

/* ================= Temario ================= */

const DEFS=`<defs>
 <linearGradient id="gYou" x1="0" x2="1"><stop offset="0" stop-color="#1F5FC4"/><stop offset=".5" stop-color="#4A94FF"/><stop offset="1" stop-color="#1F5FC4"/></linearGradient>

    if(!s.dirt) g+=`<line x1="184" y1="150" x2="300" y2="150" ${dash}/>`;
    if(s.stop){
      g+=`<line x1="151" y1="186" x2="179" y2="186" stroke="${mark}" stroke-width="4"/><text x="165" y="243" fill="${mark}" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="15" text-anchor="middle" letter-spacing="1">STOP</text>`;
      g+=`<circle cx="196" cy="221" r="2" fill="rgba(0,0,0,.3)"/><line x1="193" y1="206" x2="193" y2="220" stroke="#9AA0A6" stroke-width="2"/><polygon points="${octagon(193,206,11)}" fill="#C8262B" stroke="#fff" stroke-width="1.6"/><text x="193" y="208.8" fill="#fff" font-family="Arial,sans-serif" font-weight="700" font-size="6.6" text-anchor="middle">STOP</text>`;
    }
  }else{
    g+=`<circle cx="150" cy="150" r="80" fill="url(#gRoad)"/><circle cx="150" cy="150" r="54" fill="none" stroke="${mark}" stroke-width="1.6" stroke-dasharray="8 7"/>`;
    g+=`<circle cx="150" cy="150" r="31" fill="#E9E6DE"/><circle cx="150" cy="150" r="28" fill="url(#gGrass)"/><circle cx="150" cy="150" r="20" fill="none" stroke="#C9A93E" stroke-width="3" stroke-dasharray="2 3"/>`+tree(150,150,11);

    g+=`<polygon points="157,252 173,252 165,268" fill="none" stroke="${mark}" stroke-width="2.2"/>`;
    g+=`<line x1="150" y1="0" x2="150" y2="60" ${dash}/><line x1="150" y1="240" x2="150" y2="300" ${dash}/><line x1="0" y1="150" x2="60" y2="150" ${dash}/><line x1="240" y1="150" x2="300" y2="150" ${dash}/>`;
    g+=`<circle cx="199" cy="264" r="2" fill="rgba(0,0,0,.3)"/><line x1="196" y1="248" x2="196" y2="263" stroke="#9AA0A6" stroke-width="2"/><polygon points="184,242 208,242 196,262" fill="#fff" stroke="#C8262B" stroke-width="3.5" stroke-linejoin="round"/>`;

}
const KINDS={you:['gYou','#174A9C'],oth:['gOth','#B5640F'],grey:['gGrey','#454B52'],amb:['gAmb','#9A9A9A']};
function carBody(kind){const [grad,tail]=KINDS[kind]||KINDS.grey;
  return `<rect x="-8" y="-13" width="18" height="31" rx="6" fill="rgba(0,0,0,.28)" transform="translate(1.5 1.5)"/>
 <rect x="-10" y="-10" width="3" height="7" rx="1" fill="#1B1D20"/><rect x="7" y="-10" width="3" height="7" rx="1" fill="#1B1D20"/><rect x="-10" y="5" width="3" height="7" rx="1" fill="#1B1D20"/><rect x="7" y="5" width="3" height="7" rx="1" fill="#1B1D20"/>
 <rect x="-8.5" y="-15.5" width="17" height="31" rx="5.5" fill="url(#${grad})" stroke="rgba(0,0,0,.35)" stroke-width=".8"/>
 <path d="M-6.5 -7 Q0 -9.5 6.5 -7 L5.5 -2.5 H-5.5 Z" fill="url(#gGlass)"/>
 <rect x="-5.5" y="-2.5" width="11" height="8.5" rx="1.5" fill="${tail}" opacity=".55"/>
 <path d="M-5.5 6 H5.5 L6.3 9.5 Q0 11 -6.3 9.5 Z" fill="url(#gGlass)" opacity=".85"/>
 <rect x="-10.5" y="-6.5" width="2.5" height="2" rx="1" fill="${tail}"/><rect x="8" y="-6.5" width="2.5" height="2" rx="1" fill="${tail}"/>
 <rect x="-7" y="-15.6" width="4" height="2" rx="1" fill="#FFF6CC"/><rect x="3" y="-15.6" width="4" height="2" rx="1" fill="#FFF6CC"/>
 <rect x="-7" y="13.8" width="4" height="1.8" rx=".9" fill="#E0302B"/><rect x="3" y="13.8" width="4" height="1.8" rx=".9" fill="#E0302B"/>`+
 (kind==='amb'?`<rect x="-8.5" y="7" width="17" height="2.5" fill="#D8262B"/><rect x="-8.5" y="-12" width="17" height="2" fill="#D8262B"/><rect class="lb1" x="-5.5" y="-3.8" width="5" height="3" rx="1" fill="#E53935"/><rect class="lb2" x=".5" y="-3.8" width="5" height="3" rx="1" fill="#1E6BFF"/>`:'');}
const carAt=(k,x,y,h)=>`<g transform="translate(${x} ${y}) rotate(${h})">${carBody(k)}</g>`;
function pill(x,y,t){const w=t.length*6.1+18;return `<g><rect x="${x-w/2}" y="${y-11}" width="${w}" height="21" rx="10.5" fill="rgba(18,24,32,.84)"/><text x="${x}" y="${y+4}" text-anchor="middle" font-family="Atkinson Hyperlegible,system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">${t}</text></g>`;}
function polyD(p){return 'M'+p.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L');}
const C=150,RE=67,RI=41;
const arc=(r,a0,a1)=>{const n=Math.max(8,Math.round(Math.abs(a1-a0)/4));const p=[];for(let i=0;i<=n;i++){const a=(a0+(a1-a0)*i/n)*Math.PI/180;p.push([C+r*Math.cos(a),C+r*Math.sin(a)]);}return p;};
function drivingCurve(a,b,c,d,steps=20){return Array.from({length:steps+1},(_,i)=>{const t=i/steps,u=1-t;return [0,1].map(k=>u*u*u*a[k]+3*u*u*t*b[k]+3*u*t*t*c[k]+t*t*t*d[k]);});}
function roundExit(from,side='east'){
  const turn={east:0,north:-90,west:-180,south:90}[side],angle=turn*Math.PI/180;
  let end=32+turn;while(end>from)end-=360;
  const rotate=([x,y])=>[150+x*Math.cos(angle)-y*Math.sin(angle),150+x*Math.sin(angle)+y*Math.cos(angle)];
  const p=[RE*Math.cos(32*Math.PI/180),RE*Math.sin(32*Math.PI/180)];
  return arc(RE,from,end).concat(drivingCurve(p,[p[0]+6,p[1]-9.6],[78,15],[94,15]).slice(1).map(rotate),[rotate([190,15])]);
}
const exitEast=()=>drivingCurve([165,250],[165,233],[174,215],arc(RE,55,55)[0]).concat(roundExit(55).slice(1));

const PRIORITY_LESSONS=[
 {id:'L1',t:'Cómo se regula la prioridad',min:6,ill:'order',
  key:'Si varias indicaciones se contradicen, manda el agente. Después, por este orden: señalización circunstancial, semáforos, señales verticales y marcas viales.',
  body:`<p><b>Prioridad de paso</b> es el derecho de un vehículo a pasar antes que otro cuando sus trayectorias se cruzan. Quien no la tiene debe <b>ceder el paso</b>: no obligar al que tiene prioridad a frenar, desviarse o cambiar bruscamente de velocidad.</p>
  <p>La señalización circunstancial es la que cambia temporalmente las normas de una vía: conos, balizas, señales de obras o paneles luminosos.</p>
  <p>Si no hay agentes, semáforos ni señales, se aplican las normas generales que verás en la lección 3.</p>
  <p><b>Cómo se cede el paso.</b> Quien debe ceder tiene que dejarlo claro con antelación, reduciendo la velocidad de forma visible y deteniéndose si hace falta. Quien tiene prioridad tampoco puede pasar sin mirar: debe comprobar que el otro le ha visto y va a cederle.</p>`,
  tip:'Recuerda el orden: agente, señalización y balizamiento circunstanciales, semáforo, señal vertical y marca vial. Entre señales contradictorias del mismo tipo, prevalece la más restrictiva.',
  errs:['Obedecer al semáforo en verde cuando un agente te ordena parar.','Creer que tener prioridad te permite entrar en un cruce sin mirar.'],

 {id:'L2',t:'Cruces con señales',min:7,ill:'signs',
  key:'Ceda el paso (R-1): cede, y para solo si hace falta. STOP (R-2): para siempre por completo y después cede.',
  body:`<ul><li><b>R-1 Ceda el paso.</b> Reduce, mira y cede a quien circula por la vía a la que llegas. Si no viene nadie, no hace falta parar.</li>
  <li><b>R-2 STOP.</b> Detención obligatoria. Paras por completo ante la línea de detención o, si no la hay, justo antes de la intersección, aunque no venga nadie. Después cedes el paso. Si desde la primera parada no ves lo suficiente, avanza con cuidado y detente de nuevo donde puedas ver sin poner a nadie en peligro.</li>
  <li><b>R-3 Calzada con prioridad.</b> En las intersecciones de esa vía tienes preferencia.</li>
  <li><b>R-4 Fin de prioridad.</b> Avisa de que se acerca el punto donde tu calzada pierde la prioridad. Allí, fíjate en la señalización que regula el paso.</li></ul>
  <p><b>Marcas viales.</b> Una línea blanca continua atravesando tu carril es una línea de detención (STOP, semáforo, agente). Una línea discontinua de trazos anchos es de ceda el paso, y a menudo va acompañada de un triángulo pintado en el suelo.</p>
  <p><b>Semáforo en amarillo intermitente.</b> No da preferencia a nadie: cruza con precaución aplicando las señales o las normas de prioridad de ese cruce.</p>`,
  tip:'El STOP siempre para: aunque veas que no viene nadie, las ruedas tienen que detenerse del todo.',
  errs:['Hacer un "STOP rodando", reduciendo mucho pero sin llegar a detenerse.','Parar en un ceda el paso sin necesidad y frenar a los que vienen detrás.'],
  ref:'RGC, art. 56 y anexo I, apartado 4.2.d. Catálogo oficial, R-1 a R-4 y marcas M-4.1 y M-4.2'},
 {id:'L3',t:'Cruces sin señales',min:7,ill:'cross',
  key:'Sin señales ni semáforos, cede el paso a quien venga por tu derecha.',
  body:`<p>La regla general tiene cuatro excepciones. Tienen preferencia:</p>
  <ol><li>Los vehículos que circulan por una vía <b>pavimentada</b> frente a los que salen de un camino sin pavimentar.</li>
  <li>Los vehículos que circulan sobre <b>raíles</b>, como el tranvía.</li>
  <li>En las <b>glorietas</b>, los que ya circulan dentro frente a los que quieren entrar.</li><li>En <b>autopistas y autovías</b>, los que ya circulan por ellas frente a quienes quieren incorporarse.</li></ol>
  <p><b>Incorporarse a la circulación.</b> Si sales de un garaje, una gasolinera, una vía de servicio o un carril de aceleración, debes ceder el paso a los que ya circulan por la vía.</p>
  <p><b>Cruce atascado.</b> Aunque tengas preferencia, no entres en un cruce ni en un paso de peatones si es previsible que te quedes parado dentro y bloquees a los demás.</p>`,
  tip:'Mira a tu derecha: si alguien llega por ahí, va primero. Comprueba si hay una excepción: pavimento, raíles, glorieta o acceso a autopista o autovía.',
