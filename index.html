function addTutor(feedback,q,choice){
  const panel=document.createElement('details');
  panel.className='card tutor-chat';
  panel.innerHTML=`<summary>Preguntar al tutor IA</summary>
    <form>
      <label for="tutor-doubt">¿Qué duda tienes sobre esta pregunta?</label>
      <textarea id="tutor-doubt" maxlength="500" required></textarea>
      <label for="tutor-code">Código del tutor</label>
      <input id="tutor-code" type="password" maxlength="128" required>
      <label class="tutor-remember"><input id="tutor-remember" type="checkbox"> Recordar el código en este dispositivo</label>
      <p class="small muted">Necesita internet. La consulta se envía al proveedor de IA.</p>
      <button class="btn ghost" type="submit">Enviar duda</button>
      <div class="tutor-wait" hidden aria-hidden="true"><span class="tutor-wait-mascot">${mascot(52)}</span><span>La mascota busca una explicación…</span></div>
      <p class="tutor-status small" role="status" aria-live="polite"></p>
      <button class="btn ghost" type="button" data-tutor-read hidden>Ver última respuesta</button>
    </form>
    <dialog class="tutor-sheet" aria-labelledby="tutor-sheet-title">
      <header class="tutor-sheet-head">
        <h2 id="tutor-sheet-title" tabindex="-1" autofocus>Respuesta del tutor IA</h2>
        <span class="tutor-sheet-art" aria-hidden="true">${mascot(66)}</span>
      </header>
      <div class="tutor-sheet-body" tabindex="0" role="region" aria-label="Consulta y explicación">
        <div class="tutor-sheet-doubt"><b class="small">Tu duda</b><p data-tutor-doubt></p></div>
        <p class="tutor-answer"></p>
      </div>
      <footer class="tutor-sheet-foot">
        <button class="btn ghost listen" type="button" data-tutor-listen ${SPEECH?'':'hidden'}>${SPK_ICON} Escuchar</button>
        <button class="btn primary" type="button" data-tutor-close>Volver al test</button>
      </footer>
    </dialog>`;
  const form=panel.querySelector('form'),status=panel.querySelector('[role="status"]');
  const button=form.querySelector('button[type="submit"]'),code=form.querySelector('#tutor-code');
  const sheet=panel.querySelector('dialog'),readAnswer=form.querySelector('[data-tutor-read]');
  const waiting=form.querySelector('.tutor-wait');
  const listen=sheet.querySelector('[data-tutor-listen]'),answerText=sheet.querySelector('.tutor-answer');
  let reading=false;
  function setReading(active){
    reading=active;
    listen.innerHTML=active?STOP_ICON+' Detener':SPK_ICON+' Escuchar';
  }
  listen.onclick=()=>{
    if(reading){stopSpeech();setReading(false);return;}
    setReading(true);
    speakList(splitText(answerText.textContent),()=>setReading(false),true);
  };
  function openAnswer(){
    sheet.showModal();
    sheet.querySelector('.tutor-sheet-body').scrollTop=0;
  }
  readAnswer.onclick=openAnswer;
  sheet.querySelector('[data-tutor-close]').onclick=()=>sheet.close();
  sheet.onclose=()=>{
    if(reading){stopSpeech();setReading(false);}
    if(panel.isConnected&&panel.open)readAnswer.focus({preventScroll:true});
  };
  const remember=form.querySelector('#tutor-remember');
  code.value=tutorCode;
  remember.checked=rememberTutor;
  remember.onchange=()=>{
    rememberTutor=remember.checked;
    if(!rememberTutor){
      try{localStorage.removeItem(TUTOR_CODE_KEY);}catch(e){}
    }
  };
  if(!TUTOR_URL){
    button.disabled=true;
    status.textContent='El tutor aún no está conectado.';
  }
  form.onsubmit=async event=>{
    event.preventDefault();
    if(!TUTOR_URL||button.disabled)return;
    const doubt=form.querySelector('textarea').value.trim();
    if(!doubt)return;
    const submittedCode=code.value.trim();
    if(!submittedCode)return;
    button.disabled=true;
    readAnswer.disabled=true;
    status.textContent='El tutor está preparando la explicación. La primera respuesta puede tardar un poco.';
    waiting.hidden=false;
    try{
      const response=await fetch(TUTOR_URL,{
        method:'POST',
        headers:{'Content-Type':'application/json',Authorization:'Bearer '+submittedCode},
        signal:AbortSignal.timeout(110000),
        body:JSON.stringify({id:q.id,choice,doubt})
      });
      const result=await response.json();
      if(!response.ok){
        status.textContent=result?.error||'El tutor no está disponible.';
        return;
      }
      const answer=typeof result?.answer==='string'?result.answer.trim():'';
      if(!answer){status.textContent='El tutor no ha enviado una respuesta. Prueba de nuevo.';return;}
      sheet.querySelector('[data-tutor-doubt]').textContent=doubt;
      answerText.textContent=answer;
      readAnswer.hidden=false;
      status.textContent='';
      tutorCode=submittedCode;
      if(rememberTutor){
        try{localStorage.setItem(TUTOR_CODE_KEY,tutorCode);}
        catch(e){status.textContent='No se pudo recordar el código en este dispositivo.';}
      }
    }catch{
      status.textContent='No se pudo conectar con el tutor. Puedes seguir con el test.';
      return;
    }finally{
      waiting.hidden=true;
      button.disabled=false;
      readAnswer.disabled=false;
    }
    if(panel.isConnected&&panel.open)openAnswer();
  };
  feedback.after(panel);
}
function runQuiz(ids,v){
  let i=0,res=[],earnedStreak=false;
  const draw=()=>{
    const q=QBY[ids[i]],order=shuffle([0,1,2]);
    let saved=S.savedQuestions?.includes(q.id)??false;
    V.innerHTML=`<div class="qhead"><span class="small muted">Pregunta ${i+1} de ${ids.length}</span><div class="qprog">${ids.map((_,k)=>`<span class="${res[k]===true?'ok':res[k]===false?'bad':k===i?'now':''}"></span>`).join('')}</div></div>
    <div class="card"><p class="qtext">${esc(q.q)}</p>${q.img?`<div class="qimg">${SIGN[q.img]}</div>`:''}
    <button class="btn ghost q-save" type="button" aria-pressed="${saved}" aria-label="Guardar pregunta">${ICN.bookmark}<span>${saved?'Pregunta guardada':'Guardar pregunta'}</span></button></div>
    <div class="opts">${order.map((o,k)=>`<button class="opt" type="button" data-o="${o}"><b>${'ABC'[k]}</b><span>${esc(q.o[o])}</span></button>`).join('')}</div>
    <div id="qfb" tabindex="-1" aria-live="polite"></div>`;
    const bookmark=V.querySelector('.q-save');
    bookmark.onclick=()=>{
      saved=!saved;
      setQuestionSaved(q.id,saved);
      bookmark.setAttribute('aria-pressed',String(saved));
      bookmark.querySelector('span').textContent=saved?'Pregunta guardada':'Guardar pregunta';
    };
    V.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const o=+b.dataset.o,ok=o===q.c;res[i]=ok;
      earnedStreak=record(q.id,ok)||earnedStreak;
      V.querySelectorAll('.opt').forEach(x=>{x.disabled=true;const xo=+x.dataset.o;if(xo===q.c)x.classList.add('ok');else if(x===b)x.classList.add('bad');});
      const last=i===ids.length-1;
      const verdict=ok?'¡Correcto!':'Casi. Fíjate en esto:';
      const reaction=ok?'<span class="q-reaction q-correct-star" aria-hidden="true">⭐</span>':
        `<span class="q-reaction q-sad-car" aria-hidden="true">${mascot(62,true)}</span>`;
      const feedback=document.getElementById('qfb');
      feedback.innerHTML=`<div class="fb ${ok?'ok':'bad'}"><div class="q-verdict"><span class="v">${verdict}</span>${reaction}</div><p>${withSigns(esc(q.e))}</p><span class="ref">${withSigns(esc(q.r))}</span><button class="btn primary" type="button" id="qn" style="margin-top:4px">${last?'Ver resultado':'Siguiente'}</button></div>`;
      if(!ok){
        const correct=document.createElement('p');
        correct.textContent='Respuesta correcta: '+q.o[q.c];
        feedback.querySelector('.q-verdict').after(correct);
      }
      addTutor(feedback,q,o);
      feedback.focus({preventScroll:true});
      V.querySelectorAll('.qprog span')[i].className=ok?'ok':'bad';
      document.getElementById('qn').onclick=()=>{if(last)finish();else{i++;draw();window.scrollTo(0,0);}};
      feedback.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'nearest'});
    });
  };
  const finish=()=>{
    const ok=res.filter(Boolean).length,n=ids.length;
    if(v.mode==='lesson'){S.lessons[v.id]=true;}
    S.tests.push({d:Date.now(),mode:v.mode,ok,n,...(v.mode==='tema'?{topic:v.id||'5'}:{})});S.tests=S.tests.slice(-50);
    const wrongIds=ids.filter((_,k)=>!res[k]);
    const wrong=wrongIds.map(id=>QBY[id]);
    const repeatLabel=v.mode==='guardadas'&&v.id?'Repetir pregunta':v.mode==='repaso'?'Repetir repaso':'Repetir test';
    const msg=ok===n?'¡Perfecto, ni un fallo!':ok/n>=.7?'¡Bien! Echa un vistazo a las que fallaste.':'No pasa nada: repasa la lección y vuelve a intentarlo.';
    const mastered=availableTopics().find(topic=>!S.masteredTopics?.includes(topic.id)&&!(topic.id==='5'&&S.dom5)&&topicStats(topic).level==='Dominado');
    if(mastered){S.masteredTopics=[...(S.masteredTopics||[]),mastered.id];if(mastered.id==='5')S.dom5=true;setTimeout(()=>celebrate('topic'),300);}
    else if(ok===n)celebrate('perfect');else if(v.mode==='lesson')celebrate('lesson');
    save();
    V.innerHTML=`<div class="card result"><div class="mascot-c">${mascot(80)}</div><div class="big">${ok}/${n}</div><p class="muted">${msg}</p>
     ${earnedStreak?`<p class="note">🔥 Racha de ${streak()} días</p>`:''}
     ${wrong.length?`<button class="btn primary retry-missed" type="button" id="retryMissed">Repasar ${wrong.length} ${wrong.length===1?'fallo':'fallos'}</button>`:''}
     ${wrong.length?`<div class="review">${wrong.map(q=>`<div><b>${esc(q.q)}</b><br>Respuesta correcta: ${esc(q.o[q.c])}</div>`).join('')}</div>`:''}
     <div class="grid2" style="width:100%"><button class="btn ghost" type="button" data-back>Volver</button><button class="btn ${wrong.length?'ghost':'primary'}" type="button" id="again">${repeatLabel}</button></div></div>
     ${v.mode==='lesson'?'<p class="note">Lección marcada como leída.</p>':''}`;
    const retry=document.getElementById('retryMissed');
    if(retry)retry.onclick=()=>{
      stack[stack.length-1]={name:'quiz',mode:'repaso',ids:wrongIds};
      rememberView(false);
      render();
    };
    document.getElementById('again').onclick=render;
    window.scrollTo(0,0);
  };
  draw();
}

  return '<svg viewBox="0 0 300 300" role="img" aria-label="Vista sencilla de la situación">'+DEFS+ground+

function loadSimulator(entry,options,attempt=0){
  const token=animToken;
  V.innerHTML='<p class="card" role="status">Preparando el simulador en 3D…</p>';
  const source=new URL(`./simulators-${VERSION}.js`,location.href);
  if(attempt)source.searchParams.set('reintento',String(attempt));
  import(source.href).then(module=>{
    if(token!==animToken)return;
    if(module.SIMULATOR_VERSION!==VERSION)throw new Error('Los archivos del simulador no corresponden a esta versión de la app.');
    closeDrivingGame=module[entry]({root:V,sample:at,fallback:simulatorFallback,signHTML:kind=>SIGN[kind],...options});
  }).catch(error=>{
    if(token!==animToken)return;
    V.innerHTML=`<section class="card"><h2>No se ha podido abrir el simulador</h2><p>Puedes volver a intentarlo o buscar una actualización de los archivos de la app.</p><button class="btn primary" type="button" id="simulator-retry">Reintentar</button><a class="btn ghost" href="actualizar.html">Actualizar la aplicación</a><details><summary>Ver detalle del error</summary><p class="small">Versión ${VERSION} · ${esc(error?.message||'Error de carga')}</p></details><button class="btn ghost" type="button" data-back>Volver</button></section>`;
    V.querySelector('#simulator-retry').onclick=()=>loadSimulator(entry,options,attempt+1);
  });
}

function runDrivingGame(district){
  const token=animToken;
  V.innerHTML='<p class="card" role="status">Cargando el videojuego…</p>';
  import('./driving.js').then(({openDrivingGame})=>{
    if(token!==animToken)return;
    V.replaceChildren();
    closeDrivingGame=openDrivingGame({
      district,ruleUrl:RGC+(district?'#a56':'#A5'),
      onExit:()=>history.back(),
      onResult(score,total){
        const key=district?'barrio-3d':'juego-stop';
        const last=district?Math.round(100*score/total):score;
        S.sims[key]={last,best:Math.max(last,S.sims[key]?.best||0),total:district?100:total};
        markDay();save();
      }
    });
  }).catch(()=>{
    if(token!==animToken)return;
    V.innerHTML='<section class="card"><p>El videojuego no se ha podido cargar.</p><button class="btn primary" type="button">Reintentar</button></section>';
    V.querySelector('button').onclick=()=>runDrivingGame(district);
  });
}

rememberView(false);
render();
showWelcome();
</script>
